<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>CTAB-containing silica coating sol</title><desc>Coating solution contains surfactant and hydrolyzed/condensed silica species. No micelle structure or condensed oligomer formula is measured.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><text x="450" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#294451">CTAB + polymeric silica sol</text><text x="450" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#294451">Ethanol dilution</text><text x="450" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#294451">Templating mixture</text></svg>