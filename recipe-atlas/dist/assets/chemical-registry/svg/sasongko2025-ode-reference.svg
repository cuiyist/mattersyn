</g><text x="550" y="521" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#294658">Free reference molecule · no solution or surface complex</text><rect x="28" y="548" width="1044" height="205" rx="12" fill="#edf5f8"/><text x="48" y="580" font-family="Arial,sans-serif" font-size="17" text-anchor="start" fill="#294658">1-Octadecene, &gt;90%, TCI. Whole-stock and QD-route quantities are separate; all chemicals are used without</text><text x="48" y="604" font-family="Arial,sans-serif" font-size="17" text-anchor="start" fill="#294658">further purification.</text><text x="48" y="628" font-family="Arial,sans-serif" font-size="17" text-anchor="start" fill="#294658"></text><text x="48" y="652" font-family="Arial,sans-serif" font-size="17" text-anchor="start" fill="#294658">Free 1-octadecene reference with a terminal alkene. The &gt;90% lower-bound purity is retained; no pure-batch</text><text x="48" y="676" font-family="Arial,sans-serif" font-size="17" text-anchor="start" fill="#294658">or unique solution-conformer claim is made.</text></svg>