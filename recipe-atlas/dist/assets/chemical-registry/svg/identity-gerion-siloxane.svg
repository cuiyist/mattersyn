<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><title>Siloxane-coated CdSe/ZnS nanocrystals</title><desc>Layer architecture schematic, not atomic coordinates or a measured particle reconstruction. Source does not establish a unique crystal phase, shell uniformity or number of CdSe/ZnS cores in each siloxane entity.</desc><rect x="10" y="12" width="880" height="396" rx="24" fill="#f5f9fb"/><circle cx="248" cy="200" r="129" fill="#ddeeee" stroke="#64a4aa" stroke-width="4" stroke-dasharray="5 4"/><circle cx="248" cy="200" r="91" fill="#d6b875" stroke="#987542" stroke-width="3"/><circle cx="248" cy="200" r="61" fill="#c66452" stroke="#98483f" stroke-width="3"/><circle cx="453" cy="132" r="7" fill="#ad5142"/><text x="476" y="139" font-family="Arial,sans-serif" font-size="23" fill="#294451">CdSe core</text><circle cx="453" cy="191" r="7" fill="#a78142"/><text x="476" y="198" font-family="Arial,sans-serif" font-size="23" fill="#294451">ZnS shell</text><circle cx="453" cy="250" r="7" fill="#3c858b"/><text x="476" y="257" font-family="Arial,sans-serif" font-size="23" fill="#294451">Organic-functional siloxane</text><text x="450" y="357" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#617580">Architecture illustration · not to scale · no measured atomic model</text></svg>