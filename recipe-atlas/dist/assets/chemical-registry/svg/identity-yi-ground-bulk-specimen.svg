<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><title>Ground bulk comparator</title><desc>Illustrative specimen identity for nominal La2(MoO4)3:Yb,Er. Shapes and dimensions are explanatory, not a TEM reconstruction or refined dopant-site/lattice model. The 800 °C powder is source-assigned tetragonal with an unidentified minor second phase; that phase assignment is not generalized to every specimen. Grinding does not establish a nanoscale size or improved optical output.</desc><rect x="10" y="12" width="880" height="396" rx="24" fill="#f5f9fb"/><text x="450" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#294451">Ground bulk comparator</text><text x="450" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#294451">La₂(MoO₄)₃:Yb,Er</text><rect x="112" y="174" width="35" height="35" rx="7" fill="#aecad4" stroke="#668c9e"/><rect x="186" y="209" width="30" height="30" rx="7" fill="#aecad4" stroke="#668c9e"/><rect x="270" y="180" width="33" height="33" rx="7" fill="#aecad4" stroke="#668c9e"/><rect x="140" y="262" width="22" height="22" rx="7" fill="#aecad4" stroke="#668c9e"/><rect x="263" y="261" width="27" height="27" rx="7" fill="#aecad4" stroke="#668c9e"/><text x="625" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#294451">Grinding conditions unreported</text><text x="625" y="234" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#294451">Nominal doped host</text><text x="625" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#294451">No source atomic coordinates</text><text x="450" y="358" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#294451">Specimen schematic · independent of measured micrographs</text></svg>