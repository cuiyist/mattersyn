<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>ZnO nanocrystals</title><desc>Source reports ZnO phase and TEM/electron-diffraction evidence. This identity card is not a measured particle lattice; the separate independent bulk CIF does not reconstruct the synthesized sample.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><text x="450" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#294451">Wurtzite ZnO nanocrystals</text><text x="450" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#294451">Pure-host route</text><text x="450" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#294451">Particle dimensions remain sample-specific</text></svg>