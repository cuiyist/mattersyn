<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><title>Zinc oxide powder</title><desc>Formula-unit atom-count illustration for the reported oxide powder. Positions are a graphic layout, not a discrete oxide molecule, measured lattice, polymorph or glass-network geometry. No atomic coordinate download is implied.</desc><rect x="10" y="12" width="880" height="396" rx="24" fill="#f5f9fb"/><text x="450" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#294451">Zinc oxide powder</text><text x="450" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#294451">ZnO</text><circle cx="397.5" cy="213" r="34" fill="#a9c6d8" stroke="#63899c"/><text x="397.5" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#294451">Zn</text><circle cx="502.5" cy="213" r="34" fill="#e7b3ac" stroke="#63899c"/><text x="502.5" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#294451">O</text><text x="450" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#294451">Formula-unit composition · no bonds or lattice assigned</text><text x="450" y="341" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#294451">Powder phase and atomic structure are not reported</text></svg>