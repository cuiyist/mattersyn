<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>Cadmium nitrate / citrate / ammonia solution</title><desc>The source specifies starting solution and additives but no exact Cd complex stoichiometry, equilibrium speciation or final Cd concentration after additions.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><text x="450" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#294451">Cd nitrate + citrate + NH₃</text><text x="450" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#294451">Aqueous loading solution</text><text x="450" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#294451">pH 9.5; complexes unresolved</text></svg>