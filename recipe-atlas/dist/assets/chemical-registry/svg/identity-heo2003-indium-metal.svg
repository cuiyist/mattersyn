<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img"><title>Indium metal</title><desc>Elemental indium identity for source reagent or analytical metal-reference context. The symbol is not a metal crystal, cluster coordinate model or single isolated atom measurement.</desc><rect x="1" y="1" width="998" height="508" rx="20" fill="#fff" stroke="#d7e4ea"/><text x="40" y="49" font-family="Arial,sans-serif" font-size="27" font-weight="600" fill="#253f50" text-anchor="start">Indium metal</text><path d="M40 72H960" stroke="#d7e4ea"/><text x="500" y="115" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#416679" text-anchor="middle">In</text><rect x="220" y="164" width="560" height="220" rx="24" fill="#f1f6f8" stroke="#b7cfd8"/><text x="500" y="212" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#587a89" text-anchor="middle">Elemental identity</text><text x="500" y="292" font-family="Arial,sans-serif" font-size="57" font-weight="500" fill="#253f50" text-anchor="middle">In</text><text x="500" y="347" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#253f50" text-anchor="middle">Source identity · no atomic geometry</text><rect x="35" y="437" width="930" height="49" rx="10" fill="#edf5f7"/><text x="500" y="467" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#253f50" text-anchor="middle">No atomic lattice, particle size or coordinate model</text></svg>