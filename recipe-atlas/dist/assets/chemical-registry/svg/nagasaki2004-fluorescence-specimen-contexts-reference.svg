<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470"><title>Fluorescence acquisition contexts</title><desc>Separate fluorescence specimen contexts. Shared acquisition settings do not establish one physical aliquot or a combined mixture.</desc><rect width="960" height="470" rx="20" fill="#fff"/><rect x="1" y="1" width="958" height="468" rx="20" fill="none" stroke="#d5e0e5"/><text x="28" y="41" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#193749" text-anchor="start">Fluorescence acquisition contexts</text><text x="28" y="73" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#617784" text-anchor="start">Symbolic source identity · no atomistic coordinates</text><circle cx="193" cy="212" r="78" fill="#f6e9ad" stroke="#baa05d" stroke-width="2"/><text x="193" y="223" font-family="Arial, sans-serif" font-size="31" font-weight="600" fill="#655322" text-anchor="middle">CdS</text><rect x="330" y="131" width="560" height="120" rx="13" fill="#f6f9fb" stroke="#b9cbd3"/><text x="355" y="173" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#536575" text-anchor="start">Several specimen contexts; not one mixed</text><text x="355" y="202" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#536575" text-anchor="start">aliquot</text><text x="330" y="301" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#546d7b" text-anchor="start">Composition / sample-context diagram</text><text x="330" y="329" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#637482" text-anchor="start">No atomic lattice, particle size or coating thickness to scale.</text><path d="M28 370H932" stroke="#e1e8ec"/><text x="28" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536575" text-anchor="start">Source-specific specimen context. Original optical, TEM and XRD evidence remains separate; no atomic</text><text x="28" y="423" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536575" text-anchor="start">coordinates or CIF are recovered.</text></svg>