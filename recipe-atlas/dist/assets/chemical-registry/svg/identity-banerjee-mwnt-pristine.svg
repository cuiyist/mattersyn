<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><title>Pristine multiwalled carbon nanotubes</title><rect x="10" y="12" width="880" height="396" rx="24" fill="#f4f8fa"/><text x="450" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#294451">Pristine multiwalled carbon nanotubes</text><rect x="90" y="153" width="330" height="90" rx="45.0" fill="#aabfc8" stroke="#526f7f" stroke-width="2"/><path d="M120 167H390" stroke="#7894a1" fill="none"/><path d="M120 180H390" stroke="#7894a1" fill="none"/><path d="M120 193H390" stroke="#7894a1" fill="none"/><path d="M120 206H390" stroke="#7894a1" fill="none"/><path d="M120 217H390" stroke="#7894a1" fill="none"/><ellipse cx="125" cy="198.0" rx="25" ry="37.0" fill="#e7eff2" stroke="#526f7f"/><ellipse cx="125" cy="198.0" rx="13" ry="26.0" fill="#fafcfd" stroke="#7894a1"/><text x="648" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#294451">C-based tubular framework</text><text x="648" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#294451">No oxygen sites assigned</text><text x="450" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#294451">Purchased MWNT starting material</text><text x="450" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#294451">Illustrative morphology · no atomic coordinates</text><desc>Multiple-wall tube geometry is illustrative, not a measured chirality, wall count, diameter or atomic lattice. Source composition and sample state remain separate from cartoon geometry.</desc></svg>