1" cy="256" r="7" fill="#bd5b53"/><circle cx="542" cy="270" r="7" fill="#bd5b53"/><circle cx="625" cy="199" r="7" fill="#bd5b53"/><path d="M96 134L136 142L139 174L99 180L88 155Z" fill="#cfaa6c" stroke="#9f783e" stroke-width="2"/><path d="M221 226L261 234L264 266L224 272L213 247Z" fill="#cfaa6c" stroke="#9f783e" stroke-width="2"/><path d="M386 192L426 200L429 232L389 238L378 213Z" fill="#cfaa6c" stroke="#9f783e" stroke-width="2"/><path d="M584 167L624 175L627 207L587 213L576 188Z" fill="#cfaa6c" stroke="#9f783e" stroke-width="2"/><path d="M729 218L769 226L772 258L732 264L721 239Z" fill="#cfaa6c" stroke="#9f783e" stroke-width="2"/><text x="450" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#294451">Attached particles and possible nanotube junctions</text><text x="450" y="366" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#294451">Specimen architecture · no measured atomic reconstruction</text><desc>Illustrative CdTe nanocrystal attachment and junction architecture on oxygenated multiwalled nanotubes. Positions, colors, particle number and geometry are explanatory, not a measured interface or atomic model. Source predominantly assigns wurtzite CdTe with possible zinc blende and stacking faults; no refined interfacial coordinates are supplied.</desc></svg>