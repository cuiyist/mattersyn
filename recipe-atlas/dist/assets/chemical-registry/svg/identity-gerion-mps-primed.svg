<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>MPS-primed CdSe/ZnS intermediate</title><desc>MPS-primed intermediate for the optional APS addition. This depiction does not show a final mature siloxane shell or imply that APS replaces the initial MPS primer.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><text x="450" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#254a5c">CdSe/ZnS + MPS primer</text><text x="450" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#254a5c">Intermediate before later functionalization</text><text x="450" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#254a5c">Shell completeness unresolved</text></svg>