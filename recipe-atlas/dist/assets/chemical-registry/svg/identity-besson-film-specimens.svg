<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>Separate porous-film specimens</title><desc>Comparison context only. Empty, ion-impregnated and CdS-loaded films remain separate specimen states; method assignment does not establish batch identity.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><text x="450" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#294451">Separate silica-film specimens</text><text x="450" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#294451">Blank / Cd-loaded / CdS-loaded</text><text x="450" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#294451">Comparison set; not a mixture</text></svg>