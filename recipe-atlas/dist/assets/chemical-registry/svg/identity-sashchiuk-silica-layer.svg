<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>Silicon oxide layer</title><desc>The paper reports a 200 nm oxide layer and depicts SiO2 on silicon. Its growth process, defect chemistry and atomic coordinates are not supplied.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><text x="450" y="115" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#294451">200 nm oxide layer on silicon</text><text x="450" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#294451">Source labels the stack Si/SiO2</text><text x="450" y="257" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#294451">Growth method unreported</text></svg>