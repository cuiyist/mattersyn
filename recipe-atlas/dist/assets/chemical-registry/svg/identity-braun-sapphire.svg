<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>Sapphire continuum-generation plate</title><desc>Source-named sapphire plate. Al2O3 is a chemical identity reference, not a measured nanocrystal phase, unit cell or a synthesis ingredient.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><text x="450" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#294451">Sapphire plate</text><text x="450" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#294451">White-light continuum generation</text><text x="450" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#294451">Optical hardware; not product</text></svg>