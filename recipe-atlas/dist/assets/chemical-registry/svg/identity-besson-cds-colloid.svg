<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>CdS colloidal optical comparator</title><desc>The source uses a CdS colloid as an optical loading comparator. Its cited reverse-micelle recipe is not supplied in the inspected article; no invented reagent inventory or new complete route.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><text x="450" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#294451">CdS colloidal comparator</text><text x="450" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#294451">Optical loading reference</text><text x="450" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#294451">Cited reverse-micelle preparation</text></svg>