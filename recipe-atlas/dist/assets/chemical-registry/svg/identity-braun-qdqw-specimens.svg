<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>CdS/HgS quantum-dot quantum-well specimens</title><desc>Shared acquisition context for separately measured quantum-dot quantum-well systems. This is not a physical mixture or a uniquely identified experimental batch.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><text x="450" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#294451">CdS / HgS / CdS</text><text x="450" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#294451">Systems I, II and III</text><text x="450" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#294451">Separate architectures / specimens</text></svg>