<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><title>Sulfur source, chemical form unspecified</title><desc>The source specifies sulfur doping but does not identify the sulfur reagent, quantity or introduction sequence. No elemental S8, sulfide salt or other chemical is substituted.</desc><rect x="10" y="12" width="880" height="396" rx="24" fill="#f5f9fb"/><text x="450" y="64" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#294451">Sulfur source, chemical form unspecified</text><text x="450" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#294451">Sulfur-doped glass</text><text x="450" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#294451">Sulfur reagent not identified</text><text x="450" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#294451">Dose and introduction step unreported</text></svg>