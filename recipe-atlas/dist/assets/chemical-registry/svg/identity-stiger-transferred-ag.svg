<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360" role="img"><title>Silver nanoparticles transferred to the TEM grid</title><desc>Silver nanoparticles mechanically transferred from Si to a carbon-coated gold TEM grid. Source Figure 6 reports the TEM/SAED evidence, but exact preparative pulse duration is unassigned. The cartoon is not a measured particle layout, support structure or reconstructed Ag unit cell.</desc><rect x="20" y="22" width="800" height="316" rx="18" fill="#f1f6f9" stroke="#cbdce6"/><ellipse cx="221" cy="177" rx="139" ry="58" fill="#d6c691" stroke="#8c855f" stroke-width="2"/><path d="M97 157H345" stroke="#7c898e" stroke-width="2"/><path d="M97 177H345" stroke="#7c898e" stroke-width="2"/><path d="M97 197H345" stroke="#7c898e" stroke-width="2"/><ellipse cx="151" cy="172" rx="10" ry="7" fill="#8197a5" stroke="#637b89"/><ellipse cx="218" cy="159" rx="10" ry="7" fill="#8197a5" stroke="#637b89"/><ellipse cx="270" cy="189" rx="10" ry="7" fill="#8197a5" stroke="#637b89"/><ellipse cx="314" cy="172" rx="10" ry="7" fill="#8197a5" stroke="#637b89"/><text x="600" y="137" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#254b5e">Ag on carbon / Au grid</text><text x="600" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#254b5e">Transferred TEM specimen</text><text x="600" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#254b5e">No measured particle layout</text><text x="420" y="297" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#254b5e">Illustrative reference • not measured sample geometry</text></svg>