<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360" role="img"><title>Indium chloride in trioctylphosphine</title><desc>The source names a concentrated InCl₃·TOP solution prepared from 0.33 g InCl₃ per mL of distilled TOP. The dot is not evidence for a solved 1:1 molecular adduct or a measured In–P coordination geometry. Components remain separately inspectable.</desc><rect x="20" y="22" width="800" height="316" rx="18" fill="#f1f6f9" stroke="#cbdce6"/><text x="220" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" fill="#254a5c">InCl₃</text><text x="420" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#254a5c">+</text><text x="620" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" fill="#254a5c">TOP</text><text x="420" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#254a5c">Prepared stock solution</text><text x="420" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#254a5c">Coordination/speciation unresolved</text></svg>