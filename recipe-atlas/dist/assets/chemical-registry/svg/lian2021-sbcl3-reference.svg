<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640"><title>Antimony trichloride</title><desc>Antimony trichloride formal stoichiometric reference: Sb³⁺ and three Cl⁻ symbols, with no Sb–Cl bonds. This is not a claim that SbCl3 exists as separated ions in DMF.</desc><rect x="1" y="1" width="1098" height="638" rx="20" fill="white" stroke="#cbdde5"/><text x="36" y="47" font-family="Arial,sans-serif" font-size="26" fill="#294558" text-anchor="start">Antimony trichloride</text><path d="M36 72H1064" stroke="#d5e3e8"/><text x="550" y="107" font-family="Arial,sans-serif" font-size="22" fill="#294558" text-anchor="middle">SbCl3</text><circle cx="185" cy="300" r="69" fill="#d6c2e5" stroke="#a7bdc8"/><text x="185" y="310" font-family="Arial,sans-serif" font-size="34" fill="#294558" text-anchor="middle">Sb³⁺</text><circle cx="430" cy="300" r="69" fill="#dfedcf" stroke="#a7bdc8"/><text x="430" y="310" font-family="Arial,sans-serif" font-size="34" fill="#294558" text-anchor="middle">Cl⁻</text><circle cx="675" cy="300" r="69" fill="#dfedcf" stroke="#a7bdc8"/><text x="675" y="310" font-family="Arial,sans-serif" font-size="34" fill="#294558" text-anchor="middle">Cl⁻</text><circle cx="920" cy="300" r="69" fill="#dfedcf" stroke="#a7bdc8"/><text x="920" y="310" font-family="Arial,sans-serif" font-size="34" fill="#294558" text-anchor="middle">Cl⁻</text><text x="550" y="448" font-family="Arial,sans-serif" font-size="21" fill="#294558" text-anchor="middle">Formal stoichiometric ions · no Sb–Cl bonds or dissolved-species claim</text><rect x="30" y="566" width="1040" height="53" rx="9" fill="#edf5f7"/><text x="50" y="589" font-family="Arial,sans-serif" font-size="16" fill="#294558" text-anchor="start">SbCl3 composition reference · arbitrary 2D layout · no coordination geometry</text></svg>