<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>Agarose gel</title><desc>Cross-linked or entangled gel structure is not characterized atomically in the supplied source. Source-specific gel percentage and buffer remain operation data.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><text x="450" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#254a5c">Agarose network</text><text x="450" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#254a5c">Electrophoresis matrix</text><text x="450" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#254a5c">Not a nanoparticle shell</text></svg>