<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680"><title>Nanocrystal dispersion context</title><desc>Symbolic composition and specimen context. Atomic positions, particle shape, surface coverage and phase fractions are not drawn.</desc><rect x="1" y="1" width="1098" height="678" rx="20" fill="#fff" stroke="#b9ced8"/><text x="48" y="59" fill="#244756" font-family="Arial,sans-serif" font-size="30" text-anchor="start">Nanocrystal dispersion context</text><text x="48" y="107" fill="#244756" font-family="Arial,sans-serif" font-size="22" text-anchor="start">The suspension and its measurement state remain distinct</text><text x="550" y="258" fill="#244756" font-family="Arial,sans-serif" font-size="64" text-anchor="middle">CsMnCl3</text><rect x="280" y="340" width="540" height="100" rx="12" fill="#f4dfed" stroke="#c4a4b8"/><text x="550" y="385" fill="#244756" font-family="Arial,sans-serif" font-size="25" text-anchor="middle">Dispersed nanocrystal material</text><text x="550" y="420" fill="#244756" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">No individual particles or solvent molecules modeled</text><text x="52" y="548" fill="#244756" font-family="Arial,sans-serif" font-size="20" text-anchor="start">Symbolic composition and specimen context. Atomic positions, particle shape, surface</text><text x="52" y="578" fill="#244756" font-family="Arial,sans-serif" font-size="20" text-anchor="start">coverage and phase fractions are not drawn.</text></svg>