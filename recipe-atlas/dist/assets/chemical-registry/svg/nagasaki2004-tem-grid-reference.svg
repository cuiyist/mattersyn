<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470"><title>Film-coated copper TEM grid</title><desc>The source calls the support a “formval film-coated Cu grid.” Mesh, film chemistry and carbon coating are unreported.</desc><rect width="960" height="470" rx="20" fill="#fff"/><rect x="1" y="1" width="958" height="468" rx="20" fill="none" stroke="#d5e0e5"/><text x="28" y="41" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#193749" text-anchor="start">Film-coated copper TEM grid</text><text x="28" y="73" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#617784" text-anchor="start">Symbolic source identity · no atomistic coordinates</text><ellipse cx="235" cy="212" rx="147" ry="106" fill="#efd5b8" stroke="#ad8055" stroke-width="4"/><ellipse cx="235" cy="212" rx="118" ry="84" fill="#e5eef5" fill-opacity=".85" stroke="#9fb5c5"/><text x="235" y="221" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#665343" text-anchor="middle">Cu support</text><text x="450" y="169" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#536575" text-anchor="start">“formval film-coated Cu grid”</text><text x="450" y="234" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#536575" text-anchor="start">Source spelling retained. Mesh, film</text><text x="450" y="258" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#536575" text-anchor="start">chemistry and carbon coating are</text><text x="450" y="282" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#536575" text-anchor="start">unreported.</text><path d="M28 370H932" stroke="#e1e8ec"/><text x="28" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536575" text-anchor="start">Schematic coated support. No 300-mesh specification, carbon layer or corrected film-polymer identity is</text><text x="28" y="423" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536575" text-anchor="start">imported.</text></svg>