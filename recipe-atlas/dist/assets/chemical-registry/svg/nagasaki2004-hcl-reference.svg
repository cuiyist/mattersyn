<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470"><title>Hydrochloric acid</title><desc>Source-named HCl is an alternative zeta-assay pH adjuster. It is not identified as the reagent used earlier to protonate PAMA.</desc><rect width="960" height="470" rx="20" fill="#fff"/><rect x="1" y="1" width="958" height="468" rx="20" fill="none" stroke="#d5e0e5"/><text x="28" y="41" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#193749" text-anchor="start">Hydrochloric acid</text><text x="28" y="73" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#617784" text-anchor="start">Source-named acid identity · aqueous pH-adjustment context</text><text x="215" y="231" font-family="Arial, sans-serif" font-size="66" font-weight="600" fill="#567b8f" text-anchor="middle">HCl</text><text x="410" y="173" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#536575" text-anchor="start">Alternative pH adjuster in the zeta-</text><text x="410" y="197" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#536575" text-anchor="start">potential measurement.</text><text x="410" y="258" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#536575" text-anchor="start">This is not the unspecified polymer-</text><text x="410" y="282" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#536575" text-anchor="start">protonation reagent.</text><path d="M28 370H932" stroke="#e1e8ec"/><text x="28" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536575" text-anchor="start">Formula identity only. No discrete aqueous HCl molecule, ion pair or acid solution concentration is</text><text x="28" y="423" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536575" text-anchor="start">inferred.</text></svg>