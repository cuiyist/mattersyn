</g><text x="550" y="521" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#294658">Formal salt components · arbitrary 2D layout</text><rect x="28" y="548" width="1044" height="205" rx="12" fill="#edf5f8"/><text x="48" y="580" font-family="Arial,sans-serif" font-size="17" text-anchor="start" fill="#294658">Formamidine acetate salt, 99%, Sigma-Aldrich. Whole FA-stock preparation uses 0.1042 g; this is distinct</text><text x="48" y="604" font-family="Arial,sans-serif" font-size="17" text-anchor="start" fill="#294658">from the later 0.51 mL stock transfer.</text><text x="48" y="628" font-family="Arial,sans-serif" font-size="17" text-anchor="start" fill="#294658"></text><text x="48" y="652" font-family="Arial,sans-serif" font-size="17" text-anchor="start" fill="#294658">Formal disconnected formamidinium and acetate ions show named-salt connectivity and one resonance form. The</text><text x="48" y="676" font-family="Arial,sans-serif" font-size="17" text-anchor="start" fill="#294658">printed neutral-pair formula is retained separately. This 2D drawing does not establish ion-pair geometry,</text><text x="48" y="700" font-family="Arial,sans-serif" font-size="17" text-anchor="start" fill="#294658">proton-transfer equilibrium, hydrate, crystal or dissolved speciation.</text></svg>