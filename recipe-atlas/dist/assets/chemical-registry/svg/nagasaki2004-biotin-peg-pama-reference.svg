<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470"><title>Biotin-functional PEG/PAMA</title><desc>Biotin-functional PEG/PAMA identity. Biotin loading and exact attachment microstructure are unreported; the acetal functionality estimate is not a biotin-conjugation yield.</desc><rect width="960" height="470" rx="20" fill="#fff"/><rect x="1" y="1" width="958" height="468" rx="20" fill="none" stroke="#d5e0e5"/><text x="28" y="41" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#193749" text-anchor="start">Biotin-functional PEG/PAMA</text><text x="28" y="73" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#617784" text-anchor="start">Symbolic source identity · no atomistic coordinates</text><rect x="60" y="125" width="155" height="73" rx="13" fill="#f5ead4" stroke="#c59b52"/><text x="138" y="167" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#684d28" text-anchor="middle">Biotin</text><path d="M215 162H252" stroke="#7e929d" stroke-width="3"/><rect x="252" y="121" width="260" height="82" rx="13" fill="#d9eef1" stroke="#477e87"/><text x="382" y="170" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#477e87" text-anchor="middle">PEG</text><path d="M510 162H547" stroke="#7e929d" stroke-width="3"/><rect x="547" y="121" width="260" height="82" rx="13" fill="#eee0f4" stroke="#825e98"/><text x="677" y="170" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#825e98" text-anchor="middle">PAMA</text><text x="61" y="255" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#536575" text-anchor="start">End functionalization schematic; biotin loading and exact attachment microstructure are</text><text x="61" y="279" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#536575" text-anchor="start">unreported.</text><text x="61" y="328" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#637482" text-anchor="start">Block lengths are symbolic; no fixed repeat count, tacticity or chain conformation.</text><path d="M28 370H932" stroke="#e1e8ec"/><text x="28" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536575" text-anchor="start">Polymer topology and end-group labels are symbolic. No exact whole-chain formula, conformation or</text><text x="28" y="423" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536575" text-anchor="start">surface attachment geometry is supplied.</text></svg>