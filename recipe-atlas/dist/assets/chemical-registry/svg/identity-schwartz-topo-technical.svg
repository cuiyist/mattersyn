<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>Technical-grade TOPO</title><desc>Footnote16 specifies technical-grade TOPO and unidentified phosphonic-acid impurities. The linked pure TOPO structure describes only the named component, not the full reagent or actual surface ligand distribution.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><text x="450" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#294451">TOPO-containing technical reagent</text><text x="450" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#294451">Phosphonic-acid impurities reported</text><text x="450" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#294451">Mixture composition unspecified</text></svg>