<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820"><title>Quoted gamma reference cell</title><rect x="1" y="1" width="1098" height="818" rx="18" fill="white" stroke="#b9ced8"/><text x="40" y="55" font-family="Arial,sans-serif" font-size="27" fill="#244756">Quoted gamma reference cell</text><text x="40" y="95" font-family="Arial,sans-serif" font-size="20" fill="#687f8b">Sasongko et al. · Journal of Physical Chemistry C 2025</text><text x="55" y="160" font-family="Arial,sans-serif" font-size="29" fill="#244756">γ tetragonal P4/mbm — quoted reference</text><rect x="36" y="208" width="1028" height="111" rx="14" fill="#edf5f8"/><text x="55" y="243" font-family="Arial,sans-serif" font-size="21" fill="#244756">a: 8.88 Å</text><text x="55" y="270" font-family="Arial,sans-serif" font-size="21" fill="#244756">b: 8.88 Å</text><text x="55" y="297" font-family="Arial,sans-serif" font-size="21" fill="#244756">c: 6.28 Å</text><text x="45" y="389" font-family="Arial,sans-serif" font-size="21" fill="#244756">The paper quotes external reference-cell parameters for its conceptual phase discussion. They are</text><text x="45" y="416" font-family="Arial,sans-serif" font-size="21" fill="#244756">not a refinement of the current QDs. No atomic positions, occupancies or CIF are supplied.</text><text x="45" y="726" font-family="Arial,sans-serif" font-size="20" fill="#687f8b">Symbolic context only. No atomic positions, particle envelope, ligand geometry or exact</text><text x="45" y="753" font-family="Arial,sans-serif" font-size="20" fill="#687f8b">structure–recipe pair.</text></svg>