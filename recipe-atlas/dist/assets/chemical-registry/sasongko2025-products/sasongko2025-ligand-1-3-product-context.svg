<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820"><title>Ligand comparison — OAm:OA 1:3</title><rect x="1" y="1" width="1098" height="818" rx="18" fill="white" stroke="#b9ced8"/><text x="40" y="55" font-family="Arial,sans-serif" font-size="27" fill="#244756">Ligand comparison — OAm:OA 1:3</text><text x="40" y="95" font-family="Arial,sans-serif" font-size="20" fill="#687f8b">Sasongko et al. · Journal of Physical Chemistry C 2025</text><text x="55" y="160" font-family="Arial,sans-serif" font-size="29" fill="#244756">OAm:OA 1:3 by volume</text><rect x="36" y="208" width="1028" height="192" rx="14" fill="#edf5f8"/><text x="55" y="243" font-family="Arial,sans-serif" font-size="21" fill="#244756">Source XRD assignment: Source FAPbI3 diffraction assignment; phase fractions unquantified</text><text x="55" y="270" font-family="Arial,sans-serif" font-size="21" fill="#244756">OAm parts: 1 volume part</text><text x="55" y="297" font-family="Arial,sans-serif" font-size="21" fill="#244756">OA parts: 3 volume parts</text><text x="55" y="324" font-family="Arial,sans-serif" font-size="21" fill="#244756">(001) FWHM: .37 ° 2θ (axis)</text><text x="55" y="351" font-family="Arial,sans-serif" font-size="21" fill="#244756">(002) FWHM: .44 ° 2θ (axis)</text><text x="55" y="378" font-family="Arial,sans-serif" font-size="21" fill="#244756">average PL lifetime: ~150 ns</text><text x="45" y="470" font-family="Arial,sans-serif" font-size="21" fill="#244756">Figure 1 compares this condition at 100 °C with acetonitrile:toluene 1:20 washing. Diffraction</text><text x="45" y="497" font-family="Arial,sans-serif" font-size="21" fill="#244756">widths and optical lifetimes are source comparison results; no exact cross-technique aliquot, phase</text><text x="45" y="524" font-family="Arial,sans-serif" font-size="21" fill="#244756">fraction or ligand occupancy is established.</text><text x="45" y="726" font-family="Arial,sans-serif" font-size="20" fill="#687f8b">Symbolic context only. No atomic positions, particle envelope, ligand geometry or exact</text><text x="45" y="753" font-family="Arial,sans-serif" font-size="20" fill="#687f8b">structure–recipe pair.</text></svg>