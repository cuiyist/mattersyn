<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830"><rect width="1000" height="830" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="27" y="42" font-size="25" fill="#213446" stroke="none">09  Crosslink with aqueous glutaraldehyde</text><text x="28" y="81" font-size="17" fill="#596b7d" stroke="none">CS-QD hybrid preparation · source-bound conceptual stage</text><rect x="24" y="112" width="372" height="315" rx="12" fill="#e6f1fa"/><rect x="604" y="112" width="372" height="315" rx="12" fill="#e5f4ed"/><text x="43" y="146" font-size="18" fill="#213446" stroke="none">INPUTS</text><text x="623" y="146" font-size="17" fill="#213446" stroke="none">OUTPUTS / PHYSICAL STATES</text><text x="43" y="179" font-size="18" fill="#213446" stroke="none">opalescent CS-EDTA-QD colloid</text><text x="43" y="215" font-size="18" fill="#213446" stroke="none">25% aqueous glutaraldehyde stock</text><text x="623" y="179" font-size="18" fill="#213446" stroke="none">crosslinked CS-EDTA-QD colloid</text><text x="623" y="203" font-size="18" fill="#213446" stroke="none">[mixture]</text><g stroke="#1c6480" stroke-width="3" fill="none" stroke-linejoin="round"><rect x="442" y="187" width="112" height="34" rx="4"/><rect x="442" y="283" width="112" height="34" rx="4"/><path d="M464 221v62 M496 221v62 M528 221v62"/><text x="417" y="347" font-size="16" fill="#213446" stroke="none">Crosslinking stage</text><text x="411" y="371" font-size="15" fill="#213446" stroke="none">No network geometry</text></g><text x="28" y="460" font-size="18" fill="#213446" stroke="none">Add 11uL of 25%aqueous GA solution and allow crosslinking2h at room temperature. No numeric room</text><text x="28" y="484" font-size="18" fill="#213446" stroke="none">temperature or GA percentage basis supplied.</text><text x="28" y="521" font-size="18" fill="#213446" stroke="none">stock addition volume: 11 uL</text><text x="28" y="558" font-size="18" fill="#213446" stroke="none">duration: 2 h</text><text x="28" y="595" font-size="18" fill="#213446" stroke="none">temperature: not reported — Room temperature reported; numeric value unreported.</text><text x="28" y="632" font-size="18" fill="#213446" stroke="none">Environment: room temperature. Atmosphere/pressure unreported.</text><text x="28" y="774" font-size="15" fill="#596b7d" stroke="none">Conceptual illustration; no measured geometry, levels or unreported apparatus inferred.</text><text x="28" y="799" font-size="14" fill="#596b7d" stroke="none">Lin et al.(2011) · Main PDF p.3 / printed p.997, Preparation of CS-QD Hybrid Nanospheres continued</text></g></svg>