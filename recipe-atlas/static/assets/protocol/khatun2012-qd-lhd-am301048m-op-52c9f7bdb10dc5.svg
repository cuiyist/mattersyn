<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="681" viewBox="0 0 1100 681"><rect width="1100" height="681" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="42" font-size="27" font-weight="bold" fill="#173047">02 Prepare the reported tellurium solution</text><text x="28" y="91" font-size="17" font-weight="normal" fill="#596b7d">primary reported preparation</text><g transform="translate(0 101)"><g transform="translate(875 0)" stroke="#1b6986" fill="none" stroke-width="3" stroke-linejoin="round"><path d="M18 21h43v31H18z M101 21h43v31h-43z M41 60l32 33m-1-12 1 12-12-1 M122 60L90 93m1-12-1 12 12-1"/></g></g><text x="28" y="136" font-size="23" font-weight="normal" fill="#135d83">Mixing / preparation • conceptual action symbol</text><rect x="26" y="223" width="500" height="235" rx="12" fill="#e6f1fa"/><text x="42" y="261" font-size="19" font-weight="bold" fill="#173047">INPUTS</text><text x="42" y="296" font-size="20" font-weight="normal" fill="#173047">tellurium</text><text x="42" y="327" font-size="18" font-weight="normal" fill="#173047">amount: 0.2 mmol</text><text x="42" y="371" font-size="20" font-weight="normal" fill="#173047">trioctyl phosphate (TOP), as printed</text><text x="42" y="402" font-size="18" font-weight="normal" fill="#173047">mass: 0.475 g</text><rect x="572" y="223" width="500" height="235" rx="12" fill="#e5f4ed"/><text x="588" y="261" font-size="19" font-weight="bold" fill="#173047">OUTPUTS / PHYSICAL STATES</text><text x="588" y="296" font-size="20" font-weight="normal" fill="#173047">tellurium solution in source-named TOP</text><text x="588" y="327" font-size="18" font-weight="normal" fill="#173047">Kind: stock</text><text x="28" y="496" font-size="21" font-weight="normal" fill="#173047">Use tellurium0.2mmol dissolved in0.475g source-named trioctyl phosphate (TOP); preparation</text><text x="28" y="524" font-size="21" font-weight="normal" fill="#173047">temperature/time are unreported.</text><text x="28" y="565" font-