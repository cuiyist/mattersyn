<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="789" viewBox="0 0 1100 789"><rect width="1100" height="789" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="42" font-size="27" font-weight="bold" fill="#173047">03 Mix the two precursor solutions</text><text x="28" y="91" font-size="17" font-weight="normal" fill="#596b7d">primary reported preparation</text><g transform="translate(0 101)"><g transform="translate(875 0)" stroke="#1b6986" fill="none" stroke-width="3" stroke-linejoin="round"><rect x="9" y="13" width="48" height="31"/><rect x="102" y="13" width="48" height="31"/><path d="M32 52l38 39m-2-12 2 12-12-2 M126 52L89 91m1-12-1 12 12-2 M55 106h51"/></g></g><text x="28" y="136" font-size="23" font-weight="normal" fill="#135d83">Combine separate stocks • conceptual action symbol</text><rect x="26" y="223" width="500" height="343" rx="12" fill="#e6f1fa"/><text x="42" y="261" font-size="19" font-weight="bold" fill="#173047">INPUTS</text><text x="42" y="296" font-size="20" font-weight="normal" fill="#173047">0.06 M Pb(Ac)2 in ethylenediamine</text><text x="42" y="327" font-size="18" font-weight="normal" fill="#173047">Separate precursor stock only; absolute amount and</text><text x="42" y="352" font-size="18" font-weight="normal" fill="#173047">volume unreported.</text><text x="42" y="381" font-size="18" font-weight="normal" fill="#173047">lead_acetate concentration: 0.06 mol/L</text><text x="42" y="425" font-size="20" font-weight="normal" fill="#173047">0.06 M thioacetamide in ethylenediamine</text><text x="42" y="456" font-size="18" font-weight="normal" fill="#173047">Separate precursor stock only; absolute amount and</text><text x="42" y="481" font-size="18" font-weight="normal" fill="#173047">volume unreported.</text><text x="42" y="510" font-size="18" font-weight="normal" fill="#173047">thioacetamide concentration: 0.06 mol/L</text><rect x="572" y="223" width="500" height="343" rx="12" fill="#e5f4ed"/><text x="588" y="261" font-size="19" font-weight="bold" fill="#173047">OUTPUTS / PHYSICAL STATES</text><text x="588" y="296" font-size="20" font-weight="normal" fill="#173047">mixed lead and sulfur precursor solutions</text><text x="588" y="327" font-size="18" font-weight="normal" fill="#173047">Kind: reaction_batch</text><text x="28" y="604" font-size="21" font-weight="normal" fill="#173047">Mix the two ethylenediamine solutions. Relative volumes, final volume, final mixed concentrations, mixing</text><text x="28" y="632" font-size="21" font-weight="normal" fill="#173047">temperature and mixing duration are unreported.</text><text x="28" y="673" font-size="21" font-weight="normal" fill="#173047">Environment: not reported</text><text x="28" y="714" font-size="15" font-weight="normal" fill="#596b7d">Conceptual and not to scale; no unreported apparatus geometry, liquid levels or handling atmosphere inferred.</text><text x="28" y="744" font-size="15" font-weight="normal" fill="#596b7d">Yang et al. (2012) • Main PDF p.2 / printed p.6163, Experimental, Preparation of PbS/CB Composite Counter Electrode</text></g></svg>