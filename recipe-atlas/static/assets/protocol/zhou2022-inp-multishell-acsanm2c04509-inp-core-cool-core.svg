<svg xmlns="http://www.w3.org/2000/svg" width="960" height="819" viewBox="0 0 960 819"><title>Rapidly cool the core mixture</title><desc>Second three-neck flask continues; cooling method not restated. Drawing dimensions and liquid level are schematic, not measured geometry.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><rect width="960" height="819" rx="15" fill="#f7fafc"/><text x="30" y="32" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#637f8e">InP core synthesis and HF treatment</text><text x="30" y="57" font-family="Arial,sans-serif" font-size="28" text-anchor="start" fill="#173c4a">Rapidly cool the core mixture</text><text x="30" y="92" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">temperature: room temperature; numerical value not reported</text><g transform="translate(70 136)"><path d="M386 20H434V80L452 90L473 55L503 72L482 110Q516 142 507 197Q500 257 410 263Q320 257 313 197Q304 142 338 110L317 72L347 55L368 90L386 80Z" fill="#edf6f8" stroke="#3c6475" stroke-width="3"/><path d="M327 193Q410 219 493 193" fill="none" stroke="#9abbc8" stroke-width="4"/><path d="M600 64L600 220" fill="none" stroke="#477e91" stroke-width="4" marker-end="url(#arrow)"/><text x="657" y="252" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#173c4a">Cool</text><text x="410" y="354" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#173c4a">Continuing reaction vessel</text></g><text x="30" y="531" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Inputs: Quickly transfer the nuclei to the second flask</text><text x="30" y="557" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="583" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Outputs: Rapidly cool the core mixture</text><text x="30" y="609" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="635" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Rapidly cool the core mixture</text><text x="30" y="661" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="687" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Second three-neck flask continues; cooling method not restated. Drawing dimensions and liquid level</text><text x="30" y="713" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">are schematic, not measured geometry.</text><text x="30" y="739" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="765" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Source: Main PDF p.3, Section 2.1.1, InP Core</text></svg>