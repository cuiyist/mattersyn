<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><title>Separate the organic phase</title><desc>Conceptual stage diagram. Aqueous / organic phase context. Only source-stated conditions apply.</desc><rect x="5" y="5" width="1090" height="580" rx="20" fill="#f3f8fa" stroke="#bfd1da"/><g transform="translate(10 120)" fill="none" stroke="#426e80" stroke-width="3.4"><path d="M64 54v186q96 28 192 0V54M64 128q96 24 192 0M64 184q96 24 192 0"/><path d="M106 80h108m-13-10 13 10-13 10"/></g><text x="360" y="54" font-family="Arial,sans-serif" font-size="25" fill="#153e50">Separate the organic phase</text><text x="360" y="132" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">Use centrifugation at 5000 rpm and decantation to separate</text><text x="360" y="160" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">the aqueous and organic phases. Centrifugation duration is</text><text x="360" y="188" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">unreported.</text><text x="26" y="538" font-family="Arial,sans-serif" font-size="16" fill="#52717d">Conceptual stage diagram. Aqueous / organic phase context. Only source-stated conditions apply.</text></svg>
