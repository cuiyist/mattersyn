<svg xmlns="http://www.w3.org/2000/svg" width="960" height="714" viewBox="0 0 960 714" role="img"><title>Store selected QCD material under ambient conditions</title><desc>Source-linked conceptual stage; geometry and unreported fields are not measurements.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="714" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#647888">Selected-QCD storage and fluorescence reproducibility</text><text x="30" y="68" font-size="28" text-anchor="start" fill="#234b60">Store selected QCD material under ambient conditions</text><text x="30" y="107" font-size="21" text-anchor="start" fill="#234b60">temperature: ambient conditions; no numerical temperature supplied</text><text x="30" y="135" font-size="21" text-anchor="start" fill="#234b60">Environment: ambient conditions</text><g transform="translate(0 171)"><rect x="424" y="21" width="112" height="167" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M432 153q48.0 9 96 0" fill="none" stroke="#9abfce" stroke-width="4"/><text x="480" y="251" font-size="20" text-anchor="middle" fill="#234b60">Ambient storage; temperature, light and container unspecified</text></g><text x="30" y="465" font-size="20" text-anchor="start" fill="#234b60">Inputs: AuNC/CdTe hybrid quantum cluster dots</text><text x="30" y="501" font-size="20" text-anchor="start" fill="#234b60">Output: Store selected QCD material under ambient conditions</text><text x="30" y="537" font-size="20" text-anchor="start" fill="#234b60">No container, light exposure or exact sampling design stated. Three-month visual stability and</text><text x="30" y="564" font-size="20" text-anchor="start" fill="#234b60">120-day PL series remain distinct evidence.</text><text x="30" y="600" font-size="20" text-anchor="start" fill="#234b60">Generic apparatus cue; vessel dimensions, quantitative liquid level and spatial layout are not</text><text x="30" y="627" font-size="20" text-anchor="start" fill="#234b60">measured source geometry.</text><text x="30" y="663" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.4 §3.1; Main PDF p.8 §3.4</text></g></svg>