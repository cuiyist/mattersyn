<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img" aria-labelledby="t d"><title id="t">Conceptual sealed autoclave in oven</title><desc id="d">An illustrative, unscaled schematic of the source-reported sealed Teflon-lined autoclave heated in an oven; no internal geometry, pressure, ramp or safety hardware is represented.</desc><rect width="700" height="360" rx="24" fill="#f4f7f8"/><rect x="34" y="44" width="280" height="245" rx="18" fill="#e6edf1" stroke="#687f8b" stroke-width="4"/><rect x="70" y="85" width="208" height="162" rx="12" fill="#fff" stroke="#8ba1ad" stroke-width="3"/><text x="174" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#334c5a">Oven (reported)</text><rect x="378" y="92" width="160" height="130" rx="22" fill="#dce6ea" stroke="#486676" stroke-width="4"/><path d="M378 118H538M397 82H519V96H397Z" fill="#b9c9d0" stroke="#486676" stroke-width="3"/><rect x="397" y="126" width="122" height="80" rx="14" fill="#f8fbfc" stroke="#91a5ad" stroke-width="3"/><text x="458" y="161" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#263c47">Teflon</text><text x="458" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#263c47">liner</text><text x="458" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#263c47">10 mL autoclave</text><path d="M314 166H359" stroke="#bd7550" stroke-width="5" stroke-dasharray="9 7"/><text x="350" y="312" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#334c5a"><tspan x="350">Conceptual; not to scale. Source reports 200 °C for 4 h.</tspan><tspan x="350" dy="25">Pressure and ramp unreported.</tspan></text></svg>