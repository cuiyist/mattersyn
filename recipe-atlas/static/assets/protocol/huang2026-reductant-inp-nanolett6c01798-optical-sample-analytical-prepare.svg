<svg xmlns="http://www.w3.org/2000/svg" width="960" height="741" viewBox="0 0 960 741" role="img" aria-labelledby="title desc"><title id="title">Disperse purified QDs in hexane and apply to a colorimetric cuvette</title><desc id="desc">Cuvette loading is shown schematically. Cuvette dimensions, fill level and optical path length are not reported.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><g font-family="Arial,sans-serif"><rect width="960" height="741" rx="16" fill="#f7fafb"/><text x="28" y="42" font-size="27" text-anchor="start" fill="#274c60">Disperse purified QDs in hexane and apply to a colorimetric</text><text x="28" y="77" font-size="27" text-anchor="start" fill="#274c60">cuvette</text><g transform="translate(0 140)"><text x="247" y="48" font-size="23" text-anchor="middle" fill="#274c60">QD dispersion in hexane</text><rect x="210" y="81" width="76" height="135" rx="7" fill="#eef6f8" stroke="#477081" stroke-width="3"/><path d="M210 98h76M217 187q31.0 10 62 0" fill="none" stroke="#a0c1d0" stroke-width="3"/><path d="M330 153L535 153" fill="none" stroke="#477e91" stroke-width="3" marker-end="url(#arrow)"/><path d="M595 103c-8 15-20 25-20 37a20 20 0 0 0 40 0c0-12-12-22-20-37z" fill="#9dc4d3" stroke="#477081" stroke-width="3"/><path d="M572 195v125h107V195M679 195l22-15v125l-22 15M572 195l22-15h107" fill="#e5f0f5" stroke="#477081" stroke-width="3"/><path d="M580 267h91v44h-91z" fill="#aacddc"/><text x="440" y="124" font-size="21" text-anchor="middle" fill="#274c60">Apply solution</text><text x="634" y="362" font-size="23" text-anchor="middle" fill="#274c60">Colorimetric cuvette</text></g><text x="28" y="552" font-size="20" text-anchor="start" fill="#274c60">Inputs: InP-derived quantum-dot dispersion; Hexane: source solvent label</text><text x="28" y="579" font-size="20" text-anchor="start" fill="#274c60">Outputs: Disperse purified QDs in hexane and apply to a colorimetric cuvette</text><text x="28" y="606" font-size="20" text-anchor="start" fill="#274c60">Cuvette loading is shown schematically. Cuvette dimensions, fill level and optical path length</text><text x="28" y="633" font-size="20" text-anchor="start" fill="#274c60">are not reported.</text><text x="28" y="660" font-size="20" text-anchor="start" fill="#274c60">Schematic action illustration. Drawn shapes, dimensions and fill levels are illustrative; only</text><text x="28" y="687" font-size="20" text-anchor="start" fill="#274c60">stated source dimensions are quantitative.</text></g></svg>
