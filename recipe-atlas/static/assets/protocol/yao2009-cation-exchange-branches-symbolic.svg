<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="710" viewBox="0 0 1380 710" role="img" aria-labelledby="t d"><title id="t">Yao 2009: parallel cation-exchange branches from CdSe wet gel</title><desc id="d">Original conceptual route map. Four separate branches start from CdSe wet gel: full silver exchange and Ag2Se aerogel drying; partial silver exchange stopping at a wet gel; lead nitrate exchange to PbSe; and copper nitrate exchange to CuSe. Lead and copper exchange do not follow partial silver exchange. This is not apparatus or measured geometry.</desc><rect width="1380" height="710" fill="#f6f9fb"/><style>text{font-family:Arial,sans-serif;fill:#173746}.h{font-size:24px;font-weight:bold}.b{font-size:18px}.s{font-size:16px}.box{fill:#fff;stroke:#638799;stroke-width:2}.line{fill:none;stroke:#638799;stroke-width:3}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#638799"/></marker></defs><text x="30" y="42" class="h">CdSe wet gel → separate full Ag, partial Ag, Pb and Cu exchange branches</text><rect x="30" y="226" width="255" height="204" rx="16" class="box"/><text x="48" y="266" class="h">CdSe wet gel</text><text x="48" y="304" class="b">MUA ligand exchange</text><text x="48" y="335" class="b">TNM oxidative gelation</text><text x="48" y="366" class="b">1 week, ambient light</text><text x="48" y="397" class="b">Monolithic gel framework</text><path d="M285 328H315M315 146V566" class="line"/><path d="M315 146H355M315 286H355M315 426H355M315 566H355" class="line" marker-end="url(#arrow)"/>
<rect x="365" y="91" width="448" height="110" rx="16" class="box"/><text x="385" y="126" class="h">Full Ag⁺ exchange</text><text x="385" y="159" class="b">4 mL of 0.15 M AgNO₃ in methanol</text><text x="385" y="186" class="s">Main: 12 h before wash; SI: gel after a few hours</text><path d="M813 146H873" class="line" marker-end="url(#arrow)"/><rect x="883" y="91" width="467" height="110" rx="16" class="box"/><text x="903" y="126" class="h">Ag₂Se aerogel</text><text x="903" y="159" class="b">Methanol wash → acetone exchange</text><text x="903" y="186" class="b">→ supercritical CO₂ drying</text>
<rect x="365" y="231" width="448" height="110" rx="16" class="box"/><text x="385" y="266" class="h">Partial Ag⁺ exchange</text><text x="385" y="300" class="b">Lower Ag⁺ amount; exact dose not reported</text><text x="385" y="327" class="s">Exchange time and workup not reported</text><path d="M813 286H873" class="line" marker-end="url(#arrow)"/><rect x="883" y="231" width="467" height="110" rx="16" class="box"/><text x="903" y="266" class="h">Partial CdSe / Ag₂Se wet gel</text><text x="903" y="300" class="b">Black outer zone · orange CdSe core</text><text x="903" y="327" class="s">Macroscopic monolith; no drying is assigned</text>
<rect x="365" y="371" width="448" height="110" rx="16" class="box"/><text x="385" y="406" class="h">Pb(NO₃)₂ exchange in methanol</text><text x="385" y="440" class="b">Up to 24 h</text><text x="385" y="467" class="s">Salt concentration and solution volume not restated</text><path d="M813 426H873" class="line" marker-end="url(#arrow)"/><rect x="883" y="371" width="467" height="110" rx="16" class="box"/><text x="903" y="406" class="h">PbSe gel / aerogel branch</text><text x="903" y="440" class="b">Wash: methanol / water, 2:1 v/v</text><text x="903" y="467" class="s">Other preparation follows the stated source analogy</text>
<rect x="365" y="511" width="448" height="110" rx="16" class="box"/><text x="385" y="546" class="h">Cu(NO₃)₂ exchange in methanol</text><text x="385" y="580" class="b">Up to 24 h</text><text x="385" y="607" class="s">Salt concentration and solution volume not restated</text><path d="M813 566H873" class="line" marker-end="url(#arrow)"/><rect x="883" y="511" width="467" height="110" rx="16" class="box"/><text x="903" y="546" class="h">CuSe gel / aerogel branch</text><text x="903" y="580" class="b">Wash: pure methanol</text><text x="903" y="607" class="s">Other preparation follows the stated source analogy</text>
