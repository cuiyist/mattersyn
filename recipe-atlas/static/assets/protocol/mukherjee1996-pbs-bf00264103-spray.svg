<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410" role="img"><defs><linearGradient id="steel"><stop stop-color="#e9f1f7"/><stop offset=".48" stop-color="#b7c9d8"/><stop offset="1" stop-color="#eff5f9"/></linearGradient><linearGradient id="beam"><stop stop-color="#edb856" stop-opacity=".18"/><stop offset="1" stop-color="#ed9541" stop-opacity=".7"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6284a0"/></marker></defs><rect x="8" y="8" width="604" height="394" rx="22" fill="#f4f8fb" stroke="#d6e3eb"/><text x="310" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#233d53">Form PbS by spray precipitation</text><rect x="164" y="141" width="292" height="165" rx="12" fill="#e7eff3" stroke="#688a9f" stroke-width="4"/><path d="M235 118V174L255 195H215Z" fill="#aac5d2" stroke="#688a9f" stroke-width="3"/><path d="M183 286H424V131H291" fill="none" stroke="#587f91" stroke-width="3"/><text x="310" y="93" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#233d53">Closed H2S chamber</text><text x="310" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#233d53">Spray + continuous recycling</text><text x="310" y="351" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#233d53">Nozzle, chamber size and flow are not specified</text><text x="310" y="371" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#567184">Original conceptual apparatus; source quantities alongside</text><text x="310" y="392" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#708695">Conceptual equipment · geometry is not a measured dimension</text><desc>Original equipment illustration for spray. Apparatus geometry is conceptual. Source-specific quantities and unknowns stay beside each bound operation. No measured particle, molecular or atomic coordinates.</desc></svg>
