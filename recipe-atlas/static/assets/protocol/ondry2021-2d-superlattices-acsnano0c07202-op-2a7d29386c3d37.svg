<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="846" viewBox="0 0 1000 846"><title>Stir sulfur in TOP</title><desc>Stir sulfur in TOP. Duration: ≈30 min Reported feed concentration: 0.2 M; Concentration explicitly reported for the subsequently injected TOP-S solution. Environment: Glovebox; gas not specified for this preparation Dissolved TOP-S is a formulation; sulfur element and TOP reference structures do not establish solution speciation. Glovebox silhouette is illustrative. Gas, duration and other conditions are only those reported below. Authored conceptual stage illustration; not measured apparatus or particle structure.</desc><rect x="1" y="1" width="998" height="844" rx="16" fill="#f8fbfc" stroke="#a9c5d0"/><rect x="0" y="0" width="1000" height="50" rx="16" fill="#173f50"/><text x="30" y="31" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">STEP 01 / 01  ·  PRECURSOR PREPARATION</text><text x="30" y="84" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#244754">Stir sulfur in TOP</text><text x="30" y="121" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#506875">Ondry et al. (2021): TOP-S stock preparation</text><rect x="30" y="169" width="415" height="158" rx="12" fill="#e6f0f4" stroke="#bad0db"/><rect x="555" y="169" width="415" height="158" rx="12" fill="#edf4ed" stroke="#c4d4c4"/><path d="M462 248.0H537m-13 -11l13 11-13 11" fill="none" stroke="#528295" stroke-width="3"/><text x="48" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">INPUTS / CONTEXT</text><text x="48" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• sulfur</text><text x="48" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">Mass: 20 mg</text><text x="48" y="276" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• trioctylphosphine (TOP)</text><text x="48" y="301" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">Mass: 2.6 g</text><text x="573" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">OUTPUT / STATE</text><text x="573" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• top s solution</text><text x="573" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">State kind: product</text><g transform="translate(30 366)"><rect x="65" y="24" width="335" height="146" rx="8" fill="#edf3f5" stroke="#668b9c" stroke-width="2"/><circle cx="164" cy="113" r="25" fill="none" stroke="#92a7b2" stroke-width="3"/><circle cx="297" cy="113" r="25" fill="none" stroke="#92a7b2" stroke-width="3"/><text x="485" y="68" font-family="Arial,sans-serif" font-size="19" fill="#244754">Glovebox</text><text x="485" y="108" font-family="Arial,sans-serif" font-size="19" fill="#244754">Stir to prepare stock</text></g><text x="30" y="591" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">OPERATION CONDITIONS</text><text x="30" y="619" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">Duration: ≈30 min</text><text x="30" y="650" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">Reported feed concentration: 0.2 M; Concentration explicitly reported for the subsequently injected TOP-S solution.</text><text x="30" y="689" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">Environment: Glovebox; gas not specified for this preparation</text><text x="30" y="726" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">Dissolved TOP-S is a formulation; sulfur element and TOP reference structures do not establish solution speciation.</text><text x="30" y="772" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#566d75">Glovebox silhouette is illustrative. Gas, duration and othe