<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410"><title>Characterize electrode stages</title><desc>Source-bound operation schematic; geometry, fill levels and component spacing are conceptual and not quantified.</desc><rect x="5" y="5" width="910" height="400" rx="20" fill="#f4f8fa" stroke="#bed0d8"/><g transform="translate(14 55)" fill="none" stroke="#477184" stroke-width="3.5" font-family="sans-serif" font-size="20"><path d="M66 96h194v163H66z"/><path d="M100 40v167M160 40v167M220 40v167"/><path d="M70 192h186"/><circle cx="160" cy="208" r="15"/><rect x="85" y="4" width="165" height="45"/><path d="M93 35l25-12 20 9 28-18 25 12 38-14"/></g><text stroke="none" x="365" y="54" font-family="sans-serif" font-size="24" fill="#183e4d">Characterize electrode stages</text><text stroke="none" x="365" y="99" font-family="sans-serif" font-size="18" fill="#294f5e">CV/EIS use 10 mM PBS pH 7.4 with 2.5 mM Fe(CN)6 4-/3-</text><text stroke="none" x="365" y="127" font-family="sans-serif" font-size="18" fill="#294f5e">and 0.1 M KCl; CV 100 mV/s; EIS 1–10000 Hz, amplitude 5</text><text stroke="none" x="365" y="155" font-family="sans-serif" font-size="18" fill="#294f5e">mV. Stage aliquots compared; source does not establish</text><text stroke="none" x="365" y="183" font-family="sans-serif" font-size="18" fill="#294f5e">identical physical electrodes across techniques.</text><text stroke="none" x="30" y="382" font-family="sans-serif" font-size="16" fill="#55717d">Conceptual stage scene; no unreported vessel size, liquid level, pressure or geometry implied.</text></svg>
