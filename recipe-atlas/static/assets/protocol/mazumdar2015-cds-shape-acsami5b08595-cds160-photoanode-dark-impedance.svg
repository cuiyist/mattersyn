<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900" role="img"><title>Measure dark three-electrode impedance</title><desc>Source-linked stage schematic. No unreported equipment dimensions or solution species are asserted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="900" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="34" font-size="18" text-anchor="start" fill="#647888">CdS160 attachment to TiO2/FTO</text><text x="30" y="73" font-size="28" text-anchor="start" fill="#234b60">Measure dark three-electrode impedance</text><text x="30" y="112" font-size="21" text-anchor="start" fill="#234b60">ac amplitude: 20 mV</text><text x="30" y="140" font-size="21" text-anchor="start" fill="#234b60">frequency: 1 MHz to 0.1 Hz — sweep from high to low frequency</text><text x="30" y="168" font-size="21" text-anchor="start" fill="#234b60">bias: 0–0.8 V</text><text x="30" y="196" font-size="21" text-anchor="start" fill="#234b60">bias interval: 0.05 V</text><text x="30" y="224" font-size="21" text-anchor="start" fill="#234b60">Environment: dark</text><g transform="translate(0 258)"><rect x="228" y="58" width="504" height="151" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M330 15v145" stroke="#ba9b4a" stroke-width="11"/><path d="M480 15v145" stroke="#b4bcc3" stroke-width="11"/><path d="M630 15v145" stroke="#b78855" stroke-width="11"/><text x="330" y="0" font-size="17" text-anchor="middle" fill="#234b60">Working</text><text x="480" y="0" font-size="17" text-anchor="middle" fill="#234b60">Ag reference</text><text x="630" y="0" font-size="17" text-anchor="middle" fill="#234b60">Brass counter</text><text x="480" y="239" font-size="22" text-anchor="middle" fill="#234b60">Dark · aqueous polysulfide · layout illustrative</text></g><text x="30" y="598" font-size="20" text-anchor="start" fill="#234b60">Inputs: Immerse functionalized film in CdS160/toluene for 48 h; Brass; alloy composition</text><text x="30" y="625" font-size="20" text-anchor="start" fill="#234b60">unspecified; Silver-wire reference electrode; Aqueous sodium polysulfide for impedance;</text><text x="30" y="652" font-size="20" text-anchor="start" fill="#234b60">concentrations unspecified</text><text x="30" y="688" font-size="20" text-anchor="start" fill="#234b60">Output: Measure dark three-electrode impedance</text><text x="30" y="724" font-size="20" text-anchor="start" fill="#234b60">Solartron; photoanode working, brass counter, Ag-wire reference; aqueous polysulfide. Separate</text><text x="30" y="751" font-size="20" text-anchor="start" fill="#234b60">from Cu2S/brass sandwich solar-cell geometry. Representative Figure4 biases0.1V and0.5V.</text><text x="30" y="787" font-size="20" text-anchor="start" fill="#234b60">Apparatus dimensions, liquid level and spatial layout are schematic, not measured source</text><text x="30" y="814" font-size="20" text-anchor="start" fill="#234b60">geometry.</text><text x="30" y="850" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.3 §2.5; Main PDF p.5 Figure4</text></g></svg>