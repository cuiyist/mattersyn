<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850"><rect width="1000" height="850" fill="#f8fbfd"/><style>text{stroke:none}</style><g font-family="Arial,sans-serif"><text x="28" y="41" font-size="25" fill="#213446">01  Sonicate Ti foil in acetone</text><text x="28" y="83" font-size="17" fill="#596b7d">Sonication-CdS/TNTAs · conceptual source-bound process</text><rect x="24" y="115" width="372" height="300" rx="12" fill="#e6f1fa"/><rect x="604" y="115" width="372" height="300" rx="12" fill="#e5f4ed"/><text x="43" y="148" font-size="18" fill="#213446">INPUTS</text><text x="623" y="148" font-size="17" fill="#213446">OUTPUTS / PHYSICAL STATES</text><text x="43" y="180" font-size="18" fill="#213446">titanium foil; thickness: 0.1 mm,</text><text x="43" y="204" font-size="18" fill="#213446">length: 2.5 cm, width: 3.2 cm</text><text x="43" y="238" font-size="18" fill="#213446">acetone; amount: not reported</text><text x="623" y="180" font-size="18" fill="#213446">Ti foil after acetone sonication</text><text x="623" y="204" font-size="18" fill="#213446">cleaning [fraction]</text><g stroke="#1c6480" stroke-width="3.5" fill="none" stroke-linejoin="round"><path d="M440 173v127h120V173 M477 212h44v62h-44z M443 319q16 17 31 0 M485 319q16 17 31 0 M527 319q16 17 31 0"/><text x="445" y="153" font-size="16" fill="#213446">Sonication</text></g><text x="421" y="365" font-size="15" fill="#213446">Schematic only;</text><text x="406" y="386" font-size="15" fill="#213446">no vessel dimensions</text><text x="28" y="445" font-size="18" fill="#213446">Clean Ti foil by sonication in acetone as part of the successive acetone/isopropanol/ethanol</text><text x="28" y="469" font-size="18" fill="#213446">sequence. Amount, sonication power/frequency and duration are not reported.</text><text x="28" y="515" font-size="17" fill="#213446">duration: not reported</text><text x="28" y="543" font-size="17" fill="#213446">Environment: not reported. Atmosphere and pressure not reported for this operation.</text><text x="28" y="799" font-size="15" fill="#596b7d">No inferred liquid levels, sonication power, geometry or solution species.</text><text x="28" y="825" font-size="14" fill="#596b7d">Source: Xie et al.(2010), main Methods2.2–2.3; explicit cycle order3.1/SI FigureS1.</text></g></svg>