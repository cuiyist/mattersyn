<svg xmlns="http://www.w3.org/2000/svg" width="960" height="798" viewBox="0 0 960 798" role="img"><title>Combine the set H volumes in PBS</title><desc>Source-linked conceptual stage; geometry and unreported fields are not measurements.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="798" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#647888">AuNC/CdTe QCD assembly set H (volume 1:5)</text><text x="30" y="68" font-size="28" text-anchor="start" fill="#234b60">Combine the set H volumes in PBS</text><text x="30" y="107" font-size="21" text-anchor="start" fill="#234b60">aunc volume: 0.83 mL</text><text x="30" y="135" font-size="21" text-anchor="start" fill="#234b60">cdte volume: 4.17 mL</text><text x="30" y="163" font-size="21" text-anchor="start" fill="#234b60">pbs volume: 5 mL</text><text x="30" y="191" font-size="21" text-anchor="start" fill="#234b60">pbs concentration: 0.1 M; basis: source PBS concentration; formulation unknown</text><text x="30" y="219" font-size="21" text-anchor="start" fill="#234b60">pbs pH: 7.42 pH</text><g transform="translate(0 255)"><rect x="132" y="25" width="90" height="130" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M140 120q37.0 9 74 0" fill="none" stroke="#9abfce" stroke-width="4"/><rect x="738" y="25" width="90" height="130" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M746 120q37.0 9 74 0" fill="none" stroke="#9abfce" stroke-width="4"/><path d="M242 101L407 138" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M718 101L553 138" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="436" y="71" width="87" height="127" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M444 163q35.5 9 71 0" fill="none" stroke="#9abfce" stroke-width="4"/><text x="480" y="255" font-size="20" text-anchor="middle" fill="#234b60">Combine the named inputs; depicted liquid levels are illustrative</text></g><text x="30" y="549" font-size="20" text-anchor="start" fill="#234b60">Inputs: GSH-capped Au nanoclusters; colloidal material; MPA-capped CdTe quantum dots; colloidal</text><text x="30" y="576" font-size="20" text-anchor="start" fill="#234b60">material; Assembly PBS</text><text x="30" y="612" font-size="20" text-anchor="start" fill="#234b60">Output: Combine the set H volumes in PBS</text><text x="30" y="648" font-size="20" text-anchor="start" fill="#234b60">Volume ratio 1:5. No molar feed amounts inferred from EDX labels.</text><text x="30" y="684" font-size="20" text-anchor="start" fill="#234b60">Generic apparatus cue; vessel dimensions, quantitative liquid level and spatial layout are not</text><text x="30" y="711" font-size="20" text-anchor="start" fill="#234b60">measured source geometry.</text><text x="30" y="747" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.3 §2.5; SI PDF p.12 Table S1 row H</text></g></svg>