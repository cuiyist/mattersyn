<svg xmlns="http://www.w3.org/2000/svg" width="820" height="622" viewBox="0 0 820 622"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#426d85" stroke-width="1.5"/></marker></defs><rect width="820" height="622" rx="15" fill="#f4f7f8"/><text x="25" y="38" text-anchor="start" font-family="Arial,sans-serif" font-size="28" fill="#183c50">Dilute, precipitate, centrifuge and redissolve; repeat</text><text x="25" y="72" text-anchor="start" font-family="Arial,sans-serif" font-size="28" fill="#183c50">three times</text><text x="25" y="106" text-anchor="start" font-family="Arial,sans-serif" font-size="21" fill="#183c50">dilution toluene: 5 mL; precipitation methanol: 10 mL; centrifugal</text><text x="25" y="132" text-anchor="start" font-family="Arial,sans-serif" font-size="21" fill="#183c50">force: 16095 RCF; centrifugation duration: 10 min; intermediate</text><text x="25" y="158" text-anchor="start" font-family="Arial,sans-serif" font-size="21" fill="#183c50">redissolution toluene: 5 mL; cycles: 3 count</text><g transform="translate(0 198)"><path d="M125 47v92q0 18 18 18h39q18 0 18-18V47" fill="none" stroke="#34586a" stroke-width="4"/><path d="M120 47h85" stroke="#34586a" stroke-width="3"/><path d="M232 97L304 97" fill="none" stroke="#426d85" stroke-width="4" marker-end="url(#arrow)"/><circle cx="395" cy="99" r="66" fill="none" stroke="#34586a" stroke-width="4"/><circle cx="395" cy="99" r="12" fill="none" stroke="#34586a" stroke-width="3"/><rect x="389" y="44" width="12" height="28" rx="5" fill="none" stroke="#34586a" stroke-width="3" transform="rotate(0 395 99)"/><rect x="389" y="44" width="12" height="28" rx="5" fill="none" stroke="#34586a" stroke-width="3" transform="rotate(60 395 99)"/><rect x="389" y="44" width="12" height="28" rx="5" fill="none" stroke="#34586a" stroke-width="3" transform="rotate(120 395 99)"/><rect x="389" y="44" width="12" height="28" rx="5" fill="none" stroke="#34586a" stroke-width="3" transform="rotate(180 395 99)"/><rect x="389" y="44" width="12" height="28" rx="5" fill="none" stroke="#34586a" stroke-width="3" transform="rotate(240 395 99)"/><rect x="389" y="44" width="12" height="28" rx="5" fill="none" stroke="#34586a" stroke-width="3" transform="rotate(300 395 99)"/><path d="M480 97L555 97" fill="none" stroke="#426d85" stroke-width="4" marker-end="url(#arrow)"/><path d="M590 47v92q0 18 18 18h39q18 0 18-18V47" fill="none" stroke="#34586a" stroke-width="4"/><path d="M585 47h85" stroke="#34586a" stroke-width="3"/><path d="M596 143h63" stroke="#34586a" stroke-width="7"/><text x="163" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#183c50">Antisolvent</text><text x="395" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#183c50">Centrifugation</text><text x="627" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#183c50">Precipitate</text></g><text x="25" y="453" text-anchor="start" font-family="Arial,sans-serif" font-size="21" fill="#183c50">Inputs: Cool to room temperature using an air stream; Toluene; Methanol</text><text x="25" y="480" text-anchor="start" font-family="Arial,sans-serif" font-size="21" fill="#183c50">Output: Dilute, precipitate, centrifuge and redissolve; repeat three times</text><text x="25" y="507" text-anchor="start" font-family="Arial,sans-serif" font-size="21" fill="#183c50">Repeat the complete wash/redissolution cycle three times.</text><text x="25" y="573" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#183c50">Illustrative action cues; vessel shape, dimensions and closure are unreported.</text><text x="25" y="599" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#183c50">No measured apparatus geometry, liquid color or unreported bath is assigned.</text></svg>