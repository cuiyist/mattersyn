<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img"><title>Filter and retain the residue</title><desc>Source-linked conceptual operation. Unreported geometry and quantities are not reconstructed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4d7f93"/></marker></defs><rect width="960" height="680" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#607a89">Synthesize the BCySA selenium precursor</text><text x="30" y="65" font-size="28" text-anchor="start" fill="#254d62">Filter and retain the residue</text><text x="30" y="100" font-size="21" text-anchor="start" fill="#254d62">Additional numerical conditions for this step are not specified.</text><g transform="translate(0 138)"><path d="M364 25H596L500 120V170H460V120z" fill="#eff5f8" stroke="#587f91" stroke-width="3"/><text x="480" y="226" font-size="20" text-anchor="middle" fill="#254d62">Filtration cue · use the reported filter specifications above</text></g><text x="30" y="422" font-size="20" text-anchor="start" fill="#254d62">Inputs: Stir at room temperature</text><text x="30" y="458" font-size="20" text-anchor="start" fill="#254d62">Output: BCySA-containing residue after filtration</text><text x="30" y="494" font-size="20" text-anchor="start" fill="#254d62">Retained fraction: BCySA-containing residue after filtration</text><text x="30" y="530" font-size="20" text-anchor="start" fill="#254d62">The source says filtered to remove the solvent. No evaporation or drying step is invented.</text><text x="30" y="566" font-size="20" text-anchor="start" fill="#254d62">Qualified action illustration; no unreported vessel dimensions, hardware, measured</text><text x="30" y="593" font-size="20" text-anchor="start" fill="#254d62">molecular geometry, or experimental trace is implied.</text><text x="30" y="629" font-size="20" text-anchor="start" fill="#254d62">Source: SI PDF p.2, Section 2, Synthesis of BCySA</text></g></svg>