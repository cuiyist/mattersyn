<svg xmlns="http://www.w3.org/2000/svg" width="960" height="897" viewBox="0 0 960 897"><title>Filter through a PES membrane</title><desc>Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular geometry, or experimental trace is implied. Drawing dimensions and liquid level are schematic, not measured geometry. Filter holder, pressure source and delivery hardware are not inferred.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><rect width="960" height="897" rx="15" fill="#f7fafc"/><text x="30" y="32" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#637f8e">Streptavidin coupling of QD–MPA</text><text x="30" y="57" font-family="Arial,sans-serif" font-size="28" text-anchor="start" fill="#173c4a">Filter through a PES membrane</text><text x="30" y="92" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">pore size: 0.22 um</text><g transform="translate(70 136)"><rect x="130" y="45" width="80" height="136" rx="8" fill="#eef6f8" stroke="#3c6475" stroke-width="3"/><path d="M130 63h80M138 149q32.0 10 64 0" fill="none" stroke="#9abbc8" stroke-width="4"/><path d="M241 109L316 109" fill="none" stroke="#477e91" stroke-width="4" marker-end="url(#arrow)"/><path d="M340 92H514V131H340Z" fill="#d9e9ef" stroke="#3c6475" stroke-width="3"/><path d="M351 110H503" stroke="#8fb4c4" stroke-width="6"/><path d="M427 154L427 199" fill="none" stroke="#477e91" stroke-width="4" marker-end="url(#arrow)"/><rect x="386" y="224" width="82" height="101" rx="8" fill="#eef6f8" stroke="#3c6475" stroke-width="3"/><path d="M386 242h82M394 293q33.0 10 66 0" fill="none" stroke="#9abbc8" stroke-width="4"/><text x="615" y="119" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#173c4a">Membrane cue</text><text x="615" y="254" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#173c4a">Collect filtrate</text></g><text x="30" y="531" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Inputs: Combine QD–MPA, SA and EDC and stir gently</text><text x="30" y="557" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="583" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Outputs: Filter through a PES membrane</text><text x="30" y="609" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="635" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Retained fraction: Filter through a PES membrane</text><text x="30" y="661" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="687" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Retain the filtrate, as explicitly used by the next ultrafiltration step.</text><text x="30" y="713" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="739" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular</text><text x="30" y="765" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">geometry, or experimental trace is implied. Drawing dimensions and liquid level are schematic, not</text><text x="30" y="791" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">measured geometry. Filter holder, pressure source and delivery hardware are not inferred.</text><text x="30" y="817" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="843" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Source: Main PDF p.3, Section 2.1.4, Surface Coupling Modification</text></svg>