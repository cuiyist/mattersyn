<svg xmlns="http://www.w3.org/2000/svg" width="960" height="714" viewBox="0 0 960 714" role="img"><title>Acquire GSH-AuNCs fluorescence decay</title><desc>Source-linked conceptual stage; geometry and unreported fields are not measurements.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="714" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#647888">Time-resolved photoluminescence control comparison</text><text x="30" y="68" font-size="28" text-anchor="start" fill="#234b60">Acquire GSH-AuNCs fluorescence decay</text><text x="30" y="107" font-size="21" text-anchor="start" fill="#234b60">excitation wavelength: 375 nm</text><text x="30" y="135" font-size="21" text-anchor="start" fill="#234b60">emission wavelength: 630 nm</text><g transform="translate(0 171)"><rect x="275" y="30" width="410" height="165" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><text x="480" y="92" font-size="27" text-anchor="middle" fill="#234b60">Optical / vibrational acquisition</text><text x="480" y="145" font-size="19" text-anchor="middle" fill="#234b60">Use the selected operation’s exact conditions</text><text x="480" y="245" font-size="20" text-anchor="middle" fill="#234b60">Instrument cue; unreported specimen preparation remains unknown</text></g><text x="30" y="465" font-size="20" text-anchor="start" fill="#234b60">Inputs: GSH-capped Au nanoclusters; colloidal material</text><text x="30" y="501" font-size="20" text-anchor="start" fill="#234b60">Output: Acquire GSH-AuNCs fluorescence decay</text><text x="30" y="537" font-size="20" text-anchor="start" fill="#234b60">Biexponential fit D(t)=A+B1exp(−t/τ1)+B2exp(−t/τ2). Instrument, pulse width and acquisition</text><text x="30" y="564" font-size="20" text-anchor="start" fill="#234b60">timing unreported.</text><text x="30" y="600" font-size="20" text-anchor="start" fill="#234b60">Generic apparatus cue; vessel dimensions, quantitative liquid level and spatial layout are not</text><text x="30" y="627" font-size="20" text-anchor="start" fill="#234b60">measured source geometry.</text><text x="30" y="663" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF pp.6–7 Figure 3 and decay discussion; SI PDF p.15 Table S4</text></g></svg>