<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><title>Filter the supernatant</title><desc>Conceptual stage diagram. Syringe filtration; source pore size applies. Only source-stated conditions apply.</desc><rect x="5" y="5" width="1090" height="580" rx="20" fill="#f3f8fa" stroke="#bfd1da"/><g transform="translate(10 120)" fill="none" stroke="#426e80" stroke-width="3.4"><path d="M126 35h68v120h-68zM111 35h98M160 155v27"/><ellipse cx="160" cy="189" rx="61" ry="12"/><path d="M99 189v19m122-19v19m-122 0q61 18 122 0M160 220v27M145 238l15 17 15-17"/></g><text x="360" y="54" font-family="Arial,sans-serif" font-size="25" fill="#153e50">Filter the supernatant</text><text x="360" y="132" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">Syringe-filter the supernatant through a 0.2 µm filter to</text><text x="360" y="160" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">obtain the harvested aqueous solution. This is distinct from</text><text x="360" y="188" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">the later dialyzed solution.</text><text x="26" y="538" font-family="Arial,sans-serif" font-size="16" fill="#52717d">Conceptual stage diagram. Syringe filtration; source pore size applies. Only source-stated conditions apply.</text></svg>
