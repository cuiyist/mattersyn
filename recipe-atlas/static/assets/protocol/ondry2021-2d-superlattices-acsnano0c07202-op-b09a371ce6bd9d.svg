<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="952" viewBox="0 0 1000 952"><title>Load and degas seeds in ODE/OAm</title><desc>Load and degas seeds in ODE/OAm. Temperature: 110 °C Duration: ≈30 min Flask volume: 50 mL Environment: Vacuum Three-neck round-bottom flask. Flask geometry is reused illustration; capacity is source-stated. Fittings and liquid level are not measured. Authored conceptual stage illustration; not measured apparatus or particle structure.</desc><rect x="1" y="1" width="998" height="950" rx="16" fill="#f8fbfc" stroke="#a9c5d0"/><rect x="0" y="0" width="1000" height="50" rx="16" fill="#173f50"/><text x="30" y="31" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">STEP 01 / 06  ·  SYNTHESIS</text><text x="30" y="84" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#244754">Load and degas seeds in ODE/OAm</text><text x="30" y="121" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#506875">Ondry et al. (2021): Nominal six-monolayer CdS shell growth</text><rect x="30" y="169" width="415" height="233" rx="12" fill="#e6f0f4" stroke="#bad0db"/><rect x="555" y="169" width="415" height="233" rx="12" fill="#edf4ed" stroke="#c4d4c4"/><path d="M462 285.5H537m-13 -11l13 11-13 11" fill="none" stroke="#528295" stroke-width="3"/><text x="48" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">INPUTS / CONTEXT</text><text x="48" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• Wurtzite CdSe seeds; first exciton 570 nm</text><text x="48" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">Particle amount: 100 nmol; Seed nanocrystal</text><text x="48" y="276" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">amount, not Cd or Se atom amount.</text><text x="48" y="301" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• octadecene (ODE)</text><text x="48" y="326" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">Volume: 3 mL</text><text x="48" y="351" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• oleylamine (OAm)</text><text x="48" y="376" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">Volume: 3 mL</text><text x="573" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">OUTPUT / STATE</text><text x="573" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• degassed seeds</text><text x="573" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">State kind: mixture</text><g transform="translate(30 441)"><svg x="125" y="5" width="280" height="185" viewBox="0 0 400 280"><rect width="400" height="280" rx="18" fill="#f7fafc"/><g fill="#e4f0f4" stroke="#668b9c" stroke-width="3"><path d="M174 35H226V102C290 126 303 184 269 221C237 256 162 256 130 221C97 184 110 126 174 102Z"/><path d="M147 119L127 66L98 78L121 139M253 119L273 66L302 78L279 139"/></g></svg><text x="485" y="46" font-family="Arial,sans-serif" font-size="19" fill="#244754">Shell-growth setup</text><text x="485" y="78" font-family="Arial,sans-serif" font-size="19" fill="#244754">50 mL · three-neck flask</text><text x="485" y="111" font-family="Arial,sans-serif" font-size="19" fill="#244754">Vacuum degassing</text></g><text x="30" y="666" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">OPERATION CONDITIONS</text><text x="30" y="694" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">Temperature: 110 °C</text><text x="30" y="725" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">Duration: ≈30 min</text><text x="30" y="756" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">Flask volume: 50 mL</text><text x="30" y="795" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">Environment: Vacuum</text><text x="30" y="832" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">Three-neck round-bottom flask.</text><text x="30" y="878" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#566d75">Flask geometry is reused illustration; capacity is source-stated. Fittings and liquid level are not measured. Authored conceptual stage illustration; not</text><text x="30" y="898" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#566d75">measured apparatus or particle structure.</text></svg>