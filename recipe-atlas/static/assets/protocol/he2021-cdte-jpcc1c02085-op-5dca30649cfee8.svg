<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><title>Characterize the time-indexed QDs</title><desc>Conceptual stage diagram. Characterization instrument concept; no synthetic trace or particle morphology is drawn.</desc><rect x="5" y="5" width="1090" height="580" rx="20" fill="#f3f8fa" stroke="#bfd1da"/><g transform="translate(10 120)" fill="none" stroke="#426e80" stroke-width="3.4"><rect x="43" y="63" width="234" height="182" rx="12"/><rect x="66" y="83" width="142" height="116"/><path d="M85 110v72h100"/><circle cx="243" cy="180" r="12"/></g><text x="360" y="54" font-family="Arial,sans-serif" font-size="25" fill="#153e50">Characterize the time-indexed QDs</text><text x="360" y="132" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">Figure 1 supplies TEM images and size-distribution insets.</text><text x="360" y="160" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">Section 3.1 calls the numeric size a DLS result. Record</text><text x="360" y="188" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">optical spectra, quantum yield against rhodamine 6G, and UV-</text><text x="360" y="216" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">lamp photobleaching; specimen preparation and most</text><text x="360" y="244" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">acquisition settings are not stated.</text><text x="26" y="531" font-family="Arial,sans-serif" font-size="16" fill="#52717d">Conceptual stage diagram. Characterization instrument concept; no synthetic trace or particle morphology is</text><text x="26" y="553" font-family="Arial,sans-serif" font-size="16" fill="#52717d">drawn.</text></svg>
