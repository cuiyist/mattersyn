<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850"><rect width="1000" height="850" fill="#f8fbfd"/><style>text{stroke:none}</style><g font-family="Arial,sans-serif"><text x="28" y="41" font-size="25" fill="#213446">08  Wash anodized arrays with DIwater</text><text x="28" y="83" font-size="17" fill="#596b7d">Sonication-CdS/TNTAs · conceptual source-bound process</text><rect x="24" y="115" width="372" height="300" rx="12" fill="#e6f1fa"/><rect x="604" y="115" width="372" height="300" rx="12" fill="#e5f4ed"/><text x="43" y="148" font-size="18" fill="#213446">INPUTS</text><text x="623" y="148" font-size="17" fill="#213446">OUTPUTS / PHYSICAL STATES</text><text x="43" y="180" font-size="18" fill="#213446">as-anodized TiO2 nanotube arrays on</text><text x="43" y="204" font-size="18" fill="#213446">Ti</text><text x="43" y="238" font-size="18" fill="#213446">deionized water; amount: not</text><text x="43" y="262" font-size="18" fill="#213446">reported</text><text x="623" y="180" font-size="18" fill="#213446">DIwater-washed anodized arrays</text><text x="623" y="204" font-size="18" fill="#213446">[fraction]</text><g stroke="#1c6480" stroke-width="3.5" fill="none" stroke-linejoin="round"><path d="M438 188h35v55h-35z M455 164v23 M481 227h42 M511 218l13 10-13 9 M520 258h40v51h-40z"/></g><text x="421" y="365" font-size="15" fill="#213446">Schematic only;</text><text x="406" y="386" font-size="15" fill="#213446">no vessel dimensions</text><text x="28" y="445" font-size="18" fill="#213446">Remove the anodized sample and wash with DIwater. Wash volume and duration are unreported.</text><text x="28" y="491" font-size="17" fill="#213446">Environment: not reported. Atmosphere and pressure not reported for this operation.</text><text x="28" y="799" font-size="15" fill="#596b7d">No inferred liquid levels, sonication power, geometry or solution species.</text><text x="28" y="825" font-size="14" fill="#596b7d">Source: Xie et al.(2010), main Methods2.2