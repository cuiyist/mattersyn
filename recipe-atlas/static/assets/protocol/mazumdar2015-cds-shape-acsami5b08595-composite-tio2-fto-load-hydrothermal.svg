<svg xmlns="http://www.w3.org/2000/svg" width="960" height="796" viewBox="0 0 960 796" role="img"><title>Load substrate and 15 mL precursor mixture into Teflon container</title><desc>Source-linked stage schematic. No unreported equipment dimensions or solution species are asserted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="796" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="34" font-size="18" text-anchor="start" fill="#647888">Composite TiO2/FTO support preparation</text><text x="30" y="73" font-size="28" text-anchor="start" fill="#234b60">Load substrate and 15 mL precursor mixture into Teflon</text><text x="30" y="108" font-size="28" text-anchor="start" fill="#234b60">container</text><text x="30" y="147" font-size="21" text-anchor="start" fill="#234b60">precursor volume: 15 mL</text><g transform="translate(0 181)"><rect x="340" y="25" width="280" height="170" rx="10" fill="#dbe3e7" stroke="#557f91" stroke-width="3"/><rect x="364" y="45" width="232" height="135" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><rect x="397" y="118" width="166" height="22" fill="#cadde7" stroke="#557f91" stroke-width="3"/><path d="M405 111h150" stroke="#ac8d48" stroke-width="7"/><text x="480" y="219" font-size="22" text-anchor="middle" fill="#234b60">Teflon-lined stainless-steel autoclave</text><path d="M220 71L321 71" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="183" y="43" font-size="20" text-anchor="middle" fill="#234b60">15 mL mixture</text></g><text x="30" y="521" font-size="20" text-anchor="start" fill="#234b60">Inputs: Wash coated FTO with water and ethanol; Titanium butoxide/HCl hydrothermal precursor</text><text x="30" y="548" font-size="20" text-anchor="start" fill="#234b60">mixture</text><text x="30" y="584" font-size="20" text-anchor="start" fill="#234b60">