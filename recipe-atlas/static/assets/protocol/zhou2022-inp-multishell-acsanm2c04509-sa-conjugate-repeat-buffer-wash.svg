<svg xmlns="http://www.w3.org/2000/svg" width="960" height="949" viewBox="0 0 960 949"><title>Redissolve the retained QDs and repeat centrifugation</title><desc>Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular geometry, or experimental trace is implied. Drawing dimensions and liquid level are schematic, not measured geometry. No unreported separation method, rinse count or discarded fraction is inferred.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><rect width="960" height="949" rx="15" fill="#f7fafc"/><text x="30" y="32" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#637f8e">Streptavidin coupling of QD–MPA</text><text x="30" y="57" font-family="Arial,sans-serif" font-size="28" text-anchor="start" fill="#173c4a">Redissolve the retained QDs and repeat centrifugation</text><text x="30" y="92" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">buffer volume: 0.5 mL</text><text x="30" y="118" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">additional centrifugations: 5 times</text><g transform="translate(70 162)"><rect x="170" y="60" width="80" height="148" rx="8" fill="#eef6f8" stroke="#3c6475" stroke-width="3"/><path d="M170 78h80M178 176q32.0 10 64 0" fill="none" stroke="#9abbc8" stroke-width="4"/><path d="M293 135L492 135" fill="none" stroke="#477e91" stroke-width="4" marker-end="url(#arrow)"/><rect x="550" y="60" width="80" height="148" rx="8" fill="#eef6f8" stroke="#3c6475" stroke-width="3"/><path d="M550 78h80M558 176q32.0 10 64 0" fill="none" stroke="#9abbc8" stroke-width="4"/><text x="410" y="290" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#173c4a">Reported purification</text><text x="410" y="329" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#173c4a">Only stated workup details are represented</text></g><text x="30" y="557" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Inputs: Concentrate the filtrate by ultrafiltration; BS buffer; composition unspecified</text><text x="30" y="583" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="609" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Outputs: Redissolve the retained QDs and repeat centrifugation</text><text x="30" y="635" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="661" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Retained fraction: Redissolve the retained QDs and repeat centrifugation</text><text x="30" y="687" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="713" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Source explicitly says another five centrifugations after the initial event; 100 mM BS, pH 8.4, is the</text><text x="30" y="739" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">stated wash buffer.</text><text x="30" y="765" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="791" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular</text><text x="30" y="817" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">geometry, or experimental trace is implied. Drawing dimensions and liquid level are schematic, not</text><text x="30" y="843" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">measured geometry. No unreported separation method, rinse count or discarded fraction is inferred.</text><text x="30" y="869" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="895" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Source: Main PDF p.3, Section 2.1.4, Surface Coupling Modification</text></svg>