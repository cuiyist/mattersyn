<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830"><rect width="1000" height="830" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="27" y="42" font-size="25" fill="#213446" stroke="none">07  Add cleaned QDs to CS-EDTA</text><text x="28" y="81" font-size="17" fill="#596b7d" stroke="none">CS-QD hybrid preparation · source-bound conceptual stage</text><rect x="24" y="112" width="372" height="315" rx="12" fill="#e6f1fa"/><rect x="604" y="112" width="372" height="315" rx="12" fill="#e5f4ed"/><text x="43" y="146" font-size="18" fill="#213446" stroke="none">INPUTS</text><text x="623" y="146" font-size="17" fill="#213446" stroke="none">OUTPUTS / PHYSICAL STATES</text><text x="43" y="179" font-size="18" fill="#213446" stroke="none">aqueous CS-EDTA mixture</text><text x="43" y="215" font-size="18" fill="#213446" stroke="none">twice-cleaned aqueous QD feed</text><text x="623" y="179" font-size="18" fill="#213446" stroke="none">CS-EDTA-QD aqueous mixture</text><text x="623" y="203" font-size="18" fill="#213446" stroke="none">[mixture]</text><g stroke="#1c6480" stroke-width="3" fill="none" stroke-linejoin="round"><path d="M430 187h55v43h-55z M515 187h55v43h-55z M457 235l30 39 M543 235l-30 39"/><rect x="463" y="279" width="74" height="40" rx="4"/><text x="411" y="347" font-size="16" fill="#213446" stroke="none">Material-flow stage</text><text x="405" y="372" font-size="15" fill="#213446" stroke="none">Hardware unspecified</text></g><text x="28" y="460" font-size="18" fill="#213446" stroke="none">Add the cleaned aqueous QD feed subsequently to CS-EDTA and stir2-3min.4.2nmol is the stated feed</text><text x="28" y="484" font-size="18" fill="#213446" stroke="none">before cleaning; no recovered amount measured.</text><text x="28" y="521" font-size="18" fill="#213446" stroke="none">duration: 2–3 min</text><text x="28" y="558" font-size="18" fill="#213446" stroke="none">Environment: not reported. Per-step atmosphere, pressure and unreported hardware are not</text><text x="28" y="582" font-size="18" fill="#213446" stroke="none">inferred.</text><text x="28" y="774" font-size="15" fill="#596b7d" stroke="none">Conceptual illustration; no measured geometry, levels or unreported apparatus inferred.</text><text x="28" y="799" font-size="14" fill="#596b7d" stroke="none">Lin et al.(2011) · Main PDF p.2 / printed p.996, Preparation of CS-QD Hybrid Nanospheres</text></g></svg>