<svg xmlns="http://www.w3.org/2000/svg" width="960" height="707" viewBox="0 0 960 707" role="img" aria-labelledby="title desc"><title id="title">Keep the pretreated medium under inert atmosphere until use</title><desc id="desc">Vessel dimensions and geometry are not reported for this operation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><g font-family="Arial,sans-serif"><rect width="960" height="707" rx="16" fill="#f7fafb"/><text x="28" y="42" font-size="27" text-anchor="start" fill="#274c60">Keep the pretreated medium under inert atmosphere until use</text><text x="28" y="77" font-size="20" text-anchor="start" fill="#274c60">Atmosphere: inert atmosphere</text><g transform="translate(0 133)"><rect x="440" y="91" width="76" height="124" rx="7" fill="#eef6f8" stroke="#477081" stroke-width="3"/><path d="M440 108h76M447 186q31.0 10 62 0" fill="none" stroke="#a0c1d0" stroke-width="3"/><text x="480" y="282" font-size="23" text-anchor="middle" fill="#274c60">Store the pretreated medium</text></g><text x="28" y="545" font-size="20" text-anchor="start" fill="#274c60">Inputs: Degas Octadecylamine at 150 °C for 2 h</text><text x="28" y="572" font-size="20" text-anchor="start" fill="#274c60">Outputs: Keep the pretreated medium under inert atmosphere until use</text><text x="28" y="599" font-size="20" text-anchor="start" fill="#274c60">Vessel dimensions and geometry are not reported for this operation.</text><text x="28" y="626" font-size="20" text-anchor="start" fill="#274c60">Schematic action illustration. Drawn shapes, dimensions and fill levels are illustrative; only</text><text x="28" y="653" font-size="20" text-anchor="start" fill="#274c60">stated source dimensions are quantitative.</text></g></svg>
