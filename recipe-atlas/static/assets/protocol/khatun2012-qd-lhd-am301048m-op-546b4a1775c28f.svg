<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="898" viewBox="0 0 1100 898"><rect width="1100" height="898" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="42" font-size="27" font-weight="bold" fill="#173047">11 Mix with coupling reagents and aminated DOCA</text><text x="28" y="91" font-size="17" font-weight="normal" fill="#596b7d">primary reported preparation</text><g transform="translate(0 101)"><g transform="translate(875 0)" stroke="#1b6986" fill="none" stroke-width="3" stroke-linejoin="round"><path d="M18 21h43v31H18z M101 21h43v31h-43z M41 60l32 33m-1-12 1 12-12-1 M122 60L90 93m1-12-1 12 12-1"/></g></g><text x="28" y="136" font-size="23" font-weight="normal" fill="#135d83">Mixing / preparation • conceptual action symbol</text><rect x="26" y="223" width="500" height="383" rx="12" fill="#e6f1fa"/><text x="42" y="261" font-size="19" font-weight="bold" fill="#173047">INPUTS</text><text x="42" y="296" font-size="20" font-weight="normal" fill="#173047">LMWH solution adjusted to pH5</text><text x="42" y="342" font-size="20" font-weight="normal" fill="#173047">1-ethyl-3-(3-dimethylaminopropyl) carbodiimide</text><text x="42" y="369" font-size="20" font-weight="normal" fill="#173047">hydrochloride (EDAC)</text><text x="42" y="400" font-size="18" font-weight="normal" fill="#173047">amount: 0.04 mmol</text><text x="42" y="444" font-size="20" font-weight="normal" fill="#173047">N-hydroxysuccinimide (NHS)</text><text x="42" y="475" font-size="18" font-weight="normal" fill="#173047">amount: 0.04 mmol</text><text x="42" y="519" font-size="20" font-weight="normal" fill="#173047">aminated DOCA (DOCA-NH2)</text><text x="42" y="550" font-size="18" font-weight="normal" fill="#173047">amount: 0.044 mmol</text><rect x="572" y="223" width="500" height="383" rx="12" fill="#e5f4ed"/><text x="588" y="261" font-size="19" font-weight="bold" fill="#173047">OUTPUTS / PHYSICAL STATES</text><text x="588" y="296" font-size="20" font-weight="normal" fill="#173047">LMWH coupling mixture</text><text x="588" y="327" font-size="18" font-weight="normal" fill="#173047">Kind: mixture</text><text x="28" y="644" font-size="21" font-weight="normal" fill="#173047">Mix with EDAC0.04mmol,NHS0.04mmol and aminated DOCA0.044mmol. After30min, proceed to dialysis;</text><text x="28" y="672" font-size="21" font-weight="normal" fill="#173047">coupling temperature is unreported. The intermediate transfer is a selected charge, with no batch yield</text><text x="28" y="700" font-size="21" font-weight="normal" fill="#173047">inferred.</text><text x="28" y="741" font-size="21" font-weight="normal" fill="#173047">time before dialysis: 30 min</text><text x="28" y="782" font-size="21" font-weight="normal" fill="#173047">Environment: not reported</text><text x="28" y="823" font-size="15" font-weight="normal" fill="#596b7d">Conceptual and not to scale; no unreported apparatus geometry, liquid levels or handling atmosphere inferred.</text><text x="28" y="853" font-size="15" font-weight="normal" fill="#596b7d">Khatun et al. (2012) • Main PDF p.2 / printed p.3881, Section 2.2, LHD synthesis</text></g></svg>