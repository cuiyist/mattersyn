<svg xmlns="http://www.w3.org/2000/svg" width="960" height="975" viewBox="0 0 960 975"><title>Incubate with QD–SA</title><desc>Cell-specimen treatment cue. The BS-C-1 common method states a 35 mm glass-bottom dish; vessel geometry for U2OS is unreported and any dish outline is illustrative only. No heater, stirrer or centrifuge is introduced. Drawing dimensions and liquid level are schematic, not measured geometry.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><rect width="960" height="975" rx="15" fill="#f7fafc"/><text x="30" y="32" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#637f8e">Prepare and image QD–SA-labeled microtubules</text><text x="30" y="57" font-family="Arial,sans-serif" font-size="28" text-anchor="start" fill="#173c4a">Incubate with QD–SA</text><text x="30" y="92" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">qd volume: 0.2 uL</text><text x="30" y="118" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">source qd concentration: 50 nM — Source input label; not a calculated final well concentration</text><text x="30" y="144" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">blocking solution volume: 200 uL</text><text x="30" y="170" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">duration: 1 h</text><text x="30" y="196" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">temperature: room temperature; numerical value not reported</text><g transform="translate(70 240)"><ellipse cx="410" cy="126" rx="160" ry="36" fill="#edf6f8" stroke="#3c6475" stroke-width="3"/><path d="M250 126V186Q410 254 570 186V126" fill="#edf6f8" stroke="#3c6475" stroke-width="3"/><path d="M250 186Q410 121 570 186" fill="none" stroke="#9abbc8" stroke-width="2"/><text x="410" y="198" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#173c4a">Cell specimen</text><path d="M176 66L303 109" fill="none" stroke="#477e91" stroke-width="4" marker-end="url(#arrow)"/><text x="410" y="297" font-family="Arial,sans-serif" font-size="25" text-anchor="middle" fill="#173c4a">Treat specimen</text><text x="410" y="333" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#173c4a">Dish outline is illustrative unless explicitly specified</text></g><text x="30" y="635" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Inputs: Wash after the secondary antibody; Streptavidin-conjugated InP/ZnSe/ZnS quantum dots;</text><text x="30" y="661" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Bovine serum albumin</text><text x="30" y="687" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="713" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Outputs: Incubate with QD–SA</text><text x="30" y="739" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="765" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Source QD–SA concentration/volume pair is retained without deriving a final labeling concentration.</text><text x="30" y="791" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="817" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Cell-specimen treatment cue. The BS-C-1 common method states a 35 mm glass-bottom dish;</text><text x="30" y="843" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">vessel geometry for U2OS is unreported and any dish outline is illustrative only. No heater, stirrer or</text><text x="30" y="869" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">centrifuge is introduced. Drawing dimensions and liquid level are schematic, not measured geometry.</text><text x="30" y="895" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="921" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Source: Main PDF p.4, Section 2.3, Cellular and Subcellular Labeling</text></svg>