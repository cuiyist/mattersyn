<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="914" viewBox="0 0 1000 914"><title>Heat under argon and start two feeds at 240 °C</title><desc>Heat under argon and start two feeds at 240 °C. Feed start temperature: 240 °C Heating target temperature: 310 °C Cd feed volume: 3.14 mL S feed volume: 3.14 mL Each syringe rate: 1 mL/h; Rate of each separate syringe, not combined flow. Environment: Argon Both feeds commence at 240 °C during heating toward 310 °C. No ramp duration or combined injection rate inferred. Flask geometry is reused illustration; capacity is source-stated. Fittings and liquid level are not measured. Authored conceptual stage illustration; not measured apparatus or particle structure.</desc><rect x="1" y="1" width="998" height="912" rx="16" fill="#f8fbfc" stroke="#a9c5d0"/><rect x="0" y="0" width="1000" height="50" rx="16" fill="#173f50"/><text x="30" y="31" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">STEP 02 / 06  ·  SYNTHESIS</text><text x="30" y="84" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#244754">Heat under argon and start two feeds at 240 °C</text><text x="30" y="121" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#506875">Ondry et al. (2021): Nominal six-monolayer CdS shell growth</text><rect x="30" y="169" width="415" height="133" rx="12" fill="#e6f0f4" stroke="#bad0db"/><rect x="555" y="169" width="415" height="133" rx="12" fill="#edf4ed" stroke="#c4d4c4"/><path d="M462 235.5H537m-13 -11l13 11-13 11" fill="none" stroke="#528295" stroke-width="3"/><text x="48" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">INPUTS / CONTEXT</text><text x="48" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• degassed seeds</text><text x="48" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• 0.2 M Cd(oleate)2/ODE feed</text><text x="48" y="276" f