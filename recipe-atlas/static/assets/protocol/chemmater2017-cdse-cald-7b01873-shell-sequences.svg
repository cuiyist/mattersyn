<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 315" role="img" aria-label="Ordered source-named four-monolayer CdSe shell sequences"><rect width="800" height="315" rx="16" fill="#f5f9fc"/><text x="25" y="35" font-family="Arial" font-size="20" fill="#173d4d">CdSe shell sequences from Figure 1</text><text x="25" y="67" font-family="Arial" font-size="14">3.3 nm cores</text><text x="160" y="67" font-family="Arial" font-size="14">CdS–CdS–CdS–CdS</text><text x="160" y="94" font-family="Arial" font-size="14">CdS–ZnS–CdS–ZnS</text><text x="160" y="121" font-family="Arial" font-size="14">CdS–CdS–ZnS–ZnS</text><text x="25" y="165" font-family="Arial" font-size="14">3.8 nm cores</text><text x="160" y="165" font-family="Arial" font-size="14">CdS–CdS–CdS–ZnS</text><text x="160" y="192" font-family="Arial" font-size="14">ZnS–CdS–CdS–CdS</text><text x="160" y="219" font-family="Arial" font-size="14">ZnS–ZnS–ZnS–ZnS</text><text x="160" y="246" font-family="Arial" font-size="14">CdS–CdS–ZnS–CdS</text><text x="25" y="290" font-family="Arial" font-size="12" fill="#516773">Core-to-outside order only; no lattice, thickness scale, 3D morphology or measured coordinates.</text></svg>
