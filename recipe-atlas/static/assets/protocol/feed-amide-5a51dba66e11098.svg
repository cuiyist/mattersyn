<svg xmlns="http://www.w3.org/2000/svg" width="820" height="733" viewBox="0 0 820 733"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#426d85" stroke-width="1.5"/></marker></defs><rect width="820" height="733" rx="14" fill="#f4f7f8"/><text x="25" y="38" text-anchor="start" font-family="Arial,sans-serif" font-size="28" fill="#183c50">Dissolve lithium silylamide in anhydrous toluene; load</text><text x="25" y="73" text-anchor="start" font-family="Arial,sans-serif" font-size="28" fill="#183c50">first funnel</text><g transform="translate(0 164)"><path d="M370 15h66v45l-25 30v35h-16V90l-25-30z" fill="none" stroke="#34586a" stroke-width="4"/><path d="M385 110h36" stroke="#34586a" stroke-width="4"/><text x="404" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#183c50">Addition funnel</text></g><text x="25" y="477" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#183c50">Inputs: Lithium bis(trimethylsilyl)amide; Toluene</text><text x="25" y="505" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#183c50">Output: Dissolve lithium silylamide in anhydrous toluene; load first</text><text x="25" y="533" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#183c50">funnel</text><text x="25" y="561" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#183c50">Independent source feed branch; preparation vessel is not assumed to be</text><text x="25" y="589" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#183c50">the reaction flask.</text><text x="25" y="617" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#183c50">Two separately prepared feeds; source gives amide first, reducing agent second.</text><text x="25" y="645" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#183c50">Illustrative action cues; no measured apparatus coordinates or unreported liquid</text><text x="25" y="673" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#183c50">colors.</text></svg>