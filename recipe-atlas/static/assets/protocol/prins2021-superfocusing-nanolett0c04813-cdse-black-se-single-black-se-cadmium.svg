<svg xmlns="http://www.w3.org/2000/svg" width="960" height="734" viewBox="0 0 960 734" role="img" aria-labelledby="title desc"><title id="title">Heat CdO, oleic acid and ODE to 270 °C under air</title><desc id="desc">Continuing three-neck flask with cooler under air, explicitly reported in SI p.21; flask capacity and cooler geometry are unreported.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><g font-family="Arial,sans-serif"><rect width="960" height="734" rx="16" fill="#f7fafb"/><text x="28" y="42" font-size="27" text-anchor="start" fill="#274c60">Heat CdO, oleic acid and ODE to 270 °C under air</text><text x="28" y="77" font-size="20" text-anchor="start" fill="#274c60">temperature: 270 degC; Atmosphere: air</text><g transform="translate(0 133)"><path d="M458 65h44v70l47-47 24 24-57 65q66 45 45 103q-16 47-81 47t-81-47q-21-58 45-103l-57-65 24-24 47 47z" fill="#edf5f8" stroke="#466c7d" stroke-width="3"/><path d="M409 254q71 16 142 0" fill="none" stroke="#9dc1cf" stroke-width="4"/><path d="M684 248q-13-20 0-39m32 39q-13-20 0-39m32 39q-13-20 0-39" fill="none" stroke="#be8258" stroke-width="3"/><text x="720" y="284" font-size="19" text-anchor="middle" fill="#274c60">Heating cue</text><rect x="462" y="-10" width="36" height="78" rx="4" fill="#e7f2f7" stroke="#466c7d" stroke-width="3"/><path d="M477-3v64" stroke="#84aabd" stroke-width="2"/><text x="694" y="53" font-size="18" text-anchor="middle" fill="#274c60">Cooler · geometry unspecified</text><text x="480" y="367" font-size="21" text-anchor="middle" fill="#274c60">Three-neck flask · schematic</text></g><text x="28" y="545" font-size="20" text-anchor="start" fill="#274c60">Inputs: Cadmium oxide; Oleic acid; 1-Octadecene</text><text x="28" y="572" font-size="20" text-anchor="start" fill="#274c60">Outputs: Heat CdO, oleic acid and ODE to 270 °C under air</text><text x="28" y="599" font-size="20" text-anchor="start" fill="#274c60">Continuing three-neck flask with cooler under air, explicitly reported in SI p.21; flask capacity</text><text x="28" y="626" font-size="20" text-anchor="start" fill="#274c60">and cooler geometry are unreported.</text><text x="28" y="653" font-size="20" text-anchor="start" fill="#274c60">Schematic action illustration. Drawn shapes, dimensions and fill levels are illustrative; only</text><text x="28" y="680" font-size="20" text-anchor="start" fill="#274c60">stated source dimensions are quantitative.</text></g></svg>
