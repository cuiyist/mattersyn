<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">CdS wash and drying sequence</title>
  <desc id="desc">The CdS precipitate is washed with water several times and dried. Separation method, number of washes, drying time and temperature are not specified.</desc>
  <rect width="960" height="280" rx="22" fill="#f7f9fb"/>
  <text x="38" y="46" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#14324d">Workup reported in the paper</text>
  <rect x="38" y="92" width="235" height="116" rx="16" fill="#e5eaf5" stroke="#9aa9c5" stroke-width="2"/>
  <text x="58" y="139" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#273d66">CdS precipitate</text>
  <text x="58" y="170" font-family="Arial,sans-serif" font-size="13" fill="#5f7184">From aqueous reaction</text>
  <path d="M282 150h68" stroke="#397a9b" stroke-width="4" stroke-linecap="round"/>
  <path d="M340 140l15 10-15 10" fill="none" stroke="#397a9b" stroke-width="4" stroke-linecap="round"/>
  <rect x="363" y="92" width="235" height="116" rx="16" fill="#e1f1f5" stroke="#8ab7c4" stroke-width="2"/>
  <text x="383" y="139" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#225565">Water wash</text>
  <text x="383" y="170" font-family="Arial,sans-serif" font-size="13" fill="#5f7184">Repeated several times</text>
  <path d="M607 150h68" stroke="#397a9b" stroke-width="4" stroke-linecap="round"/>
  <path d="M665 140l15 10-15 10" fill="none" stroke="#397a9b" stroke-width="4" stroke-linecap="round"/>
  <rect x="688" y="92" width="234" height="116" rx="16" fill="#edf1e1" stroke="#aab784" stroke-width="2"/>
  <text x="708" y="139" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#4d6230">Dried solid</text>
  <text x="708" y="170" font-family="Arial,sans-serif" font-size="13" fill="#5f7184">Drying conditions unreported</text>
  <text x="38" y="248" font-family="Arial,sans-serif" font-size="14" fill="#607589">No centrifugation, filtration, wash count or drying setpoint is inferred from the source.</text>
</svg>
