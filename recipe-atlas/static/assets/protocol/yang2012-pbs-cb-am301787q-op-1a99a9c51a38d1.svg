<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750"><rect width="1100" height="750" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="42" font-size="27" font-weight="bold" fill="#173047">01 Prepare the lead precursor solution</text><text x="28" y="91" font-size="17" font-weight="normal" fill="#596b7d">primary reported preparation</text><g transform="translate(0 101)"><g transform="translate(875 0)" stroke="#1b6986" fill="none" stroke-width="3" stroke-linejoin="round"><rect x="9" y="16" width="56" height="33" rx="5"/><text x="37" y="39" text-anchor="middle" fill="#1b6986" stroke="none" font-size="14">Pb(Ac)2</text><path d="M79 28h62 M110 18v20 M37 57v30h105"/><text x="109" y="68" text-anchor="middle" fill="#1b6986" stroke="none" font-size="19">EDA</text></g></g><text x="28" y="136" font-size="23" font-weight="normal" fill="#135d83">Lead stock / EDA solvent • conceptual action symbol</text><rect x="26" y="223" width="500" height="235" rx="12" fill="#e6f1fa"/><text x="42" y="261" font-size="19" font-weight="bold" fill="#173047">INPUTS</text><text x="42" y="296" font-size="20" font-weight="normal" fill="#173047">Pb(Ac)2, lead acetate</text><text x="42" y="327" font-size="18" font-weight="normal" fill="#173047">amount: not reported</text><text x="42" y="371" font-size="20" font-weight="normal" fill="#173047">ethylenediamine</text><text x="42" y="402" font-size="18" font-weight="normal" fill="#173047">amount: not reported</text><rect x="572" y="223" width="500" height="235" rx="12" fill="#e5f4ed"/><text x="588" y="261" font-size="19" font-weight="bold" fill="#173047">OUTPUTS / PHYSICAL STATES</text><text x="588" y="296" font-size="20" font-weight="normal" fill="#173047">0.06 M Pb(Ac)2 solution in ethylenediamine</text><text x="588" y="327" font-size="18" font-weight="normal" fill="#173047">Kind: stock</text><text x="28" y="496" font-size="21" font-weight="normal" fill="#173047">Prepare/use the reported 0.06 M Pb(Ac)2 solution in ethylenediamine. Solution volume, lead-acetate</text><text x="28" y="524" font-size="21" font-weight="normal" fill="#173047">hydration and preparation temperature/time are unreported. This operation and sulfur-stock preparation have</text><text x="28" y="552" font-size="21" font-weight="normal" fill="#173047">no asserted order.</text><text x="28" y="593" font-size="21" font-weight="normal" fill="#173047">concentration: 0.06 mol/L</text><text x="28" y="634" font-size="21" font-weight="normal" fill="#173047">Environment: not reported</text><text x="28" y="675" font-size="15" font-weight="normal" fill="#596b7d">Conceptual and not to scale; no unreported apparatus geometry, liquid levels or handling atmosphere inferred.</text><text x="28" y="705" font-size="15" font-weight="normal" fill="#596b7d">Yang et al. (2012) • Main PDF p.2 / printed p.6163, Experimental, Preparation of PbS/CB Composite Counter Electrode</text></g></svg>