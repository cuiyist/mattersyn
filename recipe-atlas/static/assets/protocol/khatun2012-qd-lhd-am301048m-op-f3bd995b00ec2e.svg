<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="762" viewBox="0 0 1100 762"><rect width="1100" height="762" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="42" font-size="27" font-weight="bold" fill="#173047">12 Dialyze against water</text><text x="28" y="91" font-size="17" font-weight="normal" fill="#596b7d">primary reported preparation</text><g transform="translate(0 101)"><g transform="translate(875 0)" stroke="#1b6986" fill="none" stroke-width="3" stroke-linejoin="round"><rect x="59" y="17" width="41" height="73" stroke-dasharray="5 4"/><path d="M14 42h37m-8-7 8 7-8 7 M147 65h-39m8-7-8 7 8 7"/></g></g><text x="28" y="136" font-size="23" font-weight="normal" fill="#135d83">Dialysis / exchange • conceptual action symbol</text><rect x="26" y="223" width="500" height="206" rx="12" fill="#e6f1fa"/><text x="42" y="261" font-size="19" font-weight="bold" fill="#173047">INPUTS</text><text x="42" y="296" font-size="20" font-weight="normal" fill="#173047">LMWH coupling mixture</text><text x="42" y="342" font-size="20" font-weight="normal" fill="#173047">water</text><text x="42" y="373" font-size="18" font-weight="normal" fill="#173047">amount: not reported</text><rect x="572" y="223" width="500" height="206" rx="12" fill="#e5f4ed"/><text x="588" y="261" font-size="19" font-weight="bold" fill="#173047">OUTPUTS / PHYSICAL STATES</text><text x="588" y="296" font-size="20" font-weight="normal" fill="#173047">dialyzed LHD solution</text><text x="588" y="327" font-size="18" font-weight="normal" fill="#173047">Kind: fraction</text><text x="28" y="467" font-size="21" font-weight="normal" fill="#173047">Dialyze against water using source MWCO2000 to remove unreacted NHS,EDAC and aminated DOCA. Unit</text><text x="28" y="495" font-size="21" font-weight="normal" fill="#173047">of this MWCO, duration and water volume/exchanges are unreported here; later application hardware is not</text><text x="28" y="523" font-size="21" font-weight="normal" fill="#173047">inherited.</text><text x="28" y="564" font-size="21" font-weight="normal" fill="#173047">MWCO: 2000; Source gives2000 without a unit in this preparation.</text><text x="28" y="605" font-size="21" font-weight="normal" fill="#173047">Environment: not reported</text><text x="28" y="646" font-size="21" font-weight="normal" fill="#173047">Retained: dialyzed LHD solution</text><text x="28" y="687" font-size="15" font-weight="normal" fill="#596b7d">Conceptual and not to scale; no unreported apparatus geometry, liquid levels or handling atmosphere inferred.</text><text x="28" y="717" font-size="15" font-weight="normal" fill="#596b7d">Khatun et al. (2012) • Main PDF p.2 / printed p.3881, Section 2.2, LHD synthesis</text></g></svg>