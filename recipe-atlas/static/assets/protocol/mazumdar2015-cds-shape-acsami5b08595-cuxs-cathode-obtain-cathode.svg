<svg xmlns="http://www.w3.org/2000/svg" width="960" height="761" viewBox="0 0 960 761" role="img"><title>Obtain nominal Cu2S electrode from a piece of brass</title><desc>Source-linked stage schematic. No unreported equipment dimensions or solution species are asserted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="761" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="34" font-size="18" text-anchor="start" fill="#647888">Nominal Cu2S dark cathode from brass; preparation incomplete</text><text x="30" y="73" font-size="28" text-anchor="start" fill="#234b60">Obtain nominal Cu2S electrode from a piece of brass</text><text x="30" y="112" font-size="21" text-anchor="start" fill="#234b60">No numerical condition or environment specified for this stage.</text><g transform="translate(0 146)"><rect x="343" y="123" width="280" height="22" fill="#cadde7" stroke="#557f91" stroke-width="3"/><path d="M351 116h264" stroke="#ac8d48" stroke-width="7"/><text x="480" y="60" font-size="27" text-anchor="middle" fill="#234b60">Nominal Cu₂S on brass</text><text x="480" y="216" font-size="22" text-anchor="middle" fill="#234b60">Preparation conditions not reported</text></g><text x="30" y="486" font-size="20" text-anchor="start" fill="#234b60">Inputs: Brass; alloy composition unspecified</text><text x="30" y="522" font-size="20" text-anchor="start" fill="#234b60">Output: Obtain nominal Cu2S electrode from a piece of brass</text><text x="30" y="558" font-size="20" text-anchor="start" fill="#234b60">Source identifies obtained Cu2S electrode but does not report its conversion reagents,</text><text x="30" y="585" font-size="20" text-anchor="start" fill="#234b60">treatment or duration. Cartoon Scheme1 uses CuxS; no exact sulfide stoichiometry/model</text><text x="30" y="612" font-size="20" text-anchor="start" fill="#234b60">inferred.</text><text x="30" y="648" font-size="20" text-anchor="start" fill="#234b60">Apparatus dimensions, liquid level and spatial layout are schematic, not measured source</text><text x="30" y="675" font-size="20" text-anchor="start" fill="#234b60">geometry.</text><text x="30" y="711" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.2 §2.4</text></g></svg>