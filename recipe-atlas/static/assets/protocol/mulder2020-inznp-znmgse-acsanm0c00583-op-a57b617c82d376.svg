<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="569" viewBox="0 0 1000 569"><title>Cool externally and transfer with toluene</title><desc>Cool externally and transfer with toluene. Cooling endpoint: 80 °C Environment: Nitrogen / inert glovebox as specified for this step Rapid cooling by external compressed air; add 2 mL toluene and transfer to a nitrogen-prefilled vial in glovebox. Compressed air is not assigned as reaction atmosphere. Conceptual material flow. Shapes do not represent apparatus geometry, liquid levels or measured particle structure.</desc><rect x="1" y="1" width="998" height="567" rx="16" fill="#f8fbfc" stroke="#a9c5d0"/><rect x="0" y="0" width="1000" height="50" rx="16" fill="#173f50"/><text x="30" y="31" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">STEP 09 / 12  ·  SYNTHESIS</text><text x="30" y="84" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#244754">Cool externally and transfer with toluene</text><text x="30" y="121" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#506875">Mulder et al. (2020): InZnP heat-up core preparation</text><rect x="30" y="169" width="415" height="133" rx="12" fill="#e6f0f4" stroke="#bad0db"/><rect x="555" y="169" width="415" height="133" rx="12" fill="#edf4ed" stroke="#c4d4c4"/><path d="M462 235.5H537m-13 -11l13 11-13 11" fill="none" stroke="#528295" stroke-width="3"/><text x="48" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">INPUTS / CONTEXT</text><text x="48" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• cores hot</text><text x="48" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• anhydrous toluene</text><text x="48" y="276" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• nitrogen</text><text x="573" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">OUTPUT / STATE</text><text x="573" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• core dispersion</text><text x="30" y="341" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">OPERATION CONDITIONS</text><text x="30" y="369" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">Cooling endpoint: 80 °C</text><text x="30" y="408" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">Environment: Nitrogen / inert glovebox as specified for this step</text><text x="30" y="445" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">Rapid cooling by external compressed air; add 2 mL toluene and transfer to a nitrogen-prefilled vial in glovebox. Compressed</text><text x="30" y="469" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">air is not assigned as reaction atmosphere.</text><text x="30" y="515" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#566d75">Conceptual material flow. Shapes do not represent apparatus geometry, liquid levels or measured particle structure.</text></svg>