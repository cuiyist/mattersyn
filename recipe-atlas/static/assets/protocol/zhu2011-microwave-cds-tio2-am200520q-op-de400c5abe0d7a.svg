<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830"><rect width="1000" height="830" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="27" y="42" font-size="25" fill="#213446" stroke="none">03  Prepare the selected aqueous precursor bath</text><text x="28" y="81" font-size="17" fill="#596b7d" stroke="none">Electrode 4 · canonical-bound conceptual stage</text><rect x="24" y="112" width="372" height="315" rx="12" fill="#e6f1fa"/><rect x="604" y="112" width="372" height="315" rx="12" fill="#e5f4ed"/><text x="43" y="146" font-size="18" fill="#213446" stroke="none">INPUTS</text><text x="623" y="146" font-size="17" fill="#213446" stroke="none">OUTPUTS / PHYSICAL STATES</text><text x="43" y="179" font-size="18" fill="#213446" stroke="none">cadmium nitrate; concentration:</text><text x="43" y="203" font-size="18" fill="#213446" stroke="none">0.05 mol/L, amount: not reported</text><text x="43" y="239" font-size="18" fill="#213446" stroke="none">thiourea; concentration: 0.05</text><text x="43" y="263" font-size="18" fill="#213446" stroke="none">mol/L, amount: not reported</text><text x="43" y="299" font-size="18" fill="#213446" stroke="none">water; amount: not reported</text><text x="623" y="179" font-size="18" fill="#213446" stroke="none">reported aqueous electrode-4</text><text x="623" y="203" font-size="18" fill="#213446" stroke="none">precursor bath [stock]</text><g stroke="#1c6480" stroke-width="3" fill="none" stroke-linejoin="round"><path d="M433 190h50v36h-50z M517 190h50v36h-50z M458 238l30 35 M542 238l-30 35"/><rect x="445" y="282" width="110" height="42" rx="4"/><text x="438" y="352" font-size="16" fill="#213446" stroke="none">Aqueous bath</text><text x="413" y="375" font-size="14" fill="#213446" stroke="none">Volume unspecified</text></g><text x="28" y="460" font-size="18" fill="#213446" stroke="none">Use an aqueous bath with Cd(NO3)2 and CH4N2S each at 0.05 M, the stated condition for electrode</text><text x="28" y="484" font-size="18" fill="#213446" stroke="none">4. Solute charges, final volume, mixing order, mixing time and preparation temperature are not</text><text x="28" y="508" font-size="18" fill="#213446" stroke="none">reported.</text><text x="28" y="545" font-size="18" fill="#213446" stroke="none">Environment: not reported. Atmosphere and pressure are not reported.</text><text x="28" y="774" font-size="15" fill="#596b7d" stroke="none">Conceptual illustration; no measured geometry, levels or unreported apparatus inferred.</text><text x="28" y="799" font-size="14" fill="#596b7d" stroke="none">Zhu et al. (2011) · Main PDF p.2 / printed p.1473, Experimental Section, MACBD preparation paragraph and electrode</text><text x="28" y="819" font-size="14" fill="#596b7d" stroke="none">numbering</text></g></svg>