<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="t d"><title id="t">Four reported heterostructure route families</title><desc id="d">Flat workflow diagram. It distinguishes free AMTP plus HBr and isolated AMTP-Br, and acetone versus octadecene baths. No particle geometry or relative yield is encoded.</desc><rect width="960" height="330" fill="#f8fafc"/><text x="36" y="45" fill="#17324d" font-family="Arial" font-size="23" font-weight="bold">Source-reported route choices</text><g font-family="Arial" font-size="17" fill="#17324d"><rect x="36" y="76" width="410" height="100" rx="15" fill="#dceef5" stroke="#3d7890"/><text x="58" y="108">Free AMTP + HBr in PbBr₂/DMSO</text><text x="58" y="139">acetone RT or ODE 150/180 °C</text><rect x="514" y="76" width="410" height="100" rx="15" fill="#e8e2f5" stroke="#79679b"/><text x="536" y="108">Isolated AMTP-Br in PbBr₂/DMSO</text><text x="536" y="139">acetone RT/50 °C or ODE 120–150 °C</text><path d="M241 176v43m478-43v43" stroke="#526979" stroke-width="3"/><rect x="131" y="219" width="698" height="71" rx="15" fill="#fff" stroke="#8395a3"/><text x="166" y="249">Inject into OAM-Br + oleic-acid bath; isolate precipitate</text><text x="166" y="273" font-size="14">Times, precursor heating and cleanup differ by branch; consult recipe.</text></g></svg>
