ed in this</text><text x="30" y="613" font-size="20" text-anchor="start" fill="#234b60">article; cited reference title is not imported as phase evidence.</text><text x="30" y="649" font-size="20" text-anchor="start" fill="#234b60">Apparatus dimensions, liquid level and spatial layout are schematic, not measured source</text><text x="30" y="676" font-size="20" text-anchor="start" fill="#234b60">geometry.</text><text x="30" y="712" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.2 §2.3</text></g></svg>