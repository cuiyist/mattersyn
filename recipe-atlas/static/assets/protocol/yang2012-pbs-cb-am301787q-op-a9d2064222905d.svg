<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="677" viewBox="0 0 1100 677"><rect width="1100" height="677" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="42" font-size="27" font-weight="bold" fill="#173047">03 Add mixed solids into the binder solution</text><text x="28" y="91" font-size="17" font-weight="normal" fill="#596b7d">primary reported preparation</text><g transform="translate(0 101)"><g transform="translate(875 0)" stroke="#1b6986" fill="none" stroke-width="3" stroke-linejoin="round"><path d="M15 34h50 M15 49h50 M15 64h50 M76 49h29m-9-8 9 8-9 8"/><rect x="112" y="24" width="38" height="60" rx="6"/><path d="M118 42h26 M118 54h26 M118 66h26"/></g></g><text x="28" y="136" font-size="23" font-weight="normal" fill="#135d83">Solids added into binder solution • conceptual action symbol</text><rect x="26" y="223" width="500" height="231" rx="12" fill="#e6f1fa"/><text x="42" y="261" font-size="19" font-weight="bold" fill="#173047">INPUTS</text><text x="42" y="296" font-size="20" font-weight="normal" fill="#173047">Sample C PbS/CB solids mixture at 10:1 by weight</text><text x="42" y="342" font-size="20" font-weight="normal" fill="#173047">PVDF solution in N-methyl pyrrolidone</text><text x="42" y="373" font-size="18" font-weight="normal" fill="#173047">Contains 0.2 g PVDF; solvent amount, concentration and</text><text x="42" y="398" font-size="18" font-weight="normal" fill="#173047">solution volume unreported.</text><rect x="572" y="223" width="500" height="231" rx="12" fill="#e5f4ed"/><text x="588" y="261" font-size="19" font-weight="bold" fill="#173047">OUTPUTS / PHYSICAL STATES</text><text x="588" y="296" font-size="20" font-weight="normal" fill="#173047">PbS/CB solids added into PVDF solution</text><text x="588" y="327" font-size="18" font-weight="normal" fill="#173047">Kind: mixture</text><text x="28" y="492" font-size="21" font-weight="normal" fill="#173047">Subsequently add the PbS/CB solids mixture into the PVDF solution. Binder-solution preparation and solids</text><text x="28" y="520" font-size="21" font-weight="normal" fill="#173047">mixing are both prerequisites; their relative order is unreported. Final volume is unreported.</text><text x="28" y="561" font-size="21" font-weight="normal" fill="#173047">Environment: not reported</text><text x="28" y="602" font-size="15" font-weight="normal" fill="#596b7d">Conceptual and not to scale; no unreported apparatus geometry, liquid levels or handling atmosphere inferred.</text><text x="28" y="632" font-size="15" font-weight="normal" fill="#596b7d">Yang et al. (2012) • Main PDF p.2 / printed p.6163, Experimental, Preparation of PbS/CB Composite Counter Electrode</text></g></svg>