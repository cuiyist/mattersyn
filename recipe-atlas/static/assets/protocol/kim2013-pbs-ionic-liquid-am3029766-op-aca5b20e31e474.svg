<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3z" fill="#c08424"/></marker></defs><g font-family="Arial, sans-serif"><rect width="960" height="550" fill="#f8fafc"/><rect x="0" y="0" width="960" height="72" fill="#173949"/><text x="28" y="30" font-size="14" fill="#b6dce7" text-anchor="start">KIM 2013 · PbS QUANTUM DOTS</text><text x="28" y="58" font-size="24" fill="white" text-anchor="start">05  Quickly inject the syringe contents</text><g fill="none" stroke="#24677a" stroke-width="4"><path d="M443 170 v-36 h18 v37 M479 171 v-37 h18 v36 M402 198 l-26 -33 l14 -10 l28 37 M443 170 C355 185,355 320,470 322 C585 320,585 185,497 170"/></g><text x="470" y="350" font-size="17" fill="#233749" text-anchor="middle">Three-neck round-bottom flask</text><text x="470" y="372" font-size="14" fill="#233749" text-anchor="middle">Capacity and fill not reported</text><g stroke="#24677a" stroke-width="3" fill="none"><rect x="660" y="131" width="100" height="28"/><path d="M660 145 h-58 l-110 23 M760 145 h30 M790 133 v25"/></g><text x="740" y="108" font-size="17" fill="#233749" text-anchor="middle">Sulfur-stock syringe</text><path d="M620 171 L510 194" stroke="#c08424" stroke-width="3" marker-end="url(#a)" fill="none"/><text x="68" y="143" font-size="21" fill="#233749" text-anchor="start">Quick injection</text><text x="68" y="173" font-size="15" fill="#233749" text-anchor="start">Rate and temperature</text><text x="68" y="195" font-size="15" fill="#233749" text-anchor="start">not reported</text><path d="M25 392 H935" stroke="#cbd5e1"/><text x="28" y="417" font-size="16" fill="#233749" text-anchor="start">Quickly inject the syringe contents into the flask. No quantitative injection rate, injection duration, or</text><text x="28" y="439" font-size="16" fill="#233749" text-anchor="start">injection/growth temperature is stated. Argon is the preceding kept-under environment, not a new separately</text><text x="28" y="461" font-size="16" fill="#233749" text-anchor="start">quantified gas phase.</text><text x="28" y="530" font-size="13" fill="#526673" text-anchor="start">Conceptual stage illustration. No measured geometry, fill, gas plumbing or unstated hardware.</text></g></svg>