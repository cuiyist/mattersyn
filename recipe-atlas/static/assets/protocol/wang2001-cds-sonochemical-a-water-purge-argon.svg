<svg xmlns="http://www.w3.org/2000/svg" width="840" height="470" viewBox="0 0 840 470"><title>Purge before irradiation · sample A</title><desc>Purge the flask with Ar to remove oxygen before ultrasonic irradiation. Purge flow, duration and continuous Ar flow during irradiation are unreported. Source-bound concept; apparatus geometry illustrative, not measured.</desc><rect width="840" height="470" rx="20" fill="#f1f7fa"/><g font-family="Arial"><text x="28" y="42" font-size="24" fill="#183d49">Purge before irradiation · sample A</text><text x="28" y="138" font-size="20" fill="#2f5866">Ar purge before irradiation</text><text x="28" y="166" font-size="20" fill="#2f5866">Remove oxygen</text><text x="28" y="340" font-size="20" fill="#2f5866">Flow and duration unreported</text><text x="28" y="368" font-size="20" fill="#2f5866">Continuous irradiation flow unknown</text><path d="M567 134 V185 L518 283 Q516 292 532 293 H670 Q686 292 682 283 L634 185 V134Z" fill="none" stroke="#387282" stroke-width="4"/><path d="M561 130 H641" stroke="#506e78" stroke-width="5"/><path d="M690 117 H658 L627 167 M627 167 L628 151 M627 167 L642 161" fill="none" stroke="#128a93" stroke-width="4"/><text x="685" y="105" font-size="20" fill="#128a93">Ar</text><text x="28" y="419" font-size="17" fill="#496773">Source-bound concept; no dimensions or fill levels are asserted.</text><text x="28" y="451" font-size="17" fill="#496773">Wang et al.2001 · Supplied PDF p.1 · Exact locators in protocol</text></g></svg>