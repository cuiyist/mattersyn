<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="779" viewBox="0 0 1000 779"><title>Cover the well and allow slow evaporation</title><desc>Cover the well and allow slow evaporation. Duration: ≥8 h; At least 8 hours; no upper bound. Environment: Not reported; Atmosphere not reported for this operation. Glass-slide cover slows solvent evaporation. Well, interface and substrate geometry are schematic, not a scale drawing or measured fill level. Authored conceptual stage illustration; not measured apparatus or particle structure.</desc><rect x="1" y="1" width="998" height="777" rx="16" fill="#f8fbfc" stroke="#a9c5d0"/><rect x="0" y="0" width="1000" height="50" rx="16" fill="#173f50"/><text x="30" y="31" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">STEP 02 / 02  ·  SYNTHESIS</text><text x="30" y="84" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#244754">Cover the well and allow slow evaporation</text><text x="30" y="121" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#506875">Ondry et al. (2021): Liquid-subphase monolayer assembly</text><rect x="30" y="169" width="415" height="122" rx="12" fill="#e6f0f4" stroke="#bad0db"/><rect x="555" y="169" width="415" height="122" rx="12" fill="#edf4ed" stroke="#c4d4c4"/><path d="M462 230.0H537m-13 -11l13 11-13 11" fill="none" stroke="#528295" stroke-width="3"/><text x="48" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">INPUTS / CONTEXT</text><text x="48" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• floating film</text><text x="573" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">OUTPUT / STATE</text><text x="573" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• native film</text><text x="573" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">State kind: product</text><g transform="translate(30 330)"><path d="M75 65L300 65L355 104L130 104Z M75 65V145L130 184L355 184V104 M130 104V184" fill="#eef4f6" stroke="#668b9c" stroke-width="3"/><path d="M94 87L295 87L331 113L130 113Z" fill="#b4d4e0" stroke="#668b9c"/><path d="M106 91L290 91L315 109" fill="none" stroke="#b88461" stroke-width="5"/><text x="465" y="53" font-family="Arial,sans-serif" font-size="19" fill="#244754">DMF interface · schematic</text><path d="M75 30L300 30L355 69L130 69Z" fill="#d9e8ee" fill-opacity=".55" stroke="#668b9c" stroke-width="2"/><text x="465" y="88" font-family="Arial,sans-serif" font-size="19" fill="#244754">Glass-slide cover</text><text x="465" y="123" font-family="Arial,sans-serif" font-size="19" fill="#244754">Slow evaporation</text></g><text x="30" y="555" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">OPERATION CONDITIONS</text><text x="30" y="583" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">Duration: ≥8 h; At least 8 hours; no upper bound.</text><text x="30" y="622" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">Environment: Not reported; Atmosphere not reported for this operation.</text><text x="30" y="659" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">Glass-slide cover slows solvent evaporation.</text><text x="30" y="705" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#566d75">Well, interface and substrate geometry are schematic, not a scale drawing or measured fill level. Authored conceptual stage illustration; not</text><text x="30" y="725" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#566d75">measured apparatus or particle structure.</text></svg>