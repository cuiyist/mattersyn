<svg xmlns="http://www.w3.org/2000/svg" width="960" height="761" viewBox="0 0 960 761" role="img"><title>Place about 50 µm Scotch tape at sides of photoanode</title><desc>Source-linked stage schematic. No unreported equipment dimensions or solution species are asserted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="761" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="34" font-size="18" text-anchor="start" fill="#647888">CdS160/CdSe sandwich photovoltaic cell</text><text x="30" y="73" font-size="28" text-anchor="start" fill="#234b60">Place about 50 µm Scotch tape at sides of photoanode</text><text x="30" y="112" font-size="21" text-anchor="start" fill="#234b60">spacer thickness: about50µm</text><g transform="translate(0 146)"><rect x="275" y="151" width="410" height="22" fill="#cadde7" stroke="#557f91" stroke-width="3"/><path d="M283 144h394" stroke="#ac8d48" stroke-width="7"/><rect x="275" y="99" width="34" height="48" fill="#d7c8a6"/><rect x="651" y="99" width="34" height="48" fill="#d7c8a6"/><text x="480" y="218" font-size="21" text-anchor="middle" fill="#234b60">Sandwich sketch; layer thicknesses not to scale</text></g><text x="30" y="486" font-size="20" text-anchor="start" fill="#234b60">Inputs: CdS/CdSe-sensitized composite TiO2/FTO; temperature variant specified by record; Scotch</text><text x="30" y="513" font-size="20" text-anchor="start" fill="#234b60">tape spacer; detailed composition unspecified</text><text x="30" y="549" font-size="20" text-anchor="start" fill="#234b60">Output: Place about 50 µm Scotch tape at sides of photoanode</text><text x="30" y="585" font-size="20" text-anchor="start" fill="#234b60">Tape is the source-reported spacer; no masking aperture, substrate thickness or seal geometry</text><text x="30" y="612" font-size="20" text-anchor="start" fill="#234b60">invented.</text><text x="30" y="648" font-size="20" text-anchor="start" fill="#234b60">Apparatus dimensions, liquid level and spatial layout are schematic, not measured source</text><text x="30" y="675" font-size="20" text-anchor="start" fill="#234b60">geometry.</text><text x="30" y="711" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.2 §2.4</text></g></svg>