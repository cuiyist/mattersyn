<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830"><rect width="1000" height="830" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="27" y="42" font-size="25" fill="#213446" stroke="none">03  Precipitate aqueous QD feed with ethanol</text><text x="28" y="81" font-size="17" fill="#596b7d" stroke="none">CS-QD hybrid preparation · source-bound conceptual stage</text><rect x="24" y="112" width="372" height="315" rx="12" fill="#e6f1fa"/><rect x="604" y="112" width="372" height="315" rx="12" fill="#e5f4ed"/><text x="43" y="146" font-size="18" fill="#213446" stroke="none">INPUTS</text><text x="623" y="146" font-size="17" fill="#213446" stroke="none">OUTPUTS / PHYSICAL STATES</text><text x="43" y="179" font-size="18" fill="#213446" stroke="none">water-soluble3-MPA-coated CdSe/ZnS</text><text x="43" y="203" font-size="18" fill="#213446" stroke="none">QDs; amount: 4.2 nmol</text><text x="43" y="239" font-size="18" fill="#213446" stroke="none">ethanol; amount: not reported</text><text x="623" y="179" font-size="18" fill="#213446" stroke="none">precipitated aqueous QD feed</text><text x="623" y="203" font-size="18" fill="#213446" stroke="none">[mixture]</text><g stroke="#1c6480" stroke-width="3" fill="none" stroke-linejoin="round"><rect x="431" y="183" width="138" height="37" rx="4"/><path d="M500 226v47 M490 261l10 14 10-14"/><rect x="451" y="282" width="98" height="37" rx="4"/><text x="435" y="347" font-size="17" fill="#213446" stroke="none">Precipitation</text></g><text x="28" y="460" font-size="18" fill="#213446" stroke="none">Precipitate the4.2nmol aqueous QD feed with ethanol; volume unreported.</text><text x="28" y="497" font-size="18" fill="#213446" stroke="none">Environment: not reported. Per-step atmosphere, pressure and unreported hardware are not</text><text x="28" y="521" font-size="18" fill="#213446" stroke="none">inferred.</text><text x="28" y="774" font-size="15" fill="#596b7d" stroke="none">Conceptual illustration;