<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="895" viewBox="0 0 1000 895"><title>Repeat the four-bath sequence to six total cycles</title><desc>Repeat the four-bath sequence to six total cycles. Total cycles: 6 cycles Source nominal monolayers: 6 ML; One completed SILAR cycle is described as one monolayer; not independently measured film thickness. Environment: Nitrogen glovebox Six total cycles including the first, not six additional cycles. General methods allow a desired layer count; this record is the explicitly displayed six-cycle sample class. Bath/tweezer symbols are schematic. First and second methanol rinses are distinct; no unreported rinse time is supplied. Authored conceptual stage illustration; not measured apparatus or particle structure.</desc><rect x="1" y="1" width="998" height="893" rx="16" fill="#f8fbfc" stroke="#a9c5d0"/><rect x="0" y="0" width="1000" height="50" rx="16" fill="#173f50"/><text x="30" y="31" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">STEP 05 / 05  ·  SURFACE EXCHANGE</text><text x="30" y="84" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#244754">Repeat the four-bath sequence to six total cycles</text><text x="30" y="121" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#506875">Ondry et al. (2021): Six-cycle CdS SILAR attachment</text><rect x="30" y="169" width="415" height="158" rx="12" fill="#e6f0f4" stroke="#bad0db"/><rect x="555" y="169" width="415" height="158" rx="12" fill="#edf4ed" stroke="#c4d4c4"/><path d="M462 248.0H537m-13 -11l13 11-13 11" fill="none" stroke="#528295" stroke-width="3"/><text x="48" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">INPUTS / CONTEXT</text><text x="48" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• one cycle film</text><text x="48" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">