<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850"><rect width="1000" height="850" fill="#f8fbfd"/><style>text{stroke:none}</style><g font-family="Arial,sans-serif"><text x="28" y="41" font-size="25" fill="#213446">07  Anodize Ti in a two-electrode cell</text><text x="28" y="83" font-size="17" fill="#596b7d">Sonication-CdS/TNTAs · conceptual source-bound process</text><rect x="24" y="115" width="372" height="300" rx="12" fill="#e6f1fa"/><rect x="604" y="115" width="372" height="300" rx="12" fill="#e5f4ed"/><text x="43" y="148" font-size="18" fill="#213446">INPUTS</text><text x="623" y="148" font-size="17" fill="#213446">OUTPUTS / PHYSICAL STATES</text><text x="43" y="180" font-size="18" fill="#213446">N2-dried degreased Ti foil</text><text x="43" y="214" font-size="18" fill="#213446">ethylene-glycol/NH4F/DIwater</text><text x="43" y="238" font-size="18" fill="#213446">anodization electrolyte</text><text x="43" y="272" font-size="18" fill="#213446">platinum foil; amount: not reported</text><text x="623" y="180" font-size="18" fill="#213446">as-anodized TiO2 nanotube arrays on</text><text x="623" y="204" font-size="18" fill="#213446">Ti [product]</text><g stroke="#1c6480" stroke-width="3.5" fill="none" stroke-linejoin="round"><path d="M430 185v120h140V185 M457 150v90 M539 150v90 M457 150v-25h82v25"/><text x="443" y="272" font-size="15" fill="#213446">Ti</text><text x="503" y="292" font-size="14" fill="#213446">Pt cathode</text></g><text x="421" y="365" font-size="15" fill="#213446">Schematic only;</text><text x="406" y="386" font-size="15" fill="#213446">no vessel dimensions</text><text x="28" y="445" font-size="18" fill="#213446">Immerse degreased Ti foil in the reported electrolyte and anodize in a two-electrode cell with Pt-</text><text x="28" y="469" font-size="18" fill="#213446">foil cathode. Foil2.5 x3.2 x0.01 cm3; working footprint 2.0 x3.2 cm2. Electrode spacing, current</text><text x="28" y="493" font-size="18" fill="#213446">and cell volume are unreported.</text><text x="28" y="539" font-size="17" fill="#213446">voltage: 40 V</text><text x="28" y="567" font-size="17" fill="#213446">temperature: 18–20 degC — Source describes ambient temperature18-20 C.</text><text x="28" y="595" font-size="17" fill="#213446">duration: 24 h</text><text x="28" y="623" font-size="17" fill="#213446">Environment: not reported. Atmosphere and pressure not reported for this operation.</text><text x="28" y="799" font-size="15" fill="#596b7d">No inferred liquid levels, sonication power, geometry or solution species.</text><text x="28" y="825" font-size="14" fill="#596b7d">Source: Xie et al.(2010), main Methods2.2–2.3; explicit cycle order3.1/SI FigureS1.</text></g></svg>