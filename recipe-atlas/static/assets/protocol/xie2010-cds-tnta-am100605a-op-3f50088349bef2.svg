<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850"><rect width="1000" height="850" fill="#f8fbfd"/><style>text{stroke:none}</style><g font-family="Arial,sans-serif"><text x="28" y="41" font-size="25" fill="#213446">09  Sonicate to remove surface debris</text><text x="28" y="83" font-size="17" fill="#596b7d">Sonication-CdS/TNTAs · conceptual source-bound process</text><rect x="24" y="115" width="372" height="300" rx="12" fill="#e6f1fa"/><rect x="604" y="115" width="372" height="300" rx="12" fill="#e5f4ed"/><text x="43" y="148" font-size="18" fill="#213446">INPUTS</text><text x="623" y="148" font-size="17" fill="#213446">OUTPUTS / PHYSICAL STATES</text><text x="43" y="180" font-size="18" fill="#213446">DIwater-washed anodized arrays</text><text x="43" y="214" font-size="18" fill="#213446">deionized water; amount: not</text><text x="43" y="238" font-size="18" fill="#213446">reported</text><text x="623" y="180" font-size="18" fill="#213446">arrays after sonication removal of</text><text x="623" y="204" font-size="18" fill="#213446">surface debris [fraction]</text><g stroke="#1c6480" stroke-width="3.5" fill="none" stroke-linejoin="round"><path d="M440 173v127h120V173 M477 212h44v62h-44z M443 319q16 17 31 0 M485 319q16 17 31 0 M527 319q16 17 31 0"/><text x="445" y="153" font-size="16" fill="#213446">Sonication</text></g><text x="421" y="365" font-size="15" fill="#213446">Schematic only;</text><text x="406" y="386" font-size="15" fill="#213446">no vessel dimensions</text><text x="28" y="445" font-size="18" fill="#213446">Sonicate in DIwater for 50-60 min to remove surface debris. Frequency, power and bath volume are</text><text x="28" y="469" font-size="18" fill="#213446">unreported.</text><text x="28" y="515" font-size="17" fill="#213446">duration: 50–60 min</text><text x="28" y="543" font-size="17" fill="#213446">Environment: not reported. Atmosphere and pressure not reported for this operation.</text><text x="28" y="799" font-size="15" fill="#596b7d">No inferred liquid levels, sonication power, geometry or solution species.</text><text x="28" y="825" font-size="14" fill="#596b7d">Source: Xie et al.(2010), main Methods2.2–2.3; explicit cycle order3.1/SI FigureS1.</text></g></svg>