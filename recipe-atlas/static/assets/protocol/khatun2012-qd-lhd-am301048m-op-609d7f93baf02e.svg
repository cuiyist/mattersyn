<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="748" viewBox="0 0 1100 748"><rect width="1100" height="748" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="42" font-size="27" font-weight="bold" fill="#173047">05 Dialyze against water for2days</text><text x="28" y="91" font-size="17" font-weight="normal" fill="#596b7d">primary reported preparation</text><g transform="translate(0 101)"><g transform="translate(875 0)" stroke="#1b6986" fill="none" stroke-width="3" stroke-linejoin="round"><rect x="59" y="17" width="41" height="73" stroke-dasharray="5 4"/><path d="M14 42h37m-8-7 8 7-8 7 M147 65h-39m8-7-8 7 8 7"/></g></g><text x="28" y="136" font-size="23" font-weight="normal" fill="#135d83">Dialysis / exchange • conceptual action symbol</text><rect x="26" y="223" width="500" height="233" rx="12" fill="#e6f1fa"/><text x="42" y="261" font-size="19" font-weight="bold" fill="#173047">INPUTS</text><text x="42" y="296" font-size="20" font-weight="normal" fill="#173047">loading mixture after residual chloroform</text><text x="42" y="323" font-size="20" font-weight="normal" fill="#173047">evaporation</text><text x="42" y="369" font-size="20" font-weight="normal" fill="#173047">water</text><text x="42" y="400" font-size="18" font-weight="normal" fill="#173047">amount: not reported</text><rect x="572" y="223" width="500" height="233" rx="12" fill="#e5f4ed"/><text x="588" y="261" font-size="19" font-weight="bold" fill="#173047">OUTPUTS / PHYSICAL STATES</text><text x="588" y="296" font-size="20" font-weight="normal" fill="#173047">aqueous Q-LHD dispersion with aggregated free</text><text x="588" y="323" font-size="20" font-weight="normal" fill="#173047">QDs</text><text x="588" y="354" font-size="18" font-weight="normal" fill="#173047">Kind: mixture</text><text x="28" y="494" font-size="21" font-weight="normal" fill="#173047">Dialyze against water for2days to exchange organic solvent. Unloaded hydrophobic QDs</text><text x="28" y="522" font-size="21" font-weight="normal" fill="#173047">aggregate/precipitate in the aqueous medium. Preparation membrane MWCO, water volume and exchanges</text><text x="28" y="550" font-size="21" font-weight="normal" fill="#173047">are unreported; application-test hardware is not inherited.</text><text x="28" y="591" font-size="21" font-weight="normal" fill="#173047">duration: 2 day</text><text x="28" y="632" font-size="21" font-weight="normal" fill="#173047">Environment: not reported</text><text x="28" y="673" font-size="15" font-weight="normal" fill="#596b7d">Conceptual and not to scale; no unreported apparatus geometry, liquid levels or handling atmosphere inferred.</text><text x="28" y="703" font-size="15" font-weight="normal" fill="#596b7d">Khatun et al. (2012) • Main PDF p.3 / printed p.3882, Section 2.4, loading and workup</text></g></svg>