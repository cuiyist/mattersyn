<svg xmlns="http://www.w3.org/2000/svg" width="960" height="678" viewBox="0 0 960 678" role="img"><title>Slowly add KOH solution to the zinc-acetate solution</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3e778d"/></marker></defs><rect width="960" height="678" fill="#fff"/><g font-family="Arial, sans-serif"><text x="30" y="44" font-size="28" text-anchor="start" fill="#244659">Slowly add KOH solution to the zinc-acetate solution</text><g transform="translate(0 95)"><rect x="238" y="30" width="85" height="132" rx="12" stroke="#47778a" stroke-width="3" fill="#edf5f8"/><path d="M248 120q32.5 12 65 0" fill="none" stroke="#91bbc9" stroke-width="3"/><path d="M367 96L589 96" stroke="#3e778d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="637" y="30" width="85" height="132" rx="12" stroke="#47778a" stroke-width="3" fill="#edf5f8"/><path d="M647 120q32.5 12 65 0" fill="none" stroke="#91bbc9" stroke-width="3"/><text x="480" y="205" font-size="23" text-anchor="middle" fill="#244659">Slow feed into precursor solution</text></g><text x="30" y="367" font-size="20" text-anchor="start" fill="#244659">Inputs: Zinc acetate precursor in methanol; hydration unresolved; Potassium hydroxide precursor</text><text x="30" y="394" font-size="20" text-anchor="start" fill="#244659">in methanol</text><text x="30" y="430" font-size="20" text-anchor="start" fill="#244659">Outputs: Slowly add KOH solution to the zinc-acetate solution</text><text x="30" y="466" font-size="20" text-anchor="start" fill="#244659">Direction is KOH solution into zinc-acetate solution; slow addition has no numeric rate or</text><text x="30" y="493" font-size="20" text-anchor="start" fill="#244659">duration.</text><text x="30" y="529" font-size="20" text-anchor="start" fill="#244659">Exact vessel type, size and hardware geometry are not reported; drawing is a qualified</text><text x="30" y="556" font-size="20" text-anchor="start" fill="#244659">schematic.</text><text x="30" y="592" font-size="20" text-anchor="start" fill="#244659">Qualified schematic; dimensions and fill levels are illustrative.</text><text x="30" y="628" font-size="20" text-anchor="start" fill="#244659">Source: SI PDF p.2, Synthesis of ZnO nanoparticles</text></g></svg>