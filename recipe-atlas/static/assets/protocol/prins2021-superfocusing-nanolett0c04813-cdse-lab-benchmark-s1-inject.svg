arate from the custom in-situ X-ray flask; exact</text><text x="28" y="626" font-size="20" text-anchor="start" fill="#274c60">apparatus geometry not independently specified.</text><text x="28" y="653" font-size="20" text-anchor="start" fill="#274c60">Schematic action illustration. Drawn shapes, dimensions and fill levels are illustrative; only</text><text x="28" y="680" font-size="20" text-anchor="start" fill="#274c60">stated source dimensions are quantitative.</text></g></svg>
