<svg xmlns="http://www.w3.org/2000/svg" width="960" height="762" viewBox="0 0 960 762" role="img"><title>Measure J–V under 1 Sun AM1.5G</title><desc>Source-linked stage schematic. No unreported equipment dimensions or solution species are asserted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="762" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="34" font-size="18" text-anchor="start" fill="#647888">CdS240/CdSe sandwich photovoltaic cell</text><text x="30" y="73" font-size="28" text-anchor="start" fill="#234b60">Measure J–V under 1 Sun AM1.5G</text><text x="30" y="112" font-size="21" text-anchor="start" fill="#234b60">illumination: 1 Sun</text><text x="30" y="140" font-size="21" text-anchor="start" fill="#234b60">minimum cells: at least five different cells — at least</text><g transform="translate(0 174)"><rect x="275" y="151" width="410" height="22" fill="#cadde7" stroke="#557f91" stroke-width="3"/><path d="M283 144h394" stroke="#ac8d48" stroke-width="7"/><rect x="275" y="99" width="34" height="48" fill="#d7c8a6"/><rect x="651" y="99" width="34" height="48" fill="#d7c8a6"/><path d="M315 132h330" stroke="#9fbbc5" stroke-width="22"/><rect x="275" y="73" width="410" height="23" fill="#beac89" stroke="#557f91" stroke-width="3"/><path d="M357 276L357 190" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M432 276L432 190" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M507 276L507 190" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M582 276L582 190" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="785" y="230" font-size="23" text-anchor="middle" fill="#234b60">1 Sun</text><text x="480" y="48" font-size="21" text-anchor="middle" fill="#234b60">Dark Cu₂S/brass cathode</text><text x="190" y="176" font-size="19" text-anchor="middle" fill="#234b60">FTO side</text><text x="480" y="320" font-size="21" text-anchor="middle" fill="#234b60">Sandwich sketch; layer thicknesses not to scale</text></g><text x="30" y="514" font-size="20" text-anchor="start" fill="#234b60">Inputs: Sandwich with nominal Cu2S/brass dark cathode</text><text x="30" y="550" font-size="20" text-anchor="start" fill="#234b60">Output: Measure J–V under 1 Sun AM1.5G</text><text x="30" y="586" font-size="20" text-anchor="start" fill="#234b60">Oriel class3A solar simulator and Keithley2420 source meter; AM1.5G. At least5different cells</text><text x="30" y="613" font-size="20" text-anchor="start" fill="#234b60">per source sample, not5synthesis runs; no statistical error bars inferred.</text><text x="30" y="649" font-size="20" text-anchor="start" fill="#234b60">Apparatus dimensions, liquid level and spatial layout are schematic, not measured source</text><text x="30" y="676" font-size="20" text-anchor="start" fill="#234b60">geometry.</text><text x="30" y="712" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.3 §2.5; Main PDF p.6 Section3.5</text></g></svg>