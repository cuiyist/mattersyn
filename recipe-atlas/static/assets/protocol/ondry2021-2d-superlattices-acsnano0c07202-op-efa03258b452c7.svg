<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="839" viewBox="0 0 1000 839"><title>Prepare powder to avoid orientation effects</title><desc>Prepare powder to avoid orientation effects. Environment: Not reported; Atmosphere not reported for this operation. Deposit a large amount of NCs from hexanes onto glass, dry, scrape with a clean razor onto the oriented Si low-background substrate. Solvent volume and drying time not reported. Support/specimen layers are conceptual and not measured thickness or geometry. Authored conceptual stage illustration; not measured apparatus or particle structure.</desc><rect x="1" y="1" width="998" height="837" rx="16" fill="#f8fbfc" stroke="#a9c5d0"/><rect x="0" y="0" width="1000" height="50" rx="16" fill="#173f50"/><text x="30" y="31" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">STEP 01 / 04  ·  CHARACTERIZATION</text><text x="30" y="84" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#244754">Prepare powder to avoid orientation effects</text><text x="30" y="121" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#506875">Ondry et al. (2021): Powder and substrate-supported XRD methods</text><rect x="30" y="169" width="415" height="158" rx="12" fill="#e6f0f4" stroke="#bad0db"/><rect x="555" y="169" width="415" height="158" rx="12" fill="#edf4ed" stroke="#c4d4c4"/><path d="M462 248.0H537m-13 -11l13 11-13 11" fill="none" stroke="#528295" stroke-width="3"/><text x="48" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">INPUTS / CONTEXT</text><text x="48" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• Starting nanocrystal dispersion</text><text x="48" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• hexanes</text><text x="48" y="276" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• glass slide or coverslip</text><text x="48" y="301" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• Oriented low-background silicon substrate</text><text x="573" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">OUTPUT / STATE</text><text x="573" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• powder specimen</text><text x="573" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">State kind: aliquot</text><g transform="translate(30 366)"><rect x="70" y="108" width="270" height="13" rx="8" fill="#d8e5ed" stroke="#668b9c" stroke-width="2"/><rect x="108" y="86" width="190" height="10" rx="8" fill="#b3c2cc" stroke="#668b9c" stroke-width="2"/><path d="M375 95L475 95" fill="none" stroke="#528295" stroke-width="3"/><path d="M466 88L475 95L466 102" fill="none" stroke="#528295" stroke-width="3"/><text x="535" y="68" font-family="Arial,sans-serif" font-size="19" fill="#244754">Separate physical specimen</text><text x="535" y="106" font-family="Arial,sans-serif" font-size="18" fill="#244754">Preparation ≠ analytical output</text></g><text x="30" y="591" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">OPERATION CONDITIONS</text><text x="30" y="619" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">No numerical parameter fields assigned to this operation.</text><text x="30" y="658" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">Environment: Not reported; Atmosphere not reported for this operation.</text><text x="30" y="695" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">Deposit a large amount of NCs from hexanes onto glass, dry, scrape with a clean razor onto the oriented Si low-background</text><text x="30" y="719" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">substrate. Solvent volume and drying time not reported.</text><text x="30" y="765" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#566d75">Support/specimen layers are conceptual and not measured thickness or geometry. Authored conceptual stage illustration; not measured apparatus</text><text x="30" y="785" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#566d75">or particle structure.</text></svg>