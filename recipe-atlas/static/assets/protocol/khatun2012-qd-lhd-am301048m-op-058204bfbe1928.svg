<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="768" viewBox="0 0 1100 768"><rect width="1100" height="768" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="42" font-size="27" font-weight="bold" fill="#173047">06 React DOCA carbonate overnight</text><text x="28" y="91" font-size="17" font-weight="normal" fill="#596b7d">primary reported preparation</text><g transform="translate(0 101)"><g transform="translate(875 0)" stroke="#1b6986" fill="none" stroke-width="3" stroke-linejoin="round"><path d="M18 21h43v31H18z M101 21h43v31h-43z M41 60l32 33m-1-12 1 12-12-1 M122 60L90 93m1-12-1 12 12-1"/></g></g><text x="28" y="136" font-size="23" font-weight="normal" fill="#135d83">Mixing / preparation • conceptual action symbol</text><rect x="26" y="223" width="500" height="281" rx="12" fill="#e6f1fa"/><text x="42" y="261" font-size="19" font-weight="bold" fill="#173047">INPUTS</text><text x="42" y="296" font-size="20" font-weight="normal" fill="#173047">DOCA carbonate powder</text><text x="42" y="342" font-size="20" font-weight="normal" fill="#173047">4-methylmorpholine</text><text x="42" y="373" font-size="18" font-weight="normal" fill="#173047">amount: 1.1 mmol</text><text x="42" y="417" font-size="20" font-weight="normal" fill="#173047">ethylenediamine</text><text x="42" y="448" font-size="18" font-weight="normal" fill="#173047">amount: 0.05 mmol</text><rect x="572" y="223" width="500" height="281" rx="12" fill="#e5f4ed"/><text x="588" y="261" font-size="19" font-weight="bold" fill="#173047">OUTPUTS / PHYSICAL STATES</text><text x="588" y="296" font-size="20" font-weight="normal" fill="#173047">DOCA amination mixture</text><text x="588" y="327" font-size="18" font-weight="normal" fill="#173047">Kind: mixture</text><text x="28" y="542" font-size="21" font-weight="normal" fill="#173047">React DOCA carbonate with4-methylmorpholine1.10mmol and ethylenediamine0.05mmol overnight at room</text><text x="28" y="570" font-size="21" font-weight="normal" fill="#173047">temperature. Carbonate charge and solvent are unreported; overnight is not converted into hours.</text><text x="28" y="611" font-size="21" font-weight="normal" fill="#173047">duration: not reported; Reported as overnight; no numeric duration assigned.</text><text x="28" y="652" font-size="21" font-weight="normal" fill="#173047">Environment: room temperature</text><text x="28" y="693" font-size="15" font-weight="normal" fill="#596b7d">Conceptual and not to scale; no unreported apparatus geometry, liquid levels or handling atmosphere inferred.</text><text x="28" y="723" font-size="15" font-weight="normal" fill="#596b7d">Khatun et al. (2012) • Main PDF p.2 / printed p.3881, Section 2.2, LHD synthesis</text></g></svg>