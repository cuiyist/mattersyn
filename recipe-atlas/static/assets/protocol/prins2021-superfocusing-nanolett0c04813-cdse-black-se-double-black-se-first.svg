<svg xmlns="http://www.w3.org/2000/svg" width="960" height="734" viewBox="0 0 960 734" role="img" aria-labelledby="title desc"><title id="title">Inject 2 mL ODE containing 0.05 mmol black selenium</title><desc id="desc">Continuing three-neck flask with cooler under air, explicitly reported in SI p.21; flask capacity and cooler geometry are unreported.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><g font-family="Arial,sans-serif"><rect width="960" height="734" rx="16" fill="#f7fafb"/><text x="28" y="42" font-size="27" text-anchor="start" fill="#274c60">Inject 2 mL ODE containing 0.05 mmol black selenium</text><text x="28" y="77" font-size="20" text-anchor="start" fill="#274c60">selenium amount: 0.05 mmol; injection solvent volume: 2 mL; Atmosphere: air</text><g transform="translate(0 133)"><path d="M458 65h44v70l47-47 24 24-57 65q66 45 45 103q-16 47-81 47t-81-47q-21-58 45-103l-57-65 24-24 47 47z" fill="#edf5f8" stroke="#466c7d" stroke-width="3"/><path d="M409 254q71 16 142 0" fill="none" stroke="#9dc1cf" stroke-width="4"/><g transform="translate(-84 18)"><path d="M462 2h36v37h-36zM480-14v16M456-14h48M480 39v45" fill="#e1eef3" stroke="#426a7d" stroke-width="3"/></g><path d="M338 36L389 82" fill="none" stroke="#477e91" stroke-width="3" marker-end="url(#arrow)"/><text x="250" y="24" font-size="21" text-anchor="middle" fill="#274c60">Feed transfer</text><rect x="462" y="-10" width="36" height="78" rx="4" fill="#e7f2f7" stroke="#466c7d" stroke-width="3"/><path d="M477-3v64" stroke="#84aabd" stroke-width="2"/><text x="694" y="53" font-size="18" text-anchor="middle" fill="#274c60">Cooler · geometry unspecified</text><text x="480" y="367" font-size="21" text-anchor="middle" fill="#274c60">Three-neck flask · schematic</text></g><text x="28" y="545" font-size="20" text-anchor="start" fill="#274c60">Inputs: Heat CdO, oleic acid and ODE to 270 °C under air; Black selenium powder; 1-Octadecene</text><text x="28" y="572" font-size="20" text-anchor="start" fill="#274c60">Outputs: Inject 2 mL ODE containing 0.05 mmol black selenium</text><text x="28" y="599" font-size="20" text-anchor="start" fill="#274c60">Continuing three-neck flask with cooler under air, explicitly reported in SI p.21; flask capacity</text><text x="28" y="626" font-size="20" text-anchor="start" fill="#274c60">and cooler geometry are unreported.</text><text x="28" y="653" font-size="20" text-anchor="start" fill="#274c60">Schematic action illustration. Drawn shapes, dimensions and fill levels are illustrative; only</text><text x="28" y="680" font-size="20" text-anchor="start" fill="#274c60">stated source dimensions are quantitative.</text></g></svg>
