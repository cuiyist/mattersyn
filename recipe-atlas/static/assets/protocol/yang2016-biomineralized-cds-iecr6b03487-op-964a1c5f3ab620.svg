<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><title>Dialyze the harvested dispersion</title><desc>Conceptual stage diagram. Dialysis retentate and external water, conceptual. Only source-stated conditions apply.</desc><rect x="5" y="5" width="1090" height="580" rx="20" fill="#f3f8fa" stroke="#bfd1da"/><g transform="translate(10 120)" fill="none" stroke="#426e80" stroke-width="3.4"><path d="M38 78v167h244V78M38 132h244"/><path d="M123 51v165q37 18 74 0V51z" stroke-dasharray="6 5"/><path d="M88 160h48m-13-10 13 10-13 10M187 187h48m-13-10 13 10-13 10"/></g><text x="360" y="54" font-family="Arial,sans-serif" font-size="25" fill="#153e50">Dialyze the harvested dispersion</text><text x="360" y="132" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">Dialyze the harvested solution against ultrapure water using</text><text x="360" y="160" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">Snakeskin 3500 MWCO membrane to remove residual cadmium</text><text x="360" y="188" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">acetate, cysteine and buffer salts. Time, water volume and</text><text x="360" y="216" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">exchange count are unreported.</text><text x="26" y="538" font-family="Arial,sans-serif" font-size="16" fill="#52717d">Conceptual stage diagram. Dialysis retentate and external water, conceptual. Only source-stated conditions</text><text x="26" y="560" font-family="Arial,sans-serif" font-size="16" fill="#52717d">apply.</text></svg>
