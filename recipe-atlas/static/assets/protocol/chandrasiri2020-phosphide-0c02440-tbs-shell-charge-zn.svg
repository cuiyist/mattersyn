<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 529" role="img"><title>Add zinc stearate to etched core solution</title><rect x="8" y="8" width="654" height="513" rx="20" fill="#f2f7fa" stroke="#d7e5ec"/><text x="335" y="39" text-anchor="middle" font-family="Arial" font-size="18" fill="#203c50">Add zinc stearate to etched core solution</text><text x="335" y="92" text-anchor="middle" font-family="Arial" font-size="13" fill="#203c50">synthesis</text><path d="M310 155V182C259 198 259 272 335 278C411 272 411 198 360 182V155M310 155H360M298 191L278 167M372 191L392 167" fill="#e4f1f4" stroke="#547a8b" stroke-width="3"/><path d="M280 239Q335 258 390 239" fill="none" stroke="#72adbc" stroke-width="14"/><text x="335" y="350" text-anchor="middle" font-family="Arial" font-size="13" fill="#203c50">Atmosphere / handling: High N2 flow</text><text x="335" y="391" text-anchor="middle" font-family="Arial" font-size="15" fill="#203c50">core amount: 5.4e-07 mol</text><text x="335" y="414" text-anchor="middle" font-family="Arial" font-size="15" fill="#203c50">core diameter: ~2 nm</text><text x="335" y="437" text-anchor="middle" font-family="Arial" font-size="15" fill="#203c50">target shell layers: 5 monolayers (nominal attempted ZnS coverage; not</text><text x="335" y="460" text-anchor="middle" font-family="Arial" font-size="15" fill="#203c50">measured shell thickness)</text><text x="335" y="507" text-anchor="middle" font-family="Arial" font-size="11" fill="#203c50">Conceptual stage; dimensions and settings only where reported</text></svg>