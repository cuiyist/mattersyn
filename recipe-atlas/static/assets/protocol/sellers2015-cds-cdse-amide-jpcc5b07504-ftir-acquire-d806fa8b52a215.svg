<svg xmlns="http://www.w3.org/2000/svg" width="820" height="681" viewBox="0 0 820 681"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><rect width="820" height="681" rx="16" fill="#f5f9fb"/><text x="25" y="41" font-family="Arial,sans-serif" font-size="26" text-anchor="start" fill="#173c4a">Record FTIR using a Nicolet Magna-IR 550 with DTGS</text><text x="25" y="73" font-family="Arial,sans-serif" font-size="26" text-anchor="start" fill="#173c4a">detector</text><text x="25" y="105" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">scans: at least 500 scans; resolution: 2 cm^-1</text><g transform="translate(0 158)"><rect x="240" y="45" width="330" height="190" rx="12" fill="#edf6f8" stroke="#3c6475" stroke-width="3"/><text x="405" y="121" font-family="Arial,sans-serif" font-size="26" text-anchor="middle" fill="#173c4a">Measurement</text><text x="405" y="160" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#173c4a">No result drawn</text><text x="405" y="298" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#173c4a">Source evidence is shown separately</text></g><text x="25" y="545" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Inputs: Purge the FTIR chamber with nitrogen for 15–30 min</text><text x="25" y="572" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Outputs: Record FTIR using a Nicolet Magna-IR 550 with DTGS detector</text><text x="25" y="599" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Illustrative acquisition cue only. No measured spectrum, micrograph, particle</text><text x="25" y="626" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">geometry or result is generated.</text></svg>