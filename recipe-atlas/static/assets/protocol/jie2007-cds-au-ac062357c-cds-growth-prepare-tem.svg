<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410"><title>Prepare TEM specimen</title><desc>Source-bound operation schematic; geometry, fill levels and component spacing are conceptual and not quantified.</desc><rect x="5" y="5" width="910" height="400" rx="20" fill="#f4f8fa" stroke="#bed0d8"/><g transform="translate(14 55)" fill="none" stroke="#477184" stroke-width="3.5" font-family="sans-serif" font-size="20"><ellipse cx="166" cy="217" rx="81" ry="27"/><path d="M86 217h160M166 190v55M113 198v37M218 198v37M153 42h26v74h-26zM166 121q-22 35 0 35q22 0 0-35"/><text x="166" y="282" text-anchor="middle" stroke="none" fill="#294f5e">Drop onto grid; dry</text></g><text stroke="none" x="365" y="54" font-family="sans-serif" font-size="24" fill="#183e4d">Prepare TEM specimen</text><text stroke="none" x="365" y="99" font-family="sans-serif" font-size="18" fill="#294f5e">Drop colloidal particle solution on carbon-coated copper</text><text stroke="none" x="365" y="127" font-family="sans-serif" font-size="18" fill="#294f5e">grid and allow to dry at room temperature; drop volume</text><text stroke="none" x="365" y="155" font-family="sans-serif" font-size="18" fill="#294f5e">and drying duration unreported.</text><text stroke="none" x="30" y="382" font-family="sans-serif" font-size="16" fill="#55717d">Conceptual stage scene; no unreported vessel size, liquid level, pressure or geometry implied.</text></svg>
