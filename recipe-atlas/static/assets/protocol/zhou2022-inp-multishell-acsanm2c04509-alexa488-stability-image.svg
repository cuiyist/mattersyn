<svg xmlns="http://www.w3.org/2000/svg" width="960" height="871" viewBox="0 0 960 871"><title>Compare Alexa-labeled microtubules at 0 and 100 s</title><desc>Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular geometry, or experimental trace is implied. No exact optical train, cellular morphology, micrograph or experimental result is reconstructed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><rect width="960" height="871" rx="15" fill="#f7fafc"/><text x="30" y="32" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#637f8e">Alexa Fluor 488 photobleaching comparison</text><text x="30" y="57" font-family="Arial,sans-serif" font-size="28" text-anchor="start" fill="#173c4a">Compare Alexa-labeled microtubules at 0 and 100 s</text><g transform="translate(70 110)"><rect x="279" y="40" width="262" height="72" rx="9" fill="#e6f1f5" stroke="#3c6475" stroke-width="3"/><text x="410" y="84" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#173c4a">Image acquisition</text><path d="M410 129L410 176" fill="none" stroke="#477e91" stroke-width="4" marker-end="url(#arrow)"/><rect x="285" y="192" width="250" height="21" fill="#d7eaf1" stroke="#3c6475" stroke-width="3"/><text x="410" y="260" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#173c4a">Specimen plane</text><text x="410" y="321" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#173c4a">Optical action cue; no measured image generated</text></g><text x="30" y="505" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Inputs: Alexa Fluor 488; BS-C-1 cells</text><text x="30" y="531" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="557" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Outputs: Compare Alexa-labeled microtubules at 0 and 100 s</text><text x="30" y="583" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="609" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">SI Figure S1e/f show loss of visible microtubule structures by 100 s. Dye dose, antibody linkage,</text><text x="30" y="635" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">labeling time and laser power are unreported; QD–SA labeling steps are not copied as a dye</text><text x="30" y="661" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">preparation.</text><text x="30" y="687" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="713" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular</text><text x="30" y="739" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">geometry, or experimental trace is implied. No exact optical train, cellular morphology, micrograph or</text><text x="30" y="765" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">experimental result is reconstructed.</text><text x="30" y="791" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="817" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Source: SI PDF pp.1–3, Section 1 and Figure S1</text></svg>