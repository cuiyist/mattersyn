<svg xmlns="http://www.w3.org/2000/svg" width="960" height="797" viewBox="0 0 960 797" role="img"><title>Combine aqueous gold precursor and GSH</title><desc>Source-linked conceptual stage; geometry and unreported fields are not measurements.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="797" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#647888">Microwave GSH-Au nanocluster synthesis</text><text x="30" y="68" font-size="28" text-anchor="start" fill="#234b60">Combine aqueous gold precursor and GSH</text><text x="30" y="107" font-size="21" text-anchor="start" fill="#234b60">gold stock volume: 2 mL</text><text x="30" y="135" font-size="21" text-anchor="start" fill="#234b60">gold stock concentration: 2 mM</text><text x="30" y="163" font-size="21" text-anchor="start" fill="#234b60">gsh stock volume: 2 mL</text><text x="30" y="191" font-size="21" text-anchor="start" fill="#234b60">gsh concentration raw: 3 Mm; Printed unit unresolved; no automatic conversion to mM</text><g transform="translate(0 227)"><rect x="132" y="25" width="90" height="130" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M140 120q37.0 9 74 0" fill="none" stroke="#9abfce" stroke-width="4"/><rect x="738" y="25" width="90" height="130" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M746 120q37.0 9 74 0" fill="none" stroke="#9abfce" stroke-width="4"/><path d="M242 101L407 138" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M718 101L553 138" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="436" y="71" width="87" height="127" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M444 163q35.5 9 71 0" fill="none" stroke="#9abfce" stroke-width="4"/><text x="480" y="255" font-size="20" text-anchor="middle" fill="#234b60">Combine the named inputs; depicted liquid levels are illustrative</text></g><text x="30" y="521" font-size="20" text-anchor="start" fill="#234b60">Inputs: Gold(III) chloride trihydrate; Glutathione (GSH); stock concentration unit unresolved;</text><text x="30" y="548" font-size="20" text-anchor="start" fill="#234b60">Water; aqueous medium</text><text x="30" y="584" font-size="20" text-anchor="start" fill="#234b60">Output: Combine aqueous gold precursor and GSH</text><text x="30" y="620" font-size="20" text-anchor="start" fill="#234b60">Additional water volume and stock preparation are not given. GSH stock printed 3 Mm. Preserve</text><text x="30" y="647" font-size="20" text-anchor="start" fill="#234b60">raw and unknown/unresolved normalized concentration unit; never automatic 3 mM. (main p3 §2.4)</text><text x="30" y="683" font-size="20" text-anchor="start" fill="#234b60">Generic apparatus cue; vessel dimensions, quantitative liquid level and spatial layout are not</text><text x="30" y="710" font-size="20" text-anchor="start" fill="#234b60">measured source geometry.</text><text x="30" y="746" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.3 §2.4</text></g></svg>