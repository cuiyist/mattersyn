ze="20" text-anchor="start" fill="#234b60">Output: Dry cleaned powder under vacuum at 70 °C</text><text x="30" y="642" font-size="20" text-anchor="start" fill="#234b60">Drying time and vacuum pressure are not reported.</text><text x="30" y="678" font-size="20" text-anchor="start" fill="#234b60">Apparatus dimensions, liquid level and spatial layout are schematic, not measured source</text><text x="30" y="705" font-size="20" text-anchor="start" fill="#234b60">geometry.</text><text x="30" y="741" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.2 §2.1</text></g></svg>