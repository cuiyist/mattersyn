<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830"><rect width="1000" height="830" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="27" y="42" font-size="25" fill="#213446" stroke="none">08  Hold and stir for shell growth</text><text x="28" y="81" font-size="17" fill="#596b7d" stroke="none">QD preparation · source-bound conceptual stage</text><rect x="24" y="112" width="372" height="315" rx="12" fill="#e6f1fa"/><rect x="604" y="112" width="372" height="315" rx="12" fill="#e5f4ed"/><text x="43" y="146" font-size="18" fill="#213446" stroke="none">INPUTS</text><text x="623" y="146" font-size="17" fill="#213446" stroke="none">OUTPUTS / PHYSICAL STATES</text><text x="43" y="179" font-size="18" fill="#213446" stroke="none">reaction mixture after shell</text><text x="43" y="203" font-size="18" fill="#213446" stroke="none">precursor addition</text><text x="623" y="179" font-size="18" fill="#213446" stroke="none">CdSe/ZnS growth mixture [mixture]</text><g stroke="#1c6480" stroke-width="3" fill="none" stroke-linejoin="round"><path d="M439 207q61-65 122 0 M550 189l13 20-22-3 M561 275q-61 65-122 0 M450 293l-13-20 22 3"/><text x="436" y="247" font-size="17" fill="#213446" stroke="none">Hold and stir</text><text x="417" y="355" font-size="15" fill="#213446" stroke="none">No ramp inferred</text></g><text x="28" y="460" font-size="18" fill="#213446" stroke="none">Keep system at 180 C and stir for 40min.</text><text x="28" y="497" font-size="18" fill="#213446" stroke="none">temperature: 180 degC</text><text x="28" y="534" font-size="18" fill="#213446" stroke="none">duration: 40 min</text><text x="28" y="571" font-size="18" fill="#213446" stroke="none">Environment: not reported. Per-step atmosphere, pressure and unreported hardware are not</text><text x="28" y="595" font-size="18" fill="#213446" stroke="none">inferred.</text><text x="28" y="774" font-size="15" fill="#596b7d" stroke="none">Conceptual illustration; no measured geometry, levels or unreported apparatus inferred.</text><text x="28" y="799" font-size="14" fill="#596b7d" stroke="none">Lin et al.(2011) · Main PDF p.2 / printed p.996, Synthesis of CdSe/ZnS QDs</text></g></svg>