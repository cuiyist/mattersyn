<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><title>Rinse twice with the ligand-matched solvent</title><desc>Rinse twice with the ligand-matched solvent. Rinse count: 2 times Environment (inherited): Ambient atmosphere, 40–50% humidity, room temperature. General device-fabrication conditions; separate dry-air storage and vacuum Au deposition override them.  Conceptual material flow; apparatus geometry, liquid levels and particle shapes are not depicted.</desc><rect x="1" y="1" width="998" height="518" rx="16" fill="#f8fbfc" stroke="#a9c5d0"/><rect x="0" y="0" width="1000" height="50" rx="16" fill="#173f50"/><text x="30" y="31" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">STEP 02 / 04  ·  WORKUP</text><text x="30" y="84" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#244754">Rinse twice with the ligand-matched solvent</text><text x="30" y="121" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#506875">TAA-derived PbS / EDT solar-cell assembly and performance</text><rect x="30" y="169" width="415" height="122" rx="12" fill="#e6f0f4" stroke="#bad0db"/><rect x="555" y="169" width="415" height="122" rx="12" fill="#edf4ed" stroke="#c4d4c4"/><path d="M462 230.0H537m-13 -11l13 11-13 11" fill="none" stroke="#528295" stroke-width="3"/><text x="48" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">INPUTS / CONTEXT</text><text x="48" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• exchanged top</text><text x="48" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• acetonitrile</text><text x="573" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">OUTPUT / OBSERVATION</text><text x="573" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• rinsed film</text><text x="30" y="3