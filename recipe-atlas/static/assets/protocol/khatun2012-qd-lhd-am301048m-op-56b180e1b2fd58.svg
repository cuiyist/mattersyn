<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="633" viewBox="0 0 1100 633"><rect width="1100" height="633" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="42" font-size="27" font-weight="bold" fill="#173047">04 Remove residual chloroform under reduced pressure</text><text x="28" y="91" font-size="17" font-weight="normal" fill="#596b7d">primary reported preparation</text><g transform="translate(0 101)"><g transform="translate(875 0)" stroke="#1b6986" fill="none" stroke-width="3" stroke-linejoin="round"><path d="M27 91h101 M40 73V21m-9 10 9-10 9 10 M81 73V21m-9 10 9-10 9 10 M122 73V21m-9 10 9-10 9 10"/></g></g><text x="28" y="136" font-size="23" font-weight="normal" fill="#135d83">Reduced-pressure evaporation • conceptual action symbol</text><rect x="26" y="223" width="500" height="187" rx="12" fill="#e6f1fa"/><text x="42" y="261" font-size="19" font-weight="bold" fill="#173047">INPUTS</text><text x="42" y="296" font-size="20" font-weight="normal" fill="#173047">Q-LHD loading mixture after overnight open-flask</text><text x="42" y="323" font-size="20" font-weight="normal" fill="#173047">stirring</text><rect x="572" y="223" width="500" height="187" rx="12" fill="#e5f4ed"/><text x="588" y="261" font-size="19" font-weight="bold" fill="#173047">OUTPUTS / PHYSICAL STATES</text><text x="588" y="296" font-size="20" font-weight="normal" fill="#173047">loading mixture after residual chloroform</text><text x="588" y="323" font-size="20" font-weight="normal" fill="#173047">evaporation</text><text x="588" y="354" font-size="18" font-weight="normal" fill="#173047">Kind: mixture</text><text x="28" y="448" font-size="21" font-weight="normal" fill="#173047">Evaporate remaining chloroform by vacuum evaporation under reduced pressure. Pressure, temperature and</text><text x="28" y="476" font-size="21" font-weight="normal" fill="#173047">duration unreported.</text><text x="28" y="517" font-size="21" font-weight="normal" fill="#173047">Environment: reduced pressure, numerical pressure unreported</text><text x="28" y="558" font-size="15" font-weight="normal" fill="#596b7d">Conceptual and not to scale; no unreported apparatus geometry, liquid levels or handling atmosphere inferred.</text><text x="28" y="588" font-size="15" font-weight="normal" fill="#596b7d">Khatun et al. (2012) • Main PDF p.3 / printed p.3882, Section 2.4, loading and workup</text></g></svg>