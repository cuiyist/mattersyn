<svg xmlns="http://www.w3.org/2000/svg" width="960" height="734" viewBox="0 0 960 734" role="img" aria-labelledby="title desc"><title id="title">Purify aliquots three times with toluene and acetone</title><desc id="desc">Vessel dimensions and geometry are not reported for this operation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><g font-family="Arial,sans-serif"><rect width="960" height="734" rx="16" fill="#f7fafb"/><text x="28" y="42" font-size="27" text-anchor="start" fill="#274c60">Purify aliquots three times with toluene and acetone</text><text x="28" y="77" font-size="20" text-anchor="start" fill="#274c60">purification cycles: 3 count</text><g transform="translate(0 133)"><rect x="210" y="87" width="76" height="124" rx="7" fill="#eef6f8" stroke="#477081" stroke-width="3"/><path d="M210 104h76M217 182q31.0 10 62 0" fill="none" stroke="#a0c1d0" stroke-width="3"/><text x="248" y="247" font-size="21" text-anchor="middle" fill="#274c60">Cycle 1</text><path d="M315 151L399 151" fill="none" stroke="#477e91" stroke-width="3" marker-end="url(#arrow)"/><rect x="430" y="87" width="76" height="124" rx="7" fill="#eef6f8" stroke="#477081" stroke-width="3"/><path d="M430 104h76M437 182q31.0 10 62 0" fill="none" stroke="#a0c1d0" stroke-width="3"/><text x="468" y="247" font-size="21" text-anchor="middle" fill="#274c60">Cycle 2</text><path d="M535 151L619 151" fill="none" stroke="#477e91" stroke-width="3" marker-end="url(#arrow)"/><rect x="650" y="87" width="76" height="124" rx="7" fill="#eef6f8" stroke="#477081" stroke-width="3"/><path d="M650 104h76M657 182q31.0 10 62 0" fill="none" stroke="#a0c1d0" stroke-width="3"/><text x="688" y="247" font-size="21" text-anchor="middle" fill="#274c60">Cycle 3</text><text x="480" y="309" font-size="20" text-anchor="middle" fill="#274c60">Purification method / equipment unspecified</text></g><text x="28" y="545" font-size="20" text-anchor="start" fill="#274c60">Inputs: Remove aliquots during PbS formation; Toluene; Acetone</text><text x="28" y="572" font-size="20" text-anchor="start" fill="#274c60">Outputs: Purify aliquots three times with toluene and acetone</text><text x="28" y="599" font-size="20" text-anchor="start" fill="#274c60">Vessel dimensions and geometry are not reported for this operation.</text><text x="28" y="626" font-size="20" text-anchor="start" fill="#274c60">Three reported purification cycles; no centrifugation or other separation equipment is inferred.</text><text x="28" y="653" font-size="20" text-anchor="start" fill="#274c60">Schematic action illustration. Drawn shapes, dimensions and fill levels are illustrative; only</text><text x="28" y="680" font-size="20" text-anchor="start" fill="#274c60">stated source dimensions are quantitative.</text></g></svg>
