<svg xmlns="http://www.w3.org/2000/svg" width="820" height="672" viewBox="0 0 820 672"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#4d8195" stroke-width="1.5"/></marker></defs><rect width="820" height="672" rx="14" fill="#f5f8fa"/><text x="26" y="40" text-anchor="start" font-family="Arial,sans-serif" font-size="27" fill="#173d50">Redisperse in chloroform and precipitate with ethanol</text><text x="26" y="74" text-anchor="start" font-family="Arial,sans-serif" font-size="27" fill="#173d50">twice</text><text x="26" y="108" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#173d50">chloroform per cycle: 2 mL; ethanol per cycle: 6 mL; cycles: 2 count; rcf:</text><text x="26" y="134" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#173d50">~2800 g; speed: 5000 rpm; duration per cycle: 10 min</text><g transform="translate(0 220)"><rect x="110" y="46" width="72" height="116" rx="9" fill="#edf5f7" stroke="#385f70" stroke-width="4"/><path d="M110 66h72M118 141h56" stroke="#385f70" stroke-width="3"/><path d="M206 107L304 107" fill="none" stroke="#4d8195" stroke-width="4" marker-end="url(#arrow)"/><circle cx="405" cy="108" r="68" fill="#eaf1f4" stroke="#385f70" stroke-width="4"/><rect x="396" y="48" width="18" height="34" rx="5" fill="#adcbd8" stroke="#385f70" stroke-width="2" transform="rotate(0 405 108)"/><rect x="396" y="48" width="18" height="34" rx="5" fill="#adcbd8" stroke="#385f70" stroke-width="2" transform="rotate(90 405 108)"/><rect x="396" y="48" width="18" height="34" rx="5" fill="#adcbd8" stroke="#385f70" stroke-width="2" transform="rotate(180 405 108)"/><rect x="396" y="48" width="18" height="34" rx="5" fill="#adcbd8" stroke="#385f70" stroke-width="2" transform="rotate(270 405 108)"/><path d="M493 107L583 107" fill="none" stroke="#4d8195" stroke-width="4" marker-end="url(#arrow)"/><rect x="617" y="46" width="72" height="116" rx="9" fill="#edf5f7" stroke="#385f70" stroke-width="4"/><path d="M617 66h72M625 141h56" stroke="#385f70" stroke-width="3"/><path d="M627 144h52" stroke="#687f8b" stroke-width="9"/><text x="147" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#173d50">Solvent mixing</text><text x="405" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#173d50">Centrifuge</text><text x="653" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#173d50">Retain precipitate</text></g><text x="26" y="530" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#173d50">Inputs: Precipitate with ethanol and centrifuge; Chloroform; Ethanol</text><text x="26" y="558" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#173d50">Output: Redisperse in chloroform and precipitate with ethanol twice</text><text x="26" y="586" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#173d50">Symbolic action and container cues; source does not specify workup-container</text><text x="26" y="614" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#173d50">dimensions.</text></svg>