<svg xmlns="http://www.w3.org/2000/svg" width="960" height="686" viewBox="0 0 960 686" role="img"><title>Use oleic-acid-capped PbSe QDs from the cited hot-injection procedure</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3e778d"/></marker></defs><rect width="960" height="686" fill="#fff"/><g font-family="Arial, sans-serif"><text x="30" y="44" font-size="28" text-anchor="start" fill="#244659">Use oleic-acid-capped PbSe QDs from the cited hot-injection</text><text x="30" y="79" font-size="28" text-anchor="start" fill="#244659">procedure</text><g transform="translate(0 130)"><rect x="330" y="28" width="300" height="167" rx="7" fill="#edf5f8" stroke="#47778a" stroke-width="3"/><text x="480" y="95" font-size="27" text-anchor="middle" fill="#244659">Cited preparation</text><text x="480" y="138" font-size="20" text-anchor="middle" fill="#244659">Full procedure unavailable</text></g><text x="30" y="402" font-size="20" text-anchor="start" fill="#244659">Inputs: Oleic-acid-capped hot-injection PbSe QDs</text><text x="30" y="438" font-size="20" text-anchor="start" fill="#244659">Outputs: Use oleic-acid-capped PbSe QDs from the cited hot-injection procedure</text><text x="30" y="474" font-size="20" text-anchor="start" fill="#244659">SI cites Sykora et al., ACS Nano 2010, 4, 2021–2034. Full external procedure was not inspected</text><text x="30" y="501" font-size="20" text-anchor="start" fill="#244659">or downloaded; charges/temperature/time/workup unknown.</text><text x="30" y="537" font-size="20" text-anchor="start" fill="#244659">Exact vessel type, size and hardware geometry are not reported; drawing is a qualified</text><text x="30" y="564" font-size="20" text-anchor="start" fill="#244659">schematic.</text><text x="30" y="600" font-size="20" text-anchor="start" fill="#244659">Qualified schematic; dimensions and fill levels are illustrative.</text><text x="30" y="636" font-size="20" text-anchor="start" fill="#244659">Source: SI PDF p.4, Figure S2</text></g></svg>