<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><title>Characterize source-named aggregate contexts</title><desc>Abstract process symbol; vessel geometry and unreported conditions are not inferred.</desc><rect x="5" y="5" width="1090" height="610" rx="20" fill="#f4f8fa" stroke="#bed0d8"/><g transform="translate(15 110)" fill="none" stroke="#477184" stroke-width="3.5"><rect x="30" y="55" width="270" height="180" rx="14"/><path d="M70 195V90M70 195h180M80 181l40-15 30-55 40 31 52-36"/></g><text x="360" y="48" font-family="sans-serif" font-size="25" fill="#183e4d">Characterize source-named aggregate</text><text x="360" y="79" font-family="sans-serif" font-size="25" fill="#183e4d">contexts</text><text x="360" y="115" font-family="sans-serif" font-size="19" fill="#294f5e">TEM/DLS and fluorescence examine source-named NAC-G and other</text><text x="360" y="143" font-family="sans-serif" font-size="19" fill="#294f5e">analyte contexts. Exact inter-technique aliquot joins are not</text><text x="360" y="171" font-family="sans-serif" font-size="19" fill="#294f5e">reported. TEM: dry water-dispersion drops on Cu grids with lacey</text><text x="360" y="199" font-family="sans-serif" font-size="19" fill="#294f5e">carbon before JEOL 1230 imaging.</text><text x="25" y="565" font-family="sans-serif" font-size="16" fill="#55717d">Abstract process symbol; vessel geometry and unreported conditions are not inferred.</text></svg>
