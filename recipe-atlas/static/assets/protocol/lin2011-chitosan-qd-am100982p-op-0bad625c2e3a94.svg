<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830"><rect width="1000" height="830" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="27" y="42" font-size="25" fill="#213446" stroke="none">06  Complete reported two cleaning repetitions</text><text x="28" y="81" font-size="17" fill="#596b7d" stroke="none">CS-QD hybrid preparation · source-bound conceptual stage</text><rect x="24" y="112" width="372" height="315" rx="12" fill="#e6f1fa"/><rect x="604" y="112" width="372" height="315" rx="12" fill="#e5f4ed"/><text x="43" y="146" font-size="18" fill="#213446" stroke="none">INPUTS</text><text x="623" y="146" font-size="17" fill="#213446" stroke="none">OUTPUTS / PHYSICAL STATES</text><text x="43" y="179" font-size="18" fill="#213446" stroke="none">redispersed aqueous QD feed</text><text x="43" y="215" font-size="18" fill="#213446" stroke="none">ethanol; amount: not reported</text><text x="43" y="251" font-size="18" fill="#213446" stroke="none">deionized water; amount: not</text><text x="43" y="275" font-size="18" fill="#213446" stroke="none">reported</text><text x="623" y="179" font-size="18" fill="#213446" stroke="none">twice-cleaned aqueous QD feed</text><text x="623" y="203" font-size="18" fill="#213446" stroke="none">[mixture]</text><g stroke="#1c6480" stroke-width="3" fill="none" stroke-linejoin="round"><path d="M429 206q72-71 144 0 M563 187l12 20-24-2 M574 274q-72 71-144 0 M440 294l-12-20 24 2"/><text x="438" y="246" font-size="18" fill="#213446" stroke="none">2 total cycles</text></g><text x="28" y="460" font-size="18" fill="#213446" stroke="none">Complete the reported ethanol precipitation,centrifugation and water redispersion twice in</text><text x="28" y="484" font-size="18" fill="#213446" stroke="none">total,including the illustrated sequence. No extra two cycles or additional feed amount inferred.</text><text x="28" y="521" font-size="18" fill="#213446" stroke="none">cycles: 2 cycles</text><text x="28" y="558" font-size="18" fill="#213446" stroke="none">Environment: not reported. Per-step atmosphere, pressure and unreported hardware are not</text><text x="28" y="582" font-size="18" fill="#213446" stroke="none">inferred.</text><text x="28" y="774" font-size="15" fill="#596b7d" stroke="none">Conceptual illustration; no measured geometry, levels or unreported apparatus inferred.</text><text x="28" y="799" font-size="14" fill="#596b7d" stroke="none">Lin et al.(2011) · Main PDF p.2 / printed p.996, Preparation of CS-QD Hybrid Nanospheres</text></g></svg>