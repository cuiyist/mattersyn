<svg xmlns="http://www.w3.org/2000/svg" width="960" height="653" viewBox="0 0 960 653" role="img"><title>Wash products twice with methanol</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3e778d"/></marker></defs><rect width="960" height="653" fill="#fff"/><g font-family="Arial, sans-serif"><text x="30" y="44" font-size="28" text-anchor="start" fill="#244659">Wash products twice with methanol</text><text x="30" y="84" font-size="21" text-anchor="start" fill="#244659">wash count: 2 count</text><g transform="translate(0 124)"><rect x="238" y="30" width="85" height="132" rx="12" stroke="#47778a" stroke-width="3" fill="#edf5f8"/><path d="M248 120q32.5 12 65 0" fill="none" stroke="#91bbc9" stroke-width="3"/><path d="M367 96L589 96" stroke="#3e778d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="637" y="30" width="85" height="132" rx="12" stroke="#47778a" stroke-width="3" fill="#edf5f8"/><path d="M647 120q32.5 12 65 0" fill="none" stroke="#91bbc9" stroke-width="3"/><text x="480" y="205" font-size="23" text-anchor="middle" fill="#244659">Methanol washing · two reported washes</text></g><text x="30" y="396" font-size="20" text-anchor="start" fill="#244659">Inputs: Stir at 62 °C for 3 h; Methanol</text><text x="30" y="432" font-size="20" text-anchor="start" fill="#244659">Outputs: Wash products twice with methanol</text><text x="30" y="468" font-size="20" text-anchor="start" fill="#244659">Two methanol washes reported; volume and inter-wash separation sequence not detailed.</text><text x="30" y="504" font-size="20" text-anchor="start" fill="#244659">Exact vessel type, size and hardware geometry are not reported; drawing is a qualified</text><text x="30" y="531" font-size="20" text-anchor="start" fill="#244659">schematic.</text><text x="30" y="567" font-size="20" text-anchor="start" fill="#244659">Qualified schematic; dimensions and fill levels are illustrative.</text><text x="30" y="603" font-size="20" text-anchor="start" fill="#244659">Source: SI PDF p.2, Synthesis of ZnO nanoparticles</text></g></svg>