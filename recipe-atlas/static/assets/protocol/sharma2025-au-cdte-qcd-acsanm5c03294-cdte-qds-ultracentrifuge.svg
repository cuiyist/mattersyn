<svg xmlns="http://www.w3.org/2000/svg" width="960" height="750" viewBox="0 0 960 750" role="img"><title>Purify by ultracentrifugation</title><desc>Source-linked conceptual stage; geometry and unreported fields are not measurements.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="750" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#647888">MPA-capped CdTe quantum-dot synthesis</text><text x="30" y="68" font-size="28" text-anchor="start" fill="#234b60">Purify by ultracentrifugation</text><text x="30" y="107" font-size="21" text-anchor="start" fill="#234b60">speed: 70000 rpm</text><text x="30" y="135" font-size="21" text-anchor="start" fill="#234b60">duration: not reported</text><g transform="translate(0 171)"><rect x="122" y="32" width="75" height="130" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M130 127q29.5 9 59 0" fill="none" stroke="#9abfce" stroke-width="4"/><path d="M224 96L357 96" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="480" cy="101" r="77" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><rect x="469" y="38" width="22" height="35" rx="6" fill="#9dbccb" transform="rotate(0 480 101)"/><rect x="469" y="38" width="22" height="35" rx="6" fill="#9dbccb" transform="rotate(90 480 101)"/><rect x="469" y="38" width="22" height="35" rx="6" fill="#9dbccb" transform="rotate(180 480 101)"/><rect x="469" y="38" width="22" height="35" rx="6" fill="#9dbccb" transform="rotate(270 480 101)"/><path d="M603 96L726 96" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="751" y="32" width="75" height="130" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M759 127q29.5 9 59 0" fill="none" stroke="#9abfce" stroke-width="4"/><text x="480" y="234" font-size="22" text-anchor="middle" fill="#234b60">Purified product reported; retained fraction is unspecified</text></g><text x="30" y="465" font-size="20" text-anchor="start" fill="#234b60">Inputs: Inject NaHTe dropwise into the refluxing mixture</text><text x="30" y="501" font-size="20" text-anchor="start" fill="#234b60">Output: Purify by ultracentrifugation</text><text x="30" y="537" font-size="20" text-anchor="start" fill="#234b60">Retained fraction: not reported.</text><text x="30" y="573" font-size="20" text-anchor="start" fill="#234b60">No duration, wash sequence, rotor radius, retained fraction or redispersion volume is stated.</text><text x="30" y="600" font-size="20" text-anchor="start" fill="#234b60">The output is the reported purified product, not an asserted pellet or supernatant.</text><text x="30" y="636" font-size="20" text-anchor="start" fill="#234b60">Generic apparatus cue; vessel dimensions, quantitative liquid level and spatial layout are not</text><text x="30" y="663" font-size="20" text-anchor="start" fill="#234b60">measured source geometry.</text><text x="30" y="699" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.3 §2.3</text></g></svg>