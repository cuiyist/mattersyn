<svg xmlns="http://www.w3.org/2000/svg" width="960" height="923" viewBox="0 0 960 923"><title>Acquire TEM/HRTEM images</title><desc>Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular geometry, or experimental trace is implied. No fabricated spectrum, pattern, micrograph or atomistic specimen is drawn. Instrument geometry is not reconstructed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><rect width="960" height="923" rx="15" fill="#f7fafc"/><text x="30" y="32" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#637f8e">Representative multishell morphology and elemental maps</text><text x="30" y="57" font-family="Arial,sans-serif" font-size="28" text-anchor="start" fill="#173c4a">Acquire TEM/HRTEM images</text><text x="30" y="92" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">accelerating voltage: 200 keV</text><g transform="translate(70 136)"><rect x="240" y="47" width="340" height="188" rx="12" fill="#edf6f8" stroke="#3c6475" stroke-width="3"/><text x="410" y="122" font-family="Arial,sans-serif" font-size="25" text-anchor="middle" fill="#173c4a">TEM / HRTEM</text><text x="410" y="166" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#173c4a">No result drawn</text><text x="410" y="298" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#173c4a">Source data are shown in the cited figures</text></g><text x="30" y="531" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Inputs: InP/ZnSe/ZnS quantum dots</text><text x="30" y="557" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="583" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Outputs: Acquire TEM/HRTEM images</text><text x="30" y="609" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="635" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">JEOL F200 high-resolution TEM at the source-stated 200 keV accelerating voltage. No grid, solvent,</text><text x="30" y="661" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">drop volume or drying preparation is reported. FFT and lattice-profile analysis describe the Figure 2</text><text x="30" y="687" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">specimen.</text><text x="30" y="713" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="739" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular</text><text x="30" y="765" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">geometry, or experimental trace is implied. No fabricated spectrum, pattern, micrograph or atomistic</text><text x="30" y="791" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">specimen is drawn. Instrument geometry is not reconstructed.</text><text x="30" y="817" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="843" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Source: Main PDF pp.3–4, Section 2.2, Instrumentation and Characterization; Main PDF pp.5–6,</text><text x="30" y="869" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Figure 2 and Section 3.1, representative HRTEM, FFT and lattice profiles</text></svg>