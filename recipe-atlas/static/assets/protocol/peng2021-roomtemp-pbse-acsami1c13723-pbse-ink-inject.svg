<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img"><title>Rapidly inject 1 mL butylamine</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3e778d"/></marker></defs><rect width="960" height="680" fill="#fff"/><g font-family="Arial, sans-serif"><text x="30" y="44" font-size="28" text-anchor="start" fill="#244659">Rapidly inject 1 mL butylamine</text><text x="30" y="84" font-size="21" text-anchor="start" fill="#244659">volume: 1 mL; Environment: nitrogen-filled glovebox</text><g transform="translate(0 124)"><rect x="262" y="3" width="436" height="193" rx="15" fill="#f4f8fa" stroke="#47778a" stroke-width="3"/><rect x="440" y="61" width="80" height="112" rx="12" stroke="#47778a" stroke-width="3" fill="#edf5f8"/><path d="M450 131q30.0 12 60 0" fill="none" stroke="#91bbc9" stroke-width="3"/><text x="480" y="37" font-size="24" text-anchor="middle" fill="#244659">N₂-filled glovebox</text><path d="M378 84L427 84" stroke="#3e778d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="355" y="111" font-size="18" text-anchor="middle" fill="#244659">Addition</text><text x="480" y="224" font-size="21" text-anchor="middle" fill="#244659">Container geometry unspecified</text></g><text x="30" y="396" font-size="20" text-anchor="start" fill="#244659">Inputs: Dissolve the selenium precursor and PbI2 in DMF; Butylamine, source isomer unspecified</text><text x="30" y="432" font-size="20" text-anchor="start" fill="#244659">Outputs: Rapidly inject 1 mL butylamine</text><text x="30" y="468" font-size="20" text-anchor="start" fill="#244659">Rapid injection after complete dissolution; rate not numerically reported. Main p.2 reports</text><text x="30" y="495" font-size="20" text-anchor="start" fill="#244659">immediate yellow-to-black color change.</text><text x="30" y="531" font-size="20" text-anchor="start" fill="#244659">Exact vessel type, size and hardware geometry are not reported; drawing is a qualified</text><text x="30" y="558" font-size="20" text-anchor="start" fill="#244659">schematic.</text><text x="30" y="594" font-size="20" text-anchor="start" fill="#244659">Qualified schematic; dimensions and fill levels are illustrative.</text><text x="30" y="630" font-size="20" text-anchor="start" fill="#244659">Source: SI PDF p.2, Room-temperature Synthesis of PbSe QD inks</text></g></svg>