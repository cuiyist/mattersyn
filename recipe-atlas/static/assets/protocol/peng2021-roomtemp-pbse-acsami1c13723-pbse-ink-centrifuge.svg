<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img"><title>Centrifuge at 8000 rpm for 5 min and recover QD solids</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3e778d"/></marker></defs><rect width="960" height="680" fill="#fff"/><g font-family="Arial, sans-serif"><text x="30" y="44" font-size="28" text-anchor="start" fill="#244659">Centrifuge at 8000 rpm for 5 min and recover QD solids</text><text x="30" y="84" font-size="21" text-anchor="start" fill="#244659">speed: 8000 rpm; duration: 5 min</text><g transform="translate(0 124)"><rect x="160" y="39" width="76" height="123" rx="12" stroke="#47778a" stroke-width="3" fill="#edf5f8"/><path d="M170 120q28.0 12 56 0" fill="none" stroke="#91bbc9" stroke-width="3"/><path d="M274 103L364 103" stroke="#3e778d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="480" cy="103" r="77" fill="#edf5f8" stroke="#47778a" stroke-width="3"/><rect x="470" y="42" width="20" height="32" rx="5" fill="#9dbfcf" transform="rotate(0 480 103)"/><rect x="470" y="42" width="20" height="32" rx="5" fill="#9dbfcf" transform="rotate(90 480 103)"/><rect x="470" y="42" width="20" height="32" rx="5" fill="#9dbfcf" transform="rotate(180 480 103)"/><rect x="470" y="42" width="20" height="32" rx="5" fill="#9dbfcf" transform="rotate(270 480 103)"/><path d="M592 103L682 103" stroke="#3e778d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="719" y="39" width="76" height="123" rx="12" stroke="#47778a" stroke-width="3" fill="#edf5f8"/><path d="M729 120q28.0 12 56 0" fill="none" stroke="#91bbc9" stroke-width="3"/><path d="M730 145h54" stroke="#52788b" stroke-width="9"/><text x="756" y="199" font-size="20" text-anchor="middle" fill="#244659">Retain precipitated solids</text></g><text x="30" y="396" font-size="20" text-anchor="start" fill="#244659">Inputs: Precipitate the QDs using toluene</text><text x="30" y="432" font-size="20" text-anchor="start" fill="#244659">Outputs: Centrifuge at 8000 rpm for 5 min and recover QD solids</text><text x="30" y="468" font-size="20" text-anchor="start" fill="#244659">Subsequent step explicitly uses the obtained QD solids; retained fraction is the precipitated</text><text x="30" y="495" font-size="20" text-anchor="start" fill="#244659">solids. Rotor radius and equivalent RCF not reported.</text><text x="30" y="531" font-size="20" text-anchor="start" fill="#244659">Exact vessel type, size and hardware geometry are not reported; drawing is a qualified</text><text x="30" y="558" font-size="20" text-anchor="start" fill="#244659">schematic.</text><text x="30" y="594" font-size="20" text-anchor="start" fill="#244659">Qualified schematic; dimensions and fill levels are illustrative.</text><text x="30" y="630" font-size="20" text-anchor="start" fill="#244659">Source: SI PDF p.2, Room-temperature Synthesis of PbSe QD inks</text></g></svg>