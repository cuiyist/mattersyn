<svg xmlns="http://www.w3.org/2000/svg" width="960" height="707" viewBox="0 0 960 707" role="img" aria-labelledby="title desc"><title id="title">Centrifuge and retain the precipitate</title><desc id="desc">Vessel dimensions and geometry are not reported for this operation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><g font-family="Arial,sans-serif"><rect width="960" height="707" rx="16" fill="#f7fafb"/><text x="28" y="42" font-size="27" text-anchor="start" fill="#274c60">Centrifuge and retain the precipitate</text><text x="28" y="77" font-size="20" text-anchor="start" fill="#274c60">speed: 2500 rpm; duration: 10 min</text><g transform="translate(0 133)"><rect x="192" y="88" width="76" height="124" rx="7" fill="#eef6f8" stroke="#477081" stroke-width="3"/><path d="M192 105h76M199 183q31.0 10 62 0" fill="none" stroke="#a0c1d0" stroke-width="3"/><path d="M292 151L365 151" fill="none" stroke="#477e91" stroke-width="3" marker-end="url(#arrow)"/><circle cx="480" cy="151" r="78" fill="#edf5f8" stroke="#466c7d" stroke-width="3"/><rect x="468" y="90" width="24" height="39" rx="4" fill="#a9c7d3" transform="rotate(0 480 151)"/><rect x="468" y="90" width="24" height="39" rx="4" fill="#a9c7d3" transform="rotate(90 480 151)"/><rect x="468" y="90" width="24" height="39" rx="4" fill="#a9c7d3" transform="rotate(180 480 151)"/><rect x="468" y="90" width="24" height="39" rx="4" fill="#a9c7d3" transform="rotate(270 480 151)"/><path d="M596 151L675 151" fill="none" stroke="#477e91" stroke-width="3" marker-end="url(#arrow)"/><rect x="708" y="88" width="76" height="124" rx="7" fill="#eef6f8" stroke="#477081" stroke-width="3"/><path d="M708 105h76M715 183q31.0 10 62 0" fill="none" stroke="#a0c1d0" stroke-width="3"/><text x="480" y="285" font-size="23" text-anchor="middle" fill="#274c60">Centrifugation · retain precipitate</text></g><text x="28" y="545" font-size="20" text-anchor="start" fill="#274c60">Inputs: Precipitate with methanol and 1-butanol in a 1:3 mixture</text><text x="28" y="572" font-size="20" text-anchor="start" fill="#274c60">Outputs: Centrifuge and retain the precipitate</text><text x="28" y="599" font-size="20" text-anchor="start" fill="#274c60">Vessel dimensions and geometry are not reported for this operation.</text><text x="28" y="626" font-size="20" text-anchor="start" fill="#274c60">Schematic action illustration. Drawn shapes, dimensions and fill levels are illustrative; only</text><text x="28" y="653" font-size="20" text-anchor="start" fill="#274c60">stated source dimensions are quantitative.</text></g></svg>
