<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 884" width="1040" height="884" role="img"><title>Grow the InP stem for 60 min</title><desc>Au-assisted VLS growth in the Riber C-21 CBE system on InP(100). All precursor pressures are measured gas-line pressures used as flux references, not chamber total pressure, gas dose or molar concentration. Substrate temperature is measured by pyrometer and cross-checked with the manipulator thermocouple; overall accuracy is ±10 °C. Qualified CBE chamber/substrate schematic; no unreported chamber shape, gas manifold, heater geometry or liquid reaction vessel is asserted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#217e92"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1040" height="884" rx="18" fill="#fbfdfe"/><text x="44" y="42" fill="#486572" font-size="17" font-weight="700">BUCCI ET AL. · 2024 / inp-stem</text><text x="44" y="77" fill="#183647" font-size="28" font-weight="700">Grow the InP stem for 60 min</text><text x="44" y="118" fill="#217e92" font-size="17" font-weight="700">STAGE 2  ·  Chemical beam epitaxy</text><g transform="translate(0 138)"><rect x="320" y="20" width="390" height="205" rx="18" fill="#f1f7f9" stroke="#8ba4ae" stroke-width="2"/><text x="352" y="54" fill="#233947" font-size="21" font-weight="700">CBE process region</text><rect x="369" y="155" width="290" height="20" rx="8" fill="#a3bdc7" stroke="#5c7785" stroke-width="2"/><text x="377" y="204" fill="#233947" font-size="18" font-weight="400">Substrate / specimen</text><text x="98" y="78" fill="#233947" font-size="22" font-weight="700">TMIn</text><path d="M195,71 L345,132" fill="none" stroke="#217e92" stroke-width="3" marker-end="url(#arrow)"/><text x="98" y="130" fill="#233947" font-size="22" font-weight="700">TBP</text><path d="M195,123 L345,139" fill="none" stroke="#217e92" stroke-width="3" marker-end="url(#arrow)"/><text x="343" y="249" fill="#536977" font-size="17" font-weight="400">Functional cue; no apparatus dimensions</text></g><path d="M44,417 H996" stroke="#cfdee4"/><text x="44" y="433" fill="#486572" font-size="17" font-weight="700">REPORTED CONDITIONS AND LIMITS</text><text x="52" y="463" fill="#233947" font-size="20" font-weight="400">Duration: 60 min</text><text x="52" y="491" fill="#233947" font-size="20" font-weight="400">Temperature: 390 ± 10 °C (±10 °C)</text><text x="52" y="519" fill="#233947" font-size="20" font-weight="400">TMIn line pressure: 0.4 Torr</text><text x="52" y="547" fill="#233947" font-size="20" font-weight="400">TBP line pressure: 0.65 Torr</text><text x="44" y="584" fill="#8c4f27" font-size="19" font-weight="700">Precursor pressures are gas-LINE pressures used as flux references.</text><text x="44" y="618" fill="#486572" font-size="17" font-weight="700">SOURCE QUALIFICATION</text><text x="44" y="648" fill="#233947" font-size="19" font-weight="400">Au-assisted VLS growth in the Riber C-21 CBE system on InP(100). All precursor pressures are measured</text><text x="44" y="675" fill="#233947" font-size="19" font-weight="400">gas-line pressures used as flux references, not chamber total pressure, gas dose or molar concentration.</text><text x="44" y="702" fill="#233947" font-size="19" font-weight="400">Substrate temperature is measured by pyrometer and cross-checked with the manipulator thermocouple;</text><text x="44" y="729" fill="#233947" font-size="19" font-weight="400">overall accuracy is ±10 °C.</text><text x="44" y="770" fill="#536977" font-size="17" font-weight="400">Qualified CBE chamber/substrate schematic; no unreported chamber shape, gas manifold, heater geometry or liquid reaction</text><text x="44" y="795" fill="#536977" font-size="17" font-weight="400">vessel is asserted. Functional symbols only; no measured specimen geometry or apparatus layout.</text><text x="44" y="832" fill="#536977" font-size="16" font-weight="400">Main PDF p.3, Section 3.1, steps (i)–(v)</text></g></svg>