<svg xmlns="http://www.w3.org/2000/svg" width="960" height="817" viewBox="0 0 960 817" role="img"><title>Immerse again in 40 mM TiCl4 at 100 °C for 1 h</title><desc>Source-linked stage schematic. No unreported equipment dimensions or solution species are asserted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="817" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="34" font-size="18" text-anchor="start" fill="#647888">Composite TiO2/FTO support preparation</text><text x="30" y="73" font-size="28" text-anchor="start" fill="#234b60">Immerse again in 40 mM TiCl4 at 100 °C for 1 h</text><text x="30" y="112" font-size="21" text-anchor="start" fill="#234b60">bath concentration: 40 mM</text><text x="30" y="140" font-size="21" text-anchor="start" fill="#234b60">temperature: 100 degC</text><text x="30" y="168" font-size="21" text-anchor="start" fill="#234b60">duration: 1 h</text><g transform="translate(0 202)"><rect x="271" y="55" width="420" height="132" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><rect x="335" y="115" width="292" height="22" fill="#cadde7" stroke="#557f91" stroke-width="3"/><path d="M343 108h276" stroke="#ac8d48" stroke-width="7"/><text x="480" y="30" font-size="22" text-anchor="middle" fill="#234b60">Container not restated for this bath</text><text x="480" y="222" font-size="21" text-anchor="middle" fill="#234b60">Bath dimensions and solution volume unreported</text></g><text x="30" y="542" font-size="20" text-anchor="start" fill="#234b60">Inputs: Grow vertically aligned TiO2 rods at 150 °C for 4 h; Titanium tetrachloride precursor</text><text x="30" y="569" font-size="20" text-anchor="start" fill="#234b60">for aqueous bath</text><text x="30" y="605" font-size="20" text-anchor="start" fill="#234b60">Output: Immerse again in 40 mM TiCl4 at 100 °C for 1 h</text><text x="30" y="641" font-size="20" text-anchor="start" fill="#234b60">Second TiCl4 treatment; aqueous identity established for initial bath but not separately</text><text x="30" y="668" font-size="20" text-anchor="start" fill="#234b60">restated here. Bath volume and subsequent rinse not supplied.</text><text x="30" y="704" font-size="20" text-anchor="start" fill="#234b60">Apparatus dimensions, liquid level and spatial layout are schematic, not measured source</text><text x="30" y="731" font-size="20" text-anchor="start" fill="#234b60">geometry.</text><text x="30" y="767" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.2 §2.3</text></g></svg>