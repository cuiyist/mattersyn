"520" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Inputs: Stir at room temperature for 12–16 h; Methanol</text><text x="25" y="547" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Outputs: Centrifuge and wash with excess methanol; repeat twice</text><text x="25" y="574" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Illustrative action only. Vessel shape, capacity and drawing dimensions are not</text><text x="25" y="601" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">source measurements. Rotor geometry, speed and duration are not inferred.</text></svg>