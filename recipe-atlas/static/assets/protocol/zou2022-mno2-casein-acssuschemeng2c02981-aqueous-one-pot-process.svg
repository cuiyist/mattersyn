<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">Casein-directed aqueous MnO2 quantum dot preparation</title><desc id="d">Authored conceptual process; vessels and particles are not measured geometry. Main PDF p2 supplies the steps.</desc><rect width="1000" height="360" rx="24" fill="#f5faf9"/><text x="40" y="45" font-family="Arial,sans-serif" font-size="24" fill="#13394a">Casein-directed MnO₂ quantum dots</text><g font-family="Arial,sans-serif" fill="#174659"><text x="50" y="98" font-size="18">1. Disperse &amp; hydrate</text><text x="50" y="124" font-size="15">Water · stirring · 60 °C</text><text x="50" y="146" font-size="15">then 4 °C overnight</text><text x="367" y="98" font-size="18">2. Adjust &amp; add</text><text x="367" y="124" font-size="15">pH 11 · casein 2 mg/mL final</text><text x="367" y="146" font-size="15">1 mL 10 mM KMnO₄ · dropwise</text><text x="692" y="98" font-size="18">3. Dialyze &amp; store</text><text x="692" y="124" font-size="15">Deionized water</text><text x="692" y="146" font-size="15">Store product at 4 °C</text></g><g fill="none" stroke="#377e91" stroke-width="4"><path d="M280 188h55m-10-10 10 10-10 10M615 188h55m-10-10 10 10-10 10"/><path d="M83 210h175v84H83zM404 210h175v84H404zM730 210h175v84H730z"/></g><path d="M84 260q85-22 173 0v33H84zM405 257q85-32 173 0v36H405zM731 259q85-20 173 0v34H731z" fill="#b7dede"/><g fill="#785eaf"><circle cx="446" cy="244" r="7"/><circle cx="485" cy="264" r="7"/><circle cx="542" cy="238" r="7"/></g><g fill="#be824a"><circle cx="766" cy="265" r="7"/><circle cx="806" cy="249" r="7"/><circle cx="843" cy="270" r="7"/></g><text x="40" y="331" font-family="Arial,sans-serif" font-size="14" fill="#49656f">Experimental completion time and total reaction volume unreported · conceptual equipment and particle marks</text></svg>