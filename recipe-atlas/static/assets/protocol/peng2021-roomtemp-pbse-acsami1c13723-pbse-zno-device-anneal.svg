<svg xmlns="http://www.w3.org/2000/svg" width="960" height="653" viewBox="0 0 960 653" role="img"><title>Anneal PbSe/ZnO devices at 70 °C for 10 min</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3e778d"/></marker></defs><rect width="960" height="653" fill="#fff"/><g font-family="Arial, sans-serif"><text x="30" y="44" font-size="28" text-anchor="start" fill="#244659">Anneal PbSe/ZnO devices at 70 °C for 10 min</text><text x="30" y="84" font-size="21" text-anchor="start" fill="#244659">temperature: 70 degC; duration: 10 min</text><g transform="translate(0 124)"><rect x="277" y="105" width="406" height="32" rx="3" fill="#d5e3e9" stroke="#47778a" stroke-width="3"/><text x="480" y="54" font-size="26" text-anchor="middle" fill="#244659">Thermal treatment</text><text x="480" y="206" font-size="21" text-anchor="middle" fill="#244659">Heater design not reconstructed</text></g><text x="30" y="396" font-size="20" text-anchor="start" fill="#244659">Inputs: Spincoat 40 µL of 100 mg/mL PbSe ink onto ZnO device</text><text x="30" y="432" font-size="20" text-anchor="start" fill="#244659">Outputs: Anneal PbSe/ZnO devices at 70 °C for 10 min</text><text x="30" y="468" font-size="20" text-anchor="start" fill="#244659">Annealing atmosphere and exact heater design unreported.</text><text x="30" y="504" font-size="20" text-anchor="start" fill="#244659">Exact vessel type, size and hardware geometry are not reported; drawing is a qualified</text><text x="30" y="531" font-size="20" text-anchor="start" fill="#244659">schematic.</text><text x="30" y="567" font-size="20" text-anchor="start" fill="#244659">Qualified schematic; dimensions and fill levels are illustrative.</text><text x="30" y="603" font-size="20" text-anchor="start" fill="#244659">Source: Main PDF p.2, Photodetector Fabrication and Measurement</text></g></svg>