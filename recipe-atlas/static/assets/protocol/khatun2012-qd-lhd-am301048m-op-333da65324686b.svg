<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="837" viewBox="0 0 1100 837"><rect width="1100" height="837" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="42" font-size="27" font-weight="bold" fill="#173047">01 Heat the core precursor mixture</text><text x="28" y="91" font-size="17" font-weight="normal" fill="#596b7d">primary reported preparation</text><g transform="translate(0 101)"><g transform="translate(875 0)" stroke="#1b6986" fill="none" stroke-width="3" stroke-linejoin="round"><path d="M40 90h84 M50 73c-17-17 17-22 0-44 M81 73c-17-17 17-22 0-44 M112 73c-17-17 17-22 0-44"/></g></g><text x="28" y="136" font-size="23" font-weight="normal" fill="#135d83">Heating / reaction • conceptual action symbol</text><rect x="26" y="223" width="500" height="337" rx="12" fill="#e6f1fa"/><text x="42" y="261" font-size="19" font-weight="bold" fill="#173047">INPUTS</text><text x="42" y="296" font-size="20" font-weight="normal" fill="#173047">cadmium oxide</text><text x="42" y="327" font-size="18" font-weight="normal" fill="#173047">amount: 0.1 mmol</text><text x="42" y="371" font-size="20" font-weight="normal" fill="#173047">4,4-prime-oxydiphthalic dianhydride (ODPA), as</text><text x="42" y="398" font-size="20" font-weight="normal" fill="#173047">printed</text><text x="42" y="429" font-size="18" font-weight="normal" fill="#173047">amount: 0.205 mmol</text><text x="42" y="473" font-size="20" font-weight="normal" fill="#173047">trioctylamine (TOA)</text><text x="42" y="504" font-size="18" font-weight="normal" fill="#173047">volume: 10 mL</text><rect x="572" y="223" width="500" height="337" rx="12" fill="#e5f4ed"/><text x="588" y="261" font-size="19" font-weight="bold" fill="#173047">OUTPUTS / PHYSICAL STATES</text><text x="588" y="296" font-size="20" font-weight="normal" fill="#173047">clear hot CdO/ODPA/TOA reaction mixture</text><text x="588" y="327" font-size="18" font-weight="normal" fill="#173047">Kind: reaction_batch</text><text x="28" y="598" font-size="21" font-weight="normal" fill="#173047">Heat CdO0.10mmol, source-named ODPA0.205mmol and TOA10mL to a clear solution at300C under argon.</text><text x="28" y="639" font-size="21" font-weight="normal" fill="#173047">temperature: 300 degC</text><text x="28" y="680" font-size="21" font-weight="normal" fill="#173047">Environment: argon</text><text x="28" y="721" font-size="21" font-weight="normal" fill="#173047">Endpoint: clear solution</text><text x="28" y="762" font-size="15" font-weight="normal" fill="#596b7d">Conceptual and not to scale; no unreported apparatus geometry, liquid levels or handling atmosphere inferred.</text><text x="28" y="792" font-size="15" font-weight="normal" fill="#596b7d">Khatun et al. (2012) • Main PDF p.2 / printed p.3881, Section 2.3, near-infrared quantum-dot synthesis</text></g></svg>