<svg xmlns="http://www.w3.org/2000/svg" width="960" height="734" viewBox="0 0 960 734" role="img"><title>Prepare the plotted 100 mg/mL device variant</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3e778d"/></marker></defs><rect width="960" height="734" fill="#fff"/><g font-family="Arial, sans-serif"><text x="30" y="44" font-size="28" text-anchor="start" fill="#244659">Prepare the plotted 100 mg/mL device variant</text><text x="30" y="84" font-size="21" text-anchor="start" fill="#244659">mass concentration: 100 mg/mL</text><g transform="translate(0 124)"><rect x="277" y="105" width="406" height="32" rx="3" fill="#d5e3e9" stroke="#47778a" stroke-width="3"/><ellipse cx="480" cy="150" rx="158" ry="16" fill="none" stroke="#91bbc9" stroke-width="3"/><path d="M492 22q-24 30-24 40a15 15 0 0 0 30 0q0-10-6-40" fill="#91bbc9"/><path d="M630 170L672 151" stroke="#3e778d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="480" y="213" font-size="22" text-anchor="middle" fill="#244659">Spin coating; speed/time unspecified</text></g><text x="30" y="396" font-size="20" text-anchor="start" fill="#244659">Inputs: Directly synthesized iodide-passivated PbSe ink in DMF; ZnO-coated SiO2/Si with Ti/Au</text><text x="30" y="423" font-size="20" text-anchor="start" fill="#244659">electrodes</text><text x="30" y="459" font-size="20" text-anchor="start" fill="#244659">Outputs: Prepare the plotted 100 mg/mL device variant</text><text x="30" y="495" font-size="20" text-anchor="start" fill="#244659">Figure fixes solution concentration only. Variant dilution, dispense volume, spinning,</text><text x="30" y="522" font-size="20" text-anchor="start" fill="#244659">annealing and physical batch are not separately stated; 40 µL and 70 °C, 10 min are not copied</text><text x="30" y="549" font-size="20" text-anchor="start" fill="#244659">as independently reported variant settings.</text><text x="30" y="585" font-size="20" text-anchor="start" fill="#244659">Exact vessel type, size and hardware geometry are not reported; drawing is a qualified</text><text x="30" y="612" font-size="20" text-anchor="start" fill="#244659">schematic.</text><text x="30" y="648" font-size="20" text-anchor="start" fill="#244659">Qualified schematic; dimensions and fill levels are illustrative.</text><text x="30" y="684" font-size="20" text-anchor="start" fill="#244659">Source: SI PDF p.5, Figure S3</text></g></svg>