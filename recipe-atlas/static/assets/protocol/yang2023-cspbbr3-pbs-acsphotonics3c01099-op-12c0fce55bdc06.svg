rted.</text><text x="32" y="773" font-size="15" fill="#596b7d">Atmosphere / pressure: not reported. Icons do not specify vessel type, size or fill level.</text><text x="32" y="799" font-size="14" fill="#596b7d">Source: Yang et al. (2023), main PDF p.7; room-temperature context p.2.</text></g></svg>