<svg xmlns="http://www.w3.org/2000/svg" width="820" height="624" viewBox="0 0 820 624"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><rect width="820" height="624" rx="16" fill="#f5f9fb"/><text x="25" y="41" font-family="Arial,sans-serif" font-size="26" text-anchor="start" fill="#173c4a">Remove precipitated DCU by vacuum filtration</text><g transform="translate(0 101)"><path d="M285 40h230l-86 88v54h-58v-54z" fill="#e6f1f5" stroke="#3c6475" stroke-width="3"/><path d="M312 65h176" stroke="#95b8c9" stroke-width="5"/><path d="M371 190h58v25l65 87H306l65-87zM429 219h71v-47" fill="#eef6f8" stroke="#3c6475" stroke-width="3"/><path d="M511 172L584 172" fill="none" stroke="#477e91" stroke-width="4" marker-end="url(#arrow)"/><text x="599" y="179" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Vacuum</text><text x="398" y="337" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#173c4a">Vacuum filtration cue</text></g><text x="25" y="488" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Inputs: Add NHS and DCC simultaneously and stir overnight</text><text x="25" y="515" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Outputs: Remove precipitated DCU by vacuum filtration</text><text x="25" y="542" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Illustrative action only. Vessel shape, capacity and drawing dimensions are not</text><text x="25" y="569" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">source measurements. Filter type, pore size and pressure are unreported.</text></svg>