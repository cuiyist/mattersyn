<svg xmlns="http://www.w3.org/2000/svg" width="840" height="470" viewBox="0 0 840 470"><title>Allow powders to precipitate</title><desc>Keep the irradiated solution for several hours to precipitate powders. No exact duration is given; this standing interval is separate from the irradiation time. Source-bound concept; no physical apparatus geometry is established.</desc><rect width="840" height="470" rx="20" fill="#f1f7fa"/><g font-family="Arial"><text x="28" y="42" font-size="24" fill="#183d49">Allow powders to precipitate</text><text x="28" y="134" font-size="19" fill="#2f5866">After irradiation: several hours</text><text x="28" y="166" font-size="19" fill="#2f5866">Black powder precipitates</text><text x="28" y="198" font-size="19" fill="#2f5866">No exact duration inferred</text><rect x="552" y="120" width="222" height="176" rx="18" fill="none" stroke="#387282" stroke-width="3"/><circle cx="663" cy="183" r="39" fill="none" stroke="#387282" stroke-width="3"/><path d="M663 154 V183 L684 196" fill="none" stroke="#387282" stroke-width="3"/><text x="574" y="273" font-size="18" fill="#387282">Qualitative interval</text><text x="28" y="368" font-size="18" fill="#496773">Successful ethylenediamine route</text><text x="28" y="417" font-size="17" fill="#496773">Source-bound concept; no vessel, dimensions or fill levels inferred.</text><text x="28" y="449" font-size="17" fill="#496773">Xie et al. 1999 · Exact source locators and limits in the protocol</text></g></svg>