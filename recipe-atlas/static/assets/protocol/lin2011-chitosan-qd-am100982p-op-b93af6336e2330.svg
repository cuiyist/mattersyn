<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830"><rect width="1000" height="830" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="27" y="42" font-size="25" fill="#213446" stroke="none">07  Gradually inject shell precursor premix</text><text x="28" y="81" font-size="17" fill="#596b7d" stroke="none">QD preparation · source-bound conceptual stage</text><rect x="24" y="112" width="372" height="315" rx="12" fill="#e6f1fa"/><rect x="604" y="112" width="372" height="315" rx="12" fill="#e5f4ed"/><text x="43" y="146" font-size="18" fill="#213446" stroke="none">INPUTS</text><text x="623" y="146" font-size="17" fill="#213446" stroke="none">OUTPUTS / PHYSICAL STATES</text><text x="43" y="179" font-size="18" fill="#213446" stroke="none">core reaction mixture cooled for</text><text x="43" y="203" font-size="18" fill="#213446" stroke="none">shell addition</text><text x="43" y="239" font-size="18" fill="#213446" stroke="none">Zn(Et)2/(TMS)2S premix in TOP</text><text x="623" y="179" font-size="18" fill="#213446" stroke="none">reaction mixture after shell</text><text x="623" y="203" font-size="18" fill="#213446" stroke="none">precursor addition [mixture]</text><g stroke="#1c6480" stroke-width="3" fill="none" stroke-linejoin="round"><path d="M461 174h77v35h-77z M499 209v42 M489 239l10 14 10-14 M449 280h100 M549 273l12 7-12 7"/><text x="428" y="330" font-size="16" fill="#213446" stroke="none">Source addition</text><text x="415" y="354" font-size="15" fill="#213446" stroke="none">Rate only as stated</text></g><text x="28" y="460" font-size="18" fill="#213446" stroke="none">After cooling to 200 C, gradually inject shell premix over 3min. A constant temperature</text><text x="28" y="484" font-size="18" fill="#213446" stroke="none">throughout injection is not separately specified.</text><text x="28" y="521" font-size="18" fill="#213446" stroke="none">duration: 3 min</text><text x="28" y="558" font-size="18" fill="#213446" stroke="none">starting temperature: 200 degC — Reported pre-injection temperature; no temperature trajectory</text><text x="28" y="582" font-size="18" fill="#213446" stroke="none">inferred.</text><text x="28" y="619" font-size="18" fill="#213446" stroke="none">Environment: not reported. Per-step atmosphere, pressure and unreported hardware are not</text><text x="28" y="643" font-size="18" fill="#213446" stroke="none">inferred.</text><text x="28" y="774" font-size="15" fill="#596b7d" stroke="none">Conceptual illustration; no measured geometry, levels or unreported apparatus inferred.</text><text x="28" y="799" font-size="14" fill="#596b7d" stroke="none">Lin et al.(2011) · Main PDF p.2 / printed p.996, Synthesis of CdSe/ZnS QDs</text></g></svg>