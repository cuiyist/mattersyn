<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850"><rect width="1000" height="850" fill="#f8fbfd"/><style>text{stroke:none}</style><g font-family="Arial,sans-serif"><text x="28" y="41" font-size="25" fill="#213446">10  Heat TNTAs in air for crystallization</text><text x="28" y="83" font-size="17" fill="#596b7d">Sonication-CdS/TNTAs · conceptual source-bound process</text><rect x="24" y="115" width="372" height="300" rx="12" fill="#e6f1fa"/><rect x="604" y="115" width="372" height="300" rx="12" fill="#e5f4ed"/><text x="43" y="148" font-size="18" fill="#213446">INPUTS</text><text x="623" y="148" font-size="17" fill="#213446">OUTPUTS / PHYSICAL STATES</text><text x="43" y="180" font-size="18" fill="#213446">arrays after sonication removal of</text><text x="43" y="204" font-size="18" fill="#213446">surface debris</text><text x="623" y="180" font-size="18" fill="#213446">crystallized TNTAs before CdS</text><text x="623" y="204" font-size="18" fill="#213446">deposition [product]</text><g stroke="#1c6480" stroke-width="3.5" fill="none" stroke-linejoin="round"><rect x="438" y="170" width="120" height="120" rx="6"/><path d="M455 264h86 M460 249q-10-15 0-30 M498 249q-10-15 0-30 M536 249q-10-15 0-30"/><text x="478" y="192" font-size="16" fill="#213446">Air</text></g><text x="421" y="365" font-size="15" fill="#213446">Schematic only;</text><text x="406" y="386" font-size="15" fill="#213446">no vessel dimensions</text><text x="28" y="445" font-size="18" fill="#213446">Heat at 400 C for 3 h with ramp1 C/min in air before CdS deposition. Furnace type, cooling</text><text x="28" y="469" font-size="18" fill="#213446">procedure and gas flow are unreported.</text><text x="28" y="515" font-size="17" fill="#213446">temperature: 400 degC</text><text x="28" y="543" font-size="17" fill="#213446">duration: 3 h</text><text x="28" y="571" font-size="17" fill="#213446">ramp rate: 1 degC/min</text><text x="28" y="599" font-size="17" fill="#213446">Environment: air. Source-stated atmosphere; flow and pressure unreported.</text><text x="28" y="799" font-size="15" fill="#596b7d">No inferred liquid levels, sonication power, geometry or solution species.</text><text x="28" y="825" font-size="14" fill="#596b7d">Source: Xie et al.(2010), main Methods2.2–2.3; explicit cycle order3.1/SI FigureS1.</text></g></svg>