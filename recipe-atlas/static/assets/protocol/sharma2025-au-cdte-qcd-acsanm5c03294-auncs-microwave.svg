<svg xmlns="http://www.w3.org/2000/svg" width="960" height="770" viewBox="0 0 960 770" role="img"><title>Microwave at 100 W and 120 °C for 4 min</title><desc>Source-linked conceptual stage; geometry and unreported fields are not measurements.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="770" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#647888">Microwave GSH-Au nanocluster synthesis</text><text x="30" y="68" font-size="28" text-anchor="start" fill="#234b60">Microwave at 100 W and 120 °C for 4 min</text><text x="30" y="107" font-size="21" text-anchor="start" fill="#234b60">power: 100 W</text><text x="30" y="135" font-size="21" text-anchor="start" fill="#234b60">temperature: 120 degC</text><text x="30" y="163" font-size="21" text-anchor="start" fill="#234b60">duration: 4 min</text><text x="30" y="191" font-size="21" text-anchor="start" fill="#234b60">Endpoint: dark yellow AuNC dispersion</text><g transform="translate(0 227)"><rect x="288" y="13" width="384" height="194" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><rect x="352" y="41" width="254" height="138" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><rect x="449" y="63" width="60" height="97" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M457 125q22.0 9 44 0" fill="none" stroke="#9abfce" stroke-width="4"/><text x="480" y="249" font-size="21" text-anchor="middle" fill="#234b60">CEM Discover microwave · vessel and pressure not reported</text></g><text x="30" y="521" font-size="20" text-anchor="start" fill="#234b60">Inputs: Combine aqueous gold precursor and GSH</text><text x="30" y="557" font-size="20" text-anchor="start" fill="#234b60">Output: Microwave at 100 W and 120 °C for 4 min</text><text x="30" y="593" font-size="20" text-anchor="start" fill="#234b60">CEM Discover named in instrumentation. No vessel size, pressure, pH, workup or storage</text><text x="30" y="620" font-size="20" text-anchor="start" fill="#234b60">procedure reported.</text><text x="30" y="656" font-size="20" text-anchor="start" fill="#234b60">Generic apparatus cue; vessel dimensions, quantitative liquid level and spatial layout are not</text><text x="30" y="683" font-size="20" text-anchor="start" fill="#234b60">measured source geometry.</text><text x="30" y="719" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.3 §2.4; Main PDF p.2 §2.2</text></g></svg>