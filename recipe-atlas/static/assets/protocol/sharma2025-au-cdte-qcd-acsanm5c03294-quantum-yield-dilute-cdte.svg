<svg xmlns="http://www.w3.org/2000/svg" width="960" height="714" viewBox="0 0 960 714" role="img"><title>Dilute MPA-CdTe QDs for absorbance below 1.0</title><desc>Source-linked conceptual stage; geometry and unreported fields are not measurements.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="714" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#647888">Quantum-yield measurement and reference protocol</text><text x="30" y="68" font-size="28" text-anchor="start" fill="#234b60">Dilute MPA-CdTe QDs for absorbance below 1.0</text><text x="30" y="107" font-size="21" text-anchor="start" fill="#234b60">absorbance limit: below 1.0; strict upper bound; not an exact absorbance</text><text x="30" y="135" font-size="21" text-anchor="start" fill="#234b60">dilution factor: not reported</text><g transform="translate(0 171)"><rect x="171" y="22" width="82" height="134" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M179 121q33.0 9 66 0" fill="none" stroke="#9abfce" stroke-width="4"/><path d="M289 89L403 119" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="435" y="59" width="96" height="140" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M443 164q40.0 9 80 0" fill="none" stroke="#9abfce" stroke-width="4"/><text x="480" y="251" font-size="21" text-anchor="middle" fill="#234b60">Dilution reported; solvent and dilution factor unknown</text></g><text x="30" y="465" font-size="20" text-anchor="start" fill="#234b60">Inputs: MPA-capped CdTe quantum dots; colloidal material</text><text x="30" y="501" font-size="20" text-anchor="start" fill="#234b60">Output: Dilute MPA-CdTe QDs for absorbance below 1.0</text><text x="30" y="537" font-size="20" text-anchor="start" fill="#234b60">Dilution is explicitly reported, but exact factor and solvent are absent. Do not assume ethanol</text><text x="30" y="564" font-size="20" text-anchor="start" fill="#234b60">reference solvent is the sample diluent.</text><text x="30" y="600" font-size="20" text-anchor="start" fill="#234b60">Generic apparatus cue; vessel dimensions, quantitative liquid level and spatial layout are not</text><text x="30" y="627" font-size="20" text-anchor="start" fill="#234b60">measured source geometry.</text><text x="30" y="663" font-size="20" text-anchor="start" fill="#234b60">Source: SI PDF pp.13–14 Tables S2–S3 and QY protocol</text></g></svg>