<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640"><title>Follow the control heating sequence</title><desc>Conceptual operation diagram; only source-stated equipment and conditions apply.</desc><rect x="5" y="5" width="1090" height="630" rx="20" fill="#f4f8fa" stroke="#bed0d8"/><g transform="translate(15 110)" fill="none" stroke="#477184" stroke-width="3.5"><rect x="40" y="70" width="225" height="130" rx="18"/><path d="M65 137h170M212 117l23 20-23 20"/></g><text x="360" y="48" font-family="sans-serif" font-size="25" fill="#183e4d">Follow the control heating sequence</text><text x="360" y="115" font-family="sans-serif" font-size="19" fill="#294f5e">The source legend follows room-temperature stirring for 15 min,</text><text x="360" y="143" font-family="sans-serif" font-size="19" fill="#294f5e">heating under vacuum to 120 °C, 1 h at 120 °C under vacuum, then</text><text x="360" y="171" font-family="sans-serif" font-size="19" fill="#294f5e">180 °C with observations at 0, 10, 30, 60 and 120 min.</text><text x="25" y="590" font-family="sans-serif" font-size="16" fill="#55717d">Conceptual operation diagram; only source-stated equipment and conditions apply.</text></svg>
