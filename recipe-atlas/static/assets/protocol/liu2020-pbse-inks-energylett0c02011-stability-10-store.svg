<svg xmlns="http://www.w3.org/2000/svg" width="960" height="725" viewBox="0 0 960 725" role="img"><title>Observe the aged ink</title><desc>Source-linked conceptual operation. Unreported geometry and quantities are not reconstructed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4d7f93"/></marker></defs><rect width="960" height="725" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#607a89">Colloidal stability at 10 mg/mL</text><text x="30" y="65" font-size="28" text-anchor="start" fill="#254d62">Observe the aged ink</text><text x="30" y="100" font-size="21" text-anchor="start" fill="#254d62">figure age: 180 days</text><g transform="translate(0 138)"><rect x="420" y="20" width="120" height="150" rx="9" fill="#eff5f8" stroke="#587f91" stroke-width="3"/><path d="M432 140q48.0 9 96 0" fill="none" stroke="#9fbfce" stroke-width="4"/><text x="480" y="239" font-size="20" text-anchor="middle" fill="#254d62">Storage / aging context · use the stated environment below</text></g><text x="30" y="422" font-size="20" text-anchor="start" fill="#254d62">Inputs: Prepare the reported ink concentration</text><text x="30" y="458" font-size="20" text-anchor="start" fill="#254d62">Output: Observe the aged ink</text><text x="30" y="494" font-size="20" text-anchor="start" fill="#254d62">Figure 2a compares fresh and 180-day inks. The text says at least half a year without</text><text x="30" y="521" font-size="20" text-anchor="start" fill="#254d62">noticeable aggregation or precipitation. Container, temperature and atmosphere for this</text><text x="30" y="548" font-size="20" text-anchor="start" fill="#254d62">figure are not specified; the separate 15-day air-aging experiment is not silently</text><text x="30" y="575" font-size="20" text-anchor="start" fill="#254d62">transferred.</text><text x="30" y="611" font-size="20" text-anchor="start" fill="#254d62">Qualified action illustration; no unreported vessel dimensions, hardware, measured</text><text x="30" y="638" font-size="20" text-anchor="start" fill="#254d62">molecular geometry, or experimental trace is implied.</text><text x="30" y="674" font-size="20" text-anchor="start" fill="#254d62">Source: Main PDF pp.2–3, Figure 2a and colloidal-stability discussion</text></g></svg>