<svg xmlns="http://www.w3.org/2000/svg" width="960" height="651" viewBox="0 0 960 651" role="img"><title>Compare initial and two-week absorption spectra</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3e778d"/></marker></defs><rect width="960" height="651" fill="#fff"/><g font-family="Arial, sans-serif"><text x="30" y="44" font-size="28" text-anchor="start" fill="#244659">Compare initial and two-week absorption spectra</text><g transform="translate(0 95)"><rect x="320" y="32" width="320" height="154" rx="14" stroke="#47778a" stroke-width="3" fill="#edf5f8"/><text x="480" y="94" font-size="26" text-anchor="middle" fill="#244659">Measurement context</text><text x="480" y="140" font-size="20" text-anchor="middle" fill="#244659">No result or curve invented</text></g><text x="30" y="367" font-size="20" text-anchor="start" fill="#244659">Inputs: Store solution in air for two weeks</text><text x="30" y="403" font-size="20" text-anchor="start" fill="#244659">Outputs: Compare initial and two-week absorption spectra</text><text x="30" y="439" font-size="20" text-anchor="start" fill="#244659">Source curves retained. OA control changes markedly while direct-ink traces nearly overlap; no</text><text x="30" y="466" font-size="20" text-anchor="start" fill="#244659">quantitative stability metric invented.</text><text x="30" y="502" font-size="20" text-anchor="start" fill="#244659">Exact vessel type, size and hardware geometry are not reported; drawing is a qualified</text><text x="30" y="529" font-size="20" text-anchor="start" fill="#244659">schematic.</text><text x="30" y="565" font-size="20" text-anchor="start" fill="#244659">Qualified schematic; dimensions and fill levels are illustrative.</text><text x="30" y="601" font-size="20" text-anchor="start" fill="#244659">Source: SI PDF p.4, Figure S2</text></g></svg>