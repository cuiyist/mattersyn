<svg xmlns="http://www.w3.org/2000/svg" width="960" height="741" viewBox="0 0 960 741" role="img"><title>Acquire Au control EDX spectrum</title><desc>Source-linked conceptual stage; geometry and unreported fields are not measurements.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="741" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#647888">TEM morphology and particle-size controls</text><text x="30" y="68" font-size="28" text-anchor="start" fill="#234b60">Acquire Au control EDX spectrum</text><text x="30" y="107" font-size="21" text-anchor="start" fill="#234b60">source image accelerating voltage: not reported; No accelerating-voltage footer is</text><text x="30" y="135" font-size="21" text-anchor="start" fill="#234b60">visible for this control panel.</text><g transform="translate(0 171)"><rect x="275" y="30" width="410" height="165" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><text x="480" y="92" font-size="27" text-anchor="middle" fill="#234b60">EDX control spectrum</text><text x="480" y="145" font-size="19" text-anchor="middle" fill="#234b60">Specimen preparation unknown</text><text x="480" y="245" font-size="20" text-anchor="middle" fill="#234b60">Instrument cue; unreported specimen preparation remains unknown</text></g><text x="30" y="465" font-size="20" text-anchor="start" fill="#234b60">Inputs: GSH-capped Au nanoclusters; colloidal material</text><text x="30" y="501" font-size="20" text-anchor="start" fill="#234b60">Output: Acquire Au control EDX spectrum</text><text x="30" y="537" font-size="20" text-anchor="start" fill="#234b60">Source-labelled control EDX spectrum. Exact aliquot, grid or substrate preparation and physical</text><text x="30" y="564" font-size="20" text-anchor="start" fill="#234b60">batch are unreported. Atomic and weight fractions remain separate; neither is a precursor-feed</text><text x="30" y="591" font-size="20" text-anchor="start" fill="#234b60">amount.</text><text x="30" y="627" font-size="20" text-anchor="start" fill="#234b60">Generic EDX instrument cue only; detector, specimen support and acquisition geometry are not</text><text x="30" y="654" font-size="20" text-anchor="start" fill="#234b60">supplied. No TEM specimen identity or atomic model is inferred.</text><text x="30" y="690" font-size="20" text-anchor="start" fill="#234b60">Source: SI PDF p.4 Figure S1(i)</text></g></svg>