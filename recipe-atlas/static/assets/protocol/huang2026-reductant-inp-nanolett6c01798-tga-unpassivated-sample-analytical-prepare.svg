<svg xmlns="http://www.w3.org/2000/svg" width="960" height="706" viewBox="0 0 960 706" role="img" aria-labelledby="title desc"><title id="title">Place the unpassivated MSC-R specimen in an alumina crucible</title><desc id="desc">Placement of the unpassivated specimen in an alumina crucible is shown schematically. Crucible dimensions and specimen mass are not reported.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><g font-family="Arial,sans-serif"><rect width="960" height="706" rx="16" fill="#f7fafb"/><text x="28" y="42" font-size="27" text-anchor="start" fill="#274c60">Place the unpassivated MSC-R specimen in an alumina crucible</text><g transform="translate(0 105)"><text x="251" y="68" font-size="23" text-anchor="middle" fill="#274c60">Unpassivated MSC-R</text><path d="M187 125h124v57H187z" fill="#cadbe4" stroke="#477081" stroke-width="3"/><text x="249" y="160" font-size="21" text-anchor="middle" fill="#274c60">Specimen</text><path d="M343 153L507 220" fill="none" stroke="#477e91" stroke-width="3" marker-end="url(#arrow)"/><path d="M541 229l24 85q70 40 142 0l25-85" fill="#f0eee5" stroke="#7e887f" stroke-width="3"/><ellipse cx="636" cy="229" rx="95" ry="29" fill="#fffdf7" stroke="#7e887f" stroke-width="3"/><text x="440" y="123" font-size="21" text-anchor="middle" fill="#274c60">Place specimen</text><text x="638" y="370" font-size="23" text-anchor="middle" fill="#274c60">Alumina crucible</text></g><text x="28" y="517" font-size="20" text-anchor="start" fill="#274c60">Inputs: Reductant-activated InP cluster dispersion; Alumina crucible; Nitrogen</text><text x="28" y="544" font-size="20" text-anchor="start" fill="#274c60">Outputs: Place the unpassivated MSC-R specimen in an alumina crucible</text><text x="28" y="571" font-size="20" text-anchor="start" fill="#274c60">Placement of the unpassivated specimen in an alumina crucible is shown schematically. Crucible</text><text x="28" y="598" font-size="20" text-anchor="start" fill="#274c60">dimensions and specimen mass are not reported.</text><text x="28" y="625" font-size="20" text-anchor="start" fill="#274c60">Schematic action illustration. Drawn shapes, dimensions and fill levels are illustrative; only</text><text x="28" y="652" font-size="20" text-anchor="start" fill="#274c60">stated source dimensions are quantitative.</text></g></svg>
