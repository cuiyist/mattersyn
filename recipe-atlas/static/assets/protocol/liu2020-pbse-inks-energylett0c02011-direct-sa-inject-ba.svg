<svg xmlns="http://www.w3.org/2000/svg" width="960" height="698" viewBox="0 0 960 698" role="img"><title>Rapidly inject butylamine</title><desc>Source-linked conceptual operation. Unreported geometry and quantities are not reconstructed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4d7f93"/></marker></defs><rect width="960" height="698" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#607a89">Direct PbSe ink synthesis with SA</text><text x="30" y="65" font-size="28" text-anchor="start" fill="#254d62">Rapidly inject butylamine</text><text x="30" y="100" font-size="21" text-anchor="start" fill="#254d62">Endpoint: Solution immediately turns black</text><g transform="translate(0 138)"><rect x="420" y="20" width="120" height="150" rx="9" fill="#eff5f8" stroke="#587f91" stroke-width="3"/><path d="M432 140q48.0 9 96 0" fill="none" stroke="#9fbfce" stroke-width="4"/><rect x="173" y="10" width="76" height="110" rx="9" fill="#eff5f8" stroke="#587f91" stroke-width="3"/><path d="M185 90q26.0 9 52 0" fill="none" stroke="#9fbfce" stroke-width="4"/><path d="M278 68L393 108" stroke="#4d7f93" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="480" y="239" font-size="20" text-anchor="middle" fill="#254d62">Inject the named input · schematic geometry</text></g><text x="30" y="422" font-size="20" text-anchor="start" fill="#254d62">Inputs: Dissolve lead and selenium precursors; Butylamine; isomer not specified</text><text x="30" y="458" font-size="20" text-anchor="start" fill="#254d62">Output: Rapidly inject butylamine</text><text x="30" y="494" font-size="20" text-anchor="start" fill="#254d62">Rapidly inject 1 mL BA. Main p.3 says less than a few minutes after dissolution, without an</text><text x="30" y="521" font-size="20" text-anchor="start" fill="#254d62">exact delay.</text><text x="30" y="557" font-size="20" text-anchor="start" fill="#254d62">Qualified action illustration; no unreported vessel dimensions, hardware, measured</text><text x="30" y="584" font-size="20" text-anchor="start" fill="#254d62">molecular geometry, or experimental trace is implied.</text><text x="30" y="620" font-size="20" text-anchor="start" fill="#254d62">Source: SI PDF p.3, Section 3, One step synthesis and purification of PbSe QD inks; Main</text><text x="30" y="647" font-size="20" text-anchor="start" fill="#254d62">PDF p.3, dissolution and BA injection timing paragraph</text></g></svg>