<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><title>Measure the temperature series</title><desc>Conceptual stage diagram. Temperature-dependent spectra; setpoints are analytical conditions, not growth temperatures.</desc><rect x="5" y="5" width="1090" height="580" rx="20" fill="#f3f8fa" stroke="#bfd1da"/><g transform="translate(10 120)" fill="none" stroke="#426e80" stroke-width="3.4"><rect x="45" y="51" width="230" height="190" rx="12"/><path d="M67 79h113v121H67zM205 94h42m-11-10 11 10-11 10M247 175h-42m11-10-11 10 11 10"/></g><text x="360" y="54" font-family="Arial,sans-serif" font-size="25" fill="#153e50">Measure the temperature series</text><text x="360" y="132" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">Characterize at 0, −5, −10, −15, −20, −25 and −30 °C. Section</text><text x="360" y="160" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">2.3 gives a general 12 h hold before next-day measurements;</text><text x="360" y="188" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">separate Figure 4 hold times are not restated. Figure 4 curve</text><text x="360" y="216" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">a shows absorption only at −30 °C; b–h are the seven</text><text x="360" y="244" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">fluorescence temperatures.</text><text x="26" y="531" font-family="Arial,sans-serif" font-size="16" fill="#52717d">Conceptual stage diagram. Temperature-dependent spectra; setpoints are analytical conditions, not growth</text><text x="26" y="553" font-family="Arial,sans-serif" font-size="16" fill="#52717d">temperatures.</text></svg>
