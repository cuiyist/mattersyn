<svg xmlns="http://www.w3.org/2000/svg" width="960" height="899" viewBox="0 0 960 899" role="img"><title>Dissolve cadmium nitrate in 15 mL oleylamine at 140 °C</title><desc>Source-linked stage schematic. No unreported equipment dimensions or solution species are asserted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="899" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="34" font-size="18" text-anchor="start" fill="#647888">CdS synthesis at 200 °C</text><text x="30" y="73" font-size="28" text-anchor="start" fill="#234b60">Dissolve cadmium nitrate in 15 mL oleylamine at 140 °C</text><text x="30" y="112" font-size="21" text-anchor="start" fill="#234b60">temperature: 140 degC</text><text x="30" y="140" font-size="21" text-anchor="start" fill="#234b60">oleylamine volume: 15 mL</text><text x="30" y="168" font-size="21" text-anchor="start" fill="#234b60">Environment: nitrogen; suitable Schlenk line</text><text x="30" y="196" font-size="21" text-anchor="start" fill="#234b60">Endpoint: clear solution</text><g transform="translate(0 230)"><path d="M403 19v64q-70 48-19 104q75 59 151 0q51-56-19-104V19h-30v63h-52V19z" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M450 82V5h28v77" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M398 150q65 23 132 0" stroke="#9abfce" stroke-width="4" fill="none"/><text x="480" y="300" font-size="20" text-anchor="middle" fill="#234b60">Three-neck flask · source geometry unspecified</text><path d="M358 179q119 123 242 0v37q-120 101-242 0z" fill="#e9d4c1" stroke="#987b64" stroke-width="3"/><text x="700" y="50" font-size="19" text-anchor="middle" fill="#234b60">N₂ / Schlenk context</text><path d="M691 68L556 68" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/></g><text x="30" y="570" font-size="20" text-anchor="start" fill="#234b60">Inputs: Cadmium nitrate; hydration unspecified; Oleylamine; stereochemistry and technical</text><text x="30" y="597" font-size="20" text-anchor="start" fill="#234b60">composition unspecified; Nitrogen</text><text x="30" y="633" font-size="20" text-anchor="start" fill="#234b60">Output: Dissolve cadmium nitrate in 15 mL oleylamine at 140 °C</text><text x="30" y="669" font-size="20" text-anchor="start" fill="#234b60">Three-neck flask. Clear solution is the reported complex-formation endpoint; heating duration</text><text x="30" y="696" font-size="20" text-anchor="start" fill="#234b60">and exact dissolved complex are not given. Main PDF p.2 §2.1 prints 1 mM of cadmium nitrate is</text><text x="30" y="723" font-size="20" text-anchor="start" fill="#234b60">taken. Concentration is written as an amount; total moles/mass and hydration state are</text><text x="30" y="750" font-size="20" text-anchor="start" fill="#234b60">unresolved. No correction to 1 mmol.</text><text x="30" y="786" font-size="20" text-anchor="start" fill="#234b60">Apparatus dimensions, liquid level and spatial layout are schematic, not measured source</text><text x="30" y="813" font-size="20" text-anchor="start" fill="#234b60">geometry.</text><text x="30" y="849" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.2 §2.1</text></g></svg>