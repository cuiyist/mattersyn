<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="594" viewBox="0 0 1000 594"><title>Quickly inject 10 mL sulfur precursor into the lead precursor</title><desc>Quickly inject 10 mL sulfur precursor into the lead precursor. Stock aliquot volume: 10 mL Environment: nitrogen flow from the immediately preceding growth-temperature step The source describes a dark-brown color change, which may take several minutes at 40 °C. It is not an exact injection duration. Conceptual material flow; apparatus geometry, liquid levels and particle shapes are not depicted.</desc><rect x="1" y="1" width="998" height="592" rx="16" fill="#f8fbfc" stroke="#a9c5d0"/><rect x="0" y="0" width="1000" height="50" rx="16" fill="#173f50"/><text x="30" y="31" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">STEP 07 / 13  ·  SYNTHESIS</text><text x="30" y="84" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#244754">Quickly inject 10 mL sulfur precursor into the lead precursor</text><text x="30" y="121" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#506875">Representative diffusion-controlled PbO/TAA synthesis</text><rect x="30" y="169" width="415" height="122" rx="12" fill="#e6f0f4" stroke="#bad0db"/><rect x="555" y="169" width="415" height="122" rx="12" fill="#edf4ed" stroke="#c4d4c4"/><path d="M462 230.0H537m-13 -11l13 11-13 11" fill="none" stroke="#528295" stroke-width="3"/><text x="48" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">INPUTS / CONTEXT</text><text x="48" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• growth lead</text><text x="48" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• heated sulfur</text><text x="573" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">OUTPUT / OBSERVATION</text><text x="573" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• reaction</text><text x="30" y="330" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">OPERATION CONDITIONS</text><text x="30" y="358" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">Stock aliquot volume: 10 mL</text><text x="30" y="397" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">Environment: nitrogen flow from the immediately preceding growth-temperature step</text><text x="30" y="434" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">Endpoint: Dark-brown color; may take several minutes at 40 °C.</text><text x="30" y="470" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">The source describes a dark-brown color change, which may take several minutes at 40 °C. It is not an exact injection</text><text x="30" y="494" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">duration.</text><text x="30" y="540" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#566d75">Conceptual material flow; apparatus geometry, liquid levels and particle shapes are not depicted.</text></svg>