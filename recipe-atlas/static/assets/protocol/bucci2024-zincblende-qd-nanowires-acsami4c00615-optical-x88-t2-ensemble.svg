<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 645" width="1040" height="645" role="img"><title>Pre-characterize as-grown nanowire ensembles</title><desc>The source reports preliminary ensemble PL to guide sample selection but explicitly does not present these ensemble spectra. No spectral values or individual ensemble-to-single-wire batch join are inferred. Qualified action/instrument schematic; hardware dimensions and unreported preparation settings are not inferred.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#217e92"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1040" height="645" rx="18" fill="#fbfdfe"/><text x="44" y="42" fill="#486572" font-size="17" font-weight="700">BUCCI ET AL. · 2024 / optical-x88-t2</text><text x="44" y="77" fill="#183647" font-size="28" font-weight="700">Pre-characterize as-grown nanowire ensembles</text><text x="44" y="118" fill="#217e92" font-size="17" font-weight="700">STAGE 1  ·  Photoluminescence measurement</text><g transform="translate(0 138)"><rect x="56" y="57" width="137" height="62" rx="8" fill="#e7f0f3" stroke="#5c7785" stroke-width="2"/><text x="80" y="95" fill="#233947" font-size="20" font-weight="400">Excitation</text><path d="M205,94 L418,151" fill="none" stroke="#217e92" stroke-width="3" marker-end="url(#arrow)"/><rect x="389" y="174" width="290" height="20" rx="8" fill="#a3bdc7" stroke="#5c7785" stroke-width="2"/><text x="397" y="223" fill="#233947" font-size="18" font-weight="400">As-grown ensemble</text><path d="M580,151 L759,94" fill="none" stroke="#217e92" stroke-width="3" marker-end="url(#arrow)"/><rect x="770" y="57" width="208" height="62" rx="8" fill="#e7f0f3" stroke="#5c7785" stroke-width="2"/><text x="789" y="95" fill="#233947" font-size="19" font-weight="400">Emission collection</text><text x="83" y="264" fill="#536977" font-size="19" font-weight="400">Optical-path cue; no spectral result drawn</text></g><path d="M44,417 H996" stroke="#cfdee4"/><text x="44" y="433" fill="#486572" font-size="17" font-weight="700">SOURCE QUALIFICATION</text><text x="44" y="463" fill="#233947" font-size="19" font-weight="400">The source reports preliminary ensemble PL to guide sample selection but explicitly does not present these</text><text x="44" y="490" fill="#233947" font-size="19" font-weight="400">ensemble spectra. No spectral values or individual ensemble-to-single-wire batch join are inferred.</text><text x="44" y="531" fill="#536977" font-size="17" font-weight="400">Qualified action/instrument schematic; hardware dimensions and unreported preparation settings are not inferred. Functional</text><text x="44" y="556" fill="#536977" font-size="17" font-weight="400">symbols only; no measured specimen geometry or apparatus layout.</text><text x="44" y="593" fill="#536977" font-size="16" font-weight="400">Main PDF p.3, Materials and Methods</text></g></svg>