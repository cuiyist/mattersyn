<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830"><rect width="1000" height="830" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="27" y="42" font-size="25" fill="#213446" stroke="none">01  Screen print the TiO2 electrode</text><text x="28" y="81" font-size="17" fill="#596b7d" stroke="none">Electrode 4 · canonical-bound conceptual stage</text><rect x="24" y="112" width="372" height="315" rx="12" fill="#e6f1fa"/><rect x="604" y="112" width="372" height="315" rx="12" fill="#e5f4ed"/><text x="43" y="146" font-size="18" fill="#213446" stroke="none">INPUTS</text><text x="623" y="146" font-size="17" fill="#213446" stroke="none">OUTPUTS / PHYSICAL STATES</text><text x="43" y="179" font-size="18" fill="#213446" stroke="none">F-doped SnO2 conducting substrate;</text><text x="43" y="203" font-size="18" fill="#213446" stroke="none">amount: not reported</text><text x="43" y="239" font-size="18" fill="#213446" stroke="none">nanocrystalline TiO2 (P25); mean</text><text x="43" y="263" font-size="18" fill="#213446" stroke="none">particle size: 25 nm, amount: not</text><text x="43" y="287" font-size="18" fill="#213446" stroke="none">reported</text><text x="43" y="323" font-size="18" fill="#213446" stroke="none">microcrystalline TiO2; mean</text><text x="43" y="347" font-size="18" fill="#213446" stroke="none">particle size: 200 nm, amount: not</text><text x="43" y="371" font-size="18" fill="#213446" stroke="none">reported</text><text x="623" y="179" font-size="18" fill="#213446" stroke="none">screen-printed NC/MC TiO2 bilayer</text><text x="623" y="203" font-size="18" fill="#213446" stroke="none">on FTO [product]</text><g stroke="#1c6480" stroke-width="3" fill="none" stroke-linejoin="round"><path d="M430 269h140 M437 280h126 M443 289h114 M450 219l40 19 8-16-40-19z M519 222h42 M551 215l10 7-10 7"/><text x="411" y="325" font-size="16" fill="#213446" stroke="none">Screen-print action</text><text x="428" y="349" font-size="15" fill="#213446" stroke="none">NC / MC bilayer</text><text x="451" y="373" font-size="14" fill="#213446" stroke="none">Not to scale</text></g><text x="28" y="460" font-size="18" fill="#213446" stroke="none">Prepare the TiO2 electrode by screen printing TiO2 paste on FTO, with an NC-TiO2 transparent</text><text x="28" y="484" font-size="18" fill="#213446" stroke="none">underlayer and MC-TiO2 scattering overlayer. No paste formulation, number of print passes,</text><text x="28" y="508" font-size="18" fill="#213446" stroke="none">detailed sequence or printing settings are invented.</text><text x="28" y="545" font-size="18" fill="#213446" stroke="none">Environment: not reported. Atmosphere and pressure are not reported.</text><text x="28" y="774" font-size="15" fill="#596b7d" stroke="none">Conceptual illustration; no measured geometry, levels or unreported apparatus inferred.</text><text x="28" y="799" font-size="14" fill="#596b7d" stroke="none">Zhu et al. (2011) · Main PDF p.2 / printed p.1473, Experimental Section, first paragraph and Results final paragraph</text></g></svg>