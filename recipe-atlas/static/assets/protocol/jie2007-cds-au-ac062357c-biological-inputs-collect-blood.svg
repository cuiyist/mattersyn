<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410"><title>Collect and process blood</title><desc>Source-bound operation schematic; geometry, fill levels and component spacing are conceptual and not quantified.</desc><rect x="5" y="5" width="910" height="400" rx="20" fill="#f4f8fa" stroke="#bed0d8"/><g transform="translate(14 55)" fill="none" stroke="#477184" stroke-width="3.5" font-family="sans-serif" font-size="20"><path d="M105 30h84v180q-42 75-84 0zM101 23h92v20h-92zM109 140h76"/><text stroke="none" x="146" y="285" text-anchor="middle" fill="#294f5e">Polypropylene tube</text></g><text stroke="none" x="365" y="54" font-family="sans-serif" font-size="24" fill="#183e4d">Collect and process blood</text><text stroke="none" x="365" y="99" font-family="sans-serif" font-size="18" fill="#294f5e">Collect into polypropylene tubes with final 1 mg EDTA/mL</text><text stroke="none" x="365" y="127" font-family="sans-serif" font-size="18" fill="#294f5e">blood; process within 2 h, keeping semidarkness during</text><text stroke="none" x="365" y="155" font-family="sans-serif" font-size="18" fill="#294f5e">that period.</text><text stroke="none" x="30" y="382" font-family="sans-serif" font-size="16" fill="#55717d">Conceptual stage scene; no unreported vessel size, liquid level, pressure or geometry implied.</text></svg>
