<svg xmlns="http://www.w3.org/2000/svg" width="960" height="753" viewBox="0 0 960 753" role="img"><title>Prepare the reported ratio/temperature variant</title><desc>Source-linked conceptual operation. Unreported geometry and quantities are not reconstructed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4d7f93"/></marker></defs><rect width="960" height="753" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#607a89">Reported PbSe 2:1 at 25 C</text><text x="30" y="65" font-size="28" text-anchor="start" fill="#254d62">Prepare the reported ratio/temperature variant</text><text x="30" y="100" font-size="21" text-anchor="start" fill="#254d62">lead to selenium ratio: 2:1 molar Pb/Se precursor ratio</text><text x="30" y="128" font-size="21" text-anchor="start" fill="#254d62">temperature: 25 degC</text><g transform="translate(0 166)"><rect x="420" y="20" width="120" height="150" rx="9" fill="#eff5f8" stroke="#587f91" stroke-width="3"/><path d="M432 140q48.0 9 96 0" fill="none" stroke="#9fbfce" stroke-width="4"/><text x="480" y="239" font-size="20" text-anchor="middle" fill="#254d62">Source-scoped stage / variant · illustrative geometry</text></g><text x="30" y="450" font-size="20" text-anchor="start" fill="#254d62">Inputs: Lead iodide; Source BCySA; 1,3-dicyclohexylselenourea; Dimethylformamide;</text><text x="30" y="477" font-size="20" text-anchor="start" fill="#254d62">Butylamine; isomer not specified</text><text x="30" y="513" font-size="20" text-anchor="start" fill="#254d62">Output: Prepare the reported ratio/temperature variant</text><text x="30" y="549" font-size="20" text-anchor="start" fill="#254d62">The plotted ratio and temperature define this scoped variant. Exact altered charges, workup</text><text x="30" y="576" font-size="20" text-anchor="start" fill="#254d62">differences and physical batch identity are unreported; do not reverse-scale the common</text><text x="30" y="603" font-size="20" text-anchor="start" fill="#254d62">recipe.</text><text x="30" y="639" font-size="20" text-anchor="start" fill="#254d62">Qualified action illustration; no unreported vessel dimensions, hardware, measured</text><text x="30" y="666" font-size="20" text-anchor="start" fill="#254d62">molecular geometry, or experimental trace is implied.</text><text x="30" y="702" font-size="20" text-anchor="start" fill="#254d62">Source: Main PDF p.2, Figure 2b; main p.3, size-control discussion</text></g></svg>