<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><title>Prepare liquid phosphorus reference mixture</title><desc>Prepare liquid phosphorus reference mixture. Prepare 0.3g biphenyl/0.7g diphenyl ether mixture then dissolve 0.1g triphenylphosphine. Geometry and color are conceptual; selected operation quantities apply.</desc><rect x="2" y="2" width="996" height="596" rx="20" fill="#f8fbfc" stroke="#bdd0d9"/><foreignObject x="30" y="24" width="940" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="font:bold 24px Arial;color:#173e4d">Prepare liquid phosphorus reference mixture</div></foreignObject><rect x="35" y="135" width="395" height="225" rx="16" fill="#e5f0f5" stroke="#a4c3d0"/><rect x="570" y="135" width="395" height="225" rx="16" fill="#e5f0f5" stroke="#a4c3d0"/><path d="M447 243H550M530 230L550 243L530 256" stroke="#4c859b" stroke-width="5" fill="none"/><foreignObject x="55" y="155" width="355" height="185"><div xmlns="http://www.w3.org/1999/xhtml" style="font:18px Arial;color:#204859;overflow-wrap:anywhere">Biphenyl, Diphenyl ether, Triphenylphosphine</div></foreignObject><foreignObject x="590" y="155" width="355" height="185"><div xmlns="http://www.w3.org/1999/xhtml" style="font:18px Arial;color:#204859;overflow-wrap:anywhere">reference mixture</div></foreignObject><foreignObject x="35" y="390" width="930" height="150"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px Arial;color:#254d5b;overflow-wrap:anywhere">No numeric condition reported for this operation.</div></foreignObject><text x="500" y="575" text-anchor="middle" font-family="Arial" font-size="14" fill="#476773">Source-bound conceptual flow; no unreported vessel geometry, dimensions or sample shape.</text></svg>