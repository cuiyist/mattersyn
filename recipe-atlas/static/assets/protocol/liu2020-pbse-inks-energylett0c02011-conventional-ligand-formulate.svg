<svg xmlns="http://www.w3.org/2000/svg" width="960" height="727" viewBox="0 0 960 727" role="img"><title>Formulate DMF/BA ink</title><desc>Source-linked conceptual operation. Unreported geometry and quantities are not reconstructed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4d7f93"/></marker></defs><rect width="960" height="727" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#607a89">Conventional PbSe ligand exchange to ink</text><text x="30" y="65" font-size="28" text-anchor="start" fill="#254d62">Formulate DMF/BA ink</text><text x="30" y="100" font-size="21" text-anchor="start" fill="#254d62">concentration: 550 mg/mL</text><text x="30" y="128" font-size="21" text-anchor="start" fill="#254d62">dmf parts: 7 parts; basis: volume</text><text x="30" y="156" font-size="21" text-anchor="start" fill="#254d62">ba parts: 3 parts; basis: volume</text><g transform="translate(0 194)"><rect x="420" y="20" width="120" height="150" rx="9" fill="#eff5f8" stroke="#587f91" stroke-width="3"/><path d="M432 140q48.0 9 96 0" fill="none" stroke="#9fbfce" stroke-width="4"/><rect x="173" y="10" width="76" height="110" rx="9" fill="#eff5f8" stroke="#587f91" stroke-width="3"/><path d="M185 90q26.0 9 52 0" fill="none" stroke="#9fbfce" stroke-width="4"/><path d="M278 68L393 108" stroke="#4d7f93" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="480" y="239" font-size="20" text-anchor="middle" fill="#254d62">Combine the named inputs · schematic geometry</text></g><text x="30" y="478" font-size="20" text-anchor="start" fill="#254d62">Inputs: Desiccate the recovered material; Dimethylformamide; Butylamine; isomer not</text><text x="30" y="505" font-size="20" text-anchor="start" fill="#254d62">specified</text><text x="30" y="541" font-size="20" text-anchor="start" fill="#254d62">Output: Formulate DMF/BA ink</text><text x="30" y="577" font-size="20" text-anchor="start" fill="#254d62">DMF:BA is 7:3 v/v. Total formulation volume is not reported.</text><text x="30" y="613" font-size="20" text-anchor="start" fill="#254d62">Qualified action illustration; no unreported vessel dimensions, hardware, measured</text><text x="30" y="640" font-size="20" text-anchor="start" fill="#254d62">molecular geometry, or experimental trace is implied.</text><text x="30" y="676" font-size="20" text-anchor="start" fill="#254d62">Source: SI PDF p.4, Section 4, Step 3, ligand exchange</text></g></svg>