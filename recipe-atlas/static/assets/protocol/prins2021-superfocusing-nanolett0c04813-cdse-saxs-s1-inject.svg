<svg xmlns="http://www.w3.org/2000/svg" width="960" height="761" viewBox="0 0 960 761" role="img" aria-labelledby="title desc"><title id="title">Rapidly inject 3.56 g of cadmium precursor stock</title><desc id="desc">Continuing custom three-neck flask with indentation, stirring bean, immersed thermocouple and N2 line; 4 mm liquid X-ray path, borosilicate windows 0.7 mm thick and 8 mm diameter; heating ribbon per SI pp.3–5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><g font-family="Arial,sans-serif"><rect width="960" height="761" rx="16" fill="#f7fafb"/><text x="28" y="42" font-size="27" text-anchor="start" fill="#274c60">Rapidly inject 3.56 g of cadmium precursor stock</text><text x="28" y="77" font-size="20" text-anchor="start" fill="#274c60">precursor mass: 3.56 g; post injection temperature: 230 degC; Atmosphere: nitrogen</text><g transform="translate(0 133)"><path d="M458 65h44v70l47-47 24 24-57 65q66 45 45 103q-16 47-81 47t-81-47q-21-58 45-103l-57-65 24-24 47 47z" fill="#edf5f8" stroke="#466c7d" stroke-width="3"/><path d="M409 254q71 16 142 0" fill="none" stroke="#9dc1cf" stroke-width="4"/><path d="M434 237h39v36h-39M492 236v38" fill="none" stroke="#426d7f" stroke-width="3"/><path d="M470 306h25" stroke="#568998" stroke-width="8" stroke-linecap="round"/><path d="M395 100L460 236" stroke="#576c77" stroke-width="4"/><path d="M560 105h45v-40" fill="none" stroke="#557887" stroke-width="3"/><text x="240" y="99" font-size="18" text-anchor="start" fill="#274c60">Temperature probe</text><path d="M369 104L403 125" fill="none" stroke="#477e91" stroke-width="3" marker-end="url(#arrow)"/><text x="615" y="70" font-size="19" text-anchor="start" fill="#274c60">N₂ line</text><path d="M270 257L430 257" fill="none" stroke="#477e91" stroke-width="3" marker-end="url(#arrow)"/><path d="M499 257L690 257" fill="none" stroke="#477e91" stroke-width="3" marker-end="url(#arrow)"/><text x="645" y="238" font-size="19" text-anchor="middle" fill="#274c60">X-ray path</text><text x="310" y="329" font-size="18" text-anchor="middle" fill="#274c60">4 mm liquid path</text><path d="M400 318L483 274" fill="none" stroke="#477e91" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(0 0)"><path d="M462 2h36v37h-36zM480-14v16M456-14h48M480 39v45" fill="#e1eef3" stroke="#426a7d" stroke-width="3"/></g><path d="M525 29L504 72" fill="none" stroke="#477e91" stroke-width="3" marker-end="url(#arrow)"/><text x="611" y="24" font-size="21" text-anchor="middle" fill="#274c60">Remote injector</text><path d="M408 188q70 25 142 0M402 214q77 25 156 0M408 287q70 24 143 0" fill="none" stroke="#be8258" stroke-width="4"/><text x="738" y="160" font-size="20" text-anchor="middle" fill="#274c60">Heating ribbon</text><path d="M649 168L559 200" fill="none" stroke="#477e91" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="367" font-size="21" text-anchor="middle" fill="#274c60">Custom SAXS flask · schematic</text></g><text x="28" y="545" font-size="20" text-anchor="start" fill="#274c60">Inputs: Heat the selenium-containing reaction mixture to 290 °C; Cadmium oleate</text><text x="28" y="572" font-size="20" text-anchor="start" fill="#274c60">Outputs: Rapidly inject 3.56 g of cadmium precursor stock</text><text x="28" y="599" font-size="20" text-anchor="start" fill="#274c60">Continuing custom three-neck flask with indentation, stirring bean, immersed thermocouple and N2</text><text x="28" y="626" font-size="20" text-anchor="start" fill="#274c60">line; 4 mm liquid X-ray path, borosilicate windows 0.7 mm thick and 8 mm diameter; heating ribbon</text><text x="28" y="653" font-size="20" text-anchor="start" fill="#274c60">per SI pp.3–5.</text><text x="28" y="680" font-size="20" text-anchor="start" fill="#274c60">Schematic action illustration. Drawn shapes, dimensions and fill levels are illustrative; only</text><text x="28" y="707" font-size="20" text-anchor="start" fill="#274c60">stated source dimensions are quantitative.</text></g></svg>
