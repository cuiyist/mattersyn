<svg xmlns="http://www.w3.org/2000/svg" width="960" height="817" viewBox="0 0 960 817" role="img"><title>Add a drop of sodium polysulfide electrolyte</title><desc>Source-linked stage schematic. No unreported equipment dimensions or solution species are asserted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="817" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="34" font-size="18" text-anchor="start" fill="#647888">CdS200/CdSe sandwich photovoltaic cell</text><text x="30" y="73" font-size="28" text-anchor="start" fill="#234b60">Add a drop of sodium polysulfide electrolyte</text><text x="30" y="112" font-size="21" text-anchor="start" fill="#234b60">na2s concentration: 1 M</text><text x="30" y="140" font-size="21" text-anchor="start" fill="#234b60">sulfur concentration: 1 M</text><text x="30" y="168" font-size="21" text-anchor="start" fill="#234b60">drop volume: not reported</text><g transform="translate(0 202)"><rect x="275" y="151" width="410" height="22" fill="#cadde7" stroke="#557f91" stroke-width="3"/><path d="M283 144h394" stroke="#ac8d48" stroke-width="7"/><rect x="275" y="99" width="34" height="48" fill="#d7c8a6"/><rect x="651" y="99" width="34" height="48" fill="#d7c8a6"/><path d="M315 132h330" stroke="#9fbbc5" stroke-width="22"/><path d="M475 29L475 106" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="689" y="39" font-size="21" text-anchor="middle" fill="#234b60">Electrolyte drop</text><text x="480" y="218" font-size="21" text-anchor="middle" fill="#234b60">Sandwich sketch; layer thicknesses not to scale</text></g><text x="30" y="542" font-size="20" text-anchor="start" fill="#234b60">Inputs: Place about 50 µm Scotch tape at sides of photoanode; Sandwich-cell sodium polysulfide;</text><text x="30" y="569" font-size="20" text-anchor="start" fill="#234b60">1 M Na2S and 1 M sulfur; solvent unspecified</text><text x="30" y="605" font-size="20" text-anchor="start" fill="#234b60">Output: Add a drop of sodium polysulfide electrolyte</text><text x="30" y="641" font-size="20" text-anchor="start" fill="#234b60">No drop volume reported. §2.5 identifies aqueous electrolyte for impedance; solvent is not</text><text x="30" y="668" font-size="20" text-anchor="start" fill="#234b60">independently restated in this sandwich assembly paragraph.</text><text x="30" y="704" font-size="20" text-anchor="start" fill="#234b60">Apparatus dimensions, liquid level and spatial layout are schematic, not measured source</text><text x="30" y="731" font-size="20" text-anchor="start" fill="#234b60">geometry.</text><text x="30" y="767" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.2 §2.4</text></g></svg>