<svg xmlns="http://www.w3.org/2000/svg" width="960" height="653" viewBox="0 0 960 653" role="img"><title>Redisperse QD solids in DMF</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3e778d"/></marker></defs><rect width="960" height="653" fill="#fff"/><g font-family="Arial, sans-serif"><text x="30" y="44" font-size="28" text-anchor="start" fill="#244659">Redisperse QD solids in DMF</text><text x="30" y="84" font-size="21" text-anchor="start" fill="#244659">mass concentration: ~100mg/mL</text><g transform="translate(0 124)"><rect x="428" y="36" width="104" height="146" rx="12" stroke="#47778a" stroke-width="3" fill="#edf5f8"/><path d="M438 140q42.0 12 84 0" fill="none" stroke="#91bbc9" stroke-width="3"/><text x="480" y="225" font-size="21" text-anchor="middle" fill="#244659">Vessel and hardware geometry unspecified</text></g><text x="30" y="396" font-size="20" text-anchor="start" fill="#244659">Inputs: Centrifuge at 8000 rpm for 5 min and recover QD solids; N,N-Dimethylformamide</text><text x="30" y="432" font-size="20" text-anchor="start" fill="#244659">Outputs: Redisperse QD solids in DMF</text><text x="30" y="468" font-size="20" text-anchor="start" fill="#244659">Final ink approximately 100 mg/mL; added DMF volume and isolated yield unreported.</text><text x="30" y="504" font-size="20" text-anchor="start" fill="#244659">Exact vessel type, size and hardware geometry are not reported; drawing is a qualified</text><text x="30" y="531" font-size="20" text-anchor="start" fill="#244659">schematic.</text><text x="30" y="567" font-size="20" text-anchor="start" fill="#244659">Qualified schematic; dimensions and fill levels are illustrative.</text><text x="30" y="603" font-size="20" text-anchor="start" fill="#244659">Source: SI PDF p.2, Room-temperature Synthesis of PbSe QD inks</text></g></svg>