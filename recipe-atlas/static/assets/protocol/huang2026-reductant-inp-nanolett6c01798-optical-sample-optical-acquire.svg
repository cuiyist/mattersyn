<svg xmlns="http://www.w3.org/2000/svg" width="960" height="742" viewBox="0 0 960 742" role="img" aria-labelledby="title desc"><title id="title">Acquire UV–visible, steady-state PL and time-resolved PL measurements</title><desc id="desc">Exact vessel geometry is not reported for this step; diagram is a qualified generic symbol.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><g font-family="Arial,sans-serif"><rect width="960" height="742" rx="16" fill="#f7fafb"/><text x="28" y="42" font-size="27" text-anchor="start" fill="#274c60">Acquire UV–visible, steady-state PL and time-resolved PL</text><text x="28" y="77" font-size="27" text-anchor="start" fill="#274c60">measurements</text><text x="28" y="112" font-size="20" text-anchor="start" fill="#274c60">pulsed excitation: 405 nm</text><g transform="translate(0 168)"><rect x="350" y="90" width="260" height="158" rx="15" fill="#edf5f8" stroke="#466c7d" stroke-width="3"/><text x="480" y="156" font-size="25" text-anchor="middle" fill="#274c60">Sample analysis</text><text x="480" y="197" font-size="20" text-anchor="middle" fill="#274c60">No result drawn</text><text x="480" y="292" font-size="20" text-anchor="middle" fill="#274c60">Source figures and measurements are linked separately</text></g><text x="28" y="580" font-size="20" text-anchor="start" fill="#274c60">Inputs: Disperse purified QDs in hexane and apply to a colorimetric cuvette</text><text x="28" y="607" font-size="20" text-anchor="start" fill="#274c60">Outputs: Acquire UV–visible, steady-state PL and time-resolved PL measurements</text><text x="28" y="634" font-size="20" text-anchor="start" fill="#274c60">Exact vessel geometry is not reported for this step; diagram is a qualified generic symbol.</text><text x="28" y="661" font-size="20" text-anchor="start" fill="#274c60">Schematic action illustration. Drawn shapes, dimensions and fill levels are illustrative; only</text><text x="28" y="688" font-size="20" text-anchor="start" fill="#274c60">stated source dimensions are quantitative.</text></g></svg>
