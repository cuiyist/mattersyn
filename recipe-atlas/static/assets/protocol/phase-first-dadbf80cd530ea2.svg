<svg xmlns="http://www.w3.org/2000/svg" width="820" height="731" viewBox="0 0 820 731"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#426d85" stroke-width="1.5"/></marker></defs><rect width="820" height="731" rx="14" fill="#f4f7f8"/><text x="25" y="38" text-anchor="start" font-family="Arial,sans-serif" font-size="28" fill="#183c50">Mix crude with toluene/methanol, centrifuge; decant</text><text x="25" y="73" text-anchor="start" font-family="Arial,sans-serif" font-size="28" fill="#183c50">upper fraction</text><text x="25" y="108" text-anchor="start" font-family="Arial,sans-serif" font-size="21" fill="#183c50">crude volume: 0.8 L; toluene volume: 0.8 L; methanol volume: 6 L; speed:</text><text x="25" y="135" text-anchor="start" font-family="Arial,sans-serif" font-size="21" fill="#183c50">3000 rpm; duration: 3 min</text><g transform="translate(0 218)"><path d="M105 35v100q0 15 15 15h55q15 0 15-15V35" fill="none" stroke="#34586a" stroke-width="4"/><path d="M212 93L299 93" stroke="#426d85" stroke-width="4" fill="none" marker-end="url(#arrow)"/><circle cx="390" cy="95" r="65" fill="none" stroke="#34586a" stroke-width="4"/><circle cx="390" cy="95" r="13" fill="none" stroke="#34586a" stroke-width="3"/><rect x="381" y="40" width="18" height="30" rx="5" fill="none" stroke="#34586a" stroke-width="3" transform="rotate(0 390 95)"/><rect x="381" y="40" width="18" height="30" rx="5" fill="none" stroke="#34586a" stroke-width="3" transform="rotate(90 390 95)"/><rect x="381" y="40" width="18" height="30" rx="5" fill="none" stroke="#34586a" stroke-width="3" transform="rotate(180 390 95)"/><rect x="381" y="40" width="18" height="30" rx="5" fill="none" stroke="#34586a" stroke-width="3" transform="rotate(270 390 95)"/><path d="M476 93L557 93" stroke="#426d85" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M589 35v100q0 15 15 15h55q15 0 15-15V35" fill