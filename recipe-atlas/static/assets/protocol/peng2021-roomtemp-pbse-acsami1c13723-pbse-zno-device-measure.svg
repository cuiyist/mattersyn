<svg xmlns="http://www.w3.org/2000/svg" width="960" height="678" viewBox="0 0 960 678" role="img"><title>Measure photoelectric response with Keithley-4200</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3e778d"/></marker></defs><rect width="960" height="678" fill="#fff"/><g font-family="Arial, sans-serif"><text x="30" y="44" font-size="28" text-anchor="start" fill="#244659">Measure photoelectric response with Keithley-4200</text><g transform="translate(0 95)"><rect x="320" y="32" width="320" height="154" rx="14" stroke="#47778a" stroke-width="3" fill="#edf5f8"/><text x="480" y="94" font-size="26" text-anchor="middle" fill="#244659">Measurement context</text><text x="480" y="140" font-size="20" text-anchor="middle" fill="#244659">No result or curve invented</text></g><text x="30" y="367" font-size="20" text-anchor="start" fill="#244659">Inputs: Anneal PbSe/ZnO devices at 70 °C for 10 min</text><text x="30" y="403" font-size="20" text-anchor="start" fill="#244659">Outputs: Measure photoelectric response with Keithley-4200</text><text x="30" y="439" font-size="20" text-anchor="start" fill="#244659">Different-wavelength monochromatic lasers; no specific device specimen mapped to the</text><text x="30" y="466" font-size="20" text-anchor="start" fill="#244659">fabrication batch. Figure 3 shows 1/3/5/7/10 V bias comparisons; characteristic metrics below</text><text x="30" y="493" font-size="20" text-anchor="start" fill="#244659">use 808 nm, 5 V as source stated.</text><text x="30" y="529" font-size="20" text-anchor="start" fill="#244659">Exact vessel type, size and hardware geometry are not reported; drawing is a qualified</text><text x="30" y="556" font-size="20" text-anchor="start" fill="#244659">schematic.</text><text x="30" y="592" font-size="20" text-anchor="start" fill="#244659">Qualified schematic; dimensions and fill levels are illustrative.</text><text x="30" y="628" font-size="20" text-anchor="start" fill="#244659">Source: Main PDF p.2, Photodetector Fabrication and Measurement</text></g></svg>