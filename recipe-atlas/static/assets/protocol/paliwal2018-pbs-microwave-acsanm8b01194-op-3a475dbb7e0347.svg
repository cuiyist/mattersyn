<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><title>Coat pre-existing IZO transistor with PbS and EDT</title><desc>Coat pre-existing IZO transistor with PbS and EDT. Rotation speed: 2500 rpm Treatment count: 3 cycles Environment: Not reported; Atmosphere not reported for this operation. Source explicitly says in combination with EDT as mentioned above. Full underlying TFT fabrication refers to externalref32 and is not reconstructed. Conceptual material flow. Shapes do not represent apparatus geometry, liquid levels or measured particle structure.</desc><rect x="1" y="1" width="998" height="598" rx="16" fill="#f8fbfc" stroke="#a9c5d0"/><rect x="0" y="0" width="1000" height="50" rx="16" fill="#173f50"/><text x="30" y="31" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">STEP 01 / 01  ·  SYNTHESIS</text><text x="30" y="84" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#244754">Coat pre-existing IZO transistor with PbS and EDT</text><text x="30" y="121" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#506875">Paliwal et al. (2018): PbS coating of pre-existing IZO transistor</text><rect x="30" y="169" width="415" height="133" rx="12" fill="#e6f0f4" stroke="#bad0db"/><rect x="555" y="169" width="415" height="133" rx="12" fill="#edf4ed" stroke="#c4d4c4"/><path d="M462 235.5H537m-13 -11l13 11-13 11" fill="none" stroke="#528295" stroke-width="3"/><text x="48" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">INPUTS / CONTEXT</text><text x="48" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• pre-existing IZO thin-film transistor</text><text x="48" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• microwave PbS nanocrystal dispersion</text><text x="48" y="276" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• 1 vol% EDT in acetonitrile</text><text x="573" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">OUTPUT / STATE</text><text x="573" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• phototransistor</text><text x="30" y="341" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">OPERATION CONDITIONS</text><text x="30" y="369" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">Rotation speed: 2500 rpm</text><text x="30" y="400" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">Treatment count: 3 cycles</text><text x="30" y="439" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">Environment: Not reported; Atmosphere not reported for this operation.</text><text x="30" y="476" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">Source explicitly says in combination with EDT as mentioned above. Full underlying TFT fabrication refers to externalref32</text><text x="30" y="500" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">and is not reconstructed.</text><text x="30" y="546" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#566d75">Conceptual material flow. Shapes do not represent apparatus geometry, liquid levels or measured particle structure.</text></svg>