<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><title>Extract the organic dispersion</title><desc>Conceptual organic-solvent extraction / mixing. Vessel geometry is unreported.</desc><rect x="5" y="5" width="1090" height="580" rx="20" fill="#f3f8fa" stroke="#bfd1da"/><g transform="translate(10 120)" stroke="#426e80" stroke-width="3.4"><path d="M64 54v186q96 28 192 0V54" fill="#dcecf1"/><path d="M112 137c14-20 55-28 88-12l16 12m-16-26 16 26-29 2M208 192c-14 20-55 28-88 12l-16-12m16 26-16-26 29-2" fill="none"/></g><text x="360" y="54" font-family="Arial,sans-serif" font-size="25" fill="#153e50">Extract the organic dispersion</text><text x="360" y="132" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">Contact the organic dispersion with hexane:methanol (1:3 by</text><text x="360" y="160" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">volume); the source says the process is repeated three times.</text><text x="360" y="188" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">Absolute volumes and whether repetition means three or four</text><text x="360" y="216" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">total contacts are not clarified.</text><text x="26" y="538" font-family="Arial,sans-serif" font-size="16" fill="#52717d">Conceptual organic-solvent extraction / mixing. Vessel geometry is unreported.</text></svg>
