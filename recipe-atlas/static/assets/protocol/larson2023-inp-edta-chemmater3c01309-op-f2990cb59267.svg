<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640"><title>Mix molecular NMR sample</title><desc>Conceptual operation diagram; only source-stated equipment and conditions apply.</desc><rect x="5" y="5" width="1090" height="630" rx="20" fill="#f4f8fa" stroke="#bed0d8"/><g transform="translate(15 110)" fill="none" stroke="#477184" stroke-width="3.5"><rect x="40" y="70" width="225" height="130" rx="18"/><path d="M65 137h170M212 117l23 20-23 20"/></g><text x="360" y="48" font-family="sans-serif" font-size="25" fill="#183e4d">Mix molecular NMR sample</text><text x="360" y="115" font-family="sans-serif" font-size="19" fill="#294f5e">In a 20 mL scintillation vial combine 0.03 mmol InCl3, 0.03 mmol</text><text x="360" y="143" font-family="sans-serif" font-size="19" fill="#294f5e">EDTA, 0.5 mL anhydrous DMSO-d6 and 0.12 mmol oleylamine. Stir</text><text x="360" y="171" font-family="sans-serif" font-size="19" fill="#294f5e">overnight at room temperature.</text><text x="25" y="590" font-family="sans-serif" font-size="16" fill="#55717d">Conceptual operation diagram; only source-stated equipment and conditions apply.</text></svg>
