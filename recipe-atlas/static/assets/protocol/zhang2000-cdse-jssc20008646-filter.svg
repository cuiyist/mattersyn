<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410" role="img"><defs><linearGradient id="steel"><stop stop-color="#e9f1f7"/><stop offset=".48" stop-color="#b7c9d8"/><stop offset="1" stop-color="#eff5f9"/></linearGradient><linearGradient id="beam"><stop stop-color="#edb856" stop-opacity=".18"/><stop offset="1" stop-color="#ed9541" stop-opacity=".7"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6284a0"/></marker></defs><rect x="8" y="8" width="604" height="394" rx="22" fill="#f4f8fb" stroke="#d6e3eb"/><text x="310" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#233d53">Filter precipitate</text><path d="M170 142H450L330 279V311L292 332V279Z" fill="#dae9ef" stroke="#688a9f" stroke-width="3"/><path d="M202 181H418L388 216H232Z" fill="#ad7968"/><text x="310" y="101" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#233d53">Separate precipitate by filtration</text><text x="310" y="358" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#233d53">Filter medium and pore size unreported</text><text x="310" y="371" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#567184">Original conceptual apparatus; source quantities alongside</text><text x="310" y="392" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#708695">Conceptual equipment · geometry is not a measured dimension</text><desc>Original equipment illustration for filter. Vessel, filtration and drying equipment geometry are unspecified and conceptual; the optical cuvette is source specified as quartz with a 1 cm path. The stock temperature is an observed exotherm, not external heating. No measured particle or atomic coordinates.</desc></svg>
