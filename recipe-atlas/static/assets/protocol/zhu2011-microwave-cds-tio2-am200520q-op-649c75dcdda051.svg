<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830"><rect width="1000" height="830" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="27" y="42" font-size="25" fill="#213446" stroke="none">06  Deposit CdS by microwave treatment</text><text x="28" y="81" font-size="17" fill="#596b7d" stroke="none">Electrode 4 · canonical-bound conceptual stage</text><rect x="24" y="112" width="372" height="315" rx="12" fill="#e6f1fa"/><rect x="604" y="112" width="372" height="315" rx="12" fill="#e5f4ed"/><text x="43" y="146" font-size="18" fill="#213446" stroke="none">INPUTS</text><text x="623" y="146" font-size="17" fill="#213446" stroke="none">OUTPUTS / PHYSICAL STATES</text><text x="43" y="179" font-size="18" fill="#213446" stroke="none">vessel loaded into the focused</text><text x="43" y="203" font-size="18" fill="#213446" stroke="none">microwave system</text><text x="623" y="179" font-size="18" fill="#213446" stroke="none">CdS-sensitized TiO2 electrode 4</text><text x="623" y="203" font-size="18" fill="#213446" stroke="none">after MACBD [product]</text><g stroke="#1c6480" stroke-width="3" fill="none" stroke-linejoin="round"><path d="M432 234q15 13 0 26q-15 13 0 26 M454 234q15 13 0 26q-15 13 0 26 M553 234q15 13 0 26q-15 13 0 26 M473 270h61 M477 283h53"/><text x="408" y="330" font-size="15" fill="#213446" stroke="none">Microwave treatment</text><text x="434" y="354" font-size="16" fill="#213446" stroke="none">150 C / 100 W</text><text x="430" y="378" font-size="15" fill="#213446" stroke="none">30 min reported</text></g><text x="28" y="460" font-size="18" fill="#213446" stroke="none">Treat at 150 C with microwave irradiation power of 100 W for 30 min. The paper does not specify</text><text x="28" y="484" font-size="18" fill="#213446" stroke="none">ramp timing or whether 150 C is a heater setting, vessel reading or sample temperature. No</text><text x="28" y="508" font-size="18" fill="#213446" stroke="none">washing, drying or cooling step is added.</text><text x="28" y="545" font-size="18" fill="#213446" stroke="none">temperature: 150 degC</text><text x="28" y="582" font-size="18" fill="#213446" stroke="none">microwave power: 100 W</text><text x="28" y="619" font-size="18" fill="#213446" stroke="none">duration: 30 min</text><text x="28" y="656" font-size="18" fill="#213446" stroke="none">Environment: not reported. Atmosphere and pressure are not reported.</text><text x="28" y="774" font-size="15" fill="#596b7d" stroke="none">Conceptual illustration; no measured geometry, levels or unreported apparatus inferred.</text><text x="28" y="799" font-size="14" fill="#596b7d" stroke="none">Zhu et al. (2011) · Main PDF p.2 / printed p.1473, Experimental Section, MACBD preparation paragraph and electrode</text><text x="28" y="819" font-size="14" fill="#596b7d" stroke="none">numbering</text></g></svg>