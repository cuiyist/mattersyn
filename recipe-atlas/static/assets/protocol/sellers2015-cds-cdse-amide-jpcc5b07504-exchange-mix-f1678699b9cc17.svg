<svg xmlns="http://www.w3.org/2000/svg" width="820" height="678" viewBox="0 0 820 678"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><rect width="820" height="678" rx="16" fill="#f5f9fb"/><text x="25" y="41" font-family="Arial,sans-serif" font-size="26" text-anchor="start" fill="#173c4a">Mix the ligand solution with CdSe in hexanes</text><g transform="translate(0 101)"><rect x="150" y="45" width="90" height="146" rx="8" fill="#eef6f8" stroke="#3c6475" stroke-width="3"/><path d="M150 63h90M158 159q37.0 10 74 0" fill="none" stroke="#9abbc8" stroke-width="4"/><path d="M276 115L361 115" fill="none" stroke="#477e91" stroke-width="4" marker-end="url(#arrow)"/><rect x="428" y="45" width="90" height="146" rx="8" fill="#eef6f8" stroke="#3c6475" stroke-width="3"/><path d="M428 63h90M436 159q37.0 10 74 0" fill="none" stroke="#9abbc8" stroke-width="4"/><text x="390" y="273" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#173c4a">Ligand exchange</text></g><text x="25" y="488" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Inputs: Prepare the 4-ATP solution inside an argon glovebox; TDPA-capped</text><text x="25" y="515" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">CdSe quantum dots; Hexanes solvent mixture</text><text x="25" y="542" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Outputs: Mix the ligand solution with CdSe in hexanes</text><text x="25" y="569" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Illustrative action only. Vessel shape, capacity and drawing dimensions are not</text><text x="25" y="596" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">source measurements. Phase behavior is stated in the operation text; the drawing</text><text x="25" y="623" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">does not assign layers.</text></svg>