<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1001" viewBox="0 0 960 1001"><title>Acquire wide-field and MSIM images</title><desc>Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular geometry, or experimental trace is implied. No exact optical train, cellular morphology, micrograph or experimental result is reconstructed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><rect width="960" height="1001" rx="15" fill="#f7fafc"/><text x="30" y="32" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#637f8e">Prepare and image QD–SA-labeled microtubules</text><text x="30" y="57" font-family="Arial,sans-serif" font-size="28" text-anchor="start" fill="#173c4a">Acquire wide-field and MSIM images</text><text x="30" y="92" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">excitation wavelength: 488 nm</text><text x="30" y="118" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">raw frames per sr image: 224 frames</text><text x="30" y="144" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">frame rate: 200 Hz</text><text x="30" y="170" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">axial step: 200 nm</text><g transform="translate(70 214)"><rect x="279" y="40" width="262" height="72" rx="9" fill="#e6f1f5" stroke="#3c6475" stroke-width="3"/><text x="410" y="84" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#173c4a">Image acquisition</text><path d="M410 129L410 176" fill="none" stroke="#477e91" stroke-width="4" marker-end="url(#arrow)"/><rect x="285" y="192" width="250" height="21" fill="#d7eaf1" stroke="#3c6475" stroke-width="3"/><text x="410" y="260" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#173c4a">Specimen plane</text><text x="410" y="321" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#173c4a">Optical action cue; no measured image generated</text></g><text x="30" y="609" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Inputs: Seal in glycerol solution and store</text><text x="30" y="635" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="661" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Outputs: Acquire wide-field and MSIM images</text><text x="30" y="687" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="713" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">DMD-based MSIM with sCMOS detection and ET500lp filter; the source lists 60x water/NA1.27 and</text><text x="30" y="739" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">100x Si-oil/NA1.35 objectives without assigning one to every panel. Pixel reassignment, pinholing,</text><text x="30" y="765" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">scaling, summing and deconvolution are described. A 1/90 telescope gives approximately 120 nm</text><text x="30" y="791" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">pixels. No experimental trace is fabricated.</text><text x="30" y="817" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="843" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular</text><text x="30" y="869" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">geometry, or experimental trace is implied. No exact optical train, cellular morphology, micrograph or</text><text x="30" y="895" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">experimental result is reconstructed.</text><text x="30" y="921" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="947" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Source: Main PDF p.4, Section 2.5, SR Imaging System and Acquisition</text></svg>