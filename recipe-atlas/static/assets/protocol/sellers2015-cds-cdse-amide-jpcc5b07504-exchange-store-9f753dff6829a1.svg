<svg xmlns="http://www.w3.org/2000/svg" width="820" height="703" viewBox="0 0 820 703"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><rect width="820" height="703" rx="16" fill="#f5f9fb"/><text x="25" y="41" font-family="Arial,sans-serif" font-size="26" text-anchor="start" fill="#173c4a">Disperse in DMSO and store in the dark</text><text x="25" y="73" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">dark storage</text><g transform="translate(0 126)"><rect x="150" y="45" width="90" height="146" rx="8" fill="#eef6f8" stroke="#3c6475" stroke-width="3"/><path d="M150 63h90M158 159q37.0 10 74 0" fill="none" stroke="#9abbc8" stroke-width="4"/><path d="M276 115L361 115" fill="none" stroke="#477e91" stroke-width="4" marker-end="url(#arrow)"/><rect x="428" y="45" width="90" height="146" rx="8" fill="#eef6f8" stroke="#3c6475" stroke-width="3"/><path d="M428 63h90M436 159q37.0 10 74 0" fill="none" stroke="#9abbc8" stroke-width="4"/><text x="390" y="273" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#173c4a">Store dispersion</text></g><text x="25" y="513" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Inputs: Centrifuge and wash with excess methanol; repeat twice; Dimethyl</text><text x="25" y="540" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">sulfoxide</text><text x="25" y="567" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Outputs: Disperse in DMSO and store in the dark</text><text x="25" y="594" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Illustrative action only. Vessel shape, capacity and drawing dimensions are not</text><text x="25" y="621" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">source measurements. Phase behavior is stated in the operation text; the drawing</text><text x="25" y="648" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">does not assign layers.</text></svg>