<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820"><rect width="1000" height="820" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="32" y="40" font-size="25" fill="#213446">17  Refrigerate purified dispersion for testing</text><text x="32" y="84" font-size="17" fill="#526477">Pb/S 1:1 core route · conceptual process illustration</text><rect x="25" y="115" width="370" height="295" rx="12" fill="#e6f1fa"/><rect x="605" y="115" width="370" height="295" rx="12" fill="#e5f4ed"/><text x="44" y="147" font-size="18" fill="#213446">INPUTS</text><text x="624" y="147" font-size="18" fill="#213446">OUTPUTS / PHYSICAL STATES</text><text x="44" y="180" font-size="18" fill="#213446">purified Pb/S1:1 heterostructure</text><text x="44" y="205" font-size="18" fill="#213446">dispersion</text><text x="624" y="180" font-size="18" fill="#213446">refrigerated purified</text><text x="624" y="205" font-size="18" fill="#213446">heterostructure dispersion</text><text x="624" y="230" font-size="18" fill="#213446">[product]</text><g stroke="#1c6480" stroke-width="4" fill="none" stroke-linejoin="round"><rect x="454" y="170" width="90" height="150" rx="10"/><path d="M454 216h90 M522 240v28 M474 191h24 M486 179v24"/><path d="M400 354h192 M579 344l13 10-13 10"/></g><text x="420" y="375" font-size="15" fill="#213446">Operation symbol;</text><text x="410" y="397" font-size="15" fill="#213446">geometry not reported</text><text x="32" y="452" font-size="18" fill="#213446">Transfer the redispersed product to a refrigerator for testing; storage temperature and duration</text><text x="32" y="477" font-size="18" fill="#213446">are not stated.</text><text x="32" y="527" font-size="17" fill="#213446">temperature: not reported</text><text x="32" y="554" font-size="17" fill="#213446">duration: not reported</text><text x="32" y="773" font-size="15" fill="#596b7d">Atmosphere / pressure: not reported. Icons do not specify vessel type, size or fill level.</text><text x="32" y="799" font-size="14" fill="#596b7d">Source: Yang et al. (2023), main PDF p.7; room-temperature context p.2.</text></g></svg>