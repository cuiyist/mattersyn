<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="631" viewBox="0 0 1000 631"><title>Add selenium and preferred Zn/Mg feed by pumps</title><desc>Add selenium and preferred Zn/Mg feed by pumps. Methods start temperature: 50 °C Duration: 1 h Results addition temperature: 200 °C Environment: Nitrogen; brief vacuum for hexane removal as specified Methods: begin when solution reaches 50 C during heating toward 200 C. Results: addition at 200 C. Both statements retained. ZnEt2/TOP-Se premixed; MgBu2 separate syringe. Conceptual material flow. Shapes do not represent apparatus geometry, liquid levels or measured particle structure.</desc><rect x="1" y="1" width="998" height="629" rx="16" fill="#f8fbfc" stroke="#a9c5d0"/><rect x="0" y="0" width="1000" height="50" rx="16" fill="#173f50"/><text x="30" y="31" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">STEP 04 / 04  ·  SYNTHESIS</text><text x="30" y="84" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#244754">Add selenium and preferred Zn/Mg feed by pumps</text><text x="30" y="121" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#506875">Mulder et al. (2020): ZnMgSe first shell on pre-existing InZnP cores</text><rect x="30" y="169" width="415" height="133" rx="12" fill="#e6f0f4" stroke="#bad0db"/><rect x="555" y="169" width="415" height="133" rx="12" fill="#edf4ed" stroke="#c4d4c4"/><path d="M462 235.5H537m-13 -11l13 11-13 11" fill="none" stroke="#528295" stroke-width="3"/><text x="48" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">INPUTS / CONTEXT</text><text x="48" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• heated cores</text><text x="48" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• TOP-Se plus additional TOP</text><text x="48" y="276" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#24