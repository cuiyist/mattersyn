xt x="42" y="560" font-size="18" font-weight="normal" fill="#173047">selenium concentration: 0.2 mol/L</text><rect x="572" y="223" width="500" height="393" rx="12" fill="#e5f4ed"/><text x="588" y="261" font-size="19" font-weight="bold" fill="#173047">OUTPUTS / PHYSICAL STATES</text><text x="588" y="296" font-size="20" font-weight="normal" fill="#173047">combined cadmium and selenium precursor feed</text><text x="588" y="327" font-size="18" font-weight="normal" fill="#173047">Kind: stock</text><text x="28" y="654" font-size="21" font-weight="normal" fill="#173047">Mix the room-temperature cadmium solution with2.5mL0.2M Se-in-TOP solution; no total volume or pure</text><text x="28" y="682" font-size="21" font-weight="normal" fill="#173047">selenium charge is calculated.</text><text x="28" y="723" font-size="21" font-weight="normal" fill="#173047">Environment: not reported</text><text x="28" y="764" font-size="15" font-weight="normal" fill="#596b7d">Conceptual and not to scale; no unreported apparatus geometry, liquid levels or handling atmosphere inferred.</text><text x="28" y="794" font-size="15" font-weight="normal" fill="#596b7d">Khatun et al. (2012) • Main PDF p.2 / printed p.3881, Section 2.3, near-infrared quantum-dot synthesis</text></g></svg>