<svg xmlns="http://www.w3.org/2000/svg" width="960" height="651" viewBox="0 0 960 651" role="img"><title>Develop with AR 300-26</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3e778d"/></marker></defs><rect width="960" height="651" fill="#fff"/><g font-family="Arial, sans-serif"><text x="30" y="44" font-size="28" text-anchor="start" fill="#244659">Develop with AR 300-26</text><g transform="translate(0 95)"><rect x="277" y="105" width="406" height="32" rx="3" fill="#d5e3e9" stroke="#47778a" stroke-width="3"/><text x="480" y="48" font-size="25" text-anchor="middle" fill="#244659">AR 300-26 developer</text><text x="480" y="206" font-size="21" text-anchor="middle" fill="#244659">Development settings not reported</text></g><text x="30" y="367" font-size="20" text-anchor="start" fill="#244659">Inputs: Expose to UV for 1.5 s using MJB4; AR 300-26 developer; proprietary formulation</text><text x="30" y="394" font-size="20" text-anchor="start" fill="#244659">unspecified</text><text x="30" y="430" font-size="20" text-anchor="start" fill="#244659">Outputs: Develop with AR 300-26</text><text x="30" y="466" font-size="20" text-anchor="start" fill="#244659">Developer amount and duration unreported.</text><text x="30" y="502" font-size="20" text-anchor="start" fill="#244659">Exact vessel type, size and hardware geometry are not reported; drawing is a qualified</text><text x="30" y="529" font-size="20" text-anchor="start" fill="#244659">schematic.</text><text x="30" y="565" font-size="20" text-anchor="start" fill="#244659">Qualified schematic; dimensions and fill levels are illustrative.</text><text x="30" y="601" font-size="20" text-anchor="start" fill="#244659">Source: Main PDF p.2, Photodetector Fabrication and Measurement</text></g></svg>