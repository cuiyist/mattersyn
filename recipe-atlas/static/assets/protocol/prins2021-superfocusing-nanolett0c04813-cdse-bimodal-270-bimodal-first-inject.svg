<svg xmlns="http://www.w3.org/2000/svg" width="960" height="762" viewBox="0 0 960 762" role="img" aria-labelledby="title desc"><title id="title">Stop nitrogen flow and inject 2 mL of 1 M TOP-Se</title><desc id="desc">Vessel dimensions and geometry are not reported for this operation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><g font-family="Arial,sans-serif"><rect width="960" height="762" rx="16" fill="#f7fafb"/><text x="28" y="42" font-size="27" text-anchor="start" fill="#274c60">Stop nitrogen flow and inject 2 mL of 1 M TOP-Se</text><text x="28" y="77" font-size="20" text-anchor="start" fill="#274c60">injection temperature: X+15 °C, X=270 °C; injection volume: 2 mL; concentration: 1 M; Atmosphere:</text><text x="28" y="105" font-size="20" text-anchor="start" fill="#274c60">nitrogen atmosphere; flow stopped</text><g transform="translate(0 161)"><rect x="399" y="104" width="162" height="155" rx="19" fill="#edf5f8" stroke="#466c7d" stroke-width="3"/><path d="M411 216q69 13 138 0" fill="none" stroke="#9dc1cf" stroke-width="4"/><g transform="translate(0 0)"><path d="M462 2h36v37h-36zM480-14v16M456-14h48M480 39v45" fill="#e1eef3" stroke="#426a7d" stroke-width="3"/></g><path d="M525 29L504 72" fill="none" stroke="#477e91" stroke-width="3" marker-end="url(#arrow)"/><text x="611" y="24" font-size="21" text-anchor="middle" fill="#274c60">Feed transfer</text><text x="480" y="292" font-size="20" text-anchor="middle" fill="#274c60">Vessel unspecified</text></g><text x="28" y="573" font-size="20" text-anchor="start" fill="#274c60">Inputs: Stir the 10 mL precursor mixture under nitrogen flow at 120 °C for 1 h; Selenium</text><text x="28" y="600" font-size="20" text-anchor="start" fill="#274c60">precursor in TOP</text><text x="28" y="627" font-size="20" text-anchor="start" fill="#274c60">Outputs: Stop nitrogen flow and inject 2 mL of 1 M TOP-Se</text><text x="28" y="654" font-size="20" text-anchor="start" fill="#274c60">Vessel dimensions and geometry are not reported for this operation.</text><text x="28" y="681" font-size="20" text-anchor="start" fill="#274c60">Schematic action illustration. Drawn shapes, dimensions and fill levels are illustrative; only</text><text x="28" y="708" font-size="20" text-anchor="start" fill="#274c60">stated source dimensions are quantitative.</text></g></svg>
