bed as a stoppered Erlenmeyer; dimensions and other equipment geometry are conceptual. Receiver charge and feed-to-receiver mixing ratio remain unknown. Film matrix upstream synthesis is not reconstructed. No measured particle or atomic coordinates.</desc></svg>
