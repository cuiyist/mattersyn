<svg xmlns="http://www.w3.org/2000/svg" width="960" height="845" viewBox="0 0 960 845"><title>Acquire QD–SA PL</title><desc>Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular geometry, or experimental trace is implied. No fabricated spectrum, pattern, micrograph or atomistic specimen is drawn. Instrument geometry is not reconstructed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><rect width="960" height="845" rx="15" fill="#f7fafc"/><text x="30" y="32" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#637f8e">Representative QD–SA optical properties</text><text x="30" y="57" font-family="Arial,sans-serif" font-size="28" text-anchor="start" fill="#173c4a">Acquire QD–SA PL</text><g transform="translate(70 110)"><rect x="240" y="47" width="340" height="188" rx="12" fill="#edf6f8" stroke="#3c6475" stroke-width="3"/><text x="410" y="122" font-family="Arial,sans-serif" font-size="25" text-anchor="middle" fill="#173c4a">Optical acquisition</text><text x="410" y="166" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#173c4a">No result drawn</text><text x="410" y="298" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#173c4a">Source data are shown in the cited figures</text></g><text x="30" y="505" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Inputs: Streptavidin-conjugated InP/ZnSe/ZnS quantum dots</text><text x="30" y="531" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="557" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Outputs: Acquire QD–SA PL</text><text x="30" y="583" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="609" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">SI Figure S3a reports the PL spectrum. Its excitation wavelength is not explicitly assigned by the</text><text x="30" y="635" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">caption; the 375 nm decay excitation is not silently assigned as the PL setting.</text><text x="30" y="661" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="687" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular</text><text x="30" y="713" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">geometry, or experimental trace is implied. No fabricated spectrum, pattern, micrograph or atomistic</text><text x="30" y="739" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">specimen is drawn. Instrument geometry is not reconstructed.</text><text x="30" y="765" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="791" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Source: SI PDF p.4, Figure S3</text></svg>