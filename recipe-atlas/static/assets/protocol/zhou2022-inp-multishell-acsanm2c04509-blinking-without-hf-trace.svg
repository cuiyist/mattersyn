<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1079" viewBox="0 0 960 1079"><title>Acquire the fluorescence time trace</title><desc>Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular geometry, or experimental trace is implied. No fabricated spectrum, pattern, micrograph or atomistic specimen is drawn. Instrument geometry is not reconstructed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><rect width="960" height="1079" rx="15" fill="#f7fafc"/><text x="30" y="32" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#637f8e">Without-HF blinking control</text><text x="30" y="57" font-family="Arial,sans-serif" font-size="28" text-anchor="start" fill="#173c4a">Acquire the fluorescence time trace</text><text x="30" y="92" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">excitation wavelength: 488 nm</text><text x="30" y="118" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">exposure: 30 ms</text><text x="30" y="144" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">frame count: 1000 frames</text><text x="30" y="170" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">objective magnification: 100 x — Common single-particle method</text><text x="30" y="196" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">objective na: 1.35 ratio — Common single-particle method</text><g transform="translate(70 240)"><rect x="240" y="47" width="340" height="188" rx="12" fill="#edf6f8" stroke="#3c6475" stroke-width="3"/><text x="410" y="122" font-family="Arial,sans-serif" font-size="25" text-anchor="middle" fill="#173c4a">Measurement</text><text x="410" y="166" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#173c4a">No result drawn</text><text x="410" y="298" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#173c4a">Source data are shown in the cited figures</text></g><text x="30" y="635" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Inputs: InP/ZnSe/ZnS quantum dots</text><text x="30" y="661" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="687" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Outputs: Acquire the fluorescence time trace</text><text x="30" y="713" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="739" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Continuous-wave excitation and sCMOS recording. The general 1000-frame, 30 ms acquisition is</text><text x="30" y="765" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">used for the reported blinking comparison; no complete without-HF synthesis is supplied. Illustration</text><text x="30" y="791" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">is an instrument/action cue, not a simulated experimental trace. The common method uses a Nikon</text><text x="30" y="817" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Si-oil immersion objective, Hamamatsu C5440-20UP sCMOS camera and ET500LP emission filter.</text><text x="30" y="843" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">The general camera rate is 30 fps; per-panel frame rates are only asserted where explicitly reported.</text><text x="30" y="869" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="895" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular</text><text x="30" y="921" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">geometry, or experimental trace is implied. No fabricated spectrum, pattern, micrograph or atomistic</text><text x="30" y="947" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">specimen is drawn. Instrument geometry is not reconstructed.</text><text x="30" y="973" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="999" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Source: Main PDF pp.6–7, Figure 4 and blinking discussion; Main PDF pp.3–4, Section 2.2,</text><text x="30" y="1025" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Instrumentation and Characterization</text></svg>