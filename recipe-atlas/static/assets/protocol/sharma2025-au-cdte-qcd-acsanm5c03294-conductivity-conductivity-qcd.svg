<svg xmlns="http://www.w3.org/2000/svg" width="960" height="713" viewBox="0 0 960 713" role="img"><title>Measure Selected set-D QCDs four-probe conductivity</title><desc>Source-linked conceptual stage; geometry and unreported fields are not measurements.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="713" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#647888">Four-probe transport controls</text><text x="30" y="68" font-size="28" text-anchor="start" fill="#234b60">Measure Selected set-D QCDs four-probe conductivity</text><text x="30" y="107" font-size="21" text-anchor="start" fill="#234b60">temperature range: 77–300 K</text><g transform="translate(0 143)"><rect x="281" y="64" width="398" height="134" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><text x="480" y="122" font-size="27" text-anchor="middle" fill="#234b60">Four-probe measurement</text><path d="M369 13v46" stroke="#557f91" stroke-width="6"/><path d="M442 13v46" stroke="#557f91" stroke-width="6"/><path d="M515 13v46" stroke="#557f91" stroke-width="6"/><path d="M588 13v46" stroke="#557f91" stroke-width="6"/><text x="480" y="247" font-size="21" text-anchor="middle" fill="#234b60">Specimen form, electrodes and probe spacing not reported</text></g><text x="30" y="437" font-size="20" text-anchor="start" fill="#234b60">Inputs: AuNC/CdTe hybrid quantum cluster dots</text><text x="30" y="473" font-size="20" text-anchor="start" fill="#234b60">Output: Measure Selected set-D QCDs four-probe conductivity</text><text x="30" y="509" font-size="20" text-anchor="start" fill="#234b60">Standard four-probe technique only. No film/pellet preparation, substrate, electrodes, probe</text><text x="30" y="536" font-size="20" text-anchor="start" fill="#234b60">spacing, dimensions or voltage/current is reconstructed; generic measurement cue is not a</text><text x="30" y="563" font-size="20" text-anchor="start" fill="#234b60">device architecture.</text><text x="30" y="599" font-size="20" text-anchor="start" fill="#234b60">Generic apparatus cue; vessel dimensions, quantitative liquid level and spatial layout are not</text><text x="30" y="626" font-size="20" text-anchor="start" fill="#234b60">measured source geometry.</text><text x="30" y="662" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.8 §3.4; Main PDF p.7 Figure 4a–c</text></g></svg>