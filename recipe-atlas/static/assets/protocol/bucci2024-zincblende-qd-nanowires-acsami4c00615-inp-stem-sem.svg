<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 740" width="1040" height="740" role="img"><title>Image the nanowires by SEM</title><desc>Zeiss Merlin SEM at 5 kV; top views and side views at 45° are described in the common method. ImageJ is used for geometrical analysis. No coating, acquisition dose or exact batch ID is given. Qualified action/instrument schematic; hardware dimensions and unreported preparation settings are not inferred.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#217e92"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1040" height="740" rx="18" fill="#fbfdfe"/><text x="44" y="42" fill="#486572" font-size="17" font-weight="700">BUCCI ET AL. · 2024 / inp-stem</text><text x="44" y="77" fill="#183647" font-size="28" font-weight="700">Image the nanowires by SEM</text><text x="44" y="118" fill="#217e92" font-size="17" font-weight="700">STAGE 3  ·  Scanning electron microscopy</text><g transform="translate(0 138)"><rect x="466" y="23" width="100" height="45" rx="8" fill="#d9e6eb" stroke="#5c7785" stroke-width="2"/><text x="414" y="14" fill="#233947" font-size="18" font-weight="400">Electron-beam cue</text><path d="M516,73 L516,125" fill="none" stroke="#217e92" stroke-width="3" marker-end="url(#arrow)"/><rect x="370" y="137" width="290" height="20" rx="8" fill="#a3bdc7" stroke="#5c7785" stroke-width="2"/><text x="378" y="186" fill="#233947" font-size="18" font-weight="400">Specimen context</text><path d="M599,138 L724,94" fill="none" stroke="#217e92" stroke-width="3" marker-end="url(#arrow)"/><rect x="744" y="59" width="160" height="75" rx="8" fill="#e7f0f3" stroke="#5c7785" stroke-width="2"/><text x="762" y="102" fill="#233947" font-size="18" font-weight="400">Signal detector</text><text x="72" y="103" fill="#536977" font-size="20" font-weight="400">Diagram only</text><text x="72" y="133" fill="#536977" font-size="18" font-weight="400">No result drawn</text></g><path d="M44,417 H996" stroke="#cfdee4"/><text x="44" y="433" fill="#486572" font-size="17" font-weight="700">REPORTED CONDITIONS AND LIMITS</text><text x="52" y="463" fill="#233947" font-size="20" font-weight="400">Accelerating voltage: 5 kV</text><text x="52" y="491" fill="#233947" font-size="20" font-weight="400">Side view tilt: 45 degree</text><text x="44" y="528" fill="#486572" font-size="17" font-weight="700">SOURCE QUALIFICATION</text><text x="44" y="558" fill="#233947" font-size="19" font-weight="400">Zeiss Merlin SEM at 5 kV; top views and side views at 45° are described in the common method. ImageJ is</text><text x="44" y="585" fill="#233947" font-size="19" font-weight="400">used for geometrical analysis. No coating, acquisition dose or exact batch ID is given.</text><text x="44" y="626" fill="#536977" font-size="17" font-weight="400">Qualified action/instrument schematic; hardware dimensions and unreported preparation settings are not inferred. Functional</text><text x="44" y="651" fill="#536977" font-size="17" font-weight="400">symbols only; no measured specimen geometry or apparatus layout.</text><text x="44" y="688" fill="#536977" font-size="16" font-weight="400">Main PDF p.3, Materials and Methods</text></g></svg>