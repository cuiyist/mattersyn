<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460"><title>Add sodium linoleate</title><desc>Add 0.8 g sodium linoleate after the aqueous silver precursor, following the stated sequence. Conceptual geometry; no measured apparatus design.</desc><rect width="800" height="460" rx="20" fill="#f3f8fa"/><g font-family="Arial"><text x="34" y="44" font-size="25" fill="#173a45">Add sodium linoleate</text><text x="34" y="142" font-size="20" fill="#244855">Sodium linoleate</text><text x="34" y="169" font-size="20" fill="#244855">0.8 g</text><text x="34" y="336" font-size="20" fill="#244855">Add after the aqueous silver stock</text><text x="34" y="363" font-size="20" fill="#244855">Mixing and reagent grade unreported</text><path d="M490 166 V274 Q490 294 510 294 H650 Q670 294 670 274 V166" fill="none" stroke="#315d69" stroke-width="5"/><path d="M576 100 V144 M565 132 L576 145 L587 132" fill="none" stroke="#0f8990" stroke-width="4"/><text x="34" y="412" font-size="17" fill="#49626c">Source-bound concept; geometry is illustrative, not measured.</text><text x="34" y="439" font-size="16" fill="#49626c">Qiu et al. 2006 · Supplied PDF pp. 2–3 · Exact locators in protocol</text></g></svg>