<svg xmlns="http://www.w3.org/2000/svg" width="960" height="770" viewBox="0 0 960 770" role="img"><title>Stir at 0 °C for 1 h</title><desc>Source-linked conceptual stage; geometry and unreported fields are not measurements.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="770" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#647888">NaHTe precursor preparation</text><text x="30" y="68" font-size="28" text-anchor="start" fill="#234b60">Stir at 0 °C for 1 h</text><text x="30" y="107" font-size="21" text-anchor="start" fill="#234b60">temperature: 0 degC</text><text x="30" y="135" font-size="21" text-anchor="start" fill="#234b60">duration: 1 h</text><text x="30" y="163" font-size="21" text-anchor="start" fill="#234b60">Environment: nitrogen</text><text x="30" y="191" font-size="21" text-anchor="start" fill="#234b60">Endpoint: purple NaHTe precursor</text><g transform="translate(0 227)"><rect x="421" y="20" width="118" height="165" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M429 150q51.0 9 102 0" fill="none" stroke="#9abfce" stroke-width="4"/><path d="M450 158h60" stroke="#557f91" stroke-width="6"/><text x="480" y="235" font-size="21" text-anchor="middle" fill="#234b60">Stirring rate and vessel geometry not reported</text><text x="700" y="81" font-size="22" text-anchor="middle" fill="#234b60">0 °C reaction</text><text x="700" y="116" font-size="19" text-anchor="middle" fill="#234b60">Bath not specified</text><text x="221" y="50" font-size="22" text-anchor="middle" fill="#234b60">N₂ atmosphere</text><path d="M248 73L394 73" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/></g><text x="30" y="521" font-size="20" text-anchor="start" fill="#234b60">Inputs: Add tellurium powder</text><text x="30" y="557" font-size="20" text-anchor="start" fill="#234b60">Output: Stir at 0 °C for 1 h</text><text x="30" y="593" font-size="20" text-anchor="start" fill="#234b60">A 0 °C reaction temperature is reported; an ice bath is not explicitly specified. Sodium</text><text x="30" y="620" font-size="20" text-anchor="start" fill="#234b60">tetraborate is a reported byproduct.</text><text x="30" y="656" font-size="20" text-anchor="start" fill="#234b60">Generic apparatus cue; vessel dimensions, quantitative liquid level and spatial layout are not</text><text x="30" y="683" font-size="20" text-anchor="start" fill="#234b60">measured source geometry.</text><text x="30" y="719" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.3 §2.3</text></g></svg>