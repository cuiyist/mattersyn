<svg xmlns="http://www.w3.org/2000/svg" width="960" height="624" viewBox="0 0 960 624" role="img"><title>Precipitate the QDs using toluene</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3e778d"/></marker></defs><rect width="960" height="624" fill="#fff"/><g font-family="Arial, sans-serif"><text x="30" y="44" font-size="28" text-anchor="start" fill="#244659">Precipitate the QDs using toluene</text><g transform="translate(0 95)"><rect x="238" y="30" width="85" height="132" rx="12" stroke="#47778a" stroke-width="3" fill="#edf5f8"/><path d="M248 120q32.5 12 65 0" fill="none" stroke="#91bbc9" stroke-width="3"/><path d="M367 96L589 96" stroke="#3e778d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="637" y="30" width="85" height="132" rx="12" stroke="#47778a" stroke-width="3" fill="#edf5f8"/><path d="M647 120q32.5 12 65 0" fill="none" stroke="#91bbc9" stroke-width="3"/><text x="480" y="205" font-size="23" text-anchor="middle" fill="#244659">Toluene precipitation</text></g><text x="30" y="367" font-size="20" text-anchor="start" fill="#244659">Inputs: Transfer obtained solution into a glovebox for purification; Toluene</text><text x="30" y="403" font-size="20" text-anchor="start" fill="#244659">Outputs: Precipitate the QDs using toluene</text><text x="30" y="439" font-size="20" text-anchor="start" fill="#244659">Toluene antisolvent volume and number of precipitation cycles are not specified.</text><text x="30" y="475" font-size="20" text-anchor="start" fill="#244659">Exact vessel type, size and hardware geometry are not reported; drawing is a qualified</text><text x="30" y="502" font-size="20" text-anchor="start" fill="#244659">schematic.</text><text x="30" y="538" font-size="20" text-anchor="start" fill="#244659">Qualified schematic; dimensions and fill levels are illustrative.</text><text x="30" y="574" font-size="20" text-anchor="start" fill="#244659">Source: SI PDF p.2, Room-temperature Synthesis of PbSe QD inks</text></g></svg>