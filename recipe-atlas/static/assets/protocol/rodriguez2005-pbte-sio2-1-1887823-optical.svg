<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img"><title>Illustrative optical operation</title><rect width="640" height="320" rx="16" fill="#f4f8fb"/><g font-family="Segoe UI,Arial,sans-serif" fill="#18384c" font-size="18"><rect x="100" y="65" width="440" height="55" fill="#d2e8ed" stroke="#5c7f92"/><path d="M70 90 L140 90 L180 115 L230 70 L280 115 L330 70 L380 115 L430 70 L480 115 L560 90" stroke="#d5a044" stroke-width="4" fill="none"/><text x="320" y="160" text-anchor="middle" font-size="23" stroke="#f4f8fb" stroke-width="4" paint-order="stroke">Multipass total internal reflection</text><text x="320" y="215" text-anchor="middle" font-size="20" stroke="#f4f8fb" stroke-width="4" paint-order="stroke">Measure separate P / Q / R regions</text><text x="320" y="270" text-anchor="middle" font-size="15" stroke="#f4f8fb" stroke-width="4" paint-order="stroke">Geometry schematic, not measured ray paths</text></g></svg>