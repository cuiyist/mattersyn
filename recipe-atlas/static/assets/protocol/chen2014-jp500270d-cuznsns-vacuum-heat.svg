<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" role="img" aria-label="Conceptual Vacuum stage operation"><title>Vacuum heat in the same reaction flask</title><desc>Source: Chen et al. 2014, main PDF p.2 / printed 11955. The same 50 mL three-neck round-bottom flask is retained through charging, vacuum heating, argon heating, sulfur injection, growth and cooling. Shape, liquid level and neck arrangement are schematic. No transfer, tubing, valve layout or measured dimensions are asserted.</desc><rect width="800" height="270" rx="22" fill="#f4f8fb"/><rect x="30" y="30" width="385" height="205" rx="18" fill="#fff" stroke="#d5e3ee"/><text x="54" y="89" fill="#17344b" font-family="Arial" font-size="26" font-weight="700">Vacuum stage</text><text x="54" y="139" fill="#2d6173" font-family="Arial" font-size="15">135 °C for 120 min</text><text x="54" y="198" fill="#526977" font-family="Arial" font-size="12">Source-linked conceptual apparatus; not to scale</text><g id="same-reaction-flask" aria-label="Same 50 mL three-neck round-bottom reaction flask"><path d="M548 102 L529 72 L515 81 L534 115 C513 126 502 146 502 166 C502 196 528 217 570 217 C612 217 638 196 638 166 C638 146 627 126 606 115 L625 81 L611 72 L592 102 C588 100 583 99 578 98 L578 52 L562 52 L562 98 C557 99 552 100 548 102 Z" fill="#dff1ee" stroke="#2c6870" stroke-width="4" stroke-linejoin="round"/><path d="M514 164 Q570 150 626 164" fill="none" stroke="#56a5a5" stroke-width="4"/><text x="570" y="235" text-anchor="middle" fill="#526977" font-family="Arial" font-size="12">50 mL · three-neck round-bottom flask</text></g><text x="446" y="246" fill="#526977" font-family="Arial" font-size="13">Chen et al. 2014, main p.2</text></svg>
