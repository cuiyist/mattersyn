<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="715" viewBox="0 0 1100 715"><rect width="1100" height="715" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="42" font-size="27" font-weight="bold" fill="#173047">06 Dry the coated electrode at 80 C for 1 h</text><text x="28" y="91" font-size="17" font-weight="normal" fill="#596b7d">primary reported preparation</text><g transform="translate(0 101)"><g transform="translate(875 0)" stroke="#1b6986" fill="none" stroke-width="3" stroke-linejoin="round"><rect x="14" y="16" width="131" height="84" rx="8"/><path d="M34 77h89 M41 69h77 M47 58c-10-10 10-15 0-30 M81 58c-10-10 10-15 0-30 M115 58c-10-10 10-15 0-30"/></g></g><text x="28" y="136" font-size="23" font-weight="normal" fill="#135d83">Oven drying / coated electrode • conceptual action symbol</text><rect x="26" y="223" width="500" height="187" rx="12" fill="#e6f1fa"/><text x="42" y="261" font-size="19" font-weight="bold" fill="#173047">INPUTS</text><text x="42" y="296" font-size="20" font-weight="normal" fill="#173047">Sample C paste coated on FTO glass</text><rect x="572" y="223" width="500" height="187" rx="12" fill="#e5f4ed"/><text x="588" y="261" font-size="19" font-weight="bold" fill="#173047">OUTPUTS / PHYSICAL STATES</text><text x="588" y="296" font-size="20" font-weight="normal" fill="#173047">dried Sample C PbS/CB composite counter</text><text x="588" y="323" font-size="20" font-weight="normal" fill="#173047">electrode</text><text x="588" y="354" font-size="18" font-weight="normal" fill="#173047">Kind: product</text><text x="28" y="448" font-size="21" font-weight="normal" fill="#173047">Dry in an oven at 80 C for 1 h to obtain the composite counter electrode. Atmosphere, ramp and storage are</text><text x="28" y="476" font-size="21" font-weight="normal" fill="#173047">unreported.</text><text x="28" y="517" font-size="21" font-weight="normal" fill="#173047">temperature: 80 degC</text><text x="28" y="558" font-size="21" font-weight="normal" fill="#173047">duration: 1 h</text><text x="28" y="599" font-size="21" font-weight="normal" fill="#173047">Environment: not reported</text><text x="28" y="640" font-size="15" font-weight="normal" fill="#596b7d">Conceptual and not to scale; no unreported apparatus geometry, liquid levels or handling atmosphere inferred.</text><text x="28" y="670" font-size="15" font-weight="normal" fill="#596b7d">Yang et al. (2012) • Main PDF p.2 / printed p.6163, Experimental, Preparation of PbS/CB Composite Counter Electrode</text></g></svg>