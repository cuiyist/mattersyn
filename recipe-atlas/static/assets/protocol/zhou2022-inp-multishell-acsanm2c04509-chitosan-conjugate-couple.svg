<svg xmlns="http://www.w3.org/2000/svg" width="960" height="897" viewBox="0 0 960 897"><title>Add chitosanic acetate and shake slowly</title><desc>Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular geometry, or experimental trace is implied. Drawing dimensions and liquid level are schematic, not measured geometry. No mechanical shaker, stirring bar, or speed is inferred.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><rect width="960" height="897" rx="15" fill="#f7fafc"/><text x="30" y="32" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#637f8e">Chitosan coupling of QD–MPA</text><text x="30" y="57" font-family="Arial,sans-serif" font-size="28" text-anchor="start" fill="#173c4a">Add chitosanic acetate and shake slowly</text><text x="30" y="92" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">duration: 12 h</text><text x="30" y="118" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">stock volume: 2 mL</text><g transform="translate(70 162)"><rect x="360" y="50" width="100" height="169" rx="8" fill="#eef6f8" stroke="#3c6475" stroke-width="3"/><path d="M360 68h100M368 187q42.0 10 84 0" fill="none" stroke="#9abbc8" stroke-width="4"/><path d="M267 135L336 135" fill="none" stroke="#477e91" stroke-width="4" marker-end="url(#arrow)"/><path d="M487 135L556 135" fill="none" stroke="#477e91" stroke-width="4" marker-end="url(#arrow)"/><text x="410" y="301" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#173c4a">Reported shaking / mixing</text></g><text x="30" y="557" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Inputs: Mix QD–MPA with EDC; Chitosan; deacetylation &gt;=80%; molecular weight unspecified</text><text x="30" y="583" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="609" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Outputs: Add chitosanic acetate and shake slowly</text><text x="30" y="635" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="661" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Source says slowly shaken overnight for 12 h. Do not infer a different vessel capacity despite the</text><text x="30" y="687" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">added stock volume.</text><text x="30" y="713" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="739" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular</text><text x="30" y="765" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">geometry, or experimental trace is implied. Drawing dimensions and liquid level are schematic, not</text><text x="30" y="791" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">measured geometry. No mechanical shaker, stirring bar, or speed is inferred.</text><text x="30" y="817" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="843" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Source: Main PDF p.4, Section 2.3, Cellular and Subcellular Labeling</text></svg>