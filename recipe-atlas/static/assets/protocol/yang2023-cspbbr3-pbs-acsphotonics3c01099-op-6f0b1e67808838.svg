<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820"><rect width="1000" height="820" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="32" y="40" font-size="25" fill="#213446">04  Dilute PbBr2-TOPO preparation with hexane</text><text x="32" y="84" font-size="17" fill="#526477">Pb/S 1:1 core route · conceptual process illustration</text><rect x="25" y="115" width="370" height="295" rx="12" fill="#e6f1fa"/><rect x="605" y="115" width="370" height="295" rx="12" fill="#e5f4ed"/><text x="44" y="147" font-size="18" fill="#213446">INPUTS</text><text x="624" y="147" font-size="18" fill="#213446">OUTPUTS / PHYSICAL STATES</text><text x="44" y="180" font-size="18" fill="#213446">heated PbBr2-TOPO preparation</text><text x="44" y="205" font-size="18" fill="#213446">mixture</text><text x="44" y="242" font-size="18" fill="#213446">hexane; volume: 20 mL</text><text x="624" y="180" font-size="18" fill="#213446">PbBr2-TOPO solution after hexane</text><text x="624" y="205" font-size="18" fill="#213446">dilution [stock]</text><g stroke="#1c6480" stroke-width="4" fill="none" stroke-linejoin="round"><path d="M447 187h43v70h-43z M470 164v22 M510 225h45v79h-45z M488 240h17 M497 233l10 8-10 7"/><path d="M400 354h192 M579 344l13 10-13 10"/></g><text x="420" y="375" font-size="15" fill="#213446">Operation symbol;</text><text x="410" y="397" font-size="15" fill="#213446">geometry not reported</text><text x="32" y="452" font-size="18" fill="#213446">Add 20 mL hexane; reported stock concentration 0.04 M. Do not infer a single solution complex.</text><text x="32" y="773" font-size="15" fill="#596b7d">Atmosphere / pressure: not reported. Icons do not specify vessel type, size or fill level.</text><text x="32" y="799" font-size="14" fill="#596b7d">Source: Yang et al. (2023), main PDF p.7; room-temperature context p.2.</text></g></svg>