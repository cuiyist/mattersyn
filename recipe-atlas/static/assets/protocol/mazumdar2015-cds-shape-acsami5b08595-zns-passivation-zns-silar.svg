<svg xmlns="http://www.w3.org/2000/svg" width="960" height="845" viewBox="0 0 960 845" role="img"><title>Apply two ZnS SILAR cycles, each 1 min</title><desc>Source-linked stage schematic. No unreported equipment dimensions or solution species are asserted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="845" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="34" font-size="18" text-anchor="start" fill="#647888">Additional ZnS SILAR passivation; variant mapping unresolved</text><text x="30" y="73" font-size="28" text-anchor="start" fill="#234b60">Apply two ZnS SILAR cycles, each 1 min</text><text x="30" y="112" font-size="21" text-anchor="start" fill="#234b60">cycles: 2 count</text><text x="30" y="140" font-size="21" text-anchor="start" fill="#234b60">duration per cycle: 1 min — source says eachcycle; no separate half-bath timing invented</text><text x="30" y="168" font-size="21" text-anchor="start" fill="#234b60">zinc acetate concentration: 0.2 M</text><text x="30" y="196" font-size="21" text-anchor="start" fill="#234b60">sodium sulfide concentration: 0.2 M</text><g transform="translate(0 230)"><rect x="156" y="44" width="255" height="148" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><rect x="555" y="44" width="255" height="148" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><text x="283" y="32" font-size="21" text-anchor="middle" fill="#234b60">0.2 M zinc acetate</text><text x="683" y="32" font-size="21" text-anchor="middle" fill="#234b60">0.2 M sodium sulfide</text><rect x="203" y="121" width="160" height="22" fill="#cadde7" stroke="#557f91" stroke-width="3"/><path d="M211 114h144" stroke="#ac8d48" stroke-width="7"/><rect x="605" y="121" width="160" height="22" fill="#cadde7" stroke="#557f91" stroke-width="3"/><path d="M613 114h144" stroke="#ac8d48" stroke-width="7"/><path d="M427 95L533 95" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M533 133L427 133" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="480" y="228" font-size="21" text-anchor="middle" fill="#234b60">Bath geometry illustrative; rinse steps not supplied</text></g><text x="30" y="570" font-size="20" text-anchor="start" fill="#234b60">Inputs: Sensitized TiO2 film selected for ZnS passivation; specimen mapping unresolved; Zinc</text><text x="30" y="597" font-size="20" text-anchor="start" fill="#234b60">acetate; hydration unspecified; Sodium sulfide; hydration unspecified; Water</text><text x="30" y="633" font-size="20" text-anchor="start" fill="#234b60">Output: Apply two ZnS SILAR cycles, each 1 min</text><text x="30" y="669" font-size="20" text-anchor="start" fill="#234b60">0.2M aqueous zinc acetate and0.2M aqueous sodium sulfide. Surface-trap passivation is authors</text><text x="30" y="696" font-size="20" text-anchor="start" fill="#234b60">stated purpose; no conformal shell thickness or individual device mapping established.</text><text x="30" y="732" font-size="20" text-anchor="start" fill="#234b60">Apparatus dimensions, liquid level and spatial layout are schematic, not measured source</text><text x="30" y="759" font-size="20" text-anchor="start" fill="#234b60">geometry.</text><text x="30" y="795" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.2 §2.3</text></g></svg>