<svg xmlns="http://www.w3.org/2000/svg" width="820" height="638" viewBox="0 0 820 638"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#4d8195" stroke-width="1.5"/></marker></defs><rect width="820" height="638" rx="14" fill="#f5f8fa"/><text x="26" y="40" text-anchor="start" font-family="Arial,sans-serif" font-size="27" fill="#173d50">Acquire photoluminescence at 413nm excitation</text><text x="26" y="74" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#173d50">excitation wavelength: 413 nm; starting optical density: ≤0.05 AU (at most);</text><text x="26" y="100" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#173d50">maximum count rate: 2×10^6 cps (not exceed)</text><g transform="translate(0 186)"><path d="M216 32v189h397" fill="none" stroke="#385f70" stroke-width="4"/><path d="M219 195C300 190 309 48 353 60S405 190 466 199S580 201 608 195" fill="none" stroke="#4d8195" stroke-width="5"/><text x="405" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#173d50">Acquisition cue • not source data</text></g><text x="26" y="496" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#173d50">Inputs: Acquire quantitative absorption spectrum</text><text x="26" y="524" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#173d50">Output: Acquire photoluminescence at 413nm excitation</text><text x="26" y="552" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#173d50">Illustrative acquisition cue, not a measured spectrum; actual source plots are</text><text x="26" y="580" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#173d50">separate.</text></svg>