<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830"><rect width="1000" height="830" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="27" y="42" font-size="25" fill="#213446" stroke="none">14  Dialyze against pH9water</text><text x="28" y="81" font-size="17" fill="#596b7d" stroke="none">CS-QD hybrid preparation · source-bound conceptual stage</text><rect x="24" y="112" width="372" height="315" rx="12" fill="#e6f1fa"/><rect x="604" y="112" width="372" height="315" rx="12" fill="#e5f4ed"/><text x="43" y="146" font-size="18" fill="#213446" stroke="none">INPUTS</text><text x="623" y="146" font-size="17" fill="#213446" stroke="none">OUTPUTS / PHYSICAL STATES</text><text x="43" y="179" font-size="18" fill="#213446" stroke="none">hybrid particle dispersion</text><text x="43" y="215" font-size="18" fill="#213446" stroke="none">deionized water; amount: not</text><text x="43" y="239" font-size="18" fill="#213446" stroke="none">reported</text><text x="623" y="179" font-size="18" fill="#213446" stroke="none">CS-QD hybrid nanospheres in water</text><text x="623" y="203" font-size="18" fill="#213446" stroke="none">[product]</text><g stroke="#1c6480" stroke-width="3" fill="none" stroke-linejoin="round"><rect x="470" y="185" width="60" height="130" stroke-dasharray="6 5"/><path d="M431 226h27 M445 218l14 8-14 8 M541 276h29 M556 268l14 8-14 8"/><text x="420" y="347" font-size="16" fill="#213446" stroke="none">Dialysis boundary</text><text x="420" y="372" font-size="15" fill="#213446" stroke="none">Cutoff unspecified</text></g><text x="28" y="460" font-size="18" fill="#213446" stroke="none">Dialyze particle solution against deionized water at pH9 for 24h to remove EDTA. Membrane</text><text x="28" y="484" font-size="18" fill="#213446" stroke="none">cutoff,bath volume,temperature and bath exchanges unreported.</text><text x="28" y="521" font-size="18" fill="#213446" stroke="none">external medium pH: 9</text><text x="28" y="558" font-size="18" fill="#213446" stroke="none">duration: 24 h</text><text x="28" y="595" font-size="18" fill="#213446" stroke="none">Environment: not reported. Per-step atmosphere, pressure and unreported hardware are not</text><text x="28" y="619" font-size="18" fill="#213446" stroke="none">inferred.</text><text x="28" y="774" font-size="15" fill="#596b7d" stroke="none">Conceptual illustration; no measured geometry, levels or unreported apparatus inferred.</text><text x="28" y="799" font-size="14" fill="#596b7d" stroke="none">Lin et al.(2011) · Main PDF p.3 / printed p.997, Preparation of CS-QD Hybrid Nanospheres continued</text></g></svg>