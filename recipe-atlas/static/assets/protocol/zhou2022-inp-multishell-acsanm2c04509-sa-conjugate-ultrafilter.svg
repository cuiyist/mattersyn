<svg xmlns="http://www.w3.org/2000/svg" width="960" height="975" viewBox="0 0 960 975"><title>Concentrate the filtrate by ultrafiltration</title><desc>Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular geometry, or experimental trace is implied. Drawing dimensions and liquid level are schematic, not measured geometry. No centrifuge model or unsupported fraction assignment is inferred.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><rect width="960" height="975" rx="15" fill="#f7fafc"/><text x="30" y="32" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#637f8e">Streptavidin coupling of QD–MPA</text><text x="30" y="57" font-family="Arial,sans-serif" font-size="28" text-anchor="start" fill="#173c4a">Concentrate the filtrate by ultrafiltration</text><text x="30" y="92" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">cutoff: 100 kDa</text><text x="30" y="118" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">tube capacity: 0.5 mL</text><text x="30" y="144" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">speed: 12000 rpm</text><text x="30" y="170" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">duration: 5 min</text><g transform="translate(70 214)"><rect x="104" y="55" width="72" height="133" rx="8" fill="#eef6f8" stroke="#3c6475" stroke-width="3"/><path d="M104 73h72M112 156q28.0 10 56 0" fill="none" stroke="#9abbc8" stroke-width="4"/><path d="M208 121L299 121" fill="none" stroke="#477e91" stroke-width="4" marker-end="url(#arrow)"/><circle cx="401" cy="119" r="73" fill="#edf6f8" stroke="#3c6475" stroke-width="3"/><rect x="390" y="53" width="22" height="38" rx="5" fill="#9dbfcd" stroke="#3c6475" stroke-width="2" transform="rotate(0 401 119)"/><rect x="390" y="53" width="22" height="38" rx="5" fill="#9dbfcd" stroke="#3c6475" stroke-width="2" transform="rotate(90 401 119)"/><rect x="390" y="53" width="22" height="38" rx="5" fill="#9dbfcd" stroke="#3c6475" stroke-width="2" transform="rotate(180 401 119)"/><rect x="390" y="53" width="22" height="38" rx="5" fill="#9dbfcd" stroke="#3c6475" stroke-width="2" transform="rotate(270 401 119)"/><path d="M508 121L600 121" fill="none" stroke="#477e91" stroke-width="4" marker-end="url(#arrow)"/><rect x="644" y="55" width="72" height="133" rx="8" fill="#eef6f8" stroke="#3c6475" stroke-width="3"/><path d="M644 73h72M652 156q28.0 10 56 0" fill="none" stroke="#9abbc8" stroke-width="4"/><text x="398" y="273" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#173c4a">Centrifuge / separate</text><text x="410" y="324" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#173c4a">Retained fraction: see explicit operation text</text></g><text x="30" y="609" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Inputs: Filter through a PES membrane</text><text x="30" y="635" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="661" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Outputs: Concentrate the filtrate by ultrafiltration</text><text x="30" y="687" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="713" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Retained fraction: Concentrate the filtrate by ultrafiltration</text><text x="30" y="739" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="765" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Source calls the retained QD fraction a precipitate; no claim that soluble filtrate is the product.</text><text x="30" y="791" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="817" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular</text><text x="30" y="843" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">geometry, or experimental trace is implied. Drawing dimensions and liquid level are schematic, not</text><text x="30" y="869" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">measured geometry. No centrifuge model or unsupported fraction assignment is inferred.</text><text x="30" y="895" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="921" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Source: Main PDF p.3, Section 2.1.4, Surface Coupling Modification</text></svg>