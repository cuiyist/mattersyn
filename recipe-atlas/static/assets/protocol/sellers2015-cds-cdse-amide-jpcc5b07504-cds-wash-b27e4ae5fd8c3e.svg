<svg xmlns="http://www.w3.org/2000/svg" width="820" height="708" viewBox="0 0 820 708"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><rect width="820" height="708" rx="16" fill="#f5f9fb"/><text x="25" y="41" font-family="Arial,sans-serif" font-size="26" text-anchor="start" fill="#173c4a">Flocculate with acetone, centrifuge and redisperse in</text><text x="25" y="73" font-family="Arial,sans-serif" font-size="26" text-anchor="start" fill="#173c4a">water; repeat twice</text><text x="25" y="105" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">total cycles: initial cycle, repeated twice</text><g transform="translate(0 158)"><rect x="104" y="55" width="72" height="133" rx="8" fill="#eef6f8" stroke="#3c6475" stroke-width="3"/><path d="M104 73h72M112 156q28.0 10 56 0" fill="none" stroke="#9abbc8" stroke-width="4"/><path d="M208 121L299 121" fill="none" stroke="#477e91" stroke-width="4" marker-end="url(#arrow)"/><circle cx="401" cy="119" r="73" fill="#edf6f8" stroke="#3c6475" stroke-width="3"/><rect x="390" y="53" width="22" height="38" rx="5" fill="#9dbfcd" stroke="#3c6475" stroke-width="2" transform="rotate(0 401 119)"/><rect x="390" y="53" width="22" height="38" rx="5" fill="#9dbfcd" stroke="#3c6475" stroke-width="2" transform="rotate(90 401 119)"/><rect x="390" y="53" width="22" height="38" rx="5" fill="#9dbfcd" stroke="#3c6475" stroke-width="2" transform="rotate(180 401 119)"/><rect x="390" y="53" width="22" height="38" rx="5" fill="#9dbfcd" stroke="#3c6475" stroke-width="2" transform="rotate(270 401 119)"/><path d="M508 121L600 121" fill="none" stroke="#477e91" stroke-width="4" marker-end="url(#arrow)"/><rect x="644" y="55" width="72" height="133" rx="8" fill="#eef6f8" stroke="#3c6475" stroke-width="3"/><path d="M644 73h72M652 156q28.0 10 56 0" fill="none" stroke="#9abbc8" stroke-width="4"/><text x="398" y="273" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#173c4a">Centrifuge / separate</text></g><text x="25" y="545" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Inputs: Stir overnight at room temperature; Acetone; Deionized water</text><text x="25" y="572" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Outputs: Flocculate with acetone, centrifuge and redisperse in water; repeat</text><text x="25" y="599" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">twice</text><text x="25" y="626" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Illustrative action only. Vessel shape, capacity and drawing dimensions are not</text><text x="25" y="653" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">source measurements. Rotor geometry, speed and duration are not inferred.</text></svg>