<svg xmlns="http://www.w3.org/2000/svg" width="960" height="686" viewBox="0 0 960 686" role="img"><title>Measure MPA-CdTe QDs zeta potential</title><desc>Source-linked conceptual stage; geometry and unreported fields are not measurements.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="686" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#647888">Zeta-potential controls</text><text x="30" y="68" font-size="28" text-anchor="start" fill="#234b60">Measure MPA-CdTe QDs zeta potential</text><text x="30" y="107" font-size="21" text-anchor="start" fill="#234b60">No additional numerical condition specified for this stage.</text><g transform="translate(0 143)"><rect x="275" y="30" width="410" height="165" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><text x="480" y="92" font-size="27" text-anchor="middle" fill="#234b60">Zeta-potential acquisition</text><text x="480" y="145" font-size="19" text-anchor="middle" fill="#234b60">Malvern zetasizer nano s90</text><text x="480" y="245" font-size="20" text-anchor="middle" fill="#234b60">Instrument cue; unreported specimen preparation remains unknown</text></g><text x="30" y="437" font-size="20" text-anchor="start" fill="#234b60">Inputs: MPA-capped CdTe quantum dots; colloidal material</text><text x="30" y="473" font-size="20" text-anchor="start" fill="#234b60">Output: Measure MPA-CdTe QDs zeta potential</text><text x="30" y="509" font-size="20" text-anchor="start" fill="#234b60">Malvern zetasizer nano s90 named in instrumentation. Measurement medium, concentration, pH and</text><text x="30" y="536" font-size="20" text-anchor="start" fill="#234b60">temperature not separately specified.</text><text x="30" y="572" font-size="20" text-anchor="start" fill="#234b60">Generic apparatus cue; vessel dimensions, quantitative liquid level and spatial layout are not</text><text x="30" y="599" font-size="20" text-anchor="start" fill="#234b60">measured source geometry.</text><text x="30" y="635" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.2 §2.2; SI PDF p.9 Figure S6</text></g></svg>