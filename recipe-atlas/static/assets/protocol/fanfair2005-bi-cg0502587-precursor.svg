<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" role="img" aria-labelledby="t d"><title id="t">Bi precursor charge</title><desc id="d">Authored explanatory scene for Fanfair and Korgel's Bi nanocrystal preparation; no measured apparatus geometry.</desc><rect x="2" y="2" width="676" height="256" rx="18" fill="#f7fbfd" stroke="#cadde6"/><path d="M42 175h148m-25-5v-85h-98v85" fill="none" stroke="#1b6680" stroke-width="5" stroke-linecap="round"/><path d="M78 145h76v22H78z" fill="#b5d9e3" opacity=".9"/><circle cx="116" cy="90" r="12" fill="#d6a43a"/><path d="M195 139h72" stroke="#d6a43a" stroke-width="5"/><path d="m254 129 17 10-17 10" fill="#d6a43a"/><text x="302" y="60" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#13354b">Bi precursor charge</text><text x="302" y="102" font-family="Arial,sans-serif" font-size="17" fill="#24556c">0.1 mL Bi carboxylate + 0.15 mL TOP</text><text x="302" y="135" font-family="Arial,sans-serif" font-size="17" fill="#24556c">11 mL dioctyl ether · 15 min stir</text><text x="302" y="170" font-family="Arial,sans-serif" font-size="16" fill="#687d89">N₂ Schlenk line</text><text x="302" y="214" font-family="Arial,sans-serif" font-size="13" fill="#687d89">Illustrative apparatus · source conditions</text></svg>