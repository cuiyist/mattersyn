<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1053" viewBox="0 0 960 1053"><title>Preculture the SK-OV-3 cell suspension</title><desc>Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular geometry, or experimental trace is implied. Drawing dimensions and liquid level are schematic, not measured geometry.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><rect width="960" height="1053" rx="15" fill="#f7fafc"/><text x="30" y="32" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#637f8e">Cytotoxicity exposure with 1 pM QD input</text><text x="30" y="57" font-family="Arial,sans-serif" font-size="28" text-anchor="start" fill="#173c4a">Preculture the SK-OV-3 cell suspension</text><text x="30" y="92" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">suspension volume: 100 uL</text><text x="30" y="118" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">duration: 24 h</text><text x="30" y="144" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">temperature: 37 degC</text><text x="30" y="170" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">co2 fraction: 5 %</text><text x="30" y="196" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">plate wells: 96 wells</text><text x="30" y="222" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">occupied middle wells: 60 wells</text><text x="30" y="248" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">wells per group: 10 wells</text><text x="30" y="274" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Environment: 5% CO2</text><g transform="translate(70 318)"><rect x="242" y="52" width="336" height="190" rx="16" fill="#edf6f8" stroke="#3c6475" stroke-width="3"/><circle cx="280" cy="84" r="13" fill="#d7eaf1" stroke="#7099aa" stroke-width="2"/><circle cx="332" cy="84" r="13" fill="#d7eaf1" stroke="#7099aa" stroke-width="2"/><circle cx="384" cy="84" r="13" fill="#d7eaf1" stroke="#7099aa" stroke-width="2"/><circle cx="436" cy="84" r="13" fill="#d7eaf1" stroke="#7099aa" stroke-width="2"/><circle cx="488" cy="84" r="13" fill="#d7eaf1" stroke="#7099aa" stroke-width="2"/><circle cx="540" cy="84" r="13" fill="#d7eaf1" stroke="#7099aa" stroke-width="2"/><circle cx="280" cy="127" r="13" fill="#d7eaf1" stroke="#7099aa" stroke-width="2"/><circle cx="332" cy="127" r="13" fill="#d7eaf1" stroke="#7099aa" stroke-width="2"/><circle cx="384" cy="127" r="13" fill="#d7eaf1" stroke="#7099aa" stroke-width="2"/><circle cx="436" cy="127" r="13" fill="#d7eaf1" stroke="#7099aa" stroke-width="2"/><circle cx="488" cy="127" r="13" fill="#d7eaf1" stroke="#7099aa" stroke-width="2"/><circle cx="540" cy="127" r="13" fill="#d7eaf1" stroke="#7099aa" stroke-width="2"/><circle cx="280" cy="170" r="13" fill="#d7eaf1" stroke="#7099aa" stroke-width="2"/><circle cx="332" cy="170" r="13" fill="#d7eaf1" stroke="#7099aa" stroke-width="2"/><circle cx="384" cy="170" r="13" fill="#d7eaf1" stroke="#7099aa" stroke-width="2"/><circle cx="436" cy="170" r="13" fill="#d7eaf1" stroke="#7099aa" stroke-width="2"/><circle cx="488" cy="170" r="13" fill="#d7eaf1" stroke="#7099aa" stroke-width="2"/><circle cx="540" cy="170" r="13" fill="#d7eaf1" stroke="#7099aa" stroke-width="2"/><circle cx="280" cy="213" r="13" fill="#d7eaf1" stroke="#7099aa" stroke-width="2"/><circle cx="332" cy="213" r="13" fill="#d7eaf1" stroke="#7099aa" stroke-width="2"/><circle cx="384" cy="213" r="13" fill="#d7eaf1" stroke="#7099aa" stroke-width="2"/><circle cx="436" cy="213" r="13" fill="#d7eaf1" stroke="#7099aa" stroke-width="2"/><circle cx="488" cy="213" r="13" fill="#d7eaf1" stroke="#7099aa" stroke-width="2"/><circle cx="540" cy="213" r="13" fill="#d7eaf1" stroke="#7099aa" stroke-width="2"/><text x="410" y="298" font-family="Arial,sans-serif" font-size="25" text-anchor="middle" fill="#173c4a">Microplate operation</text><text x="410" y="333" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#173c4a">Schematic well array; count and dimensions not to scale</text></g><text x="30" y="713" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Inputs: SK-OV-3 cells</text><text x="30" y="739" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="765" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Outputs: Preculture the SK-OV-3 cell suspension</text><text x="30" y="791" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="817" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Source uses the middle 60 wells and ten wells per group; not all six group identities are explicitly</text><text x="30" y="843" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">enumerated.</text><text x="30" y="869" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="895" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular</text><text x="30" y="921" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">geometry, or experimental trace is implied. Drawing dimensions and liquid level are schematic, not</text><text x="30" y="947" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">measured geometry.</text><text x="30" y="973" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="999" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Source: Main PDF p.4, Section 2.4, Cytotoxicity Analysis</text></svg>