<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900" role="img"><title>Acquire synchrotron powder XRD</title><desc>Source-linked stage schematic. No unreported equipment dimensions or solution species are asserted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="900" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="34" font-size="18" text-anchor="start" fill="#647888">CdS synthesis at 200 °C</text><text x="30" y="73" font-size="28" text-anchor="start" fill="#234b60">Acquire synchrotron powder XRD</text><text x="30" y="112" font-size="21" text-anchor="start" fill="#234b60">energy: 14 keV</text><text x="30" y="140" font-size="21" text-anchor="start" fill="#234b60">wavelength: 1.0287 angstrom</text><text x="30" y="168" font-size="21" text-anchor="start" fill="#234b60">divergence slit: 200 um</text><text x="30" y="196" font-size="21" text-anchor="start" fill="#234b60">antiscattering slit: 250 um</text><text x="30" y="224" font-size="21" text-anchor="start" fill="#234b60">receiving slit: 200 um</text><g transform="translate(0 258)"><rect x="270" y="30" width="420" height="162" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><text x="480" y="89" font-size="29" text-anchor="middle" fill="#234b60">Powder diffraction</text><text x="480" y="136" font-size="21" text-anchor="middle" fill="#234b60">Instrument settings shown above</text><text x="480" y="232" font-size="21" text-anchor="middle" fill="#234b60">No peak trace or measured atomic model invented</text></g><text x="30" y="598" font-size="20" text-anchor="start" fill="#234b60">Inputs: Grind powder and load grooved quartz-glass plate</text><text x="30" y="634" font-size="20" text-anchor="start" fill="#234b60">Output: Acquire synchrotron powder XRD</text><text x="30" y="670" font-size="20" text-anchor="start" fill="#234b60">BL18B Indian beamline at Photon Factory KEK; Bragg–Brentano geometry. Dwell adjusted for</text><text x="30" y="697" font-size="20" text-anchor="start" fill="#234b60">signal-to-noise, no numeric dwell. Main PDF p.2 §2.2 states 14 keV and λ=1.0287 Å; Figure2 also</text><text x="30" y="724" font-size="20" text-anchor="start" fill="#234b60">states λ=1.0287 Å. These are inconsistent energy/wavelength values, retained without choosing a</text><text x="30" y="751" font-size="20" text-anchor="start" fill="#234b60">replacement.</text><text x="30" y="787" font-size="20" text-anchor="start" fill="#234b60">Apparatus dimensions, liquid level and spatial layout are schematic, not measured source</text><text x="30" y="814" font-size="20" text-anchor="start" fill="#234b60">geometry.</text><text x="30" y="850" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.2 §2.2</text></g></svg>