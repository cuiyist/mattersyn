<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3z" fill="#c08424"/></marker></defs><g font-family="Arial, sans-serif"><rect width="960" height="550" fill="#f8fafc"/><rect x="0" y="0" width="960" height="72" fill="#173949"/><text x="28" y="30" font-size="14" fill="#b6dce7" text-anchor="start">KIM 2013 · PbS QUANTUM DOTS</text><text x="28" y="58" font-size="24" fill="white" text-anchor="start">04  Prepare and load sulfur-precursor solution</text><rect x="65" y="108" width="830" height="255" rx="12" fill="none" stroke="#547b8d" stroke-dasharray="7 5"/><text x="85" y="138" font-size="19" fill="#233749" text-anchor="start">Glovebox reported · gas and mixing vessel not reported</text><text x="90" y="183" font-size="19" fill="#233749" text-anchor="start">Hexamethyldisilathiane 180 μL</text><text x="90" y="205" font-size="19" fill="#233749" text-anchor="start">+ octane 5 mL</text><path d="M380 235 L560 235" stroke="#c08424" stroke-width="3" marker-end="url(#a)" fill="none"/><g stroke="#24677a" stroke-width="4" fill="none"><rect x="590" y="210" width="155" height="44"/><path d="M745 232 h80 M590 220 h-45 v24 h45 M545 213 v38"/></g><text x="630" y="287" font-size="18" fill="#233749" text-anchor="middle">Load syringe</text><text x="480" y="340" font-size="15" fill="#233749" text-anchor="middle">Final solution volume and concentration not reported</text><path d="M25 392 H935" stroke="#cbd5e1"/><text x="28" y="417" font-size="16" fill="#233749" text-anchor="start">In a glovebox, mix 180 μL hexamethyldisilathiane with 5 mL octane and load into a syringe. The glovebox</text><text x="28" y="439" font-size="16" fill="#233749" text-anchor="start">atmosphere, mixing vessel, final solution volume, concentration, temperature and duration are unreported.</text><text x="28" y="461" font-size="16" fill="#233749" text-anchor="start">Relative timing to lead-mixture prepa