<svg xmlns="http://www.w3.org/2000/svg" width="960" height="742" viewBox="0 0 960 742" role="img"><title>Stir for 12 h at room temperature</title><desc>Source-linked conceptual stage; geometry and unreported fields are not measurements.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="742" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#647888">AuNC/CdTe QCD assembly set A (volume 1:1)</text><text x="30" y="68" font-size="28" text-anchor="start" fill="#234b60">Stir for 12 h at room temperature</text><text x="30" y="107" font-size="21" text-anchor="start" fill="#234b60">duration: 12 h</text><text x="30" y="135" font-size="21" text-anchor="start" fill="#234b60">temperature: room temperature; no numerical temperature reported</text><text x="30" y="163" font-size="21" text-anchor="start" fill="#234b60">Environment: room temperature</text><g transform="translate(0 199)"><rect x="421" y="20" width="118" height="165" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M429 150q51.0 9 102 0" fill="none" stroke="#9abfce" stroke-width="4"/><path d="M450 158h60" stroke="#557f91" stroke-width="6"/><text x="480" y="235" font-size="21" text-anchor="middle" fill="#234b60">Stirring rate and vessel geometry not reported</text></g><text x="30" y="493" font-size="20" text-anchor="start" fill="#234b60">Inputs: Combine the set A volumes in PBS</text><text x="30" y="529" font-size="20" text-anchor="start" fill="#234b60">Output: Stir for 12 h at room temperature</text><text x="30" y="565" font-size="20" text-anchor="start" fill="#234b60">Common §2.5 assembly method; no stirring rate, vessel, atmosphere, cleanup or final</text><text x="30" y="592" font-size="20" text-anchor="start" fill="#234b60">concentration.</text><text x="30" y="628" font-size="20" text-anchor="s