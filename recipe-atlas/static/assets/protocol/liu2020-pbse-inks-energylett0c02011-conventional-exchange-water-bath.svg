 x="30" y="530" font-size="20" text-anchor="start" fill="#254d62">Source explicitly immerses the continuing three-neck flask in a water bath; bath dimensions</text><text x="30" y="557" font-size="20" text-anchor="start" fill="#254d62">and water temperature are not reported.</text><text x="30" y="593" font-size="20" text-anchor="start" fill="#254d62">Source: SI PDF p.4, Section 4, Step 2, cation exchange</text></g></svg>