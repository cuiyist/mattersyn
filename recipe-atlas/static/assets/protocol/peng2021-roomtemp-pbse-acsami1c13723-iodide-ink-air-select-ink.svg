<svg xmlns="http://www.w3.org/2000/svg" width="960" height="624" viewBox="0 0 960 624" role="img"><title>Use the directly synthesized PbSe ink comparison dispersion</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3e778d"/></marker></defs><rect width="960" height="624" fill="#fff"/><g font-family="Arial, sans-serif"><text x="30" y="44" font-size="28" text-anchor="start" fill="#244659">Use the directly synthesized PbSe ink comparison dispersion</text><g transform="translate(0 95)"><rect x="428" y="36" width="104" height="146" rx="12" stroke="#47778a" stroke-width="3" fill="#edf5f8"/><path d="M438 140q42.0 12 84 0" fill="none" stroke="#91bbc9" stroke-width="3"/><text x="480" y="225" font-size="21" text-anchor="middle" fill="#244659">Vessel and hardware geometry unspecified</text></g><text x="30" y="367" font-size="20" text-anchor="start" fill="#244659">Inputs: Directly synthesized iodide-passivated PbSe ink in DMF</text><text x="30" y="403" font-size="20" text-anchor="start" fill="#244659">Outputs: Use the directly synthesized PbSe ink comparison dispersion</text><text x="30" y="439" font-size="20" text-anchor="start" fill="#244659">Related ink route described separately; exact batch and storage concentration unknown.</text><text x="30" y="475" font-size="20" text-anchor="start" fill="#244659">Exact vessel type, size and hardware geometry are not reported; drawing is a qualified</text><text x="30" y="502" font-size="20" text-anchor="start" fill="#244659">schematic.</text><text x="30" y="538" font-size="20" text-anchor="start" fill="#244659">Qualified schematic; dimensions and fill levels are illustrative.</text><text x="30" y="574" font-size="20" text-anchor="start" fill="#244659">Source: SI PDF p.4, Figure S2</text></g></svg>