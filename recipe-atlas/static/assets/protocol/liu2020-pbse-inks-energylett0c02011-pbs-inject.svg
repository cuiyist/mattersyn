<svg xmlns="http://www.w3.org/2000/svg" width="960" height="644" viewBox="0 0 960 644" role="img"><title>Rapidly inject the sulfur precursor</title><desc>Source-linked conceptual operation. Unreported geometry and quantities are not reconstructed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4d7f93"/></marker></defs><rect width="960" height="644" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#607a89">Oleate-capped PbS adjunct QDs</text><text x="30" y="65" font-size="28" text-anchor="start" fill="#254d62">Rapidly inject the sulfur precursor</text><text x="30" y="100" font-size="21" text-anchor="start" fill="#254d62">Additional numerical conditions for this step are not specified.</text><g transform="translate(0 138)"><path d="M403 22v58q-70 48-19 104q75 59 151 0q51-56-19-104V22h-30v57h-52V22z" fill="#eff5f8" stroke="#587f91" stroke-width="3"/><path d="M450 80V6h28v73" fill="#eff5f8" stroke="#587f91" stroke-width="3"/><path d="M398 145q65 23 132 0" stroke="#9fbfce" stroke-width="4" fill="none"/><rect x="173" y="10" width="76" height="110" rx="9" fill="#eff5f8" stroke="#587f91" stroke-width="3"/><path d="M185 90q26.0 9 52 0" fill="none" stroke="#9fbfce" stroke-width="4"/><path d="M278 68L393 108" stroke="#4d7f93" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="480" y="239" font-size="20" text-anchor="middle" fill="#254d62">Inject the named input · schematic geometry</text></g><text x="30" y="422" font-size="20" text-anchor="start" fill="#254d62">Inputs: Heat the lead precursor under vacuum; Mix the sulfur precursor separately</text><text x="30" y="458" font-size="20" text-anchor="start" fill="#254d62">Output: Rapidly inject the sulfur precursor</text><text x="30" y="494" font-size="20" text-anchor="start" fill="#254d62">Injection temperature and growth duration are not restated; do not silently assign the</text><text x="30" y="521" font-size="20" text-anchor="start" fill="#254d62">prior 100 C lead-preparation setting.</text><text x="30" y="557" font-size="20" text-anchor="start" fill="#254d62">Injection into the continuing three-neck reaction flask.</text><text x="30" y="593" font-size="20" text-anchor="start" fill="#254d62">Source: SI PDF pp.4–5, Section 5, Synthesis of oleate capped PbS QDs</text></g></svg>