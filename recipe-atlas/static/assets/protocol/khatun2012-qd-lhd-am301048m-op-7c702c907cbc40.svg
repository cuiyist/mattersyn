<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="674" viewBox="0 0 1100 674"><rect width="1100" height="674" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="42" font-size="27" font-weight="bold" fill="#173047">03 Stir vigorously overnight in an open flask</text><text x="28" y="91" font-size="17" font-weight="normal" fill="#596b7d">primary reported preparation</text><g transform="translate(0 101)"><g transform="translate(875 0)" stroke="#1b6986" fill="none" stroke-width="3" stroke-linejoin="round"><path d="M42 20v23L24 87q55 24 111 0l-19-44V20 M57 20h44 M51 74q29-28 59 0l-2-13m2 13-13 1"/></g></g><text x="28" y="136" font-size="23" font-weight="normal" fill="#135d83">Vigorous stirring / open flask • conceptual action symbol</text><rect x="26" y="223" width="500" height="187" rx="12" fill="#e6f1fa"/><text x="42" y="261" font-size="19" font-weight="bold" fill="#173047">INPUTS</text><text x="42" y="296" font-size="20" font-weight="normal" fill="#173047">primary0.5mL QD loading mixture</text><rect x="572" y="223" width="500" height="187" rx="12" fill="#e5f4ed"/><text x="588" y="261" font-size="19" font-weight="bold" fill="#173047">OUTPUTS / PHYSICAL STATES</text><text x="588" y="296" font-size="20" font-weight="normal" fill="#173047">Q-LHD loading mixture after overnight open-flask</text><text x="588" y="323" font-size="20" font-weight="normal" fill="#173047">stirring</text><text x="588" y="354" font-size="18" font-weight="normal" fill="#173047">Kind: mixture</text><text x="28" y="448" font-size="21" font-weight="normal" fill="#173047">Stir vigorously to load hydrophobic QDs into LHD micelle cores. Source reports chloroform evaporation after</text><text x="28" y="476" font-size="21" font-weight="normal" fill="#173047">overnight stirring in an open flask; no numerical hour count, stirring speed or temperature is assigned.</text><text x="28" y="517" font-size="21" font-weight="normal" fill="#173047">duration: not reported; Overnight, numeric duration unreported.</text><text x="28" y="558" font-size="21" font-weight="normal" fill="#173047">Environment: open flask; other environmental conditions unreported</text><text x="28" y="599" font-size="15" font-weight="normal" fill="#596b7d">Conceptual and not to scale; no unreported apparatus geometry, liquid levels or handling atmosphere inferred.</text><text x="28" y="629" font-size="15" font-weight="normal" fill="#596b7d">Khatun et al. (2012) • Main PDF p.3 / printed p.3882, Section 2.4, loading and workup</text></g></svg>