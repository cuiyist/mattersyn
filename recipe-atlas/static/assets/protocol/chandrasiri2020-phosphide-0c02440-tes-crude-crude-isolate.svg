<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 505" width="670" height="505" role="img"><title>Remove volatiles and seal crude material</title><desc>Volatiles are removed under vacuum in a Schlenk flask, which is then sealed for glovebox storage. Unreported removal settings remain unspecified.</desc><defs><linearGradient id="glass" x1="0" x2="1"><stop stop-color="#e6f3f7"/><stop offset=".48" stop-color="#ffffff"/><stop offset="1" stop-color="#dcecf1"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#337d90"/></marker></defs><rect x="8" y="8" width="654" height="489" rx="20" fill="#f2f7fa" stroke="#d7e5ec"/><style>text{font-family:Arial,sans-serif;fill:#203c50}.glass{fill:url(#glass);stroke:#547a8b;stroke-width:2.8;stroke-linejoin:round}.line{fill:none;stroke:#547a8b;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.flow{fill:none;stroke:#337d90;stroke-width:2.8;marker-end:url(#arrow)}.note{font-size:12px;fill:#536f7c}</style><text x="335" y="39" text-anchor="middle" font-size="18">Remove volatiles and seal crude material</text>
