<svg xmlns="http://www.w3.org/2000/svg" width="960" height="871" viewBox="0 0 960 871"><title>Dissolve in the first BS amount</title><desc>Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular geometry, or experimental trace is implied. Drawing dimensions and liquid level are schematic, not measured geometry.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><rect width="960" height="871" rx="15" fill="#f7fafc"/><text x="30" y="32" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#637f8e">Chitosan coupling of QD–MPA</text><text x="30" y="57" font-family="Arial,sans-serif" font-size="28" text-anchor="start" fill="#173c4a">Dissolve in the first BS amount</text><text x="30" y="92" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">buffer volume: 1 mL</text><g transform="translate(70 136)"><rect x="360" y="53" width="100" height="169" rx="8" fill="#eef6f8" stroke="#3c6475" stroke-width="3"/><path d="M360 71h100M368 190q42.0 10 84 0" fill="none" stroke="#9abbc8" stroke-width="4"/><text x="410" y="301" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#173c4a">Solution / dispersion</text></g><text x="30" y="531" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Inputs: Centrifuge the coupling mixture; BS buffer; composition unspecified</text><text x="30" y="557" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="583" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Outputs: Dissolve in the first BS amount</text><text x="30" y="609" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="635" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Source reports dissolution to 1 mL of 100 mM BS, pH 8.4. A subsequent recovery operation before</text><text x="30" y="661" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">the final precipitate is not stated.</text><text x="30" y="687" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="713" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular</text><text x="30" y="739" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">geometry, or experimental trace is implied. Drawing dimensions and liquid level are schematic, not</text><text x="30" y="765" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">measured geometry.</text><text x="30" y="791" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="817" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Source: Main PDF p.4, Section 2.3, Cellular and Subcellular Labeling</text></svg>