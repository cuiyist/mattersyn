<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="785" viewBox="0 0 1100 785"><rect width="1100" height="785" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="42" font-size="27" font-weight="bold" fill="#173047">02 Mix 2.2 g of PbS/CB solids at 10:1</text><text x="28" y="91" font-size="17" font-weight="normal" fill="#596b7d">primary reported preparation</text><g transform="translate(0 101)"><g transform="translate(875 0)" stroke="#1b6986" fill="none" stroke-width="3" stroke-linejoin="round"><path d="M15 68l26-34 26 34z M91 68l26-24 26 24z M21 85h116"/><text x="43" y="22" text-anchor="middle" fill="#1b6986" stroke="none" font-size="18">PbS</text><text x="117" y="25" text-anchor="middle" fill="#1b6986" stroke="none" font-size="18">CB</text><text x="80" y="109" text-anchor="middle" fill="#1b6986" stroke="none" font-size="16">10:1 by weight</text></g></g><text x="28" y="136" font-size="23" font-weight="normal" fill="#135d83">Combined solid charge / mass ratio • conceptual action symbol</text><rect x="26" y="223" width="500" height="235" rx="12" fill="#e6f1fa"/><text x="42" y="261" font-size="19" font-weight="bold" fill="#173047">INPUTS</text><text x="42" y="296" font-size="20" font-weight="normal" fill="#173047">source-prepared PbS powder</text><text x="42" y="327" font-size="18" font-weight="normal" fill="#173047">amount: not reported</text><text x="42" y="371" font-size="20" font-weight="normal" fill="#173047">carbon black (CB)</text><text x="42" y="402" font-size="18" font-weight="normal" fill="#173047">amount: not reported</text><rect x="572" y="223" width="500" height="235" rx="12" fill="#e5f4ed"/><text x="588" y="261" font-size="19" font-weight="bold" fill="#173047">OUTPUTS / PHYSICAL STATES</text><text x="588" y="296" font-size="20" font-weight="normal" fill="#173047">Sample C PbS/CB solids mixture at 10:1 by weight</text><text x="588" y="327" font-size="18" font-weight="normal" fill="#173047">Kind: mixture</text><text x="28" y="496" font-size="21" font-weight="normal" fill="#173047">Mix a combined 2.2 g of PbS powder and carbon black. Use the primary Sample C PbS:CB ratio 10:1 by</text><text x="28" y="524" font-size="21" font-weight="normal" fill="#173047">weight explicitly defined in the Results. Individual charges are not reported and are not calculated here.</text><text x="28" y="565" font-size="21" font-weight="normal" fill="#173047">combined PbS CB mass: 2.2 g</text><text x="28" y="606" font-size="21" font-weight="normal" fill="#173047">PbS to CB mass ratio: 10 g/g; Source ratio 10:1 by weight.</text><text x="28" y="647" font-size="21" font-weight="normal" fill="#173047">Environment: not reported</text><text x="28" y="688" font-size="15" font-weight="normal" fill="#596b7d">Conceptual and not to scale; no unreported apparatus geometry, liquid levels or handling atmosphere inferred.</text><text x="28" y="718" font-size="15" font-weight="normal" fill="#596b7d">Yang et al. (2012) • Main PDF p.2 / printed p.6163, Experimental, Preparation of PbS/CB Composite Counter Electrode; Main PDF p.2 / printed p.6163, Results,</text><text x="28" y="740" font-size="15" font-weight="normal" fill="#596b7d">powder characterization and Sample C ratio definition</text></g></svg>