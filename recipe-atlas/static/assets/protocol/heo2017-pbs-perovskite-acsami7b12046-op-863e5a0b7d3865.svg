<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570"><title>Repeat the three-step spin-SPAER cycle to 15 cycles</title><desc>Repeat the three-step spin-SPAER cycle to 15 cycles. Cycle count: 15 cycles Environment: Not reported; Atmosphere not reported for this operation. Source repetition count; no additional wash, isolation or anneal supplied. Conceptual material flow. Shapes do not represent apparatus geometry, liquid levels or measured particle structure.</desc><rect x="1" y="1" width="998" height="568" rx="16" fill="#f8fbfc" stroke="#a9c5d0"/><rect x="0" y="0" width="1000" height="50" rx="16" fill="#173f50"/><text x="30" y="31" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">STEP 04 / 04  ·  SYNTHESIS</text><text x="30" y="84" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#244754">Repeat the three-step spin-SPAER cycle to 15 cycles</text><text x="30" y="121" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#506875">Heo et al. (2017): PbS QDs-15 by spin-SPAER</text><rect x="30" y="169" width="415" height="158" rx="12" fill="#e6f0f4" stroke="#bad0db"/><rect x="555" y="169" width="415" height="158" rx="12" fill="#edf4ed" stroke="#c4d4c4"/><path d="M462 248.0H537m-13 -11l13 11-13 11" fill="none" stroke="#528295" stroke-width="3"/><text x="48" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">INPUTS / CONTEXT</text><text x="48" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• edt treated film</text><text x="48" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• 5 mM PbBr2 in DMF</text><text x="48" y="276" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• 5 mM Na2S in methanol/water (95/5 v/v)</text><text x="48" y="301" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• EDT/ethanol (1/