<svg xmlns="http://www.w3.org/2000/svg" width="820" height="759" viewBox="0 0 820 759"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#426d85" stroke-width="1.5"/></marker></defs><rect width="820" height="759" rx="14" fill="#f4f7f8"/><text x="25" y="38" text-anchor="start" font-family="Arial,sans-serif" font-size="28" fill="#183c50">Redissolve in hexane, precipitate with acetone; repeat</text><text x="25" y="73" text-anchor="start" font-family="Arial,sans-serif" font-size="28" fill="#183c50">this wash two more times</text><text x="25" y="108" text-anchor="start" font-family="Arial,sans-serif" font-size="21" fill="#183c50">hexane per cycle: 0.75 L; acetone per cycle: 0.75 L; speed: 4600 rpm;</text><text x="25" y="135" text-anchor="start" font-family="Arial,sans-serif" font-size="21" fill="#183c50">duration per cycle: 5 min; additional repetitions: 2 count</text><g transform="translate(0 218)"><path d="M105 35v100q0 15 15 15h55q15 0 15-15V35" fill="none" stroke="#34586a" stroke-width="4"/><path d="M212 93L299 93" stroke="#426d85" stroke-width="4" fill="none" marker-end="url(#arrow)"/><circle cx="390" cy="95" r="65" fill="none" stroke="#34586a" stroke-width="4"/><circle cx="390" cy="95" r="13" fill="none" stroke="#34586a" stroke-width="3"/><rect x="381" y="40" width="18" height="30" rx="5" fill="none" stroke="#34586a" stroke-width="3" transform="rotate(0 390 95)"/><rect x="381" y="40" width="18" height="30" rx="5" fill="none" stroke="#34586a" stroke-width="3" transform="rotate(90 390 95)"/><rect x="381" y="40" width="18" height="30" rx="5" fill="none" stroke="#34586a" stroke-width="3" transform="rotate(180 390 95)"/><rect x="381" y="40" width="18" height="30" rx="5" fill="none" stroke="#34586a" stroke-width="3" transform="rotate(270 390 95)"/><path d="M476 93L557 93" stroke="#426d85" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M589 35v100q0 15 15 15h55q15 0 15-15V35" fill="none" stroke="#34586a" stroke-width="4"/><path d="M596 135h71" stroke="#34586a" stroke-width="7"/><text x="148" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#183c50">Solvent mixing</text><text x="390" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#183c50">Centrifugation</text><text x="632" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#183c50">Precipitate</text></g><text x="25" y="531" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#183c50">Inputs: Mix crude with hexane and acetone; centrifuge and discard</text><text x="25" y="559" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#183c50">supernatant; Hexane; Acetone</text><text x="25" y="587" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#183c50">Output: Redissolve in hexane, precipitate with acetone; repeat this wash</text><text x="25" y="615" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#183c50">two more times</text><text x="25" y="643" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#183c50">Workup containers are schematic; reaction-flask geometry is not transferred here.</text><text x="25" y="671" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#183c50">Illustrative action cues; no measured apparatus coordinates or unreported liquid</text><text x="25" y="699" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="#183c50">colors.</text></svg>