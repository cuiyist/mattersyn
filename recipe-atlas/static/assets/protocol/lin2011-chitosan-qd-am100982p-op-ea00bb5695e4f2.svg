roke="none">inferred.</text><text x="28" y="774" font-size="15" fill="#596b7d" stroke="none">Conceptual illustration; no measured geometry, levels or unreported apparatus inferred.</text><text x="28" y="799" font-size="14" fill="#596b7d" stroke="none">Lin et al.(2011) · Main PDF p.2 / printed p.996, Synthesis of CdSe/ZnS QDs</text></g></svg>