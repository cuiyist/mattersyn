<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="851" viewBox="0 0 1000 851"><title>Construct dimers and trimers</title><desc>Construct dimers and trimers. Environment: Not reported; Atmosphere not reported for this operation. Start two CdSe cores separated by an integer lattice translation. Add CdS/ZnS to set size and neck thickness. Restrict added layers to interface for area variation at fixed dot spacing/asymmetric trimers. For spacing variation at fixed neck thickness, split a fused dimer halfway along its bond, add lattice translations and duplicate interface atoms into the gap. Manually check intended structural parameters. Computational data-flow diagram only; no atomic coordinates or calculated outputs are invented. Authored conceptual stage illustration; not measured apparatus or particle structure.</desc><rect x="1" y="1" width="998" height="849" rx="16" fill="#f8fbfc" stroke="#a9c5d0"/><rect x="0" y="0" width="1000" height="50" rx="16" fill="#173f50"/><text x="30" y="31" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">STEP 02 / 04  ·  CHARACTERIZATION</text><text x="30" y="84" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#244754">Construct dimers and trimers</text><text x="30" y="121" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#506875">Ondry et al. (2021): Atomistic model construction and electronic-structure calculation</text><rect x="30" y="169" width="415" height="122" rx="12" fill="#e6f0f4" stroke="#bad0db"/><rect x="555" y="169" width="415" height="122" rx="12" fill="#edf4ed" stroke="#c4d4c4"/><path d="M462 230.0H537m-13 -11l13 11-13 11" fill="none" stroke="#528295" stroke-width="3"/><text x="48" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">INPUTS / CONTEXT</text><text x="48" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• constructed model</text><text x="573" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">OUTPUT / STATE</text><text x="573" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• multi dot model</text><text x="573" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">State kind: analysis data</text><g transform="translate(30 330)"><rect x="50" y="30" width="335" height="115" rx="8" fill="#f5f8fa" stroke="#668b9c" stroke-width="2"/><rect x="65" y="45" width="305" height="85" rx="7" fill="none" stroke="#a7bdc7" stroke-dasharray="6 5"/><text x="85" y="83" font-family="Arial,sans-serif" font-size="22" fill="#244754">Dimer / trimer construction</text><text x="85" y="115" font-family="Arial,sans-serif" font-size="15" fill="#244754">Computational operation</text><path d="M405 90L505 90" fill="none" stroke="#528295" stroke-width="3"/><path d="M496 83L505 90L496 97" fill="none" stroke="#528295" stroke-width="3"/><rect x="550" y="32" width="335" height="115" rx="8" fill="#edf0f8" stroke="#668b9c" stroke-width="2"/><text x="575" y="80" font-family="Arial,sans-serif" font-size="19" fill="#244754">Model / calculated data</text><text x="575" y="112" font-family="Arial,sans-serif" font-size="17" fill="#244754">Not physical synthesis</text></g><text x="30" y="555" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">OPERATION CONDITIONS</text><text x="30" y="583" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">No numerical parameter fields assigned to this operation.</text><text x="30" y="622" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">Environment: Not reported; Atmosphere not reported for this operation.</text><text x="30" y="659" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">Start two CdSe cores separated by an integer lattice translation. Add CdS/ZnS to set size and neck thickness. Restrict</text><text x="30" y="683" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">added layers to interface for area variation at fixed dot spacing/asymmetric trimers. For spacing variation at fixed neck</text><text x="30" y="707" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">thickness, split a fused dimer halfway along its bond, add lattice translations and duplicate interface atoms into the gap.</text><text x="30" y="731" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">Manually check intended structural parameters.</text><text x="30" y="777" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#566d75">Computational data-flow diagram only; no atomic coordinates or calculated outputs are invented. Authored conceptual stage illustration; not</text><text x="30" y="797" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#566d75">measured apparatus or particle structure.</text></svg>