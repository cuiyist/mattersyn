<svg xmlns="http://www.w3.org/2000/svg" width="960" height="734" viewBox="0 0 960 734" role="img"><title>Treat FeS with HCl to generate H2S</title><desc>Source-linked stage schematic. No unreported equipment dimensions or solution species are asserted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="734" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="34" font-size="18" text-anchor="start" fill="#647888">H2S generation from FeS and HCl</text><text x="30" y="73" font-size="28" text-anchor="start" fill="#234b60">Treat FeS with HCl to generate H2S</text><text x="30" y="112" font-size="21" text-anchor="start" fill="#234b60">No numerical condition or environment specified for this stage.</text><g transform="translate(0 146)"><rect x="100" y="35" width="220" height="100" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><text x="210" y="80" font-size="28" text-anchor="middle" fill="#234b60">FeS + HCl</text><text x="210" y="111" font-size="17" text-anchor="middle" fill="#234b60">quantities unreported</text><path d="M350 85L590 85" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="620" y="35" width="220" height="100" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><text x="730" y="90" font-size="27" text-anchor="middle" fill="#234b60">H₂S feed</text><text x="480" y="190" font-size="21" text-anchor="middle" fill="#234b60">Generation and gas-transfer hardware not specified</text></g><text x="30" y="486" font-size="20" text-anchor="start" fill="#234b60">Inputs: Iron sulfide for H2S generation; nominal FeS; Hydrochloric acid</text><text x="30" y="522" font-size="20" text-anchor="start" fill="#234b60">Output: Treat FeS with HCl to generate H2S</text><text x="30" y="558" font-size="20" text-anchor="start" fill="#234b60">Source reports reagent identities only. No generator vessel, HCl concentration, gas drying</text><text x="30" y="585" font-size="20" text-anchor="start" fill="#234b60">train, pressure or flow rate is reconstructed.</text><text x="30" y="621" font-size="20" text-anchor="start" fill="#234b60">Apparatus dimensions, liquid level and spatial layout are schematic, not measured source</text><text x="30" y="648" font-size="20" text-anchor="start" fill="#234b60">geometry.</text><text x="30" y="684" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.2 §2.1</text></g></svg>