<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="662" viewBox="0 0 1000 662"><title>Precipitate, centrifuge and redisperse</title><desc>Precipitate, centrifuge and redisperse. Centrifugation duration: 10 min Relative centrifugal force: 1800 g Redispersion volume: 1 mL Total washing cycles: 3 cycles Environment: Inert glovebox workup following nitrogen transfer.; Explicit atmosphere already present in source and operation description; resolved default missingness contradiction. Add methyl acetate until turbid, remove supernatant, redisperse in 1 mL toluene. Repeat this washing step two more times. Conceptual material flow. Shapes do not represent apparatus geometry, liquid levels or measured particle structure.</desc><rect x="1" y="1" width="998" height="660" rx="16" fill="#f8fbfc" stroke="#a9c5d0"/><rect x="0" y="0" width="1000" height="50" rx="16" fill="#173f50"/><text x="30" y="31" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">STEP 05 / 06  ·  WORKUP</text><text x="30" y="84" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#244754">Precipitate, centrifuge and redisperse</text><text x="30" y="121" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#506875">Mulder et al. (2020): Protective outer ZnS shell and core-shell-shell workup</text><rect x="30" y="169" width="415" height="133" rx="12" fill="#e6f0f4" stroke="#bad0db"/><rect x="555" y="169" width="415" height="133" rx="12" fill="#edf4ed" stroke="#c4d4c4"/><path d="M462 235.5H537m-13 -11l13 11-13 11" fill="none" stroke="#528295" stroke-width="3"/><text x="48" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">INPUTS / CONTEXT</text><text x="48" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• css dispersion</text><text x="48" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• anhydrous methyl acetate</text><text x="