<svg xmlns="http://www.w3.org/2000/svg" width="820" height="699" viewBox="0 0 820 699"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><rect width="820" height="699" rx="16" fill="#f5f9fb"/><text x="25" y="41" font-family="Arial,sans-serif" font-size="26" text-anchor="start" fill="#173c4a">Acquire time-resolved PL with 440 nm excitation</text><text x="25" y="73" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">excitation wavelength: 440 nm; repetition rate: 1 MHz; pulse duration: 40–90</text><text x="25" y="98" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">ps; pulse energy: 0.07–20 mJ (literal source unit); bins: 1024 count; bin</text><text x="25" y="123" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">width: 48.8 ps; record span: 50 ns; emission wavelength: 625 nm</text><g transform="translate(0 176)"><rect x="240" y="45" width="330" height="190" rx="12" fill="#edf6f8" stroke="#3c6475" stroke-width="3"/><text x="405" y="121" font-family="Arial,sans-serif" font-size="26" text-anchor="middle" fill="#173c4a">Measurement</text><text x="405" y="160" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#173c4a">No result drawn</text><text x="405" y="298" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#173c4a">Source evidence is shown separately</text></g><text x="25" y="563" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Inputs: NHS-CdS plus 4-ATP-CdSe coupling mixture</text><text x="25" y="590" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Outputs: Acquire time-resolved PL with 440 nm excitation</text><text x="25" y="617" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Illustrative acquisition cue only. No measured spectrum, micrograph, particle</text><text x="25" y="644" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">geometry or result is generated.</text></svg>