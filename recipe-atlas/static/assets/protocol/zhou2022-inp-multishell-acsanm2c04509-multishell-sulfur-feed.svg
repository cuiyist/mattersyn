<svg xmlns="http://www.w3.org/2000/svg" width="960" height="897" viewBox="0 0 960 897"><title>Add dodecanethiol and hold</title><desc>Continuing 100 mL three-neck flask. Drawing dimensions and liquid level are schematic, not measured geometry.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><rect width="960" height="897" rx="15" fill="#f7fafc"/><text x="30" y="32" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#637f8e">InP/ZnSe/ZnS growth with HF–TOP passivation</text><text x="30" y="57" font-family="Arial,sans-serif" font-size="28" text-anchor="start" fill="#173c4a">Add dodecanethiol and hold</text><text x="30" y="92" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">temperature: 310 degC</text><text x="30" y="118" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">amount: 1 mol</text><text x="30" y="144" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">duration: 10 min</text><g transform="translate(70 188)"><path d="M386 20H434V80L452 90L473 55L503 72L482 110Q516 142 507 197Q500 257 410 263Q320 257 313 197Q304 142 338 110L317 72L347 55L368 90L386 80Z" fill="#edf6f8" stroke="#3c6475" stroke-width="3"/><path d="M327 193Q410 219 493 193" fill="none" stroke="#9abbc8" stroke-width="4"/><path d="M635 53L495 107" fill="none" stroke="#477e91" stroke-width="4" marker-end="url(#arrow)"/><text x="625" y="159" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#173c4a">Reported addition</text><text x="410" y="354" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#173c4a">Continuing three-neck flask</text></g><text x="30" y="583" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Inputs: Return to 270 °C and repeat the Se bolus procedure; Dodecanethiol; isomer not explicitly</text><text x="30" y="609" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">restated</text><text x="30" y="635" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="661" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Outputs: Add dodecanethiol and hold</text><text x="30" y="687" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="713" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Add dodecanethiol and hold</text><text x="30" y="739" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="765" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Continuing 100 mL three-neck flask. Drawing dimensions and liquid level are schematic, not</text><text x="30" y="791" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">measured geometry.</text><text x="30" y="817" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="843" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Source: Main PDF p.3, Section 2.1.2, Core–Multishell InP/ZnSe/ZnS QDs</text></svg>