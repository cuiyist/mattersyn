<svg xmlns="http://www.w3.org/2000/svg" width="960" height="853" viewBox="0 0 960 853" role="img"><title>Measure Selected set-D QCDs QY</title><desc>Source-linked conceptual stage; geometry and unreported fields are not measurements.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="853" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#647888">Quantum-yield measurement and reference protocol</text><text x="30" y="68" font-size="28" text-anchor="start" fill="#234b60">Measure Selected set-D QCDs QY</text><text x="30" y="107" font-size="21" text-anchor="start" fill="#234b60">excitation wavelength: 375 nm</text><text x="30" y="135" font-size="21" text-anchor="start" fill="#234b60">data interval: 1 nm</text><text x="30" y="163" font-size="21" text-anchor="start" fill="#234b60">scan speed: 6000 nm/min</text><text x="30" y="191" font-size="21" text-anchor="start" fill="#234b60">excitation slit: 5 nm</text><text x="30" y="219" font-size="21" text-anchor="start" fill="#234b60">emission slit: 5 nm</text><text x="30" y="247" font-size="21" text-anchor="start" fill="#234b60">reference qy: 95 %; basis: Rhodamine6G reference quantum yield</text><g transform="translate(0 283)"><rect x="275" y="30" width="410" height="165" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><text x="480" y="92" font-size="27" text-anchor="middle" fill="#234b60">Optical / vibrational acquisition</text><text x="480" y="145" font-size="19" text-anchor="middle" fill="#234b60">Use the selected operation’s exact conditions</text><text x="480" y="245" font-size="20" text-anchor="middle" fill="#234b60">Instrument cue; unreported specimen preparation remains unknown</text></g><text x="30" y="577" font-size="20" text-anchor="start" fill="#234b60">Inputs: Dilute Selected set-D QCDs for absorbance below 1.0; Rhodamine 6G quantum-yield</text><text x="30" y="604" font-size="20" text-anchor="start" fill="#234b60">standard; counterion/formulation unspecified; Ethanol reference solvent</text><text x="30" y="640" font-size="20" text-anchor="start" fill="#234b60">Output: Measure Selected set-D QCDs QY</text><text x="30" y="676" font-size="20" text-anchor="start" fill="#234b60">Hitachi F-7000 integrating-sphere-based fluorescence spectrometer as reported; xenon arc lamp;</text><text x="30" y="703" font-size="20" text-anchor="start" fill="#234b60">Auto sensitivity; software comparative QY with refractive-index corrections.</text><text x="30" y="739" font-size="20" text-anchor="start" fill="#234b60">Generic apparatus cue; vessel dimensions, quantitative liquid level and spatial layout are not</text><text x="30" y="766" font-size="20" text-anchor="start" fill="#234b60">measured source geometry.</text><text x="30" y="802" font-size="20" text-anchor="start" fill="#234b60">Source: SI PDF pp.13–14 Tables S2–S3 and QY protocol</text></g></svg>