<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="761" viewBox="0 0 1000 761"><title>Perform controlled-potential CO2 electrolysis</title><desc>Perform controlled-potential CO2 electrolysis. Potential: -450 mV; Versus Ag/AgCl in the reported three-electrode system. Duration: 3 h Environment: not reported Atmosphere is not specified for this operation. Gastight H-type cell with Agar-KCl(sat) salt bridge; BASI POWER MODULE PWR-3. Separate dark and white-light contexts are reported, without an exact run order. Conceptual material flow; apparatus geometry, liquid levels and particle shapes are not depicted.</desc><rect x="1" y="1" width="998" height="759" rx="16" fill="#f8fbfc" stroke="#a9c5d0"/><rect x="0" y="0" width="1000" height="50" rx="16" fill="#173f50"/><text x="30" y="31" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">STEP 02 / 04  ·  CHARACTERIZATION</text><text x="30" y="84" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#244754">Perform controlled-potential CO2 electrolysis</text><text x="30" y="121" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#506875">PMAEMA electrode dark/light CO2 electrolysis</text><rect x="30" y="169" width="415" height="208" rx="12" fill="#e6f0f4" stroke="#bad0db"/><rect x="555" y="169" width="415" height="208" rx="12" fill="#edf4ed" stroke="#c4d4c4"/><path d="M462 273.0H537m-13 -11l13 11-13 11" fill="none" stroke="#528295" stroke-width="3"/><text x="48" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">INPUTS / CONTEXT</text><text x="48" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• ITO-(PMAEMA/CdTe–MSA QDs)6 electrode</text><text x="48" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• Pt electrode</text><text x="48" y="276" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• Ag/AgCl electrode</text><text x="48" y="301" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• co2 electrolyte</text><text x="48" y="326" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• Agar</text><text x="48" y="351" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• KCl</text><text x="573" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">OUTPUT / OBSERVATION</text><text x="573" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• electrolysis products</text><rect x="30" y="408" width="940" height="57" rx="10" fill="#fff5df" stroke="#c9ac6d"/><text x="48" y="435" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">Gastight H-type cell + Agar-KCl(sat) salt bridge. Compartment geometry and electrode positions unassigned.</text><text x="30" y="502" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">OPERATION CONDITIONS</text><text x="30" y="530" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">Potential: -450 mV; Versus Ag/AgCl in the reported three-electrode system.</text><text x="30" y="561" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">Duration: 3 h</text><text x="30" y="600" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">Environment: not reported Atmosphere is not specified for this operation.</text><text x="30" y="637" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">Gastight H-type cell with Agar-KCl(sat) salt bridge; BASI POWER MODULE PWR-3. Separate dark and white-light contexts</text><text x="30" y="661" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">are reported, without an exact run order.</text><text x="30" y="707" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#566d75">Conceptual m