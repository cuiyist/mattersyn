<svg xmlns="http://www.w3.org/2000/svg" width="960" height="796" viewBox="0 0 960 796" role="img"><title>Dissolve procedural CdBr2 and MPA in deionized water</title><desc>Source-linked conceptual stage; geometry and unreported fields are not measurements.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="796" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#647888">MPA-capped CdTe quantum-dot synthesis</text><text x="30" y="68" font-size="28" text-anchor="start" fill="#234b60">Dissolve procedural CdBr2 and MPA in deionized water</text><text x="30" y="107" font-size="21" text-anchor="start" fill="#234b60">cadmium bromide amount: 0.0056 mol</text><text x="30" y="135" font-size="21" text-anchor="start" fill="#234b60">mpa amount: 0.0037 mol</text><text x="30" y="163" font-size="21" text-anchor="start" fill="#234b60">water volume: 100 mL</text><g transform="translate(0 199)"><rect x="421" y="20" width="118" height="165" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M429 150q51.0 9 102 0" fill="none" stroke="#9abfce" stroke-width="4"/><text x="480" y="235" font-size="21" text-anchor="middle" fill="#234b60">Dissolution cue; vessel geometry not reported</text></g><text x="30" y="493" font-size="20" text-anchor="start" fill="#234b60">Inputs: Cadmium bromide; procedural identity conflicts with materials list; 3-Mercaptopropionic</text><text x="30" y="520" font-size="20" text-anchor="start" fill="#234b60">acid; Deionized water</text><text x="30" y="556" font-size="20" text-anchor="start" fill="#234b60">Output: Dissolve procedural CdBr2 and MPA in deionized water</text><text x="30" y="592" font-size="20" text-anchor="start" fill="#234b60">CdCl2·2.5H2O materials list versus CdBr2 procedural precursor. Two named identities with</text><text x="30" y="619" font-size="20" text-anchor="start" fill="#234b60">explicit uncertainty; recipe follows reported procedural CdBr2 without claiming conflict</text><text x="30" y="646" font-size="20" text-anchor="start" fill="#234b60">resolved. (main p2 §2.1 versus p3 §2.3/p4 §3.1)</text><text x="30" y="682" font-size="20" text-anchor="start" fill="#234b60">Generic apparatus cue; vessel dimensions, quantitative liquid level and spatial layout are not</text><text x="30" y="709" font-size="20" text-anchor="start" fill="#234b60">measured source geometry.</text><text x="30" y="745" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.3 §2.3</text></g></svg>