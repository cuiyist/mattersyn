<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><title>First microwave irradiation</title><desc>First microwave irradiation. Microwave power: 400 W Duration: 2 min Maximum temperature constraint: 150 °C Environment: Not reported; Atmosphere not reported for this operation. Temperature reaches 150 C after 30 s; transparent solution becomes gray, then darker during the next 30 s. Those are observations within the total two-minute step, not extra holding steps. Conceptual material flow. Shapes do not represent apparatus geometry, liquid levels or measured particle structure.</desc><rect x="1" y="1" width="998" height="618" rx="16" fill="#f8fbfc" stroke="#a9c5d0"/><rect x="0" y="0" width="1000" height="50" rx="16" fill="#173f50"/><text x="30" y="31" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">STEP 02 / 12  ·  SYNTHESIS</text><text x="30" y="84" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#244754">First microwave irradiation</text><text x="30" y="121" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#506875">Paliwal et al. (2018): Two-stage microwave-polyol PbS preparation</text><rect x="30" y="169" width="415" height="122" rx="12" fill="#e6f0f4" stroke="#bad0db"/><rect x="555" y="169" width="415" height="122" rx="12" fill="#edf4ed" stroke="#c4d4c4"/><path d="M462 230.0H537m-13 -11l13 11-13 11" fill="none" stroke="#528295" stroke-width="3"/><text x="48" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">INPUTS / CONTEXT</text><text x="48" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• mixed charge</text><text x="573" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">OUTPUT / STATE</text><text x="573" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• first stage aggregate</text><text x="30" y="330" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">OPERATION CONDITIONS</text><text x="30" y="358" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">Microwave power: 400 W</text><text x="30" y="389" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">Duration: 2 min</text><text x="30" y="420" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">Maximum temperature constraint: 150 °C</text><text x="30" y="459" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">Environment: Not reported; Atmosphere not reported for this operation.</text><text x="30" y="496" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">Temperature reaches 150 C after 30 s; transparent solution becomes gray, then darker during the next 30 s. Those are</text><text x="30" y="520" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">observations within the total two-minute step, not extra holding steps.</text><text x="30" y="566" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#566d75">Conceptual material flow. Shapes do not represent apparatus geometry, liquid levels or measured particle structure.</text></svg>