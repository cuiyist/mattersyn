<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820"><rect width="1000" height="820" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="32" y="40" font-size="25" fill="#213446">08  Stir for 30 min to obtain experimental CsPbBr3</text><text x="32" y="84" font-size="17" fill="#526477">Pb/S 1:1 core route · conceptual process illustration</text><rect x="25" y="115" width="370" height="295" rx="12" fill="#e6f1fa"/><rect x="605" y="115" width="370" height="295" rx="12" fill="#e5f4ed"/><text x="44" y="147" font-size="18" fill="#213446">INPUTS</text><text x="624" y="147" font-size="18" fill="#213446">OUTPUTS / PHYSICAL STATES</text><text x="44" y="180" font-size="18" fill="#213446">fresh CsPbBr3 reaction mixture</text><text x="624" y="180" font-size="18" fill="#213446">30 min experimental CsPbBr3</text><text x="624" y="205" font-size="18" fill="#213446">intermediate [reaction_batch]</text><g stroke="#1c6480" stroke-width="4" fill="none" stroke-linejoin="round"><path d="M446 185v95q54 36 108 0v-95 M464 257q39-37 75 0 M528 244l13 14-19 1"/><path d="M400 354h192 M579 344l13 10-13 10"/></g><text x="420" y="375" font-size="15" fill="#213446">Operation symbol;</text><text x="410" y="397" font-size="15" fill="#213446">geometry not reported</text><text x="32" y="452" font-size="18" fill="#213446">This 30 min experimental group feeds heterostructure growth. The60 min pure-CsPbBr3 control and</text><text x="32" y="477" font-size="18" fill="#213446">its separate stabilization are pending.</text><text x="32" y="527" font-size="17" fill="#213446">duration: 30 min</text><text x="32" y="554" font-size="17" fill="#213446">temperature: not reported (Core synthesis is described as room-temperature; no numerical temperature is</text><text x="32" y="578" font-size="17" fill="#213446">reported.)</text><text x="32" y="773" font-size="15" fill="#596b7d">Atmosphere / pressure: not reported. Icons do not specify vessel type, size or fill level.</text><text x="32" y="799" font-size="14" fill="#596b7d">Source: Yang et al. (2023), main PDF p.7; room-temperature context p.2.</text></g></svg>