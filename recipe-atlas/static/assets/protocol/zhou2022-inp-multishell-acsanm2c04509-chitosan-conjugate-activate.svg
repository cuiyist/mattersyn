<svg xmlns="http://www.w3.org/2000/svg" width="960" height="923" viewBox="0 0 960 923"><title>Mix QD–MPA with EDC</title><desc>Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular geometry, or experimental trace is implied. Drawing dimensions and liquid level are schematic, not measured geometry. No mechanical shaker, stirring bar, or speed is inferred.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><rect width="960" height="923" rx="15" fill="#f7fafc"/><text x="30" y="32" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#637f8e">Chitosan coupling of QD–MPA</text><text x="30" y="57" font-family="Arial,sans-serif" font-size="28" text-anchor="start" fill="#173c4a">Mix QD–MPA with EDC</text><text x="30" y="92" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">vessel capacity: 2 mL</text><text x="30" y="118" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">duration: 15 min</text><text x="30" y="144" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">temperature: room temperature; numerical value not reported</text><g transform="translate(70 188)"><rect x="360" y="50" width="100" height="169" rx="8" fill="#eef6f8" stroke="#3c6475" stroke-width="3"/><path d="M360 68h100M368 187q42.0 10 84 0" fill="none" stroke="#9abbc8" stroke-width="4"/><path d="M267 135L336 135" fill="none" stroke="#477e91" stroke-width="4" marker-end="url(#arrow)"/><path d="M487 135L556 135" fill="none" stroke="#477e91" stroke-width="4" marker-end="url(#arrow)"/><text x="410" y="301" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#173c4a">Reported shaking / mixing</text></g><text x="30" y="583" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Inputs: MPA-modified InP/ZnSe/ZnS quantum dots; Phosphate-buffered saline; formulation partly</text><text x="30" y="609" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">specified; 1-Ethyl-3-(3-dimethylaminopropyl)carbodiimide hydrochloride</text><text x="30" y="635" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="661" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Outputs: Mix QD–MPA with EDC</text><text x="30" y="687" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="713" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Shake in the stated 2 mL glass bottle at room temperature for 15 min.</text><text x="30" y="739" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="765" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular</text><text x="30" y="791" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">geometry, or experimental trace is implied. Drawing dimensions and liquid level are schematic, not</text><text x="30" y="817" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">measured geometry. No mechanical shaker, stirring bar, or speed is inferred.</text><text x="30" y="843" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="869" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Source: Main PDF p.4, Section 2.3, Cellular and Subcellular Labeling</text></svg>