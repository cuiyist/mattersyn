<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3z" fill="#c08424"/></marker></defs><g font-family="Arial, sans-serif"><rect width="960" height="550" fill="#f8fafc"/><rect x="0" y="0" width="960" height="72" fill="#173949"/><text x="28" y="30" font-size="14" fill="#b6dce7" text-anchor="start">KIM 2013 · PbS QUANTUM DOTS</text><text x="28" y="58" font-size="24" fill="white" text-anchor="start">09  Isolate QDs and repeat washing several times</text><circle cx="455" cy="223" r="73" fill="none" stroke="#24677a" stroke-width="4"/><path d="M455 150 v146 M382 223 h146" stroke="#91a9b0" stroke-width="3"/><rect x="393" y="207" width="124" height="28" fill="#f8fafc"/><text x="455" y="225" font-size="15" fill="#233749" text-anchor="middle">CENTRIFUGE</text><path d="M545 223 L725 223" stroke="#c08424" stroke-width="3" marker-end="url(#a)" fill="none"/><text x="751" y="220" font-size="18" fill="#233749" text-anchor="start">Isolated PbS</text><text x="751" y="246" font-size="18" fill="#233749" text-anchor="start">nanoparticles</text><text x="65" y="146" font-size="19" fill="#233749" text-anchor="start">Repeat wash several times</text><text x="65" y="174" font-size="15" fill="#233749" text-anchor="start">Count, rate and time unknown</text><text x="480" y="338" font-size="16" fill="#233749" text-anchor="middle">Conceptual separation symbol; vessel not reported</text><path d="M25 392 H935" stroke="#cbd5e1"/><text x="28" y="417" font-size="16" fill="#233749" text-anchor="start">Centrifuge to isolate the PbS nanoparticles. The source says this washing step was repeated several times:</text><text x="28" y="439" font-size="16" fill="#233749" text-anchor="start">exact repetition count, centrifugation rate/time and per-repeat charge details are unreported. No numerical</text><text x="28" y="461" font-size="16" fill="#233749" text-anchor="start">repetition count or cumulative solvent consumption is calculated.</text><text x="28" y="530" font-size="13" fill="#526673" text-anchor="start">Conceptual stage illustration. No measured geometry, fill, gas plumbing or unstated hardware.</text></g></svg>