<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Fafarman 2014 open-vessel microwave Ag nanocrystal synthesis</title>
<desc id="desc">A conceptual 50 mL round-bottom flask in an open-vessel microwave reactor, with source-reported feed quantities and heating schedule. The geometry and liquid color are illustrative.</desc>
<rect x="1" y="1" width="998" height="428" rx="22" fill="#f7fbfd" stroke="#d5e3ed" stroke-width="2"/>
<text x="34" y="47" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#15374e">Microwave formation of Ag nanocrystals</text>
<text x="34" y="75" font-family="Arial,sans-serif" font-size="16" fill="#526b7b">Fafarman et al., 2014 · Methods, printed p. 2752</text>
<rect x="34" y="103" width="305" height="224" rx="16" fill="#ffffff" stroke="#afc9d8" stroke-width="2"/>
<text x="56" y="137" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#23485f">Charge · 50 mL flask</text>
<text x="56" y="179" font-family="Arial,sans-serif" font-size="17" fill="#2e5266">Silver acetate   2 mmol</text>
<text x="56" y="211" font-family="Arial,sans-serif" font-size="17" fill="#2e5266">TDPA                  1 mmol</text>
<text x="56" y="243" font-family="Arial,sans-serif" font-size="17" fill="#2e5266">Trioctylamine  20 mL</text>
<text x="56" y="291" font-family="Arial,sans-serif" font-size="15" fill="#5b7484">Vigorous stirring · N₂ atmosphere</text>
<path d="M349 215 H395" stroke="#7595a7" stroke-width="4"/><path d="M395 215 l-13 -8 v16 z" fill="#7595a7"/>
<rect x="410" y="103" width="275" height="224" rx="16" fill="#ebf4fa" stroke="#8aafc3" stroke-width="2"/>
<rect x="438" y="129" width="220" height="155" rx="14" fill="#f8fcfe" stroke="#8faaba" stroke-width="3"/>
<path d="M534 147 v34 c-29 15-34 42-24 59 18 34 62 34 80 0 10-17 5-44-24-59 v-34" fill="none" stroke="#386983" stroke-width="4"/>
<path d="M511 229 q37 17 78 0 q-3 34-39 34-35 0-39-34" fill="#cde4ef" stroke="none"/>
<text x="448" y="309" font-family="Arial,sans-serif" font-size="15" fill="#4d6a7b">Open-vessel microwave · schematic</text>
<path d="M695 215 H741" stroke="#7595a7" stroke-width="4"/><path d="M741 215 l-13 -8 v16 z" fill="#7595a7"/>
<rect x="756" y="103" width="210" height="224" rx="16" fill="#ffffff" stroke="#afc9d8" stroke-width="2"/>
<text x="778" y="139" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#23485f">Reported schedule</text>
<text x="778" y="182" font-family="Arial,sans-serif" font-size="18" fill="#2e5266">150 W</text>
<text x="778" y="216" font-family="Arial,sans-serif" font-size="18" fill="#2e5266">to 150 °C in 4 min</text>
<text x="778" y="250" font-family="Arial,sans-serif" font-size="18" fill="#2e5266">hold 5 min</text>
<text x="778" y="290" font-family="Arial,sans-serif" font-size="15" fill="#5b7484">then air-cool</text>
<text x="34" y="371" font-family="Arial,sans-serif" font-size="16" fill="#3b6175">Workup follows separately: ethanol flocculation → hexane redispersion → isopropyl-alcohol flocculation → octane dispersion.</text>
<text x="34" y="401" font-family="Arial,sans-serif" font-size="14" fill="#6c8290">Illustration of source-reported steps; device shape, flask fill level and liquid color are not measured evidence.</text>
</svg>
