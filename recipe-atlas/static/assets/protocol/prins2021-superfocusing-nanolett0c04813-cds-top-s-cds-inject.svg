<svg xmlns="http://www.w3.org/2000/svg" width="960" height="735" viewBox="0 0 960 735" role="img" aria-labelledby="title desc"><title id="title">Stop nitrogen flow, heat to 280 °C under nitrogen and inject TOP-S</title><desc id="desc">Vessel dimensions and geometry are not reported for this operation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><g font-family="Arial,sans-serif"><rect width="960" height="735" rx="16" fill="#f7fafb"/><text x="28" y="42" font-size="27" text-anchor="start" fill="#274c60">Stop nitrogen flow, heat to 280 °C under nitrogen and inject TOP-S</text><text x="28" y="77" font-size="20" text-anchor="start" fill="#274c60">temperature: 280 degC; injection volume: 2 mL; tops concentration: 1 M; Atmosphere: nitrogen</text><text x="28" y="105" font-size="20" text-anchor="start" fill="#274c60">atmosphere; flow stopped</text><g transform="translate(0 161)"><rect x="399" y="104" width="162" height="155" rx="19" fill="#edf5f8" stroke="#466c7d" stroke-width="3"/><path d="M411 216q69 13 138 0" fill="none" stroke="#9dc1cf" stroke-width="4"/><g transform="translate(0 0)"><path d="M462 2h36v37h-36zM480-14v16M456-14h48M480 39v45" fill="#e1eef3" stroke="#426a7d" stroke-width="3"/></g><path d="M525 29L504 72" fill="none" stroke="#477e91" stroke-width="3" marker-end="url(#arrow)"/><text x="611" y="24" font-size="21" text-anchor="middle" fill="#274c60">Feed transfer</text><path d="M684 248q-13-20 0-39m32 39q-13-20 0-39m32 39q-13-20 0-39" fill="none" stroke="#be8258" stroke-width="3"/><text x="720" y="284" font-size="19" text-anchor="middle" fill="#274c60">Heating cue</text><text x="480" y="292" font-size="20" text-anchor="middle" fill="#274c60">Vessel unspecified</text></g><text x="28" y="573" font-size="20" text-anchor="start" fill="#274c60">Inputs: Stir at 100 °C for 60 min under nitrogen flow; Sulfur precursor in TOP</text><text x="28" y="600" font-size="20" text-anchor="start" fill="#274c60">Outputs: Stop nitrogen flow, heat to 280 °C under nitrogen and inject TOP-S</text><text x="28" y="627" font-size="20" text-anchor="start" fill="#274c60">Vessel dimensions and geometry are not reported for this operation.</text><text x="28" y="654" font-size="20" text-anchor="start" fill="#274c60">Schematic action illustration. Drawn shapes, dimensions and fill levels are illustrative; only</text><text x="28" y="681" font-size="20" text-anchor="start" fill="#274c60">stated source dimensions are quantitative.</text></g></svg>
