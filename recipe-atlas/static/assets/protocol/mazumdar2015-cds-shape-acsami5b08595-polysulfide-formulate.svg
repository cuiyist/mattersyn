<svg xmlns="http://www.w3.org/2000/svg" width="960" height="816" viewBox="0 0 960 816" role="img"><title>Reported cell formulation: 1 M Na2S and 1 M sulfur</title><desc>Source-linked stage schematic. No unreported equipment dimensions or solution species are asserted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="816" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="34" font-size="18" text-anchor="start" fill="#647888">Sandwich-cell polysulfide formulation; solvent unspecified</text><text x="30" y="73" font-size="28" text-anchor="start" fill="#234b60">Reported cell formulation: 1 M Na2S and 1 M sulfur</text><text x="30" y="112" font-size="21" text-anchor="start" fill="#234b60">na2s concentration: 1 M</text><text x="30" y="140" font-size="21" text-anchor="start" fill="#234b60">sulfur concentration: 1 M</text><g transform="translate(0 174)"><rect x="410" y="24" width="130" height="165" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M418 152q57.0 10 114 0" fill="none" stroke="#9abfce" stroke-width="4"/><text x="480" y="228" font-size="21" text-anchor="middle" fill="#234b60">Reported composition; solvent not specified</text></g><text x="30" y="514" font-size="20" text-anchor="start" fill="#234b60">Inputs: Sodium sulfide; hydration unspecified; Elemental sulfur; allotrope unspecified</text><text x="30" y="550" font-size="20" text-anchor="start" fill="#234b60">Output: Reported sandwich-cell electrolyte; solvent unspecified</text><text x="30" y="586" font-size="20" text-anchor="start" fill="#234b60">Section 2.4 reports this composition for a drop added to the sandwich solar cell. Solvent,</text><text x="30" y="613" font-size="20" text-anchor="start" fill="#234b60">mixing order, preparation duration and temperature are not reported. This record does not</text><text x="30" y="640" font-size="20" text-anchor="start" fill="#234b60">supply an aqueous formulation or a complete preparation method; the impedance medium is a</text><text x="30" y="667" font-size="20" text-anchor="start" fill="#234b60">separate source context.</text><text x="30" y="703" font-size="20" text-anchor="start" fill="#234b60">Illustrative formulation container; cell solvent, mixing procedure and container geometry are</text><text x="30" y="730" font-size="20" text-anchor="start" fill="#234b60">not reported.</text><text x="30" y="766" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.2 §2.4</text></g></svg>