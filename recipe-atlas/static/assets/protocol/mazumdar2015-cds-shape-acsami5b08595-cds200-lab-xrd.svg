<svg xmlns="http://www.w3.org/2000/svg" width="960" height="763" viewBox="0 0 960 763" role="img"><title>Acquire laboratory powder XRD</title><desc>Source-linked stage schematic. No unreported equipment dimensions or solution species are asserted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="763" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="34" font-size="18" text-anchor="start" fill="#647888">CdS synthesis at 200 °C</text><text x="30" y="73" font-size="28" text-anchor="start" fill="#234b60">Acquire laboratory powder XRD</text><text x="30" y="112" font-size="21" text-anchor="start" fill="#234b60">wavelength: 1.5418 angstrom</text><text x="30" y="140" font-size="21" text-anchor="start" fill="#234b60">step width: step width of 0.02</text><text x="30" y="168" font-size="21" text-anchor="start" fill="#234b60">scan rate: scan rate of 2.50 per min</text><g transform="translate(0 202)"><rect x="270" y="30" width="420" height="162" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><text x="480" y="89" font-size="29" text-anchor="middle" fill="#234b60">Powder diffraction</text><text x="480" y="136" font-size="21" text-anchor="middle" fill="#234b60">Instrument settings shown above</text><text x="480" y="232" font-size="21" text-anchor="middle" fill="#234b60">No peak trace or measured atomic model invented</text></g><text x="30" y="542" font-size="20" text-anchor="start" fill="#234b60">Inputs: Grind powder and load grooved quartz-glass plate</text><text x="30" y="578" font-size="20" text-anchor="start" fill="#234b60">Output: Acquire laboratory powder XRD</text><text x="30" y="614" font-size="20" text-anchor="start" fill="#234b60">Philips X Pert Pro CuKα. Angular units are not silently added to the printed step and rate.</text><text x="30" y="650" font-size="20" text-anchor="start" fill="#234b60">Apparatus dimensions, liquid level and spatial layout are schematic, not measured source</text><text x="30" y="677" font-size="20" text-anchor="start" fill="#234b60">geometry.</text><text x="30" y="713" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.2 §2.2</text></g></svg>