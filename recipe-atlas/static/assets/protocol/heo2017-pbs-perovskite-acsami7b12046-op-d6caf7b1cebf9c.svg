<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="627" viewBox="0 0 1000 627"><title>Spin-coat warm P3HT/toluene solution</title><desc>Spin-coat warm P3HT/toluene solution. Aliquot volume: 100 uL Solution temperature: 60 °C; Temperature of solution; not substrate anneal. Spin speed: 3000 rpm Duration: 30 s Environment: Not reported; Atmosphere not reported for this operation. No P3HT annealing stage reported. Conceptual material flow. Shapes do not represent apparatus geometry, liquid levels or measured particle structure.</desc><rect x="1" y="1" width="998" height="625" rx="16" fill="#f8fbfc" stroke="#a9c5d0"/><rect x="0" y="0" width="1000" height="50" rx="16" fill="#173f50"/><text x="30" y="31" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">STEP 01 / 02  ·  SYNTHESIS</text><text x="30" y="84" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#244754">Spin-coat warm P3HT/toluene solution</text><text x="30" y="121" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#506875">Heo et al. (2017): PbS QDs-15 device completion and photovoltaic classes</text><rect x="30" y="169" width="415" height="122" rx="12" fill="#e6f0f4" stroke="#bad0db"/><rect x="555" y="169" width="415" height="122" rx="12" fill="#edf4ed" stroke="#c4d4c4"/><path d="M462 230.0H537m-13 -11l13 11-13 11" fill="none" stroke="#528295" stroke-width="3"/><text x="48" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">INPUTS / CONTEXT</text><text x="48" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• PbS QDs-15/mp-TiO2/bl-TiO2/FTO/glass</text><text x="48" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• P3HT/toluene (15 mg/1 mL)</text><text x="573" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">OUTPUT / STATE</text><text x="573" y="226" font-family="Arial,sans-serif" font-s