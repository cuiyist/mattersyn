<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img"><title>Place precipitates in 10 mL chloroform and 10 mL methanol</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3e778d"/></marker></defs><rect width="960" height="680" fill="#fff"/><g font-family="Arial, sans-serif"><text x="30" y="44" font-size="28" text-anchor="start" fill="#244659">Place precipitates in 10 mL chloroform and 10 mL methanol</text><text x="30" y="84" font-size="21" text-anchor="start" fill="#244659">chloroform volume: 10 mL; methanol volume: 10 mL</text><g transform="translate(0 124)"><rect x="428" y="36" width="104" height="146" rx="12" stroke="#47778a" stroke-width="3" fill="#edf5f8"/><path d="M438 140q42.0 12 84 0" fill="none" stroke="#91bbc9" stroke-width="3"/><text x="480" y="225" font-size="21" text-anchor="middle" fill="#244659">Vessel and hardware geometry unspecified</text></g><text x="30" y="396" font-size="20" text-anchor="start" fill="#244659">Inputs: Separate by centrifugation and recover precipitates; Chloroform; Methanol</text><text x="30" y="432" font-size="20" text-anchor="start" fill="#244659">Outputs: Place precipitates in 10 mL chloroform and 10 mL methanol</text><text x="30" y="468" font-size="20" text-anchor="start" fill="#244659">Source says dissolved; no molecular dissolution mechanism inferred for ZnO nanoparticles and no</text><text x="30" y="495" font-size="20" text-anchor="start" fill="#244659">exact final solution volume asserted.</text><text x="30" y="531" font-size="20" text-anchor="start" fill="#244659">Exact vessel type, size and hardware geometry are not reported; drawing is a qualified</text><text x="30" y="558" font-size="20" text-anchor="start" fill="#244659">schematic.</text><text x="30" y="594" font-size="20" text-anchor="start" fill="#244659">Qualified schematic; dimensions and fill levels are illustrative.</text><text x="30" y="630" font-size="20" text-anchor="start" fill="#244659">Source: SI PDF p.2, Synthesis of ZnO nanoparticles</text></g></svg>