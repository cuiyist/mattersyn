<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640"><title>Record molecular proton NMR</title><desc>Conceptual operation diagram; only source-stated equipment and conditions apply.</desc><rect x="5" y="5" width="1090" height="630" rx="20" fill="#f4f8fa" stroke="#bed0d8"/><g transform="translate(15 110)" fill="none" stroke="#477184" stroke-width="3.5"><rect x="30" y="55" width="270" height="180" rx="14"/><rect x="60" y="85" width="165" height="110"/><circle cx="265" cy="186" r="10"/></g><text x="360" y="48" font-family="sans-serif" font-size="25" fill="#183e4d">Record molecular proton NMR</text><text x="360" y="115" font-family="sans-serif" font-size="19" fill="#294f5e">Record at 298 K on the 500 MHz Bruker Advance instrument; 10</text><text x="360" y="143" font-family="sans-serif" font-size="19" fill="#294f5e">scans, 2 dummy scans and a 10 s relaxation delay for small</text><text x="360" y="171" font-family="sans-serif" font-size="19" fill="#294f5e">molecules.</text><text x="25" y="590" font-family="sans-serif" font-size="16" fill="#55717d">Conceptual operation diagram; only source-stated equipment and conditions apply.</text></svg>
