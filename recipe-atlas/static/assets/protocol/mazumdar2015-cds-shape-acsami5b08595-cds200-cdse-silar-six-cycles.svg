<svg xmlns="http://www.w3.org/2000/svg" width="960" height="817" viewBox="0 0 960 817" role="img"><title>Dip alternately for CdSe SILAR, six cycles</title><desc>Source-linked stage schematic. No unreported equipment dimensions or solution species are asserted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="817" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="34" font-size="18" text-anchor="start" fill="#647888">CdSe co-sensitization of CdS200/TiO2</text><text x="30" y="73" font-size="28" text-anchor="start" fill="#234b60">Dip alternately for CdSe SILAR, six cycles</text><text x="30" y="112" font-size="21" text-anchor="start" fill="#234b60">cycles: 6 count</text><text x="30" y="140" font-size="21" text-anchor="start" fill="#234b60">dip duration each case: 30 s</text><text x="30" y="168" font-size="21" text-anchor="start" fill="#234b60">Environment: nitrogen</text><g transform="translate(0 202)"><rect x="156" y="44" width="255" height="148" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><rect x="555" y="44" width="255" height="148" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><text x="283" y="32" font-size="21" text-anchor="middle" fill="#234b60">0.03 M Cd nitrate</text><text x="683" y="32" font-size="21" text-anchor="middle" fill="#234b60">NaBH₄ / SeO₂ in ethanol</text><rect x="203" y="121" width="160" height="22" fill="#cadde7" stroke="#557f91" stroke-width="3"/><path d="M211 114h144" stroke="#ac8d48" stroke-width="7"/><rect x="605" y="121" width="160" height="22" fill="#cadde7" stroke="#557f91" stroke-width="3"/><path d="M613 114h144" stroke="#ac8d48" stroke-width="7"/><path d="M427 95L533 95" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M533 133L427 133" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="480" y="228" font-size="21" text-anchor="middle" fill="#234b60">Bath geometry illustrative; rinse steps not supplied</text></g><text x="30" y="542" font-size="20" text-anchor="start" fill="#234b60">Inputs: Provide cadmium and selenium SILAR baths; CdS-sensitized composite TiO2/FTO;</text><text x="30" y="569" font-size="20" text-anchor="start" fill="#234b60">temperature variant specified by record; Nitrogen</text><text x="30" y="605" font-size="20" text-anchor="start" fill="#234b60">Output: Dip alternately for CdSe SILAR, six cycles</text><text x="30" y="641" font-size="20" text-anchor="start" fill="#234b60">CdS200 films additionally co-sensitized with CdSe. No rinse sequence, bath volumes, substrate</text><text x="30" y="668" font-size="20" text-anchor="start" fill="#234b60">area or deposition temperature reported. No selenium component concentration guessed.</text><text x="30" y="704" font-size="20" text-anchor="start" fill="#234b60">Apparatus dimensions, liquid level and spatial layout are schematic, not measured source</text><text x="30" y="731" font-size="20" text-anchor="start" fill="#234b60">geometry.</text><text x="30" y="767" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.2 §2.3</text></g></svg>