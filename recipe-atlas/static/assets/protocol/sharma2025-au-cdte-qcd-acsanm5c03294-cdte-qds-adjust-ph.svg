<svg xmlns="http://www.w3.org/2000/svg" width="960" height="715" viewBox="0 0 960 715" role="img"><title>Adjust solution to pH 10.9</title><desc>Source-linked conceptual stage; geometry and unreported fields are not measurements.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="715" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#647888">MPA-capped CdTe quantum-dot synthesis</text><text x="30" y="68" font-size="28" text-anchor="start" fill="#234b60">Adjust solution to pH 10.9</text><text x="30" y="107" font-size="21" text-anchor="start" fill="#234b60">pH: 10.9 pH</text><text x="30" y="135" font-size="21" text-anchor="start" fill="#234b60">naoh stock concentration: 1 M</text><text x="30" y="163" font-size="21" text-anchor="start" fill="#234b60">naoh added volume: not reported</text><g transform="translate(0 199)"><rect x="161" y="15" width="79" height="111" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M169 91q31.5 9 63 0" fill="none" stroke="#9abfce" stroke-width="4"/><path d="M275 75L404 114" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="433" y="45" width="110" height="148" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M441 158q47.0 9 94 0" fill="none" stroke="#9abfce" stroke-width="4"/><text x="200" y="163" font-size="21" text-anchor="middle" fill="#234b60">NaOH stock</text><text x="480" y="239" font-size="21" text-anchor="middle" fill="#234b60">Added volume unreported; no invented dosing scale</text></g><text x="30" y="493" font-size="20" text-anchor="start" fill="#234b60">Inputs: Dissolve procedural CdBr2 and MPA in deionized water; Sodium hydroxide stock</text><text x="30" y="529" font-size="20" text-anchor="start" fill="#234b60">Output: Adjust solution to pH 10.9</text><text x="30" y="565" font-size="20" text-anchor="start" fill="#234b60">The precise value belongs to method prose. Figure 1a separately labels pH 10–12.</text><text x="30" y="601" font-size="20" text-anchor="start" fill="#234b60">Generic apparatus cue; vessel dimensions, quantitative liquid level and spatial layout are not</text><text x="30" y="628" font-size="20" text-anchor="start" fill="#234b60">measured source geometry.</text><text x="30" y="664" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.3 §2.3</text></g></svg>