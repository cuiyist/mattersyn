<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="761" viewBox="0 0 1100 761"><rect width="1100" height="761" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="42" font-size="27" font-weight="bold" fill="#173047">04 Wash crude product three times</text><text x="28" y="91" font-size="17" font-weight="normal" fill="#596b7d">primary reported preparation</text><g transform="translate(0 101)"><g transform="translate(875 0)" stroke="#1b6986" fill="none" stroke-width="3" stroke-linejoin="round"><rect x="15" y="24" width="43" height="56"/><rect x="107" y="24" width="43" height="56"/><path d="M64 42h37m-9-7 9 7-9 7 M101 65H64m9-7-9 7 9 7"/></g></g><text x="28" y="136" font-size="23" font-weight="normal" fill="#135d83">Repeated washing • conceptual action symbol</text><rect x="26" y="223" width="500" height="233" rx="12" fill="#e6f1fa"/><text x="42" y="261" font-size="19" font-weight="bold" fill="#173047">INPUTS</text><text x="42" y="296" font-size="20" font-weight="normal" fill="#173047">source-described crude aqueous product after</text><text x="42" y="323" font-size="20" font-weight="normal" fill="#173047">extraction</text><text x="42" y="369" font-size="20" font-weight="normal" fill="#173047">ethyl acetate</text><text x="42" y="400" font-size="18" font-weight="normal" fill="#173047">amount: not reported</text><rect x="572" y="223" width="500" height="233" rx="12" fill="#e5f4ed"/><text x="588" y="261" font-size="19" font-weight="bold" fill="#173047">OUTPUTS / PHYSICAL STATES</text><text x="588" y="296" font-size="20" font-weight="normal" fill="#173047">crude aqueous product after three ethyl acetate</text><text x="588" y="323" font-size="20" font-weight="normal" fill="#173047">washes</text><text x="588" y="354" font-size="18" font-weight="normal" fill="#173047">Kind: fraction</text><text x="28" y="494" font-size="21" font-weight="normal" fill="#173047">Wash the source-described crude aqueous product with ethyl acetate three times. Individual wash volumes</text><text x="28" y="522" font-size="21" font-weight="normal" fill="#173047">are unreported.</text><text x="28" y="563" font-size="21" font-weight="normal" fill="#173047">wash count: 3</text><text x="28" y="604" font-size="21" font-weight="normal" fill="#173047">Environment: not reported</text><text x="28" y="645" font-size="21" font-weight="normal" fill="#173047">Retained: crude aqueous product after three ethyl acetate washes</text><text x="28" y="686" font-size="15" font-weight="normal" fill="#596b7d">Conceptual and not to scale; no unreported apparatus geometry, liquid levels or handling atmosphere inferred.</text><text x="28" y="716" font-size="15" font-weight="normal" fill="#596b7d">Khatun et al. (2012) • Main PDF p.2 / printed p.3881, Section 2.2, LHD synthesis</text></g></svg>