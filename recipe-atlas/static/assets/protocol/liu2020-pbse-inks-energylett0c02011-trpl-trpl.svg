<svg xmlns="http://www.w3.org/2000/svg" width="960" height="753" viewBox="0 0 960 753" role="img"><title>Acquire the PbSe-in-DMF transient PL</title><desc>Source-linked conceptual operation. Unreported geometry and quantities are not reconstructed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4d7f93"/></marker></defs><rect width="960" height="753" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#607a89">Time-resolved PL of PbSe ink in DMF</text><text x="30" y="65" font-size="28" text-anchor="start" fill="#254d62">Acquire the PbSe-in-DMF transient PL</text><text x="30" y="100" font-size="21" text-anchor="start" fill="#254d62">excitation wavelength: 400 nm</text><text x="30" y="128" font-size="21" text-anchor="start" fill="#254d62">repetition rate: 76 MHz</text><g transform="translate(0 166)"><rect x="280" y="20" width="400" height="165" rx="9" fill="#eff5f8" stroke="#587f91" stroke-width="3"/><text x="480" y="82" font-size="27" text-anchor="middle" fill="#254d62">Optical acquisition</text><text x="480" y="132" font-size="20" text-anchor="middle" fill="#254d62">Source-specific measurement conditions</text><text x="480" y="229" font-size="20" text-anchor="middle" fill="#254d62">Generic method cue · no simulated spectrum</text></g><text x="30" y="450" font-size="20" text-anchor="start" fill="#254d62">Inputs: Directly synthesized lead-iodide-passivated PbSe quantum dots; Dimethylformamide</text><text x="30" y="486" font-size="20" text-anchor="start" fill="#254d62">Output: Acquire the PbSe-in-DMF transient PL</text><text x="30" y="522" font-size="20" text-anchor="start" fill="#254d62">The common method uses the Ti:sapphire second harmonic and a Hamamatsu streak camera with a</text><text x="30" y="549" font-size="20" text-anchor="start" fill="#254d62">near-IR-sensitive cathode. Solution concentration, pulse fluence and specific detection</text><text x="30" y="576" font-size="20" text-anchor="start" fill="#254d62">wavelength are unreported.</text><text x="30" y="612" font-size="20" text-anchor="start" fill="#254d62">Qualified action illustration; no unreported vessel dimensions, hardware, measured</text><text x="30" y="639" font-size="20" text-anchor="start" fill="#254d62">molecular geometry, or experimental trace is implied.</text><text x="30" y="675" font-size="20" text-anchor="start" fill="#254d62">Source: SI PDF p.7, Section 9, Measurement and characterization; Main PDF p.4, Figure 3c</text><text x="30" y="702" font-size="20" text-anchor="start" fill="#254d62">and DMF TRPL discussion</text></g></svg>