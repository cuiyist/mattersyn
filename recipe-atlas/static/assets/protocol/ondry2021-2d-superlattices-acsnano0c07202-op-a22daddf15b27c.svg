<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790"><title>Dip the supported array into Na2S bath</title><desc>Dip the supported array into Na2S bath. Duration: 30 s Environment: Nitrogen glovebox; anhydrous solvents Self-closing anti-capillary tweezers; one SILAR cycle begins here. Bath/tweezer symbols are schematic. First and second methanol rinses are distinct; no unreported rinse time is supplied. Authored conceptual stage illustration; not measured apparatus or particle structure.</desc><rect x="1" y="1" width="998" height="788" rx="16" fill="#f8fbfc" stroke="#a9c5d0"/><rect x="0" y="0" width="1000" height="50" rx="16" fill="#173f50"/><text x="30" y="31" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">STEP 01 / 05  ·  SURFACE EXCHANGE</text><text x="30" y="84" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#244754">Dip the supported array into Na2S bath</text><text x="30" y="121" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#506875">Ondry et al. (2021): Six-cycle CdS SILAR attachment</text><rect x="30" y="169" width="415" height="133" rx="12" fill="#e6f0f4" stroke="#bad0db"/><rect x="555" y="169" width="415" height="133" rx="12" fill="#edf4ed" stroke="#c4d4c4"/><path d="M462 235.5H537m-13 -11l13 11-13 11" fill="none" stroke="#528295" stroke-width="3"/><text x="48" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">INPUTS / CONTEXT</text><text x="48" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• t-BuSH-treated, transferred and 200</text><text x="48" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">°C-treated CdSe/CdS array</text><text x="48" y="276" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• Na2S in methanol</text><text x="573" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="70