<svg xmlns="http://www.w3.org/2000/svg" width="960" height="762" viewBox="0 0 960 762" role="img"><title>Raise reaction temperature to 240 °C</title><desc>Source-linked stage schematic. No unreported equipment dimensions or solution species are asserted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="762" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="34" font-size="18" text-anchor="start" fill="#647888">CdS synthesis at 240 °C</text><text x="30" y="73" font-size="28" text-anchor="start" fill="#234b60">Raise reaction temperature to 240 °C</text><text x="30" y="112" font-size="21" text-anchor="start" fill="#234b60">temperature: 240 degC</text><text x="30" y="140" font-size="21" text-anchor="start" fill="#234b60">Environment: nitrogen</text><g transform="translate(0 174)"><path d="M403 19v64q-70 48-19 104q75 59 151 0q51-56-19-104V19h-30v63h-52V19z" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M450 82V5h28v77" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M398 150q65 23 132 0" stroke="#9abfce" stroke-width="4" fill="none"/><text x="480" y="300" font-size="20" text-anchor="middle" fill="#234b60">Three-neck flask · source geometry unspecified</text><path d="M358 179q119 123 242 0v37q-120 101-242 0z" fill="#e9d4c1" stroke="#987b64" stroke-width="3"/><text x="700" y="50" font-size="19" text-anchor="middle" fill="#234b60">N₂ / Schlenk context</text><path d="M691 68L556 68" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/></g><text x="30" y="514" font-size="20" text-anchor="start" fill="#234b60">Inputs: Dissolve cadmium nitrate in 15 mL oleylamine at 140 °C</text><text x="30" y="550" font-size="20" text-anchor="start" fill="#234b60">Output: Raise reaction temperature to 240 °C</text><text x="30" y="586" font-size="20" text-anchor="start" fill="#234b60">As soon as the selected reaction temperature is reached, begin H2S introduction. No ramp rate</text><text x="30" y="613" font-size="20" text-anchor="start" fill="#234b60">or stabilization dwell supplied.</text><text x="30" y="649" font-size="20" text-anchor="start" fill="#234b60">Apparatus dimensions, liquid level and spatial layout are schematic, not measured source</text><text x="30" y="676" font-size="20" text-anchor="start" fill="#234b60">geometry.</text><text x="30" y="712" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.2 §2.1</text></g></svg>