<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410"><title>Inspect stage morphology</title><desc>Source-bound operation schematic; geometry, fill levels and component spacing are conceptual and not quantified.</desc><rect x="5" y="5" width="910" height="400" rx="20" fill="#f4f8fa" stroke="#bed0d8"/><g transform="translate(14 55)" fill="none" stroke="#477184" stroke-width="3.5" font-family="sans-serif" font-size="20"><path d="M40 264h253M108 25h111v49H108zM149 74v114M111 190h109M135 192l-32 46M185 192l35 46"/></g><text stroke="none" x="365" y="54" font-family="sans-serif" font-size="24" fill="#183e4d">Inspect stage morphology</text><text stroke="none" x="365" y="99" font-family="sans-serif" font-size="18" fill="#294f5e">Tapping-mode AFM in air at room temperature, scan 1.5</text><text stroke="none" x="365" y="127" font-family="sans-serif" font-size="18" fill="#294f5e">Hz, tip force constant 40 N/m; Seiko Spi3800N. Figure 7</text><text stroke="none" x="365" y="155" font-family="sans-serif" font-size="18" fill="#294f5e">gives stage surfaces, not free colloidal particle size</text><text stroke="none" x="365" y="183" font-family="sans-serif" font-size="18" fill="#294f5e">distributions.</text><text stroke="none" x="30" y="382" font-family="sans-serif" font-size="16" fill="#55717d">Conceptual stage scene; no unreported vessel size, liquid level, pressure or geometry implied.</text></svg>
