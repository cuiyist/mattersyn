<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="815" viewBox="0 0 1000 815"><title>Immerse the Au-grid-supported array</title><desc>Immerse the Au-grid-supported array. Duration: 5 min Environment: Not reported; Atmosphere not reported for this operation. The source does not require the 300 °C anneal before exchange; precise exchanged-ion concentration is not controlled. Grid and liquid-contact symbols are schematic; no bath volume or geometry is asserted. Authored conceptual stage illustration; not measured apparatus or particle structure.</desc><rect x="1" y="1" width="998" height="813" rx="16" fill="#f8fbfc" stroke="#a9c5d0"/><rect x="0" y="0" width="1000" height="50" rx="16" fill="#173f50"/><text x="30" y="31" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">STEP 01 / 02  ·  SURFACE EXCHANGE</text><text x="30" y="84" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#244754">Immerse the Au-grid-supported array</text><text x="30" y="121" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#506875">Ondry et al. (2021): Copper-intermediate cation exchange</text><rect x="30" y="169" width="415" height="158" rx="12" fill="#e6f0f4" stroke="#bad0db"/><rect x="555" y="169" width="415" height="158" rx="12" fill="#edf4ed" stroke="#c4d4c4"/><path d="M462 248.0H537m-13 -11l13 11-13 11" fill="none" stroke="#528295" stroke-width="3"/><text x="48" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">INPUTS / CONTEXT</text><text x="48" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• Attached CdSe/CdS array with six</text><text x="48" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">SILAR-grown CdS monolayers</text><text x="48" y="276" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• Au TEM grid</text><text x="48" y="301" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• Copper(I) complex in methanol</text><text x="573" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">OUTPUT / STATE</text><text x="573" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• cu film</text><text x="573" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">State kind: mixture</text><g transform="translate(30 366)"><circle cx="195" cy="89" r="42" fill="#f6efda" stroke="#ad945a" stroke-width="3"/><path d="M175 55V123" fill="none" stroke="#ad945a" stroke-width="1"/><path d="M161 69H229" fill="none" stroke="#ad945a" stroke-width="1"/><path d="M195 55V123" fill="none" stroke="#ad945a" stroke-width="1"/><path d="M161 89H229" fill="none" stroke="#ad945a" stroke-width="1"/><path d="M215 55V123" fill="none" stroke="#ad945a" stroke-width="1"/><path d="M161 109H229" fill="none" stroke="#ad945a" stroke-width="1"/><text x="165" y="156" font-family="Arial,sans-serif" font-size="17" fill="#244754">Au-grid support</text><path d="M280 86L415 86" fill="none" stroke="#528295" stroke-width="3"/><path d="M406 79L415 86L406 93" fill="none" stroke="#528295" stroke-width="3"/><path d="M455 56V128H570V56" fill="none" stroke="#bd7747" stroke-width="4"/><path d="M469 84H556" fill="none" stroke="#7ba5b8" stroke-width="2"/><text x="650" y="80" font-family="Arial,sans-serif" font-size="19" fill="#244754">Immersion</text><text x="650" y="113" font-family="Arial,sans-serif" font-size="17" fill="#244754">Supported film retained</text></g><text x="30" y="591" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">OPERATION CONDITIONS</text><text x="30" y="619" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">Duration: 5 min</text><text x="30" y="658" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">Environment: Not reported; Atmosphere not reported for this operation.</text><text x="30" y="695" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">The source does not require the 300 °C anneal before exchange; precise exchanged-ion concentration is not controlled.</text><text x="30" y="741" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#566d75">Grid and liquid-contact symbols are schematic; no bath volume or geometry is asserted. Authored conceptual stage illustration; not measured</text><text x="30" y="761" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#566d75">apparatus or particle structure.</text></svg>