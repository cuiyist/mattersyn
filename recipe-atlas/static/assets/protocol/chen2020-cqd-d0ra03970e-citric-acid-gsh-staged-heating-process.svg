<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="t d"><title id="t">Citric acid and glutathione CQD preparation</title><desc id="d">Authored conceptual workflow; vessel geometry and dots are illustrative.</desc><rect width="1000" height="330" rx="20" fill="#f6faf8"/><text x="32" y="42" font-family="Arial,sans-serif" font-size="24" fill="#173d49">Staged heating to carbon quantum dots</text><g font-family="Arial,sans-serif" fill="#17495a"><text x="35" y="90" font-size="17">1. Mix precursors</text><text x="35" y="115" font-size="14">2 g citric acid monohydrate</text><text x="35" y="137" font-size="14">0.6 g glutathione</text><text x="275" y="90" font-size="17">2. Heat</text><text x="275" y="115" font-size="14">RT → 140 °C → 180 °C</text><text x="275" y="137" font-size="14">Hold 180 °C for 1 h</text><text x="535" y="90" font-size="17">3. Purify</text><text x="535" y="115" font-size="14">Acetone · centrifuge</text><text x="535" y="137" font-size="14">24 h dialysis · 0.22 µm filter</text><text x="790" y="90" font-size="17">4. Dry &amp; stock</text><text x="790" y="115" font-size="14">Freeze-dry</text><text x="790" y="137" font-size="14">1 mg/mL in water</text></g><g fill="none" stroke="#5b8f9a" stroke-width="4"><path d="M220 191h42m-9-9 9 9-9 9M480 191h42m-9-9 9 9-9 9M740 191h42m-9-9 9 9-9 9"/></g><g fill="#b7d6df"><rect x="45" y="182" width="145" height="70" rx="10"/><rect x="300" y="182" width="145" height="70" rx="10"/><rect x="560" y="182" width="145" height="70" rx="10"/><rect x="815" y="182" width="145" height="70" rx="10"/></g><g fill="#617f9b"><circle cx="839" cy="216" r="6"/><circle cx="863" cy="231" r="6"/><circle cx="894" cy="207" r="6"/><circle cx="924" cy="225" r="6"/></g><text x="32" y="299" font-family="Arial,sans-serif" font-size="13" fill="#506a72">Illustrative process · 140 °C dwell, heating ramps, centrifuge settings and yield unreported</text></svg>