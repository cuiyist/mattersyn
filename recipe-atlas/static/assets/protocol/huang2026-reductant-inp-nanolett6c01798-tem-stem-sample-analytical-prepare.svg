<svg xmlns="http://www.w3.org/2000/svg" width="960" height="796" viewBox="0 0 960 796" role="img" aria-labelledby="title desc"><title id="title">Dip a carbon-coated copper TEM grid in QD solution and blot on filter paper at room temperature</title><desc id="desc">A carbon-coated copper TEM grid is dipped in QD solution, then blotted on filter paper. Grid and container dimensions, liquid level and drying time are not reported.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><g font-family="Arial,sans-serif"><rect width="960" height="796" rx="16" fill="#f7fafb"/><text x="28" y="42" font-size="27" text-anchor="start" fill="#274c60">Dip a carbon-coated copper TEM grid in QD solution and blot on</text><text x="28" y="77" font-size="27" text-anchor="start" fill="#274c60">filter paper at room temperature</text><text x="28" y="112" font-size="20" text-anchor="start" fill="#274c60">temperature: room temperature; numerical value not reported</text><g transform="translate(0 168)"><text x="240" y="47" font-size="23" text-anchor="middle" fill="#274c60">Dip grid in QD solution</text><text x="715" y="47" font-size="23" text-anchor="middle" fill="#274c60">Blot on filter paper</text><path d="M154 132v165h179V132" fill="#edf5f8" stroke="#477081" stroke-width="3"/><path d="M161 225h165v64H161z" fill="#b7d5e2"/><circle cx="243" cy="146" r="28" fill="#c2dce6" stroke="#477081" stroke-width="3"/><path d="M231 124v44M221 134h44" stroke="#6b94a3" stroke-width="1.5"/><path d="M243 124v44M221 146h44" stroke="#6b94a3" stroke-width="1.5"/><path d="M255 124v44M221 158h44" stroke="#6b94a3" stroke-width="1.5"/><path d="M287 151L287 239" fill="none" stroke="#477e91" stroke-width="3" marker-end="url(#arrow)"/><path d="M378 210L505 210" fill="none" stroke="#477e91" stroke-width="3" marker-end="url(#arrow)"/><path d="M556 250l166-34