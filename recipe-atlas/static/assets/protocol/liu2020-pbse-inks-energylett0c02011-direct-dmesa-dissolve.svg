ors</text><text x="30" y="613" font-size="20" text-anchor="start" fill="#254d62">Qualified action illustration; no unreported vessel dimensions, hardware, measured</text><text x="30" y="640" font-size="20" text-anchor="start" fill="#254d62">molecular geometry, or experimental trace is implied.</text><text x="30" y="676" font-size="20" text-anchor="start" fill="#254d62">Source: SI PDF p.3, Section 3, One step synthesis and purification of PbSe QD inks</text></g></svg>