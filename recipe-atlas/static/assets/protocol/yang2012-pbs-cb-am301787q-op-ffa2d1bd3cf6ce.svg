<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="905" viewBox="0 0 1100 905"><rect width="1100" height="905" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="42" font-size="27" font-weight="bold" fill="#173047">05 Wash three times with each liquid</text><text x="28" y="91" font-size="17" font-weight="normal" fill="#596b7d">primary reported preparation</text><g transform="translate(0 101)"><g transform="translate(875 0)" stroke="#1b6986" fill="none" stroke-width="3" stroke-linejoin="round"><text x="36" y="25" text-anchor="middle" fill="#1b6986" stroke="none" font-size="15">water ×3</text><text x="123" y="25" text-anchor="middle" fill="#1b6986" stroke="none" font-size="15">ethanol ×3</text><path d="M36 37v42m-7-9 7 9 7-9 M123 37v42m-7-9 7 9 7-9 M24 95h114"/><text x="80" y="117" text-anchor="middle" fill="#1b6986" stroke="none" font-size="13">No ordering implied</text></g></g><text x="28" y="136" font-size="23" font-weight="normal" fill="#135d83">Wash counts; sequence unreported • conceptual action symbol</text><rect x="26" y="223" width="500" height="308" rx="12" fill="#e6f1fa"/><text x="42" y="261" font-size="19" font-weight="bold" fill="#173047">INPUTS</text><text x="42" y="296" font-size="20" font-weight="normal" fill="#173047">PbS-containing product after solvothermal</text><text x="42" y="323" font-size="20" font-weight="normal" fill="#173047">treatment</text><text x="42" y="369" font-size="20" font-weight="normal" fill="#173047">deionized water</text><text x="42" y="400" font-size="18" font-weight="normal" fill="#173047">amount: not reported</text><text x="42" y="444" font-size="20" font-weight="normal" fill="#173047">ethanol</text><text x="42" y="475" font-size="18" font-weight="normal" fill="#173047">amount: not reported</text><rect x="572" y="223" width="500" height="308" rx="12" fill="#e5f4ed"/><text x="588" y="261" font-size="19" font-weight="bold" fill="#173047">OUTPUTS / PHYSICAL STATES</text><text x="588" y="296" font-size="20" font-weight="normal" fill="#173047">PbS powder after water and ethanol washes</text><text x="588" y="327" font-size="18" font-weight="normal" fill="#173047">Kind: fraction</text><text x="28" y="569" font-size="21" font-weight="normal" fill="#173047">Wash the powder with deionized water and ethanol each three times. This is three water washes and three</text><text x="28" y="597" font-size="21" font-weight="normal" fill="#173047">ethanol washes; ordering or interleaving between the liquids, wash volumes and the separation method are</text><text x="28" y="625" font-size="21" font-weight="normal" fill="#173047">unreported.</text><text x="28" y="666" font-size="21" font-weight="normal" fill="#173047">water wash count: 3</text><text x="28" y="707" font-size="21" font-weight="normal" fill="#173047">ethanol wash count: 3</text><text x="28" y="748" font-size="21" font-weight="normal" fill="#173047">Environment: not reported</text><text x="28" y="789" font-size="21" font-weight="normal" fill="#173047">Retained: PbS powder after water and ethanol washes</text><text x="28" y="830" font-size="15" font-weight="normal" fill="#596b7d">Conceptual and not to scale; no unreported apparatus geometry, liquid levels or handling atmosphere inferred.</text><text x="28" y="860" font-size="15" font-weight="normal" fill="#596b7d">Yang et al. (2012) • Main PDF p.2 / printed p.6163, Experimental, Preparation of PbS/CB Composite Counter Electrode</text></g></svg>