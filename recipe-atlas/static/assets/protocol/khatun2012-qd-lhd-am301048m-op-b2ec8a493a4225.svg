<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="899" viewBox="0 0 1100 899"><rect width="1100" height="899" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="42" font-size="27" font-weight="bold" fill="#173047">01 React DOCA with carbonate-forming reagents</text><text x="28" y="91" font-size="17" font-weight="normal" fill="#596b7d">primary reported preparation</text><g transform="translate(0 101)"><g transform="translate(875 0)" stroke="#1b6986" fill="none" stroke-width="3" stroke-linejoin="round"><path d="M18 21h43v31H18z M101 21h43v31h-43z M41 60l32 33m-1-12 1 12-12-1 M122 60L90 93m1-12-1 12 12-1"/></g></g><text x="28" y="136" font-size="23" font-weight="normal" fill="#135d83">Mixing / preparation • conceptual action symbol</text><rect x="26" y="223" width="500" height="412" rx="12" fill="#e6f1fa"/><text x="42" y="261" font-size="19" font-weight="bold" fill="#173047">INPUTS</text><text x="42" y="296" font-size="20" font-weight="normal" fill="#173047">DOCA: deoxycholic acid in method; sodium</text><text x="42" y="323" font-size="20" font-weight="normal" fill="#173047">deoxycholic acid in Materials</text><text x="42" y="354" font-size="18" font-weight="normal" fill="#173047">amount: 0.77 mmol</text><text x="42" y="398" font-size="20" font-weight="normal" fill="#173047">dimethyl sulfoxide (DMSO)</text><text x="42" y="429" font-size="18" font-weight="normal" fill="#173047">volume: 5 mL</text><text x="42" y="473" font-size="20" font-weight="normal" fill="#173047">4-nitrophenyl chloroformate (4-NPC)</text><text x="42" y="504" font-size="18" font-weight="normal" fill="#173047">amount: 3.86 mmol</text><text x="42" y="548" font-size="20" font-weight="normal" fill="#173047">triethylamine</text><text x="42" y="579" font-size="18" font-weight="normal" fill="#173047">amount: 4.63 mmol</text><rect x="572" y="223" width="500" height="412" rx="12" fill="#e5f4ed"/><text x="588" y="261" font-size="19" font-weight="bold" fill="#173047">OUTPUTS / PHYSICAL STATES</text><text x="588" y="296" font-size="20" font-weight="normal" fill="#173047">DOCA carbonate reaction mixture</text><text x="588" y="327" font-size="18" font-weight="normal" fill="#173047">Kind: mixture</text><text x="28" y="673" font-size="21" font-weight="normal" fill="#173047">Use DOCA0.77mmol, DMSO5mL,4-NPC3.86mmol and triethylamine4.63mmol for6h at room temperature.</text><text x="28" y="701" font-size="21" font-weight="normal" fill="#173047">Source wording retained; no controlled numerical room temperature assigned.</text><text x="28" y="742" font-size="21" font-weight="normal" fill="#173047">duration: 6 h</text><text x="28" y="783" font-size="21" font-weight="normal" fill="#173047">Environment: room temperature</text><text x="28" y="824" font-size="15" font-weight="normal" fill="#596b7d">Conceptual and not to scale; no unreported apparatus geometry, liquid levels or handling atmosphere inferred.</text><text x="28" y="854" font-size="15" font-weight="normal" fill="#596b7d">Khatun et al. (2012) • Main PDF p.2 / printed p.3881, Section 2.2, LHD synthesis</text></g></svg>