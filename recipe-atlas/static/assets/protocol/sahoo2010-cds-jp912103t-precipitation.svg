<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Aqueous CdS precipitation, source-bound conceptual process</title>
  <desc id="desc">Cadmium acetate solution and 25 mL sodium sulfide solution are combined with stirring to form CdS precipitate. Cadmium stock volume and exact temperature are not reported.</desc>
  <rect width="960" height="300" rx="22" fill="#f5f9fc"/>
  <text x="38" y="46" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#14324d">Aqueous precipitation</text>
  <text x="38" y="76" font-family="Arial,sans-serif" font-size="14" fill="#476276">Conceptual sequence · not a measured apparatus image</text>
  <rect x="38" y="105" width="245" height="117" rx="16" fill="#e0eff7" stroke="#82aaca" stroke-width="2"/>
  <text x="58" y="141" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#163d5b">Cd(CH₃COO)₂</text>
  <text x="58" y="171" font-family="Arial,sans-serif" font-size="17" fill="#163d5b">0.5 mmol, aqueous</text>
  <text x="58" y="198" font-family="Arial,sans-serif" font-size="13" fill="#4c687b">Water volume unreported</text>
  <path d="M292 164h62" stroke="#397a9b" stroke-width="4" stroke-linecap="round"/>
  <path d="M344 154l15 10-15 10" fill="none" stroke="#397a9b" stroke-width="4" stroke-linecap="round"/>
  <rect x="368" y="105" width="245" height="117" rx="16" fill="#e8f4ed" stroke="#7eb097" stroke-width="2"/>
  <text x="388" y="141" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1c573e">Na₂S solution</text>
  <text x="388" y="171" font-family="Arial,sans-serif" font-size="17" fill="#1c573e">0.5 mmol in 25 mL</text>
  <text x="388" y="198" font-family="Arial,sans-serif" font-size="13" fill="#4c687b">Add while stirring</text>
  <path d="M622 164h62" stroke="#397a9b" stroke-width="4" stroke-linecap="round"/>
  <path d="M674 154l15 10-15 10" fill="none" stroke="#397a9b" stroke-width="4" stroke-linecap="round"/>
  <rect x="698" y="105" width="224" height="117" rx="16" fill="#e4e9f4" stroke="#8c9fbc" stroke-width="2"/>
  <text x="718" y="141" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#273d66">CdS precipitate</text>
  <text x="718" y="171" font-family="Arial,sans-serif" font-size="14" fill="#273d66">Phase later checked by XRD</text>
  <text x="38" y="262" font-family="Arial,sans-serif" font-size="14" fill="#607589">The paper calls the route room-temperature yet says the solution was slightly warmed during addition; no numeric temperature is given.</text>
</svg>
