<svg xmlns="http://www.w3.org/2000/svg" width="820" height="733" viewBox="0 0 820 733"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><rect width="820" height="733" rx="16" fill="#f5f9fb"/><text x="25" y="41" font-family="Arial,sans-serif" font-size="26" text-anchor="start" fill="#173c4a">Age the mixed dispersions for at least 72 h before</text><text x="25" y="73" font-family="Arial,sans-serif" font-size="26" text-anchor="start" fill="#173c4a">time-resolved spectroscopy</text><text x="25" y="105" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">duration: at least 72 h; temperature: room temperature (numerical value not</text><text x="25" y="130" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">reported)</text><g transform="translate(0 183)"><g transform="translate(398 16)"><path d="M-22 0h44v78q68 40 60 102q-9 65-82 65t-82-65q-8-62 60-102z" fill="#edf6f8" stroke="#3c6475" stroke-width="3"/><path d="M-73 174q73 22 146 0M-22 18h44" fill="none" stroke="#9abbc8" stroke-width="4"/></g><rect x="315" y="276" width="166" height="26" rx="5" fill="#dbe8ee" stroke="#3c6475" stroke-width="3"/><path d="M373 213q25 22 50 0" fill="none" stroke="#4b8896" stroke-width="3" marker-end="url(#arrow)"/><text x="398" y="337" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#173c4a">Generic vessel and operation cue</text></g><text x="25" y="570" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Inputs: Combine TP-CdSe with NHS-CdS</text><text x="25" y="597" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Outputs: Age the mixed dispersions for at least 72 h before time-resolved</text><text x="25" y="624" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">spectroscopy</text><text x="25" y="651" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Illustrative action only. Vessel shape, capacity and drawing dimensions are not</text><text x="25" y="678" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">source measurements.</text></svg>