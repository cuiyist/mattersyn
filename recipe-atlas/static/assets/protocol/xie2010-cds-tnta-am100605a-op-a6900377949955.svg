<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850"><rect width="1000" height="850" fill="#f8fbfd"/><style>text{stroke:none}</style><g font-family="Arial,sans-serif"><text x="28" y="41" font-size="25" fill="#213446">13  Immerse in 0.025M Na2S bath</text><text x="28" y="83" font-size="17" fill="#596b7d">Sonication-CdS/TNTAs · conceptual source-bound process</text><rect x="24" y="115" width="372" height="300" rx="12" fill="#e6f1fa"/><rect x="604" y="115" width="372" height="300" rx="12" fill="#e5f4ed"/><text x="43" y="148" font-size="18" fill="#213446">INPUTS</text><text x="623" y="148" font-size="17" fill="#213446">OUTPUTS / PHYSICAL STATES</text><text x="43" y="180" font-size="18" fill="#213446">arrays after first within-cycle</text><text x="43" y="204" font-size="18" fill="#213446">rinse</text><text x="43" y="238" font-size="18" fill="#213446">nominal0.025M Na2S bath</text><text x="623" y="180" font-size="18" fill="#213446">arrays after Na2S immersion</text><text x="623" y="204" font-size="18" fill="#213446">[fraction]</text><g stroke="#1c6480" stroke-width="3.5" fill="none" stroke-linejoin="round"><path d="M440 200v105h120V200 M488 168v95h23v-95 M458 318q12 15 24 0 M497 318q12 15 24 0 M536 318q12 15 24 0"/><text x="422" y="153" font-size="16" fill="#213446">Sonicated bath</text></g><text x="421" y="365" font-size="15" fill="#213446">Schematic only;</text><text x="406" y="386" font-size="15" fill="#213446">no vessel dimensions</text><text x="28" y="445" font-size="18" fill="#213446">Within one deposition cycle, immerse for 2 min during sonication. Four-beaker ordering follows the</text><text x="28" y="469" font-size="18" fill="#213446">explicit CdCl2,water,Na2S,water account in Results3.1 and SI FigureS1; Section2.3 lists the two</text><text x="28" y="493" font-size="18" fill="#213446">precursor solutions and two water beakers without this interleaved presentation. Sonication</text><text x="28" y="517" font-size="18" fill="#213446">power/frequency, temperature and bath volume unreported.</text><text x="28" y="563" font-size="17" fill="#213446">duration: 2 min</text><text x="28" y="591" font-size="17" fill="#213446">Environment: not reported. Atmosphere and pressure not reported for this operation.</text><text x="28" y="799" font-size="15" fill="#596b7d">No inferred liquid levels, sonication power, geometry or solution species.</text><text x="28" y="825" font-size="14" fill="#596b7d">Source: Xie et al.(2010), main Methods2.2–2.3; explicit cycle order3.1/SI FigureS1.</text></g></svg>