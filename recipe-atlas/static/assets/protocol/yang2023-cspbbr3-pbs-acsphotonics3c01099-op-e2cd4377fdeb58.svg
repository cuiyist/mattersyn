<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820"><rect width="1000" height="820" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="32" y="40" font-size="25" fill="#213446">03  Dissolve PbBr2 and TOPO in octane at 120 C</text><text x="32" y="84" font-size="17" fill="#526477">Pb/S 1:1 core route · conceptual process illustration</text><rect x="25" y="115" width="370" height="295" rx="12" fill="#e6f1fa"/><rect x="605" y="115" width="370" height="295" rx="12" fill="#e5f4ed"/><text x="44" y="147" font-size="18" fill="#213446">INPUTS</text><text x="624" y="147" font-size="18" fill="#213446">OUTPUTS / PHYSICAL STATES</text><text x="44" y="180" font-size="18" fill="#213446">lead bromide; amount: 1 mmol</text><text x="44" y="217" font-size="18" fill="#213446">trioctylphosphine oxide (TOPO);</text><text x="44" y="242" font-size="18" fill="#213446">amount: 5 mmol</text><text x="44" y="279" font-size="18" fill="#213446">n-octane; volume: 5 mL</text><text x="624" y="180" font-size="18" fill="#213446">heated PbBr2-TOPO preparation</text><text x="624" y="205" font-size="18" fill="#213446">mixture [mixture]</text><g stroke="#1c6480" stroke-width="4" fill="none" stroke-linejoin="round"><path d="M447 180h106v102H447z M462 303q-10-10 0-21 M500 303q-10-10 0-21 M538 303q-10-10 0-21"/><path d="M400 354h192 M579 344l13 10-13 10"/></g><text x="420" y="375" font-size="15" fill="#213446">Operation symbol;</text><text x="410" y="397" font-size="15" fill="#213446">geometry not reported</text><text x="32" y="452" font-size="18" fill="#213446">Dissolve 1 mmol PbBr2 and5 mmol TOPO in 5 mL octane at 120 C. Atmosphere and duration are not</text><text x="32" y="477" font-size="18" fill="#213446">stated.</text><text x="32" y="527" font-size="17" fill="#213446">temperature: 120 degC</text><text x="32" y="554" font-size="17" fill="#213446">duration: not reported</text><text x="32" y="773" font-size="15" fill="#596b7d">Atmosphere / pressure: not reported. Icons do not specify vessel type, size or fill level.</text><text x="32" y="799" font-size="14" fill="#596b7d">Source: Yang et al. (2023), main PDF p.7; room-temperature context p.2.</text></g></svg>