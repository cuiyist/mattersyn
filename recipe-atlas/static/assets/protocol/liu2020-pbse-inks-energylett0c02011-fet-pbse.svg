<svg xmlns="http://www.w3.org/2000/svg" width="960" height="698" viewBox="0 0 960 698" role="img"><title>Spin-coat the PbSe-I film</title><desc>Source-linked conceptual operation. Unreported geometry and quantities are not reconstructed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4d7f93"/></marker></defs><rect width="960" height="698" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#607a89">Bottom-gate, top-contact PbSe FET preparation</text><text x="30" y="65" font-size="28" text-anchor="start" fill="#254d62">Spin-coat the PbSe-I film</text><text x="30" y="100" font-size="21" text-anchor="start" fill="#254d62">film thickness: 100 nm</text><g transform="translate(0 138)"><path d="M280 80L595 80L680 141L365 141z" fill="#e4eef3" stroke="#587f91" stroke-width="3"/><text x="480" y="35" font-size="27" text-anchor="middle" fill="#254d62">Substrate / device processing</text><text x="480" y="199" font-size="20" text-anchor="middle" fill="#254d62">Selected operation defines the material and layer</text><text x="480" y="236" font-size="20" text-anchor="middle" fill="#254d62">Illustrative plane · no inferred stack or dimensional scale</text></g><text x="30" y="422" font-size="20" text-anchor="start" fill="#254d62">Inputs: Immerse in PTS/toluene; Directly synthesized lead-iodide-passivated PbSe quantum</text><text x="30" y="449" font-size="20" text-anchor="start" fill="#254d62">dots</text><text x="30" y="485" font-size="20" text-anchor="start" fill="#254d62">Output: Spin-coat the PbSe-I film</text><text x="30" y="521" font-size="20" text-anchor="start" fill="#254d62">Spin-coat a 100 nm PbSe-I film. Spin speed, duration, ink concentration and subsequent film</text><text x="30" y="548" font-size="20" text-anchor="start" fill="#254d62">treatment are not reported for this FET method.</text><text x="30" y="584" font-size="20" text-anchor="start" fill="#254d62">Qualified action illustration; no unreported vessel dimensions, hardware, measured</text><text x="30" y="611" font-size="20" text-anchor="start" fill="#254d62">molecular geometry, or experimental trace is implied.</text><text x="30" y="647" font-size="20" text-anchor="start" fill="#254d62">Source: SI PDF p.6, Section 7, FET fabrication</text></g></svg>