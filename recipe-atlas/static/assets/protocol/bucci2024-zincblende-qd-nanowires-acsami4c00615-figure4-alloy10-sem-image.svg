<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 618" width="1040" height="618" role="img"><title>Acquire the SEM specimen image</title><desc>Source Figure 4a context. Full-tip SEM specimen; not assigned the short-tip TEM preparation. Qualified action/instrument schematic; hardware dimensions and unreported preparation settings are not inferred.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#217e92"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1040" height="618" rx="18" fill="#fbfdfe"/><text x="44" y="42" fill="#486572" font-size="17" font-weight="700">BUCCI ET AL. · 2024 / figure4-alloy10-sem</text><text x="44" y="77" fill="#183647" font-size="28" font-weight="700">Acquire the SEM specimen image</text><text x="44" y="118" fill="#217e92" font-size="17" font-weight="700">STAGE 1  ·  Scanning electron microscopy</text><g transform="translate(0 138)"><rect x="466" y="23" width="100" height="45" rx="8" fill="#d9e6eb" stroke="#5c7785" stroke-width="2"/><text x="414" y="14" fill="#233947" font-size="18" font-weight="400">Electron-beam cue</text><path d="M516,73 L516,125" fill="none" stroke="#217e92" stroke-width="3" marker-end="url(#arrow)"/><rect x="370" y="137" width="290" height="20" rx="8" fill="#a3bdc7" stroke="#5c7785" stroke-width="2"/><text x="378" y="186" fill="#233947" font-size="18" font-weight="400">Specimen context</text><path d="M599,138 L724,94" fill="none" stroke="#217e92" stroke-width="3" marker-end="url(#arrow)"/><rect x="744" y="59" width="160" height="75" rx="8" fill="#e7f0f3" stroke="#5c7785" stroke-width="2"/><text x="762" y="102" fill="#233947" font-size="18" font-weight="400">Signal detector</text><text x="72" y="103" fill="#536977" font-size="20" font-weight="400">Diagram only</text><text x="72" y="133" fill="#536977" font-size="18" font-weight="400">No result drawn</text></g><path d="M44,417 H996" stroke="#cfdee4"/><text x="44" y="433" fill="#486572" font-size="17" font-weight="700">SOURCE QUALIFICATION</text><text x="44" y="463" fill="#233947" font-size="19" font-weight="400">Source Figure 4a context. Full-tip SEM specimen; not assigned the short-tip TEM preparation.</text><text x="44" y="504" fill="#536977" font-size="17" font-weight="400">Qualified action/instrument schematic; hardware dimensions and unreported preparation settings are not inferred. Functional</text><text x="44" y="529" fill="#536977" font-size="17" font-weight="400">symbols only; no measured specimen geometry or apparatus layout.</text><text x="44" y="566" fill="#536977" font-size="16" font-weight="400">Main PDF pp.5–6, Figure 4 and Section 3.3</text></g></svg>