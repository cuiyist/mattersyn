<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><title>Hold in the low-temperature circulation system</title><desc>Conceptual stage diagram. Low-temperature circulation system; exact bath and sample-holder geometry unreported.</desc><rect x="5" y="5" width="1090" height="580" rx="20" fill="#f3f8fa" stroke="#bfd1da"/><g transform="translate(10 120)" fill="none" stroke="#426e80" stroke-width="3.4"><rect x="42" y="74" width="234" height="184" rx="12"/><path d="M42 156h234M114 48v162q44 25 88 0V48M114 91h88"/><path d="M60 103h30m-15-15v30M65 93l20 20m-20 0 20-20"/></g><text x="360" y="54" font-family="Arial,sans-serif" font-size="25" fill="#153e50">Hold in the low-temperature circulation</text><text x="360" y="86" font-family="Arial,sans-serif" font-size="25" fill="#153e50">system</text><text x="360" y="134" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">Set the low-temperature coolant circulation pump to −30 °C</text><text x="360" y="162" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">for the Figure 3 comparison and hold 12 h under the general</text><text x="360" y="190" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">Section 2.3 method. Observe the dispersion state and measure</text><text x="360" y="218" font-family="Arial,sans-serif" font-size="19" fill="#284e5e">spectra the next day.</text><text x="26" y="531" font-family="Arial,sans-serif" font-size="16" fill="#52717d">Conceptual stage diagram. Low-temperature circulation system; exact bath and sample-holder geometry</text><text x="26" y="553" font-family="Arial,sans-serif" font-size="16" fill="#52717d">unreported.</text></svg>
