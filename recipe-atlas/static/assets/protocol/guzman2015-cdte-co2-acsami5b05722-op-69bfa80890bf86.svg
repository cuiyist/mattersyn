<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="545" viewBox="0 0 1000 545"><title>Saturate electrolyte with N2 and subsequently CO2 at room temperature</title><desc>Saturate electrolyte with N2 and subsequently CO2 at room temperature. Environment: Sequential N2 then CO2 saturation N2 and CO2 are sequential, not simultaneous gas streams. Duration and flow are unreported. Conceptual material flow; apparatus geometry, liquid levels and particle shapes are not depicted.</desc><rect x="1" y="1" width="998" height="543" rx="16" fill="#f8fbfc" stroke="#a9c5d0"/><rect x="0" y="0" width="1000" height="50" rx="16" fill="#173f50"/><text x="30" y="31" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">STEP 01 / 04  ·  CHARACTERIZATION</text><text x="30" y="84" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#244754">Saturate electrolyte with N2 and subsequently CO2 at room temperature</text><text x="30" y="121" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#506875">PDDA electrode dark/light CO2 electrolysis</text><rect x="30" y="169" width="415" height="133" rx="12" fill="#e6f0f4" stroke="#bad0db"/><rect x="555" y="169" width="415" height="133" rx="12" fill="#edf4ed" stroke="#c4d4c4"/><path d="M462 235.5H537m-13 -11l13 11-13 11" fill="none" stroke="#528295" stroke-width="3"/><text x="48" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">INPUTS / CONTEXT</text><text x="48" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• 0.1 M NaClO4 electrolyte</text><text x="48" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• N2</text><text x="48" y="276" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• CO2</text><text x="573" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">OUTPUT / OBSERVATION</text><text x="573" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• co2 electrolyte</text><text x="30" y="341" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">OPERATION CONDITIONS</text><text x="30" y="369" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">Numerical operation conditions: not reported.</text><text x="30" y="408" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">Environment: Sequential N2 then CO2 saturation</text><text x="30" y="445" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#244754">N2 and CO2 are sequential, not simultaneous gas streams. Duration and flow are unreported.</text><text x="30" y="491" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#566d75">Conceptual material flow; apparatus geometry, liquid levels and particle shapes are not depicted.</text></svg>