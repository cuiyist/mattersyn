<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830"><rect width="1000" height="830" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="27" y="42" font-size="25" fill="#213446" stroke="none">02  Sinter the TiO2 electrode</text><text x="28" y="81" font-size="17" fill="#596b7d" stroke="none">Electrode 4 · canonical-bound conceptual stage</text><rect x="24" y="112" width="372" height="315" rx="12" fill="#e6f1fa"/><rect x="604" y="112" width="372" height="315" rx="12" fill="#e5f4ed"/><text x="43" y="146" font-size="18" fill="#213446" stroke="none">INPUTS</text><text x="623" y="146" font-size="17" fill="#213446" stroke="none">OUTPUTS / PHYSICAL STATES</text><text x="43" y="179" font-size="18" fill="#213446" stroke="none">screen-printed NC/MC TiO2 bilayer</text><text x="43" y="203" font-size="18" fill="#213446" stroke="none">on FTO</text><text x="623" y="179" font-size="18" fill="#213446" stroke="none">sintered mesoporous TiO2 electrode</text><text x="623" y="203" font-size="18" fill="#213446" stroke="none">before sensitization [product]</text><g stroke="#1c6480" stroke-width="3" fill="none" stroke-linejoin="round"><path d="M446 278h108 M446 288h108 M446 298h108 M467 261c-18-14 18-22 0-39 M500 261c-18-14 18-22 0-39 M533 261c-18-14 18-22 0-39"/><text x="420" y="331" font-size="16" fill="#213446" stroke="none">Bilayer sintering</text><text x="411" y="356" font-size="15" fill="#213446" stroke="none">Furnace unspecified</text></g><text x="28" y="460" font-size="18" fill="#213446" stroke="none">Sinter the as-prepared electrode at 500 C for 30 min. Furnace design, atmosphere, heating ramp</text><text x="28" y="484" font-size="18" fill="#213446" stroke="none">and subsequent cooling are not reported.</text><text x="28" y="521" font-size="18" fill="#213446" stroke="none">temperature: 500 degC</text><text x="28" y="558" font-size="18" fill="#213446" stroke="none">duration: 30 min</text><text x="28" y="595" font-size="18" fill="#213446" stroke="none">Environment: not reported. Atmosphere and pressure are not reported.</text><text x="28" y="774" font-size="15" fill="#596b7d" stroke="none">Conceptual illustration; no measured geometry, levels or unreported apparatus inferred.</text><text x="28" y="799" font-size="14" fill="#596b7d" stroke="none">Zhu et al. (2011) · Main PDF p.2 / printed p.1473, Experimental Section, first paragraph and Results final paragraph</text></g></svg>