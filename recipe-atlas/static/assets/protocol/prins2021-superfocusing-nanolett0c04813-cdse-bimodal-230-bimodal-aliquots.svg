<svg xmlns="http://www.w3.org/2000/svg" width="960" height="707" viewBox="0 0 960 707" role="img" aria-labelledby="title desc"><title id="title">Take timed aliquots and acquire absorption and photoluminescence</title><desc id="desc">Vessel dimensions and geometry are not reported for this operation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><g font-family="Arial,sans-serif"><rect width="960" height="707" rx="16" fill="#f7fafb"/><text x="28" y="42" font-size="27" text-anchor="start" fill="#274c60">Take timed aliquots and acquire absorption and photoluminescence</text><text x="28" y="77" font-size="20" text-anchor="start" fill="#274c60">time after second injection: 5–600 s</text><g transform="translate(0 133)"><rect x="350" y="90" width="260" height="158" rx="15" fill="#edf5f8" stroke="#466c7d" stroke-width="3"/><text x="480" y="156" font-size="25" text-anchor="middle" fill="#274c60">Sample analysis</text><text x="480" y="197" font-size="20" text-anchor="middle" fill="#274c60">No result drawn</text><text x="480" y="292" font-size="20" text-anchor="middle" fill="#274c60">Source figures and measurements are linked separately</text></g><text x="28" y="545" font-size="20" text-anchor="start" fill="#274c60">Inputs: After 4 min, inject an additional 0.4 mmol of cadmium oleate</text><text x="28" y="572" font-size="20" text-anchor="start" fill="#274c60">Outputs: Take timed aliquots and acquire absorption and photoluminescence</text><text x="28" y="599" font-size="20" text-anchor="start" fill="#274c60">Vessel dimensions and geometry are not reported for this operation.</text><text x="28" y="626" font-size="20" text-anchor="start" fill="#274c60">Schematic action illustration. Drawn shapes, dimensions and fill levels are illustrative; only</text><text x="28" y="653" font-size="20" text-anchor="start" fill="#274c60">stated source dimensions are quantitative.</text></g></svg>
