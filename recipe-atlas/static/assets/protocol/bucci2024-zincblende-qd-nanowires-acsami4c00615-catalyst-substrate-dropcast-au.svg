<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 645" width="1040" height="645" role="img"><title>Drop-cast the aqueous Au colloid</title><desc>Nominal 30 nm Au particles deposited from the commercial aqueous dispersion. No drop volume or loading density is supplied. Qualified action/instrument schematic; hardware dimensions and unreported preparation settings are not inferred.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#217e92"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1040" height="645" rx="18" fill="#fbfdfe"/><text x="44" y="42" fill="#486572" font-size="17" font-weight="700">BUCCI ET AL. · 2024 / catalyst-substrate</text><text x="44" y="77" fill="#183647" font-size="28" font-weight="700">Drop-cast the aqueous Au colloid</text><text x="44" y="118" fill="#217e92" font-size="17" font-weight="700">STAGE 3  ·  Catalyst colloid deposition</text><g transform="translate(0 138)"><rect x="350" y="180" width="290" height="20" rx="8" fill="#a3bdc7" stroke="#5c7785" stroke-width="2"/><text x="358" y="229" fill="#233947" font-size="18" font-weight="400">InP substrate</text><path d="M500,50 L500,134" fill="none" stroke="#217e92" stroke-width="3" marker-end="url(#arrow)"/><circle cx="500" cy="148" r="8" fill="#c39c39"/><text x="595" y="89" fill="#233947" font-size="22" font-weight="700">Aqueous Au colloid</text><text x="595" y="120" fill="#233947" font-size="18" font-weight="400">Amount / coverage unreported</text></g><path d="M44,417 H996" stroke="#cfdee4"/><text x="44" y="433" fill="#486572" font-size="17" font-weight="700">SOURCE QUALIFICATION</text><text x="44" y="463" fill="#233947" font-size="19" font-weight="400">Nominal 30 nm Au particles deposited from the commercial aqueous dispersion. No drop volume or loading</text><text x="44" y="490" fill="#233947" font-size="19" font-weight="400">density is supplied.</text><text x="44" y="531" fill="#536977" font-size="17" font-weight="400">Qualified action/instrument schematic; hardware dimensions and unreported preparation settings are not inferred. Functional</text><text x="44" y="556" fill="#536977" font-size="17" font-weight="400">symbols only; no measured specimen geometry or apparatus layout.</text><text x="44" y="593" fill="#536977" font-size="16" font-weight="400">Main PDF p.3, Materials and Methods</text></g></svg>