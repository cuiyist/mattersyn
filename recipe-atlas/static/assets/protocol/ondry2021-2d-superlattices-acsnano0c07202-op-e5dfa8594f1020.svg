<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="903" viewBox="0 0 1000 903"><title>Collect powder or array diffraction</title><desc>Collect powder or array diffraction. Tube voltage: 30 kV Tube current: 10 mA Two theta: 20–60 degree; 2θ scan interval. Step: 0.02 degree Integration per step: 7 s Environment: Not reported; Atmosphere not reported for this operation. Alternative specimen preparations measured separately. Bruker PhaserD2 with CuKα source and160SSD detector. Analytical data-flow diagram; no fabricated image, spectrum, detector geometry or measured structure. Authored conceptual stage illustration; not measured apparatus or particle structure.</desc><rect x="1" y="1" width="998" height="901" rx="16" fill="#f8fbfc" stroke="#a9c5d0"/><rect x="0" y="0" width="1000" height="50" rx="16" fill="#173f50"/><text x="30" y="31" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">STEP 03 / 04  ·  CHARACTERIZATION</text><text x="30" y="84" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#244754">Collect powder or array diffraction</text><text x="30" y="121" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#506875">Ondry et al. (2021): Powder and substrate-supported XRD methods</text><rect x="30" y="169" width="415" height="122" rx="12" fill="#e6f0f4" stroke="#bad0db"/><rect x="555" y="169" width="415" height="122" rx="12" fill="#edf4ed" stroke="#c4d4c4"/><path d="M462 230.0H537m-13 -11l13 11-13 11" fill="none" stroke="#528295" stroke-width="3"/><text x="48" y="194" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244754">INPUTS / CONTEXT</text><text x="48" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• powder specimen</text><text x="48" y="251" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#244754">• array specimen</text><text x="573" y="194" font-family="Arial,sans-serif" font-size="14" font-weight=