<svg xmlns="http://www.w3.org/2000/svg" width="960" height="871" viewBox="0 0 960 871"><title>Acquire the two-hour DND-26 wide-field control</title><desc>Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular geometry, or experimental trace is implied. No exact optical train, cellular morphology, micrograph or experimental result is reconstructed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><rect width="960" height="871" rx="15" fill="#f7fafc"/><text x="30" y="32" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#637f8e">DND-26 representative two-hour control</text><text x="30" y="57" font-family="Arial,sans-serif" font-size="28" text-anchor="start" fill="#173c4a">Acquire the two-hour DND-26 wide-field control</text><g transform="translate(70 110)"><rect x="279" y="40" width="262" height="72" rx="9" fill="#e6f1f5" stroke="#3c6475" stroke-width="3"/><text x="410" y="84" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#173c4a">Image acquisition</text><path d="M410 129L410 176" fill="none" stroke="#477e91" stroke-width="4" marker-end="url(#arrow)"/><rect x="285" y="192" width="250" height="21" fill="#d7eaf1" stroke="#3c6475" stroke-width="3"/><text x="410" y="260" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#173c4a">Specimen plane</text><text x="410" y="321" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#173c4a">Optical action cue; no measured image generated</text></g><text x="30" y="505" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Inputs: Retain the source two-hour DND-26 context</text><text x="30" y="531" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="557" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Outputs: Acquire the two-hour DND-26 wide-field control</text><text x="30" y="583" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="609" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">SI Figure S4c supplies a wide-field image of the two-hour DND-26 control with SNR 0.68. No</text><text x="30" y="635" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">matched MSIM acquisition or two-hour dye concentration is reported for this control; no experimental</text><text x="30" y="661" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">image is fabricated in the illustration.</text><text x="30" y="687" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="713" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular</text><text x="30" y="739" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">geometry, or experimental trace is implied. No exact optical train, cellular morphology, micrograph or</text><text x="30" y="765" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">experimental result is reconstructed.</text><text x="30" y="791" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="817" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Source: SI PDF p.4, Figure S4c, two-hour DND-26 wide-field control</text></svg>