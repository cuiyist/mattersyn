<svg xmlns="http://www.w3.org/2000/svg" width="960" height="742" viewBox="0 0 960 742" role="img"><title>Acquire MPA-CdTe QDs TGA</title><desc>Source-linked conceptual stage; geometry and unreported fields are not measurements.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="742" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#647888">Thermogravimetric control comparison</text><text x="30" y="68" font-size="28" text-anchor="start" fill="#234b60">Acquire MPA-CdTe QDs TGA</text><text x="30" y="107" font-size="21" text-anchor="start" fill="#234b60">temperature range: 25–800 °C</text><text x="30" y="135" font-size="21" text-anchor="start" fill="#234b60">ramp: 20 degC/min</text><text x="30" y="163" font-size="21" text-anchor="start" fill="#234b60">Environment: nitrogen</text><g transform="translate(0 199)"><rect x="275" y="30" width="410" height="165" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><text x="480" y="92" font-size="27" text-anchor="middle" fill="#234b60">Thermogravimetric analysis</text><text x="480" y="145" font-size="19" text-anchor="middle" fill="#234b60">Analytical heating under nitrogen</text><text x="480" y="245" font-size="20" text-anchor="middle" fill="#234b60">Instrument cue; unreported specimen preparation remains unknown</text></g><text x="30" y="493" font-size="20" text-anchor="start" fill="#234b60">Inputs: MPA-capped CdTe quantum dots; colloidal material; Nitrogen</text><text x="30" y="529" font-size="20" text-anchor="start" fill="#234b60">Output: Acquire MPA-CdTe QDs TGA</text><text x="30" y="565" font-size="20" text-anchor="start" fill="#234b60">DSCQ20 calorimeter TA Instruments as reported; specimen mass and preparation absent. Ramp is</text><text x="30" y="592" font-size="20" text-anchor="start" fill="#234b60">analytical, not synthesis.</text><text x="30" y="628" font-size="20" text-anchor="start" fill="#234b60">Generic apparatus cue; vessel dimensions, quantitative liquid level and spatial layout are not</text><text x="30" y="655" font-size="20" text-anchor="start" fill="#234b60">measured source geometry.</text><text x="30" y="691" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.2 §2.2; Main PDF p.11 Figure 8b and §3.6</text></g></svg>