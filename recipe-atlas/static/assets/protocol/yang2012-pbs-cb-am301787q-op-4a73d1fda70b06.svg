<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="652" viewBox="0 0 1100 652"><rect width="1100" height="652" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="42" font-size="27" font-weight="bold" fill="#173047">05 Doctor-blade the paste onto FTO glass</text><text x="28" y="91" font-size="17" font-weight="normal" fill="#596b7d">primary reported preparation</text><g transform="translate(0 101)"><g transform="translate(875 0)" stroke="#1b6986" fill="none" stroke-width="3" stroke-linejoin="round"><path d="M13 89h140 M20 96h126 M52 41l15 35h17L69 41z M94 48h45m-10-7 10 7-10 7 M18 82h119"/></g></g><text x="28" y="136" font-size="23" font-weight="normal" fill="#135d83">Doctor-blade coating / FTO glass • conceptual action symbol</text><rect x="26" y="223" width="500" height="206" rx="12" fill="#e6f1fa"/><text x="42" y="261" font-size="19" font-weight="bold" fill="#173047">INPUTS</text><text x="42" y="296" font-size="20" font-weight="normal" fill="#173047">ball-milled Sample C composite paste</text><text x="42" y="342" font-size="20" font-weight="normal" fill="#173047">fluorine-doped tin oxide (FTO) glass</text><text x="42" y="373" font-size="18" font-weight="normal" fill="#173047">amount: not reported</text><rect x="572" y="223" width="500" height="206" rx="12" fill="#e5f4ed"/><text x="588" y="261" font-size="19" font-weight="bold" fill="#173047">OUTPUTS / PHYSICAL STATES</text><text x="588" y="296" font-size="20" font-weight="normal" fill="#173047">Sample C paste coated on FTO glass</text><text x="588" y="327" font-size="18" font-weight="normal" fill="#173047">Kind: mixture</text><text x="28" y="467" font-size="21" font-weight="normal" fill="#173047">Coat the paste on FTO glass by doctor-blading. Wet amount, coating area, passes and blade gap are</text><text x="28" y="495" font-size="21" font-weight="normal" fill="#173047">unreported. The measured 3.9 micrometre Sample C thickness is a result, not a prescribed blade gap.</text><text x="28" y="536" font-size="21" font-weight="normal" fill="#173047">Environment: not reported</text><text x="28" y="577" font-size="15" font-weight="normal" fill="#596b7d">Conceptual and not to scale; no unreported apparatus geometry, liquid levels or handling atmosphere inferred.</text><text x="28" y="607" font-size="15" font-weight="normal" fill="#596b7d">Yang et al. (2012) • Main PDF p.2 / printed p.6163, Experimental, Preparation of PbS/CB Composite Counter Electrode</text></g></svg>