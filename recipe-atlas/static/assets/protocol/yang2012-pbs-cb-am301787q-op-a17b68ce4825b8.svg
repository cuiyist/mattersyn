<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="688" viewBox="0 0 1100 688"><rect width="1100" height="688" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="42" font-size="27" font-weight="bold" fill="#173047">06 Vacuum-dry at room temperature for 12 h</text><text x="28" y="91" font-size="17" font-weight="normal" fill="#596b7d">primary reported preparation</text><g transform="translate(0 101)"><g transform="translate(875 0)" stroke="#1b6986" fill="none" stroke-width="3" stroke-linejoin="round"><rect x="12" y="17" width="105" height="83" rx="8"/><rect x="24" y="30" width="71" height="56"/><path d="M31 77h57 M121 46h29m-9-7 9 7-9 7"/><text x="62" y="60" text-anchor="middle" fill="#1b6986" stroke="none" font-size="18">12 h</text></g></g><text x="28" y="136" font-size="23" font-weight="normal" fill="#135d83">Vacuum oven / room temperature • conceptual action symbol</text><rect x="26" y="223" width="500" height="160" rx="12" fill="#e6f1fa"/><text x="42" y="261" font-size="19" font-weight="bold" fill="#173047">INPUTS</text><text x="42" y="296" font-size="20" font-weight="normal" fill="#173047">PbS powder after water and ethanol washes</text><rect x="572" y="223" width="500" height="160" rx="12" fill="#e5f4ed"/><text x="588" y="261" font-size="19" font-weight="bold" fill="#173047">OUTPUTS / PHYSICAL STATES</text><text x="588" y="296" font-size="20" font-weight="normal" fill="#173047">dried black PbS powder</text><text x="588" y="327" font-size="18" font-weight="normal" fill="#173047">Kind: product</text><text x="28" y="421" font-size="21" font-weight="normal" fill="#173047">Dry in a vacuum oven at room temperature for 12 h. No numerical room temperature, vacuum pressure or</text><text x="28" y="449" font-size="21" font-weight="normal" fill="#173047">isolated yield is reported.</text><text x="28" y="490" font-size="21" font-weight="normal" fill="#173047">duration: 12 h</text><text x="28" y="531" font-size="21" font-weight="normal" fill="#173047">temperature: not reported; Room temperature; numerical value unreported.</text><text x="28" y="572" font-size="21" font-weight="normal" fill="#173047">Environment: vacuum oven at room temperature</text><text x="28" y="613" font-size="15" font-weight="normal" fill="#596b7d">Conceptual and not to scale; no unreported apparatus geometry, liquid levels or handling atmosphere inferred.</text><text x="28" y="643" font-size="15" font-weight="normal" fill="#596b7d">Yang et al. (2012) • Main PDF p.2 / printed p.6163, Experimental, Preparation of PbS/CB Composite Counter Electrode</text></g></svg>