<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3z" fill="#c08424"/></marker></defs><g font-family="Arial, sans-serif"><rect width="960" height="550" fill="#f8fafc"/><rect x="0" y="0" width="960" height="72" fill="#173949"/><text x="28" y="30" font-size="14" fill="#b6dce7" text-anchor="start">KIM 2013 · PbS QUANTUM DOTS</text><text x="28" y="58" font-size="24" fill="white" text-anchor="start">01  Charge lead precursor and reaction media</text><g fill="none" stroke="#24677a" stroke-width="4"><path d="M443 170 v-36 h18 v37 M479 171 v-37 h18 v36 M402 198 l-26 -33 l14 -10 l28 37 M443 170 C355 185,355 320,470 322 C585 320,585 185,497 170"/></g><text x="470" y="350" font-size="17" fill="#233749" text-anchor="middle">Three-neck round-bottom flask</text><text x="470" y="372" font-size="14" fill="#233749" text-anchor="middle">Capacity and fill not reported</text><text x="35" y="138" font-size="17" fill="#233749" text-anchor="start">PbO 0.47 g · Oleic acid 2 g ·</text><text x="35" y="160" font-size="17" fill="#233749" text-anchor="start">1-octadecene 10 g</text><path d="M240 190 L350 215" stroke="#c08424" stroke-width="3" marker-end="url(#a)" fill="none"/><path d="M25 392 H935" stroke="#cbd5e1"/><text x="28" y="417" font-size="16" fill="#233749" text-anchor="start">Add 0.47 g lead oxide, 2 g oleic acid and 10 g 1-octadecene to a three-neck round-bottom flask. Capacity,</text><text x="28" y="439" font-size="16" fill="#233749" text-anchor="start">liquid level, stirring, atmosphere and charging order among these materials are unreported.</text><text x="28" y="530" font-size="13" fill="#526673" text-anchor="start">Conceptual stage illustration. No measured geometry, fill, gas plumbing or unstated hardware.</text></g></svg>