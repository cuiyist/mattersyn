<svg xmlns="http://www.w3.org/2000/svg" width="960" height="871" viewBox="0 0 960 871"><title>Quickly transfer the nuclei to the second flask</title><desc>Transfer between the two source three-neck flasks; do not assert an unreported syringe or pump. Drawing dimensions and liquid level are schematic, not measured geometry. No delivery hardware or transfer rate is inferred.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><rect width="960" height="871" rx="15" fill="#f7fafc"/><text x="30" y="32" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#637f8e">InP core synthesis and HF treatment</text><text x="30" y="57" font-family="Arial,sans-serif" font-size="28" text-anchor="start" fill="#173c4a">Quickly transfer the nuclei to the second flask</text><text x="30" y="92" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">elapsed before cooling: 20 min</text><g transform="translate(70 136)"><g transform="translate(15 50) scale(.65)"><path d="M386 20H434V80L452 90L473 55L503 72L482 110Q516 142 507 197Q500 257 410 263Q320 257 313 197Q304 142 338 110L317 72L347 55L368 90L386 80Z" fill="#edf6f8" stroke="#3c6475" stroke-width="3"/><path d="M327 193Q410 219 493 193" fill="none" stroke="#9abbc8" stroke-width="4"/></g><g transform="translate(400 50) scale(.65)"><path d="M386 20H434V80L452 90L473 55L503 72L482 110Q516 142 507 197Q500 257 410 263Q320 257 313 197Q304 142 338 110L317 72L347 55L368 90L386 80Z" fill="#edf6f8" stroke="#3c6475" stroke-width="3"/><path d="M327 193Q410 219 493 193" fill="none" stroke="#9abbc8" stroke-width="4"/></g><path d="M356 150L558 150" fill="none" stroke="#477e91" stroke-width="4" marker-end="url(#arrow)"/><text x="410" y="310" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#173c4a">Nuclei transfer between source flasks</text></g><text x="30" y="531" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Inputs: Rapidly cool the nucleus mixture using nitrogen; Heat ODE in a second flask simultaneously</text><text x="30" y="557" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="583" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Outputs: Quickly transfer the nuclei to the second flask</text><text x="30" y="609" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="635" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Transfer the nucleus liquid quickly into the hot ODE receiver. After 20 min, rapidly cool to room</text><text x="30" y="661" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">temperature; no precise transfer rate or separately restated maintained temperature is given.</text><text x="30" y="687" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="713" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Transfer between the two source three-neck flasks; do not assert an unreported syringe or pump.</text><text x="30" y="739" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Drawing dimensions and liquid level are schematic, not measured geometry. No delivery hardware or</text><text x="30" y="765" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">transfer rate is inferred.</text><text x="30" y="791" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="817" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Source: Main PDF p.3, Section 2.1.1, InP Core</text></svg>