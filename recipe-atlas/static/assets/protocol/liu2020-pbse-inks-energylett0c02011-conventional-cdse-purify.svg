<svg xmlns="http://www.w3.org/2000/svg" width="960" height="707" viewBox="0 0 960 707" role="img"><title>Purify with chloroform/ethanol and centrifuge</title><desc>Source-linked conceptual operation. Unreported geometry and quantities are not reconstructed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4d7f93"/></marker></defs><rect width="960" height="707" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#607a89">Conventional CdSe starting QDs</text><text x="30" y="65" font-size="28" text-anchor="start" fill="#254d62">Purify with chloroform/ethanol and centrifuge</text><text x="30" y="100" font-size="21" text-anchor="start" fill="#254d62">Additional numerical conditions for this step are not specified.</text><g transform="translate(0 138)"><rect x="133" y="25" width="76" height="140" rx="9" fill="#eff5f8" stroke="#587f91" stroke-width="3"/><path d="M145 135q26.0 9 52 0" fill="none" stroke="#9fbfce" stroke-width="4"/><path d="M235 92L362 92" stroke="#4d7f93" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="480" cy="95" r="76" fill="#eff5f8" stroke="#587f91" stroke-width="3"/><text x="480" y="103" font-size="23" text-anchor="middle" fill="#254d62">Separate</text><path d="M598 92L720 92" stroke="#4d7f93" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="750" y="25" width="76" height="140" rx="9" fill="#eff5f8" stroke="#587f91" stroke-width="3"/><path d="M762 135q26.0 9 52 0" fill="none" stroke="#9fbfce" stroke-width="4"/><text x="480" y="230" font-size="20" text-anchor="middle" fill="#254d62">Centrifugation cue · use the reported retained fraction below</text></g><text x="30" y="422" font-size="20" text-anchor="start" fill="#254d62">Inputs: Switch to a water bath for rapid cooling; Chloroform; Ethanol</text><text x="30" y="458" font-size="20" text-anchor="start" fill="#254d62">