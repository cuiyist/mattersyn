<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" role="img"><title>Centrifuge five times at 6000 rpm for 5 min each</title><desc>Source-linked stage schematic. No unreported equipment dimensions or solution species are asserted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="790" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="34" font-size="18" text-anchor="start" fill="#647888">CdS synthesis at 240 °C</text><text x="30" y="73" font-size="28" text-anchor="start" fill="#234b60">Centrifuge five times at 6000 rpm for 5 min each</text><text x="30" y="112" font-size="21" text-anchor="start" fill="#234b60">cycles: 5 count</text><text x="30" y="140" font-size="21" text-anchor="start" fill="#234b60">speed: 6000 rpm</text><text x="30" y="168" font-size="21" text-anchor="start" fill="#234b60">duration per cycle: 5 min</text><g transform="translate(0 202)"><rect x="125" y="33" width="73" height="127" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M133 123q28.5 10 57 0" fill="none" stroke="#9abfce" stroke-width="4"/><path d="M225 98L351 98" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="480" cy="101" r="77" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><rect x="469" y="38" width="22" height="35" rx="6" fill="#9dbccb" transform="rotate(0 480 101)"/><rect x="469" y="38" width="22" height="35" rx="6" fill="#9dbccb" transform="rotate(90 480 101)"/><rect x="469" y="38" width="22" height="35" rx="6" fill="#9dbccb" transform="rotate(180 480 101)"/><rect x="469" y="38" width="22" height="35" rx="6" fill="#9dbccb" transform="rotate(270 480 101)"/><path d="M607 98L721 98" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="752" y="33" width="73" height="127" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M760 123q28.5 10 57 0" fill="none" stroke="#9abfce" stroke-width="4"/><path d="M762 145h53" stroke="#ae9343" stroke-width="10"/><text x="480" y="220" font-size="22" text-anchor="middle" fill="#234b60">Five cycles · retain the precipitated powder</text></g><text x="30" y="542" font-size="20" text-anchor="start" fill="#234b60">Inputs: Add ethanol to precipitate yellow product</text><text x="30" y="578" font-size="20" text-anchor="start" fill="#234b60">Output: Centrifuge five times at 6000 rpm for 5 min each</text><text x="30" y="614" font-size="20" text-anchor="start" fill="#234b60">Recover yellow powder/precipitated solids. Between-cycle wash and redispersion details are not</text><text x="30" y="641" font-size="20" text-anchor="start" fill="#234b60">stated. No rotor-radius-to-RCF conversion.</text><text x="30" y="677" font-size="20" text-anchor="start" fill="#234b60">Apparatus dimensions, liquid level and spatial layout are schematic, not measured source</text><text x="30" y="704" font-size="20" text-anchor="start" fill="#234b60">geometry.</text><text x="30" y="740" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.2 §2.1</text></g></svg>