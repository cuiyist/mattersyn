<svg xmlns="http://www.w3.org/2000/svg" width="960" height="949" viewBox="0 0 960 949"><title>Acquire the representative PL spectrum</title><desc>Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular geometry, or experimental trace is implied. No fabricated spectrum, pattern, micrograph or atomistic specimen is drawn. Instrument geometry is not reconstructed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#477e91" stroke-width="1.5"/></marker></defs><rect width="960" height="949" rx="15" fill="#f7fafc"/><text x="30" y="32" font-family="Arial,sans-serif" font-size="18" text-anchor="start" fill="#637f8e">Representative InP/ZnSe optical specimen, 10 min</text><text x="30" y="57" font-family="Arial,sans-serif" font-size="28" text-anchor="start" fill="#173c4a">Acquire the representative PL spectrum</text><text x="30" y="92" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">excitation wavelength: 350 nm</text><g transform="translate(70 136)"><rect x="240" y="47" width="340" height="188" rx="12" fill="#edf6f8" stroke="#3c6475" stroke-width="3"/><text x="410" y="122" font-family="Arial,sans-serif" font-size="25" text-anchor="middle" fill="#173c4a">Optical acquisition</text><text x="410" y="166" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#173c4a">No result drawn</text><text x="410" y="298" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#173c4a">Source data are shown in the cited figures</text></g><text x="30" y="531" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Inputs: InP/ZnSe core/shell quantum dots</text><text x="30" y="557" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="583" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Outputs: Acquire the representative PL spectrum</text><text x="30" y="609" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="635" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Figure 3c uses 350 nm excitation for the selected spectra. The 375 nm lifetime excitation is not</text><text x="30" y="661" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">substituted for this PL condition. Horiba Fluorolog-3 is named in the general method. Its general</text><text x="30" y="687" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">375/605 nm laser description is retained as instrument context; the Figure 3c discussion explicitly</text><text x="30" y="713" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">gives 350 nm for these spectra.</text><text x="30" y="739" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="765" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Qualified action illustration; no unreported vessel dimensions, hardware, measured molecular</text><text x="30" y="791" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">geometry, or experimental trace is implied. No fabricated spectrum, pattern, micrograph or atomistic</text><text x="30" y="817" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">specimen is drawn. Instrument geometry is not reconstructed.</text><text x="30" y="843" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a"></text><text x="30" y="869" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">Source: Main PDF pp.5–7, Figure 3 and Section 3.1; Main PDF p.3, Section 2.2, Horiba Fluorolog-3</text><text x="30" y="895" font-family="Arial,sans-serif" font-size="20" text-anchor="start" fill="#173c4a">and general PL excitation settings</text></svg>