<svg xmlns="http://www.w3.org/2000/svg" width="960" height="825" viewBox="0 0 960 825" role="img"><title>Inject NaHTe dropwise into the refluxing mixture</title><desc>Source-linked conceptual stage; geometry and unreported fields are not measurements.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="825" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#647888">MPA-capped CdTe quantum-dot synthesis</text><text x="30" y="68" font-size="28" text-anchor="start" fill="#234b60">Inject NaHTe dropwise into the refluxing mixture</text><text x="30" y="107" font-size="21" text-anchor="start" fill="#234b60">temperature: 100 degC</text><text x="30" y="135" font-size="21" text-anchor="start" fill="#234b60">injection volume: not reported</text><text x="30" y="163" font-size="21" text-anchor="start" fill="#234b60">injection duration: not reported</text><text x="30" y="191" font-size="21" text-anchor="start" fill="#234b60">Environment: nitrogen</text><text x="30" y="219" font-size="21" text-anchor="start" fill="#234b60">Endpoint: immediate reddish-orange CdTe QDs</text><g transform="translate(0 255)"><path d="M403 22v58q-70 48-19 104q75 59 151 0q51-56-19-104V22h-30v57h-52V22z" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M450 80V6h28v73" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M398 145q65 23 132 0" stroke="#9abfce" stroke-width="4" fill="none"/><text x="480" y="255" font-size="20" text-anchor="middle" fill="#234b60">Three-neck flask; heating and condenser geometry schematic</text><text x="715" y="80" font-size="25" text-anchor="middle" fill="#234b60">N₂</text><path d="M683 95L569 95" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="168" y="13" width="70" height="103" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M176 81q27.0 9 54 0" fill="none" stroke="#9abfce" stroke-width="4"/><path d="M261 71L387 109" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="203" y="155" font-size="21" text-anchor="middle" fill="#234b60">NaHTe · dropwise</text></g><text x="30" y="549" font-size="20" text-anchor="start" fill="#234b60">Inputs: Transfer to a three-necked flask and reflux under N2; Aqueous sodium hydrogen telluride</text><text x="30" y="576" font-size="20" text-anchor="start" fill="#234b60">precursor</text><text x="30" y="612" font-size="20" text-anchor="start" fill="#234b60">Output: Inject NaHTe dropwise into the refluxing mixture</text><text x="30" y="648" font-size="20" text-anchor="start" fill="#234b60">Reported Cd:MPA:Te=1.51:1:2.70. No feed-amount reconstruction from this ratio and no assumption</text><text x="30" y="675" font-size="20" text-anchor="start" fill="#234b60">that the full NaHTe preparation was injected.</text><text x="30" y="711" font-size="20" text-anchor="start" fill="#234b60">Generic apparatus cue; vessel dimensions, quantitative liquid level and spatial layout are not</text><text x="30" y="738" font-size="20" text-anchor="start" fill="#234b60">measured source geometry.</text><text x="30" y="774" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.3 §2.3</text></g></svg>