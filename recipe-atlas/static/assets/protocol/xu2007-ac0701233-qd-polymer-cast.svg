<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480"><title>Sonic particle casting</title><desc>Conceptual casting flow. Equipment geometry, liquid volumes and colors are illustrative; no unreported apparatus inferred.</desc><rect x="2" y="2" width="816" height="476" rx="18" fill="#fbfdfd" stroke="#c7dbe0"/><text x="30" y="43" font-family="Arial" font-size="23" fill="#193f4d">Sonic particle casting</text><g font-family="Arial" font-size="17" fill="#284e5c"><rect x="70" y="120" width="175" height="85" rx="12" fill="#e5f1f5" stroke="#7297a7"/><text x="158" y="148" text-anchor="middle">Cocktail syringe</text><text x="158" y="176" text-anchor="middle">0.3 mL/min</text><path d="M246 165H345V212" fill="none" stroke="#4f7f91" stroke-width="5"/><rect x="300" y="75" width="180" height="65" rx="12" fill="#e5f1f5" stroke="#7297a7"/><text x="390" y="103" text-anchor="middle">Piezocrystal</text><text x="390" y="125" text-anchor="middle">10–15 kHz</text><path d="M340 217L353 245L366 217" fill="#b8d3dc" stroke="#4f7f91"/><text x="385" y="232">46 or 63 µm ceramic tip</text><path d="M600 175H455L377 251" fill="none" stroke="#55a7b2" stroke-width="4"/><text x="555" y="157" text-anchor="middle">Water sheath 50 mL/min</text><circle cx="353" cy="275" r="6" fill="#4f7f91"/><circle cx="353" cy="296" r="5" fill="#4f7f91"/><path d="M280 290V360Q353 390 426 360V290" fill="none" stroke="#7297a7" stroke-width="4"/><text x="353" y="418" text-anchor="middle">25 mL receiving vial; 3% PEG solution</text><text x="410" y="456" text-anchor="middle" font-size="13">Conceptual source flow; not a measured apparatus drawing.</text></g></svg>