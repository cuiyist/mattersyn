<svg xmlns="http://www.w3.org/2000/svg" width="960" height="734" viewBox="0 0 960 734" role="img"><title>Measure attached-film absorption and PL</title><desc>Source-linked stage schematic. No unreported equipment dimensions or solution species are asserted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="734" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="34" font-size="18" text-anchor="start" fill="#647888">CdS160 attachment to TiO2/FTO</text><text x="30" y="73" font-size="28" text-anchor="start" fill="#234b60">Measure attached-film absorption and PL</text><text x="30" y="112" font-size="21" text-anchor="start" fill="#234b60">No numerical condition or environment specified for this stage.</text><g transform="translate(0 146)"><rect x="276" y="37" width="408" height="154" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><text x="480" y="91" font-size="30" text-anchor="middle" fill="#234b60">Absorption / PL</text><text x="480" y="139" font-size="21" text-anchor="middle" fill="#234b60">Correct specimen context retained</text><text x="480" y="232" font-size="21" text-anchor="middle" fill="#234b60">No spectrum or peak position invented</text></g><text x="30" y="486" font-size="20" text-anchor="start" fill="#234b60">Inputs: Immerse functionalized film in CdS160/toluene for 48 h</text><text x="30" y="522" font-size="20" text-anchor="start" fill="#234b60">Output: Measure attached-film absorption and PL</text><text x="30" y="558" font-size="20" text-anchor="start" fill="#234b60">Lambda35 UV–vis and LS55 PL. Figure3b uses (1−R)^2/(2R); not directly a measured nanocrystal</text><text x="30" y="585" font-size="20" text-anchor="start" fill="#234b60">loading.</text><text x="30" y="621" font-size="20" text-anchor="start" fill="#234b60">Apparatus dimensions, liquid level and spatial layout are schematic, not measured source</text><text x="30" y="648" font-size="20" text-anchor="start" fill="#234b60">geometry.</text><text x="30" y="684" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.2 §2.2; Main PDF p.4 Figure3b</text></g></svg>