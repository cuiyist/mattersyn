<svg xmlns="http://www.w3.org/2000/svg" width="960" height="743" viewBox="0 0 960 743" role="img"><title>Dissolve NaBH4 in doubly distilled water under N2</title><desc>Source-linked conceptual stage; geometry and unreported fields are not measurements.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="743" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#647888">NaHTe precursor preparation</text><text x="30" y="68" font-size="28" text-anchor="start" fill="#234b60">Dissolve NaBH4 in doubly distilled water under N2</text><text x="30" y="107" font-size="21" text-anchor="start" fill="#234b60">nabh4 amount: 0.04 mol</text><text x="30" y="135" font-size="21" text-anchor="start" fill="#234b60">water volume: 20 mL</text><text x="30" y="163" font-size="21" text-anchor="start" fill="#234b60">duration: 30 min</text><text x="30" y="191" font-size="21" text-anchor="start" fill="#234b60">Environment: nitrogen</text><g transform="translate(0 227)"><rect x="421" y="20" width="118" height="165" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><path d="M429 150q51.0 9 102 0" fill="none" stroke="#9abfce" stroke-width="4"/><text x="480" y="235" font-size="21" text-anchor="middle" fill="#234b60">Dissolution cue; vessel geometry not reported</text><text x="221" y="50" font-size="22" text-anchor="middle" fill="#234b60">N₂ atmosphere</text><path d="M248 73L394 73" stroke="#497d92" stroke-width="3" fill="none" marker-end="url(#arrow)"/></g><text x="30" y="521" font-size="20" text-anchor="start" fill="#234b60">Inputs: Sodium borohydride; Doubly distilled water; Nitrogen</text><text x="30" y="557" font-size="20" text-anchor="start" fill="#234b60">Output: Dissolve NaBH4 in doubly distilled water under N2</text><text x="30" y="593" font-size="20" text-anchor="start" fill="#234b60">Dissolution temperature and vessel are not specified.</text><text x="30" y="629" font-size="20" text-anchor="start" fill="#234b60">Generic apparatus cue; vessel dimensions, quantitative liquid level and spatial layout are not</text><text x="30" y="656" font-size="20" text-anchor="start" fill="#234b60">measured source geometry.</text><text x="30" y="692" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.3 §2.3</text></g></svg>