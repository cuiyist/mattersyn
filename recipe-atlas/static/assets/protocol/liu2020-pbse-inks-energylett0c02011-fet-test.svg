<svg xmlns="http://www.w3.org/2000/svg" width="960" height="698" viewBox="0 0 960 698" role="img"><title>Test the FET in nitrogen</title><desc>Source-linked conceptual operation. Unreported geometry and quantities are not reconstructed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4d7f93"/></marker></defs><rect width="960" height="698" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="29" font-size="18" text-anchor="start" fill="#607a89">Bottom-gate, top-contact PbSe FET preparation</text><text x="30" y="65" font-size="28" text-anchor="start" fill="#254d62">Test the FET in nitrogen</text><text x="30" y="100" font-size="21" text-anchor="start" fill="#254d62">Environment: Nitrogen-filled glovebox</text><g transform="translate(0 138)"><rect x="280" y="20" width="400" height="165" rx="9" fill="#eff5f8" stroke="#587f91" stroke-width="3"/><text x="480" y="82" font-size="27" text-anchor="middle" fill="#254d62">Characterization context</text><text x="480" y="132" font-size="20" text-anchor="middle" fill="#254d62">Reported controls and conditions below</text><text x="480" y="229" font-size="20" text-anchor="middle" fill="#254d62">Generic method cue · no invented trace or specimen geometry</text></g><text x="30" y="422" font-size="20" text-anchor="start" fill="#254d62">Inputs: Deposit Al source and drain contacts; Nitrogen</text><text x="30" y="458" font-size="20" text-anchor="start" fill="#254d62">Output: Test the FET in nitrogen</text><text x="30" y="494" font-size="20" text-anchor="start" fill="#254d62">Measure electrical characteristics. The main-text mobility calculation uses different</text><text x="30" y="521" font-size="20" text-anchor="start" fill="#254d62">channel dimensions; the discrepancy is retained.</text><text x="30" y="557" font-size="20" text-anchor="start" fill="#254d62">Qualified action illustration; no unreported vessel dimensions, hardware, measured</text><text x="30" y="584" font-size="20" text-anchor="start" fill="#254d62">molecular geometry, or experimental trace is implied.</text><text x="30" y="620" font-size="20" text-anchor="start" fill="#254d62">Source: SI PDF p.6, Section 7, FET fabrication; Main PDF p.5, FET mobility dimensions and</text><text x="30" y="647" font-size="20" text-anchor="start" fill="#254d62">source conflict</text></g></svg>