<svg xmlns="http://www.w3.org/2000/svg" width="960" height="761" viewBox="0 0 960 761" role="img"><title>Immerse functionalized film in CdS160/toluene for 48 h</title><desc>Source-linked stage schematic. No unreported equipment dimensions or solution species are asserted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#497d92"/></marker></defs><rect width="960" height="761" fill="#fff"/><g font-family="Arial,sans-serif"><text x="30" y="34" font-size="18" text-anchor="start" fill="#647888">CdS160 attachment to TiO2/FTO</text><text x="30" y="73" font-size="28" text-anchor="start" fill="#234b60">Immerse functionalized film in CdS160/toluene for 48 h</text><text x="30" y="112" font-size="21" text-anchor="start" fill="#234b60">duration: 48 h</text><g transform="translate(0 146)"><rect x="271" y="55" width="420" height="132" rx="10" fill="#eff5f8" stroke="#557f91" stroke-width="3"/><rect x="335" y="115" width="292" height="22" fill="#cadde7" stroke="#557f91" stroke-width="3"/><path d="M343 108h276" stroke="#ac8d48" stroke-width="7"/><text x="480" y="30" font-size="22" text-anchor="middle" fill="#234b60">Immersion vessel unspecified</text><text x="480" y="222" font-size="21" text-anchor="middle" fill="#234b60">Bath dimensions and solution volume unreported</text></g><text x="30" y="486" font-size="20" text-anchor="start" fill="#234b60">Inputs: Immerse TiO2 electrodes in TGA/acetonitrile for 12 h; Prepared CdS nanopowder;</text><text x="30" y="513" font-size="20" text-anchor="start" fill="#234b60">temperature variant specified by record; Toluene</text><text x="30" y="549" font-size="20" text-anchor="start" fill="#234b60">Output: Immerse functionalized film in CdS160/toluene for 48 h</text><text x="30" y="585" font-size="20" text-anchor="start" fill="#234b60">No CdS concentration, loading, volume or temperature provided. Nitrogen is stated for prior12h</text><text x="30" y="612" font-size="20" text-anchor="start" fill="#234b60">functionalization, not explicitly restated for this48h step.</text><text x="30" y="648" font-size="20" text-anchor="start" fill="#234b60">Apparatus dimensions, liquid level and spatial layout are schematic, not measured source</text><text x="30" y="675" font-size="20" text-anchor="start" fill="#234b60">geometry.</text><text x="30" y="711" font-size="20" text-anchor="start" fill="#234b60">Source: Main PDF p.2 §2.3</text></g></svg>