<svg xmlns="http://www.w3.org/2000/svg" width="920" height="230" viewBox="0 0 920 230" role="img" aria-labelledby="title desc">
  <title id="title">In situ SAXS and optical monitoring line for Henkel et al.</title>
  <desc id="desc">Conceptual apparatus schematic showing a seeded reaction beaker, syringe pump, inline optical extinction point, capillary, and SAXS beam. The source reports 3000 microliters per minute for the first 60 seconds and 100 thereafter. Drawing is not a photograph or measured geometry.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#57718a"/></marker></defs>
  <rect width="920" height="230" rx="18" fill="#f7fafc"/>
  <text x="26" y="35" fill="#17354e" font-family="Arial,sans-serif" font-size="18" font-weight="700">Seeded growth monitored in flow</text>
  <path d="M55 82 V152 Q55 173 82 173 H130 Q157 173 157 152 V82" fill="none" stroke="#476783" stroke-width="4"/>
  <path d="M60 126 H152 V151 Q152 168 130 168 H82 Q60 168 60 151 Z" fill="#d9e7f3"/>
  <text x="55" y="199" fill="#365067" font-family="Arial,sans-serif" font-size="15">10 mL growth solution</text>
  <path d="M166 131 H271" stroke="#57718a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="282" y="90" width="115" height="82" rx="10" fill="#e8eff6" stroke="#476783" stroke-width="3"/>
  <path d="M304 131 H373" stroke="#476783" stroke-width="4"/>
  <text x="296" y="200" fill="#365067" font-family="Arial,sans-serif" font-size="15">Syringe pump</text>
  <path d="M404 131 H492" stroke="#57718a" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="543" cy="130" r="38" fill="#e8eff6" stroke="#476783" stroke-width="3"/>
  <path d="M525 130 H561" stroke="#d4a54b" stroke-width="6"/>
  <text x="496" y="200" fill="#365067" font-family="Arial,sans-serif" font-size="15">Optical extinction</text>
  <path d="M586 131 H665" stroke="#57718a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="672" y="116" width="88" height="28" rx="12" fill="#dceaf4" stroke="#476783" stroke-width="3"/>
  <path d="M716 72 V113" stroke="#55a6ac" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="780" y="126" fill="#365067" font-family="Arial,sans-serif" font-size="15">SAXS capillary</text>
  <text x="26" y="218" fill="#5c7083" font-family="Arial,sans-serif" font-size="12">Authored schematic • reported flow: 3000 µL/min for first 60 s, then 100 µL/min • not to scale</text>
</svg>
