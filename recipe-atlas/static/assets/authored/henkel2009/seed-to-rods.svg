<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">Au seeds and the two SAXS-inferred nanorod products</title>
  <desc id="desc">Conceptual size-independent drawing of a small Au seed feeding separate Au and gold-copper rod growth solutions. Rod outlines depict the cylindrical SAXS analysis model, not a measured TEM image or atomic crystal structure.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#67829b"/></marker></defs>
  <rect width="920" height="300" rx="20" fill="#f6f9fc"/>
  <text x="40" y="42" fill="#163351" font-family="Arial,sans-serif" font-size="18" font-weight="700">Shared Au seed suspension</text>
  <circle cx="108" cy="147" r="25" fill="#e6b95a" stroke="#a9792c" stroke-width="3"/>
  <circle cx="171" cy="122" r="16" fill="#f0cc76" stroke="#a9792c" stroke-width="2"/>
  <circle cx="173" cy="175" r="18" fill="#e6b95a" stroke="#a9792c" stroke-width="2"/>
  <text x="40" y="234" fill="#445b70" font-family="Arial,sans-serif" font-size="15">about 2–4 nm in source prose</text>
  <path d="M235 148 H335" stroke="#67829b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M330 148 V100 H455" stroke="#67829b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M330 148 V205 H455" stroke="#67829b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="356" y="76" fill="#163351" font-family="Arial,sans-serif" font-size="17" font-weight="700">Au route</text>
  <rect x="475" y="71" width="260" height="57" rx="28" fill="#e6b95a" stroke="#a9792c" stroke-width="3"/>
  <text x="758" y="105" fill="#163351" font-family="Arial,sans-serif" font-size="16">Au nanorods</text>
  <text x="354" y="250" fill="#163351" font-family="Arial,sans-serif" font-size="17" font-weight="700">Au + Cu route</text>
  <rect x="475" y="179" width="214" height="57" rx="28" fill="#d2b97c" stroke="#8d7648" stroke-width="3"/>
  <text x="711" y="214" fill="#163351" font-family="Arial,sans-serif" font-size="16">AuₓCu₍₁₋ₓ₎ nanorods</text>
  <text x="40" y="282" fill="#52677b" font-family="Arial,sans-serif" font-size="13">Authored schematic • particle proportions are conceptual • product alloy fraction x is not reported</text>
</svg>
