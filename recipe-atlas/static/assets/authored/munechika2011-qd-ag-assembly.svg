<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 270" role="img" aria-label="Authored diagram: immerse cleaned slides before QD spreading, then transfer and add Ag nanoprisms"><desc>Clean paired ITO slides are immersed back-to-back before QD dispersion is spread on the water. Conceptual positions only; immersion depth and apparatus dimensions are not reported. Later transfer and Ag deposition are unchanged; photoannealing order remains unresolved.</desc><rect width="950" height="270" rx="18" fill="#f5fafb"/><text x="28" y="36" font-size="22" font-family="Arial" fill="#143445">Munechika 2011 · assembly stages</text><rect x="28" y="70" width="260" height="160" rx="12" fill="#dceef4"/><path d="M40 179H276" stroke="#2797a5" stroke-width="8"/><g fill="#db714b"><circle cx="76" cy="165" r="11"/><circle cx="102" cy="165" r="11"/><circle cx="128" cy="165" r="11"/><circle cx="154" cy="165" r="11"/><circle cx="180" cy="165" r="11"/><circle cx="206" cy="165" r="11"/></g><text x="44" y="95" font-size="16" font-family="Arial" fill="#143445">First immerse clean paired slides</text><g fill="#b1cbd4" stroke="#476a78" stroke-width="2"><rect x="237" y="112" width="7" height="85"/><rect x="246" y="112" width="7" height="85"/></g><text x="44" y="214" font-size="17" font-family="Arial" fill="#143445">Then spread QDs on water</text><path d="M304 150h45m-14-13 14 13-14 13" stroke="#628590" stroke-width="4" fill="none"/><rect x="365" y="70" width="260" height="160" rx="12" fill="#e2ecec"/><path d="M380 183H610" stroke="#66757b" stroke-width="10"/><g fill="#db714b"><circle cx="410" cy="163" r="11"/><circle cx="436" cy="163" r="11"/><circle cx="462" cy="163" r="11"/><circle cx="488" cy="163" r="11"/><circle cx="514" cy="163" r="11"/><circle cx="540" cy="163" r="11"/><circle cx="566" cy="163" r="11"/></g><text x="382" y="214" font-size="17" font-family="Arial" fill="#143445">LB transfer onto ITO</text><path d="M641 150h45m-14-13 14 13-14 13" stroke="#628590" stroke-width="4" fill="none"/><rect x="700" y="70" width="220" height="160" rx="12" fill="#eef1e8"/><path d="M715 183H905" stroke="#66757b" stroke-width="10"/><g fill="#db714b"><circle cx="745" cy="163" r="11"/><circle cx="771" cy="163" r="11"/><circle cx="797" cy="163" r="11"/><circle cx="823" cy="163" r="11"/><circle cx="849" cy="163" r="11"/></g><path d="m763 133 18-27 20 27z" fill="#a9a9ad" stroke="#626b74" stroke-width="2"/><path d="m837 133 18-27 20 27z" fill="#a9a9ad" stroke="#626b74" stroke-width="2"/><text x="716" y="214" font-size="17" font-family="Arial" fill="#143445">Ag prisms drop-cast</text><text x="28" y="254" font-size="14" font-family="Arial" fill="#143445">Conceptual sequence · immersion depth and apparatus dimensions are not reported · SI p.2</text></svg>