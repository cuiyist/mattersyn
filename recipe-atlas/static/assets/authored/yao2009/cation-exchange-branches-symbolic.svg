<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="410" viewBox="0 0 1260 410" role="img" aria-labelledby="t d"><title id="t">Yao 2009 cation-exchanged chalcogenide aerogel branches</title><desc id="d">Original schematic of CdSe nanoparticle sol to wet gel, complete Ag2Se exchange and drying, partial Ag2Se outer-zone branch, and separate PbSe and CuSe exchanges. Exact doses for partial, lead and copper variants are not reported.</desc><rect width="1260" height="410" fill="#f6f9fb"/><style>text{font-family:Arial,sans-serif;fill:#173746}.h{font-size:24px;font-weight:bold}.b{font-size:18px}.s{font-size:15px}.box{fill:#fff;stroke:#638799;stroke-width:2}.line{fill:none;stroke:#638799;stroke-width:3}</style><text x="32" y="45" class="h">CdSe nanocrystal gel → exchanged chalcogenide aerogels</text><rect x="30" y="78" width="270" height="245" rx="16" class="box"/><text x="48" y="116" class="h">CdSe nanocrystals</text><text x="48" y="154" class="b">MUA ligand exchange</text><text x="48" y="183" class="b">TNM oxidative gelation</text><text x="48" y="212" class="b">1 week, ambient light</text><text x="48" y="250" class="b">monolithic wet gel</text><path d="M302 200h68" class="line"/><rect x="380" y="78" width="390" height="110" rx="16" class="box"/><text x="398" y="116" class="h">Full Ag⁺ exchange</text><text x="398" y="150" class="b">4 mL 0.15 M AgNO₃ · 12 h</text><rect x="380" y="207" width="390" height="116" rx="16" class="box"/><text x="398" y="244" class="h">Lower Ag⁺ amount</text><text x="398" y="278" class="b">black outer zone · orange CdSe core</text><path d="M772 133h63" class="line"/><path d="M772 265h63" class="line"/><rect x="845" y="78" width="380" height="110" rx="16" class="box"/><text x="863" y="116" class="h">Ag₂Se aerogel</text><text x="863" y="150" class="b">methanol wash → acetone → SC CO₂</text><rect x="845" y="207" width="380" height="116" rx="16" class="box"/><text x="863" y="244" class="h">PbSe / CuSe branches</text><text x="863" y="278" class="b">nitrate exchange ≤24 h; wash differs</text><text x="31" y="365" class="s">Measured phase and porosity are bound to source figures. Partial, Pb and Cu salt doses are not supplied. This diagram is illustrative.</text></svg>