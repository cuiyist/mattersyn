<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-label="MatterSyn authored schematic: Treat conductivity films"><style>.eyebrow{font:700 16px Arial,sans-serif;letter-spacing:1.2px;fill:#07868a}.title{font:700 31px Arial,sans-serif;fill:#152b3b}.stage{font:700 16px Arial,sans-serif;fill:#057d80}.body{font:18px Arial,sans-serif;fill:#163047}.num{font:700 15px Arial,sans-serif;fill:#057d80}.foot{font:15px Arial,sans-serif;fill:#466577}</style><rect width="1100" height="560" fill="#f5faf9"/><rect width="1100" height="12" fill="#0b8c8b"/><text x="42" y="54" class="eyebrow">KO ET AL. 2010  •  Ag₂Te / PbTe</text><text x="42" y="104" class="title">Treat conductivity films</text><rect x="888" y="45" width="168" height="36" rx="18" fill="#d9efec"/><text x="972" y="69" text-anchor="middle" class="stage">DEVICE</text><rect x="42" y="144" width="468" height="322" rx="22" fill="#fff" stroke="#d6e5e6"/><rect x="540" y="144" width="518" height="322" rx="22" fill="#fff" stroke="#d6e5e6"/><g stroke="#163047" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="120" y="305" width="230" height="38" rx="4" fill="#d8efed"/><path d="M145 290h180" stroke="#f4a456"/><path d="M235 195v60" stroke="#2f99a0"/><path d="M220 240l15 18 15-18" stroke="#2f99a0"/></g><circle cx="570" cy="188" r="14" fill="#d9efec"/><text x="570" y="193" text-anchor="middle" class="num">1</text><text x="605" y="195" class="body">Treat deposited films with 1 M anhydrous</text><text x="605" y="221" class="body">hydrazine in acetonitrile overnight.</text><circle cx="570" cy="284" r="14" fill="#d9efec"/><text x="570" y="289" text-anchor="middle" class="num">2</text><text x="605" y="291" class="body">Repeat deposition/treatment several times;</text><text x="605" y="317" class="body">exact cycle count is not reported.</text><circle cx="570" cy="380" r="14" fill="#d9efec"/><text x="570" y="385" text-anchor="middle" class="num">3</text><text x="605" y="387" class="body">Final thickness is 80 ± 20 nm by SEM;</text><text x="605" y="413" class="body">uncertainty statistic is unspecified.</text><path d="M42 492h1016" stroke="#d5e4e5"/><text x="42" y="520" class="foot">SI PDF p.2, Device fabrication and measurements</text><text x="42" y="543" class="foot">MatterSyn-authored stage schematic • apparatus geometry illustrative, not measured</text></svg>
