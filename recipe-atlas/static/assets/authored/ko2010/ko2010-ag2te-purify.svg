<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-label="MatterSyn authored schematic: Quench and purify Ag₂Te"><style>.eyebrow{font:700 16px Arial,sans-serif;letter-spacing:1.2px;fill:#07868a}.title{font:700 31px Arial,sans-serif;fill:#152b3b}.stage{font:700 16px Arial,sans-serif;fill:#057d80}.body{font:18px Arial,sans-serif;fill:#163047}.num{font:700 15px Arial,sans-serif;fill:#057d80}.foot{font:15px Arial,sans-serif;fill:#466577}</style><rect width="1100" height="560" fill="#f5faf9"/><rect width="1100" height="12" fill="#0b8c8b"/><text x="42" y="54" class="eyebrow">KO ET AL. 2010  •  Ag₂Te / PbTe</text><text x="42" y="104" class="title">Quench and purify Ag₂Te</text><rect x="888" y="45" width="168" height="36" rx="18" fill="#d9efec"/><text x="972" y="69" text-anchor="middle" class="stage">WORKUP</text><rect x="42" y="144" width="468" height="322" rx="22" fill="#fff" stroke="#d6e5e6"/><rect x="540" y="144" width="518" height="322" rx="22" fill="#fff" stroke="#d6e5e6"/><g stroke="#163047" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M165 195h120l-10 175c-2 15-14 25-28 25h-44c-14 0-26-10-28-25z"/><path d="M175 265h100" stroke="#2f99a0"/><path d="M179 270h92l-6 98c-1 8-7 13-15 13h-51c-8 0-14-5-15-13z" fill="#d8efed" stroke="none"/><path d="M155 195h140"/></g><circle cx="570" cy="188" r="14" fill="#d9efec"/><text x="570" y="193" text-anchor="middle" class="num">1</text><text x="605" y="195" class="body">Quench the reaction in a water bath, then</text><text x="605" y="221" class="body">dilute with 10 mL hexane.</text><circle cx="570" cy="284" r="14" fill="#d9efec"/><text x="570" y="289" text-anchor="middle" class="num">2</text><text x="605" y="291" class="body">Centrifuge; discard the precipitate and retain</text><text x="605" y="317" class="body">the NC-containing supernatant.</text><circle cx="570" cy="380" r="14" fill="#d9efec"/><text x="570" y="385" text-anchor="middle" class="num">3</text><text x