<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1000" viewBox="0 0 1420 1000" role="img" aria-labelledby="title desc">
  <title id="title">Ko 2010 silver telluride nanocrystal synthesis and film branches</title>
  <desc id="desc">MatterSyn-authored symbolic process map. AgCl in TOP, tellurium in TOP, and heated oleylamine lead to silver telluride nanocrystals. Externally prepared lead telluride nanocrystals remain a separate input. Pure controls and three mixed particle-number ratios lead to distinct conductivity and thermopower film preparations. No particle shape, packing, atomic coordinates, or measured result is depicted.</desc>
  <defs>
    <style>
      .bg{fill:#f7f9fc}.ink{fill:#14243a}.muted{fill:#52657b}.line{stroke:#8aa0b8;stroke-width:2.5;fill:none}.arrow{stroke:#536d89;stroke-width:3;fill:none;marker-end:url(#head)}
      .card{fill:#fff;stroke:#d6e0eb;stroke-width:2}.ag{fill:#e9f5fb;stroke:#78b7d9;stroke-width:2}.pb{fill:#eef6e9;stroke:#95c47e;stroke-width:2}.mix{fill:#f1ecfb;stroke:#a78bd3;stroke-width:2}.film{fill:#fff3e8;stroke:#dea56a;stroke-width:2}
      .title{font:700 34px Arial,sans-serif}.subtitle{font:18px Arial,sans-serif}.tag{font:700 15px Arial,sans-serif;letter-spacing:1.3px}.head{font:700 22px Arial,sans-serif}.body{font:17px Arial,sans-serif}.small{font:15px Arial,sans-serif}
    </style>
    <marker id="head" markerWidth="11" markerHeight="11" refX="8.5" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10Z" fill="#536d89"/></marker>
  </defs>
  <rect class="bg" width="1420" height="1000"/>
  <text class="tag" x="40" y="48" fill="#4b789a">SOURCE-BOUND PROCESS MAP · KO ET AL. 2010</text>
  <text class="title ink" x="40" y="91">Ag₂Te nanocrystals → pure and mixed NC-solid films</text>
  <text class="subtitle muted" x="40" y="122">Original symbolic illustration · source facts from SI pp. 2–3; not measured morphology or an atomistic model</text>

  <rect class="card" x="40" y="163" width="410" height="102" rx="16"/>
  <text class="tag" x="62" y="188" fill="#4b789a">SILVER STOCK</text>
  <text class="head ink" x="62" y="221">AgCl in tri-n-octylphosphine</text>
  <text class="small muted" x="62" y="246">7.17 g AgCl in 50 mL TOP → Ag-TOP stock</text>

  <rect class="card" x="505" y="163" width="410" height="102" rx="16"/>
  <text class="tag" x="527" y="188" fill="#4b789a">TELLURIUM STOCK</text>
  <text class="head ink" x="527" y="221">Te shot in tri-n-octylphosphine</text>
  <text class="small muted" x="527" y="246">4.79 g Te in 50 mL TOP → TOP-Te stock</text>

  <rect class="card" x="970" y="163" width="410" height="102" rx="16"/>
  <text class="tag" x="992" y="188" fill="#4b789a">REACTION MEDIUM</text>
  <text class="head ink" x="992" y="221">Oleylamine</text>
  <text class="small muted" x="992" y="246">8.13 g heated to 160 °C</text>

  <path class="arrow" d="M245 265V306"/>
  <path class="arrow" d="M710 265V306"/>
  <path class="arrow" d="M1175 265V306"/>
  <rect class="ag" x="235" y="320" width="950" height="118" rx="18"/>
  <text class="tag" x="264" y="347" fill="#28739c">PAPER'S ORIGINAL AG₂TE SYNTHESIS</text>
  <text class="head ink" x="264" y="381">Inject 5 mL Ag-TOP + 2.5 mL TOP-Te; age at 140 °C overnight</text>
  <text class="body muted" x="264" y="411">Water-bath quench → 10 mL hexane → centrifuge; purify supernatant with hexane/methanol</text>

  <path class="arrow" d="M710 438V461H357V480"/>
  <rect class="ag" x="40" y="492" width="635" height="110" rx="18"/>
  <text class="tag" x="64" y="520" fill="#28739c">AG₂TE INPUT</text>
  <text class="head ink" x="64" y="553">Purified Ag₂Te NCs</text>
  <text class="body muted" x="64" y="581">Source reports ~3 nm mean size and 1160 nm first absorption feature</text>

  <rect class="pb" x="745" y="492" width="635" height="110" rx="18"/>
  <text class="tag" x="769" y="520" fill="#6c9c53">PBTE INPUT · UPSTREAM REFERENCE</text>
  <text class="head ink" x="769" y="553">PbTe NCs prepared by cited earlier procedure</text>
  <text class="body muted" x="769" y="581">Source reports 7 ± 0.4 nm; this paper does not reproduce their synthesis</text>

  <path class="arrow" d="M357 602V646"/>
  <path class="arrow" d="M1062 602V646"/>
  <rect class="mix" x="40" y="660" width="1340" height="136" rx="18"/>
  <text class="tag" x="65" y="689" fill="#7862ab">SEPARATE FORMULATION BRANCHES</text>
  <text class="head ink" x="65" y="724">Pure PbTe control</text>
  <text class="head ink" x="470" y="724">Pure Ag₂Te control</text>
  <text class="head ink" x="840" y="724">Three mixed NC formulations</text>
  <text class="body muted" x="65" y="755">No Ag₂Te added</text>
  <text class="body muted" x="470" y="755">No PbTe added</text>
  <text class="body muted" x="840" y="755">Ag₂Te:PbTe particle-number = 0.01, 0.1, 1</text>
  <text class="small muted" x="65" y="779">Both NC solutions filtered twice (0.2 µm), redispersed in hexane/octane, stored under N₂.</text>

  <path class="arrow" d="M410 796V833"/>
  <path class="arrow" d="M1010 796V833"/>
  <rect class="film" x="40" y="846" width="635" height="112" rx="18"/>
  <text class="tag" x="64" y="874" fill="#ad6b2e">CONDUCTIVITY FILM</text>
  <text class="head ink" x="64" y="906">Drop-cast on Si/SiO₂ with Au/Cr electrodes</text>
  <text class="small muted" x="64" y="935">1 M hydrazine in acetonitrile overnight; repeat deposition/treatment</text>

  <rect class="film" x="745" y="846" width="635" height="112" rx="18"/>
  <text class="tag" x="769" y="874" fill="#ad6b2e">THERMOPOWER FILM</text>
  <text class="head ink" x="769" y="906">Deposit on glass at 5× NC solution concentration</text>
  <text class="small muted" x="769" y="935">Chemically treated as for conductivity films (SI p.2)</text>
  <text class="small muted" x="40" y="986">Schematic branches only. Figure 4/Table 1 supply measured mixed-film transport; SI Figure S2 mixed-SAXS ratio remains unresolved.</text>
</svg>
