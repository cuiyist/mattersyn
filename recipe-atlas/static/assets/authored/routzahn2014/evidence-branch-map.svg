<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1240" role="img" aria-labelledby="title desc">
  <title id="title">Routzahn and Jain 2014: preparation and evidence branches</title>
  <desc id="desc">Authored symbolic map separating CdSe/CdS precursor synthesis, an ensemble cuvette titration with final XRD, single-dot microfluidic optical measurements, methanol-only control, an SI-only seeded-rod experiment, and a simulation-only model. It is not a micrograph, crystallographic model, or measured kinetic plot.</desc>
  <defs>
    <style>
      .bg{fill:#f6f9fc}.ink{fill:#14263d}.sub{fill:#4c6278}.fine{fill:#64798f}.white{fill:#fff}
      .head{font:700 37px Arial,sans-serif}.kicker{font:700 18px Arial,sans-serif;letter-spacing:2px}
      .cardtitle{font:700 25px Arial,sans-serif}.body{font:20px Arial,sans-serif}.small{font:17px Arial,sans-serif}
      .pill{font:700 16px Arial,sans-serif;letter-spacing:.6px}.line{fill:none;stroke:#7b8fa3;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .arr{fill:none;stroke:#54708d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1L11 6L1 11Z" fill="#54708d"/></marker>
  </defs>
  <rect width="1900" height="1240" class="bg"/>
  <rect x="0" y="0" width="1900" height="138" fill="#14263d"/>
  <text x="68" y="63" class="head white">Cation exchange: separate routes and evidence</text>
  <text x="69" y="103" class="body" fill="#d6e4f2">Routzahn &amp; Jain · Nano Letters 2014 · DOI 10.1021/nl4044289</text>
  <text x="70" y="179" class="kicker sub">PREPARATION</text>
  <text x="525" y="179" class="kicker sub">EXPERIMENTAL BRANCH</text>
  <text x="1235" y="179" class="kicker sub">EVIDENCE AND LIMIT</text>

  <!-- Common precursor, shown symbolically without invented atomic geometry. -->
  <rect x="70" y="230" width="350" height="142" rx="22" fill="#e7f5f5" stroke="#55a7a0" stroke-width="3"/>
  <text x="95" y="266" class="pill" fill="#257b76">SI METHODS · STARTING MATERIAL</text>
  <text x="95" y="306" class="cardtitle ink">CdSe seeds</text>
  <text x="95" y="338" class="body sub">~3.4 nm estimate from absorbance</text>
  <path d="M245 374V413" class="arr"/>
  <rect x="70" y="414" width="350" height="158" rx="22" fill="#e7f5f5" stroke="#55a7a0" stroke-width="3"/>
  <text x="95" y="450" class="pill" fill="#257b76">SHELL-GROWTH BRANCH</text>
  <text x="95" y="490" class="cardtitle ink">CdSe/CdS core/shell</text>
  <text x="95" y="525" class="body sub">Main single-dot sample class</text>
  <text x="95" y="552" class="small sub">Starting TEM: SI Fig S1</text>
  <path d="M420 482H468V280H500" class="arr"/>
  <path d="M420 492H500" class="arr"/>
  <path d="M420 510H468V766H500" class="arr"/>

  <!-- Ensemble cuvette branch. -->
  <rect x="505" y="218" width="620" height="192" rx="22" fill="#fff3de" stroke="#d9a849" stroke-width="3"/>
  <text x="533" y="255" class="pill" fill="#9a6a1c">ENSEMBLE · CUVETTE · PHYSICAL SAMPLE</text>
  <text x="533" y="296" class="cardtitle ink">AgNO₃ titration in methanol</text>
  <text x="533" y="332" class="body sub">Separate solution preparation; 0–107% exchange</text>
  <text x="533" y="362" class="small sub">Absorbance, photoluminescence, final powder XRD</text>
  <path d="M1125 313H1205" class="arr"/>
  <rect x="1215" y="218" width="615" height="192" rx="22" fill="#fffaf0" stroke="#d9a849" stroke-width="3"/>
  <text x="1244" y="255" class="pill" fill="#9a6a1c">MEASURED · MAIN FIG 1 / SI S9</text>
  <text x="1244" y="296" class="cardtitle ink">XRD endpoints: 0% and 107%</text>
  <text x="1244" y="331" class="body sub">Wurtzite CdSe/CdS → orthorhombic Ag₂Se</text>
  <text x="1244" y="360" class="body sub">+ monoclinic Ag₂S at final titration point</text>
  <text x="1244" y="390" class="small" fill="#9a6a1c">Not XRD of the imaged individual dots</text>

  <!-- Main in situ microscopy branch. -->
  <rect x="505" y="444" width="620" height="226" rx="22" fill="#e7f0fb" stroke="#5b8dca" stroke-width="3"/>
  <text x="533" y="482" class="pill" fill="#326aa9">MAIN · MICROFLUIDIC TIRF</text>
  <text x="533" y="522" class="cardtitle ink">Immobilized single dots</text>
  <text x="533" y="559" class="body sub">AgNO₃ 10 µM · 75 µL/min for Fig 2</text>
  <text x="533" y="589" class="body sub">5, 10, 20, 40 µM series for Fig 3</text>
  <text x="533" y="628" class="small sub">Setup: source Scheme 1 · visible PL at 50 ms resolution</text>
  <path d="M1125 556H1205" class="arr"/>
  <rect x="1215" y="444" width="615" height="226" rx="22" fill="#f0f6fd" stroke="#5b8dca" stroke-width="3"/>
  <text x="1244" y="482" class="pill" fill="#326aa9">MEASURED OPTICAL RESPONSE · FIGS 2–3</text>
  <text x="1244" y="522" class="cardtitle ink">Dots turn permanently dark</text>
  <text x="1244" y="558" class="body sub">Single-dot switches; waiting-time distributions</text>
  <text x="1244" y="590" class="body sub">PL loss supports exchange inference</text>
  <text x="1244" y="629" class="small" fill="#326aa9">No direct phase assay on these same imaged dots</text>

  <!-- Solvent control, which cannot be assigned an AgNO3 concentration. -->
  <rect x="505" y="706" width="620" height="138" rx="22" fill="#ebf5e8" stroke="#83aa69" stroke-width="3"/>
  <text x="533" y="742" class="pill" fill="#5e853f">NEGATIVE CONTROL · SEPARATE FLOW</text>
  <text x="533" y="781" class="cardtitle ink">Pure methanol; no AgNO₃</text>
  <text x="533" y="812" class="small sub">Caption inconsistency on AgNO₃ settings flagged</text>
  <path d="M1125 772H1205" class="arr"/>
  <rect x="1215" y="706" width="615" height="138" rx="22" fill="#f4f9f1" stroke="#83aa69" stroke-width="3"/>
  <text x="1244" y="742" class="pill" fill="#5e853f">MEASURED · SI FIG S8</text>
  <text x="1244" y="781" class="cardtitle ink">No comparable ON→OFF loss</text>
  <text x="1244" y="813" class="small sub">Supports the exchange-specific optical interpretation</text>

  <!-- SI-only seeded-rod route: separate growth and measurement. -->
  <path d="M70 304H42V982H65" class="arr"/>
  <rect x="70" y="904" width="350" height="158" rx="22" fill="#f2ecfa" stroke="#a389c4" stroke-width="3"/>
  <text x="95" y="942" class="pill" fill="#7959a4">SI-ONLY MORPHOLOGY</text>
  <text x="95" y="982" class="cardtitle ink">CdSe/CdS seeded rods</text>
  <text x="95" y="1016" class="body sub">Separate CdS growth route</text>
  <text x="95" y="1044" class="small sub">Starting TEM: SI Fig S3</text>
  <rect x="505" y="886" width="620" height="176" rx="22" fill="#f2ecfa" stroke="#a389c4" stroke-width="3"/>
  <text x="533" y="923" class="pill" fill="#7959a4">OPTIONAL CONTEXT · SI-ONLY EXPERIMENT</text>
  <text x="533" y="963" class="cardtitle ink">Seeded-rod optical kinetics</text>
  <text x="533" y="998" class="body sub">AgNO₃ 46 µM · 50 µL/min</text>
  <text x="533" y="1029" class="small sub">Distinct from main core/shell dot run</text>
  <path d="M1125 970H1205" class="arr"/>
  <rect x="1215" y="886" width="615" height="176" rx="22" fill="#f8f4fc" stroke="#a389c4" stroke-width="3"/>
  <text x="1244" y="923" class="pill" fill="#7959a4">MEASURED · SI FIGS S3 / S5</text>
  <text x="1244" y="963" class="cardtitle ink">Rod TEM and PL traces</text>
  <text x="1244" y="997" class="body sub">Secondary SI sample; not main route evidence</text>
  <text x="1244" y="1030" class="small" fill="#7959a4">S5 caption’s S4 cross-reference is erroneous</text>

  <rect x="505" y="1100" width="1325" height="83" rx="17" fill="#e8edf3" stroke="#aebdcb" stroke-width="2"/>
  <text x="535" y="1135" class="pill" fill="#53677b">SIMULATION ONLY · MAIN FIG 4</text>
  <text x="535" y="1163" class="small ink">Cooperative and diffusion-limited model trajectories represent no physical specimen or new structure measurement.</text>
  <text x="70" y="1210" class="small fine">Authored symbolic branch map · source evidence and sample boundaries only · not a micrograph, crystal model, or measured plot</text>
</svg>
