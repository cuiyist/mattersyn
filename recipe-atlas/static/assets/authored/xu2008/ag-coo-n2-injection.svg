<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Conceptual Ag / Ag–CoO route apparatus; AgNO3 in oleylamine, 180 °C for 5 min under N2; then Co2(CO)8 / o-dichlorobenzene injection and 5 min more for Ag–CoO."><rect width="900" height="340" rx="24" fill="#f5f9fc"/><rect x="20" y="20" width="860" height="300" rx="16" fill="white" stroke="#a6c4d1" stroke-width="2"/><text x="48" y="78" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#164259">Ag / Ag–CoO route</text><rect x="60" y="112" width="200" height="160" rx="20" fill="#e2eef2" stroke="#52839a" stroke-width="4"/><path d="M78 208 Q160 184 242 208 L242 254 L78 254Z" fill="#9bd1db"/><path d="M155 112V75" stroke="#52839a" stroke-width="8"/><text x="300" y="145" font-family="Arial,sans-serif" font-size="19" fill="#284d60">AgNO3 in oleylamine, 180 °C for 5 min under N2;</text><text x="300" y="175" font-family="Arial,sans-serif" font-size="19" fill="#284d60">then Co2(CO)8 / o-dichlorobenzene injection and</text><text x="300" y="205" font-family="Arial,sans-serif" font-size="19" fill="#284d60">5 min more for Ag–CoO.</text><text x="48" y="295" font-family="Arial,sans-serif" font-size="17" fill="#60727d">Conceptual apparatus. Values and variants are from the source protocol, not apparatus dimensions.</text></svg>
