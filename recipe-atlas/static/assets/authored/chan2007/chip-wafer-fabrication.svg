<rect width="1280" height="798" fill="#f7fbfc"/>
<text x="48" y="62" class="title">Wafer fabrication and bonding</text>
<text x="48" y="94" class="sub">SI pp.1–3 Figure S1; device fabrication, not nanocrystal synthesis</text>
<text x="48" y="122" class="sub">Chan et al. (2007) · DOI 10.1021/jp073474u · source-bound apparatus summary</text>
<rect x="48" y="147" width="1184" height="149" rx="18" fill="#fff" stroke="#bed2d9" stroke-width="2"/>
<text x="77" y="176" class="sub">Three prepared layers become one chip; subsequent wall cleaning and FDTS remain separate stages</text>
<rect x="102" y="204" width="220" height="24" rx="7" fill="#97c8be" stroke="#4d8e84"/><text x="335" y="223" class="line">Si nitride window</text>
<rect x="102" y="234" width="220" height="24" rx="7" fill="#a3b9cf" stroke="#6485a4"/><text x="335" y="253" class="line">etched Si channels</text>
<rect x="731" y="215" width="195" height="17" rx="5" fill="#97c8be" stroke="#4d8e84"/>
<rect x="731" y="235" width="195" height="17" rx="5" fill="#a3b9cf" stroke="#6485a4"/>
<rect x="731" y="255" width="195" height="17" rx="5" fill="#c5b5db" stroke="#927db2"/>
<path d="M551 239 H701" stroke="#356c7a" stroke-width="4" marker-end="url(#arrow)"/>
<text x="944" y="239" class="line">bonded stack</text>
<rect x="102" y="264" width="220" height="15" rx="5" fill="#c5b5db" stroke="#927db2"/><text x="335" y="278" class="line">borofloat vias</text>
<rect x="48" y="318" width="581" height="184" rx="18" fill="#eaf3f5" stroke="#bed2d9" stroke-width="2"/>
<text x="70" y="357" class="h">Window wafer</text>
<text x="70" y="392" class="line">430 µm Si(100), 100 mm diameter</text>
<text x="70" y="418" class="line">CVD 1 µm silicon-rich nitride</text>
<text x="70" y="444" class="line">RIE window; KOH etch; 200 nm LTO each side</text>
<rect x="651" y="318" width="581" height="184" rx="18" fill="#f3f2f8" stroke="#bed2d9" stroke-width="2"/>
<text x="673" y="357" class="h">Channel wafer</text>
<text x="673" y="392" class="line">403 µm DSP Si; 43 µm-wide channels</text>
<text x="673" y="418" class="line">1 µm oxide mask / DRIE / HF strip (S1b)</text>
<text x="673" y="444" class="line">Finish with 200 nm CVD oxide</text>
<rect x="48" y="524" width="581" height="184" rx="18" fill="#eaf3f5" stroke="#bed2d9" stroke-width="2"/>
<text x="70" y="563" class="h">Glass via wafer</text>
<text x="70" y="598" class="line">575 µm borofloat glass</text>
<text x="70" y="624" class="line">Drilled holes provide fluidic access</text>
<text x="70" y="650" class="line">Bond first to channel Si; S1c shows −1 kV</text>
<rect x="651" y="524" width="581" height="184" rx="18" fill="#f3f2f8" stroke="#bed2d9" stroke-width="2"/>
<text x="673" y="563" class="h">Window-to-channel bond</text>
<text x="673" y="598" class="line">1 µm SU-8 2; 93 mJ/cm²; 30 s develop</text>
<text x="673" y="624" class="line">IPA; 70 °C/1 min → 90 °C/5 min</text>
<text x="673" y="650" class="line">BA6; 120 °C/~5 min roll; 150 °C/1 h</text>
<text x="48" y="767" class="foot">Unreported: etch recipe, KOH/HF concentration, drilling settings and 1 min bake-cycle temperatures.</text>
