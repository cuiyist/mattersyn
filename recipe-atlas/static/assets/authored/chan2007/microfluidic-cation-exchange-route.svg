<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-labelledby="title desc">
  <title id="title">Authored schematic of Chan et al. 2007 microfluidic cation-exchange observation</title>
  <desc id="desc">Two source solution cards feed a symbolic flow-focusing chip. A separate observation card shows selenium K-edge X-ray absorption measurements along the channel, revealing a CdSe-to-silver-selenide spectral transition. This is a schematic and not a measured image or to-scale device plan.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L9 5 L1 9 Z" fill="#356c7a"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#173b4a}
      .eyebrow{font-size:17px;font-weight:700;letter-spacing:2px;fill:#527780}
      .title{font-size:38px;font-weight:700;letter-spacing:-1px}
      .subtitle{font-size:19px;fill:#44636c}
      .card-title{font-size:25px;font-weight:700}
      .metric{font-size:22px;font-weight:650}
      .detail{font-size:18px;fill:#44636c}
      .step{font-size:16px;font-weight:700;letter-spacing:1.2px;fill:#236579}
      .foot{font-size:17px;fill:#536f76}
    </style>
  </defs>
  <rect width="1280" height="690" fill="#f7fbfc"/>
  <rect x="24" y="24" width="1232" height="642" rx="26" fill="#ffffff" stroke="#d4e3e7" stroke-width="2"/>
  <rect x="58" y="59" width="7" height="80" rx="3" fill="#d2a951"/>
  <text x="86" y="84" class="eyebrow">CHAN ET AL. · 2007 · DOI 10.1021/jp073474u</text>
  <text x="84" y="128" class="title">Cation exchange observed in flow</text>
  <text x="85" y="161" class="subtitle">Main in situ XAS branch · source concentrations before on-chip mixing</text>

  <rect x="72" y="205" width="304" height="142" rx="18" fill="#e9f4f4" stroke="#87babe" stroke-width="2"/>
  <rect x="72" y="205" width="8" height="142" rx="4" fill="#269296"/>
  <text x="96" y="239" class="step">CENTER FEED</text>
  <text x="96" y="278" class="card-title">CdSe nanocrystals</text>
  <text x="96" y="311" class="metric">1.4 mM CdSe</text>
  <text x="96" y="334" class="detail">5 wt% DDA in toluene</text>

  <rect x="72" y="369" width="304" height="142" rx="18" fill="#f2f2f8" stroke="#b3b7d5" stroke-width="2"/>
  <rect x="72" y="369" width="8" height="142" rx="4" fill="#777cba"/>
  <text x="96" y="403" class="step">SIDE FEEDS</text>
  <text x="96" y="442" class="card-title">Ag⁺ solution</text>
  <text x="96" y="475" class="metric">5 mM AgClO₄</text>
  <text x="96" y="498" class="detail">anhydrous salt; DDA/toluene</text>

  <path d="M376 276 H426 V350 H460" fill="none" stroke="#356c7a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M376 440 H426 V372 H460" fill="none" stroke="#356c7a" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="470" y="234" width="320" height="245" rx="20" fill="#f4f9fa" stroke="#88adb9" stroke-width="2"/>
  <text x="494" y="271" class="step">FLOW-FOCUSING CHIP</text>
  <text x="494" y="310" class="card-title">Diffusive mixing</text>
  <path d="M504 347 H755" stroke="#c0d4d8" stroke-width="38" stroke-linecap="round"/>
  <path d="M504 347 H755" stroke="#288e93" stroke-width="11" stroke-linecap="round"/>
  <circle cx="541" cy="347" r="8" fill="#7882b7"/>
  <circle cx="580" cy="347" r="8" fill="#7882b7"/>
  <circle cx="619" cy="347" r="8" fill="#7882b7"/>
  <circle cx="658" cy="347" r="8" fill="#7882b7"/>
  <circle cx="697" cy="347" r="8" fill="#7882b7"/>
  <text x="494" y="413" class="detail">CdSe center; Ag⁺ side feeds</text>
  <text x="494" y="441" class="detail">Observe flow downstream</text>

  <path d="M790 356 H834" fill="none" stroke="#356c7a" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="846" y="234" width="360" height="245" rx="20" fill="#fbf8ed" stroke="#d3bf83" stroke-width="2"/>
  <text x="870" y="271" class="step">IN SITU OBSERVATION</text>
