  <text x="85" y="596" class="foot">Authored symbolic route. Feed colors and particle marks are illustrative; no device dimension or atomic structure is encoded.</text>
  <text x="85" y="625" class="foot">The phase-labelled XRD sample in SI Figure S2 uses 2.8 mM CdSe and is a separate specimen context.</text>
