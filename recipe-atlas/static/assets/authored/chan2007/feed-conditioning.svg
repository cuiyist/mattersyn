<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#173b4a}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#4b6570}.h{font-size:22px;font-weight:700}.line{font-size:17px}.foot{font-size:15px;fill:#4b6570}</style>
<rect width="1280" height="798" fill="#f7fbfc"/>
<text x="48" y="62" class="title">Condition two separate feeds</text>
<text x="48" y="94" class="sub">Main p.3 Reagents and Solutions; immediately before use</text>
<text x="48" y="122" class="sub">Chan et al. (2007) · DOI 10.1021/jp073474u · source-bound apparatus summary</text>
<rect x="48" y="147" width="1184" height="149" rx="18" fill="#fff" stroke="#bed2d9" stroke-width="2"/>
<text x="77" y="176" class="sub">Two source solutions are conditioned individually before entering the chip</text>
<rect x="99" y="187" width="208" height="40" rx="8" fill="#e1f2ef" stroke="#3c9b8e" stroke-width="3"/><text x="117" y="213" class="line">CdSe · DDA/toluene</text>
<rect x="99" y="242" width="208" height="40" rx="8" fill="#ececf8" stroke="#777cba" stroke-width="3"/><text x="117" y="268" class="line">Ag⁺ · DDA/toluene</text>
<path d="M310 207 H400 M310 262 H400 M451 207 H544 M451 262 H544" stroke="#356c7a" stroke-width="4" marker-end="url(#arrow)"/>
<circle cx="426" cy="207" r="23" fill="#fff" stroke="#356c7a" stroke-width="3"/><text x="407" y="213" class="line">PTFE</text>
<circle cx="426" cy="262" r="23" fill="#fff" stroke="#356c7a" stroke-width="3"/><text x="407" y="268" class="line">PTFE</text>
<rect x="557" y="187" width="164" height="40" rx="10" fill="#f2f9fb" stroke="#5b9cb4" stroke-width="3"/><text x="579" y="213" class="line">He sparging</text>
<rect x="557" y="242" width="164" height="40" rx="10" fill="#f2f9fb" stroke="#5b9cb4" stroke-width="3"/><text x="579" y="268" class="line">He sparging</text>
<text x="751" y="213" class="line">→ center inlet</text><text x="751" y="268" class="line">→ two side inlets</text>
<rect x="48" y="318" width="581" height="184" rx="18" fill="#eaf3f5" stroke="#bed2d9" stroke-width="2"/>
<text x="70" y="357" class="h">Common medium</text>
<text x="70" y="392" class="line">DDA in toluene: 5 wt% / 232 mM</text>
<text x="70" y="418" class="line">Medium is reported for CdSe and Ag⁺ feeds</text>
<text x="70" y="444" class="line">Not a measured surface-ligand geometry</text>
<rect x="651" y="318" width="581" height="184" rx="18" fill="#f3f2f8" stroke="#bed2d9" stroke-width="2"/>
<text x="673" y="357" class="h">CdSe center feed</text>
<text x="673" y="392" class="line">Disperse preformed TOPO-capped CdSe</text>
<text x="673" y="418" class="line">Typical 1.4 mM ion-equivalent CdSe</text>
<text x="673" y="444" class="line">This is not nanocrystal molarity</text>
<rect x="48" y="524" width="581" height="184" rx="18" fill="#eaf3f5" stroke="#bed2d9" stroke-width="2"/>
<text x="70" y="563" class="h">Ag⁺ side feeds</text>
<text x="70" y="598" class="line">Dissolve anhydrous AgClO₄</text>
<text x="70" y="624" class="line">Typical 5 mM Ag⁺ before chip mixing</text>
<text x="70" y="650" class="line">No hydrate or feed stock volume implied</text>
<rect x="651" y="524" width="581" height="184" rx="18" fill="#f3f2f8" stroke="#bed2d9" stroke-width="2"/>
<text x="673" y="563" class="h">Before use</text>
<text x="673" y="598" class="line">0.45 µm PTFE syringe filtration</text>
<text x="673" y="624" class="line">Helium sparging suppresses chip bubbles</text>
<text x="673" y="650" class="line">Two feeds remain distinct until the chip</text>
<text x="48" y="767" class="foot">The illustrated feed containers are symbolic; no source vessel dimensions or volumes are asserted.</text>
