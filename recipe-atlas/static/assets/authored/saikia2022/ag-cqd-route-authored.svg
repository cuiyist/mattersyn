  <text x="790" y="308" fill="#183b49" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="700">5 mL AgNO₃</text>
  <text x="790" y="344" fill="#496b75" font-family="Arial, Segoe UI, sans-serif" font-size="18">Solution: 3.42 mg mL⁻¹</text>
  <rect x="788" y="420" width="264" height="103" rx="14" fill="#eaf6f6"/>
  <text x="804" y="455" fill="#326672" font-family="Arial, Segoe UI, sans-serif" font-size="18">Add to the stirred</text>
  <text x="804" y="486" fill="#326672" font-family="Arial, Segoe UI, sans-serif" font-size="18">CQD–water mixture.</text>

  <line x1="1079" y1="376" x2="1110" y2="376" stroke="#3b91a0" stroke-width="4" stroke-linecap="round"/>
  <path d="M1099 365 L1111 376 L1099 387" fill="none" stroke="#3b91a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="1120" y="194" width="310" height="362" rx="24" fill="#ffffff" stroke="#b9dce0" stroke-width="2"/>
  <circle cx="1157" cy="234" r="19" fill="#2b8795"/>
  <text x="1157" y="241" text-anchor="middle" fill="#ffffff" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="700">4</text>
  <text x="1189" y="242" fill="#214d5a" font-family="Arial, Segoe UI, sans-serif" font-size="23" font-weight="700">React + stabilize</text>
  <line x1="1143" y1="265" x2="1406" y2="265" stroke="#d8e8e9" stroke-width="2"/>
  <text x="1145" y="308" fill="#183b49" font-family="Arial, Segoe UI, sans-serif" font-size="23" font-weight="700">Reduction: 45 min</text>
  <text x="1145" y="348" fill="#183b49" font-family="Arial, Segoe UI, sans-serif" font-size="23" font-weight="700">Then another 3 h</text>
  <text x="1145" y="382" fill="#496b75" font-family="Arial, Segoe UI, sans-serif" font-size="18">of stirring to stabilize</text>
  <rect x="1143" y="420" width="264" height="103" rx="14" fill="#eaf6f6"/>
  <text x="1159" y="454" fill="#326672" font-family="Arial, Segoe UI, sans-serif" font-size="17">Later-stage temperature</text>
  <text x="1159" y="483" fill="#326672" font-family="Arial, Segoe UI, sans-serif" font-size="17">not separately stated</text>
  <text x="1159" y="510" fill="#326672" font-family="Arial, Segoe UI, sans-serif" font-size="17">in main p. 3.</text>

  <line x1="1434" y1="376" x2="1465" y2="376" stroke="#3b91a0" stroke-width="4" stroke-linecap="round"/>
  <path d="M1454 365 L1466 376 L1454 387" fill="none" stroke="#3b91a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="1475" y="194" width="270" height="362" rx="24" fill="#ffffff" stroke="#b9dce0" stroke-width="2"/>
  <circle cx="1512" cy="234" r="19" fill="#2b8795"/>
  <text x="1512" y="241" text-anchor="middle" fill="#ffffff" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="700">5</text>
  <text x="1544" y="242" fill="#214d5a" font-family="Arial, Segoe UI, sans-serif" font-size="23" font-weight="700">Purify</text>
  <line x1="1498" y1="265" x2="1721" y2="265" stroke="#d8e8e9" stroke-width="2"/>
  <text x="1500" y="307" fill="#183b49" font-family="Arial, Segoe UI, sans-serif" font-size="22" font-weight="700">Ultrafiltration</text>
  <text x="1500" y="342" fill="#496b75" font-family="Arial, Segoe UI, sans-serif" font-size="18">Remove residual</text>
  <text x="1500" y="372" fill="#496b75" font-family="Arial, Segoe UI, sans-serif" font-size="18">AgNO₃</text>
  <rect x="1498" y="420" width="223" height="103" rx="14" fill="#eaf6f6"/>
  <text x="1514" y="452" fill="#246979" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="700">Ag/CQD product</text>
  <text x="1514" y="482" fill="#326672" font-family="Arial, Segoe UI, sans-serif" font-size="16">Retained fraction</text>
  <text x="1514" y="507" fill="#326672" font-family="Arial, Segoe UI, sans-serif" font-size="16">not specified.</text>

  <rect x="55" y="591" width="1690" height="160" rx="20" fill="#fff8eb" stroke="#efd6a4" stroke-width="2"/>
  <text x="82" y="626" fill="#8a5c19" font-family="Arial, Segoe UI, sans-serif" font-size="19" font-weight="700">UNRESOLVED MAIN TEXT / SI FIGURE S1 CONFLICT</text>
  <text x="82" y="661" fill="#5d5b53" font-family="Arial, Segoe UI, sans-serif" font-size="18">Main p. 3 says room-temperature stirring for 15 min. SI Fig. S1 depicts 100 °C heating through both the 15 and 45 min stages, then heat off for 3 h.</text>
  <text x="82" y="694" fill="#5d5b53" font-family="Arial, Segoe UI, sans-serif" font-size="18">SI Fig. S1 labels a 0.22 µm filter; main p. 3 says ultrafiltration and separately lists a 1 kDa membrane for CQD purification.</text>
  <text x="82" y="726" fill="#6b6a63" font-family="Arial, Segoe UI, sans-serif" font-size="16">This diagram follows the main-text sequence only; apparatus geometry and the product's retained fraction are not reported.</text>
  <text x="55" y="792" fill="#647f86" font-family="Arial, Segoe UI, sans-serif" font-size="16">Author-drawn explanation · no experimental image, molecular coordinates or measured shape</text>
</svg>
