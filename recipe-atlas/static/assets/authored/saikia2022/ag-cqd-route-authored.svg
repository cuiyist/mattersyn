<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820" role="img" aria-labelledby="title desc">
  <title id="title">Ag/CQD route from Saikia et al. main text, authored schematic</title>
  <desc id="desc">Authored, non-measured operation diagram based on the main article PDF page 3, printed page 311. It shows 200 microliters of coal-derived CQD stock into 100 milliliters of hot-boiled distilled water, room-temperature stirring for 15 minutes, addition of 5 milliliters of silver nitrate solution, 45-minute reduction, another 3 hours of stirring for stabilization, then ultrafiltration. The separately published supplementary Figure S1 conflicts on heating and filtration, as disclosed below. DOI 10.1039/d1nj04039a.</desc>
  <metadata>Main source: Saikia et al., New Journal of Chemistry 2022, DOI 10.1039/d1nj04039a, main PDF page 3 / printed 311; PDF SHA-256 c958d865a99f21c99be395ac2ea8f2940caf9a660c976cd3f52feec95f21e71f. Conflict source: linked SI Figure S1, SI PDF page 1; PDF SHA-256 acde382e9bf4791cc290bc7a43986cc06911d78f4174d1bae04947dcfd9cc591. Original MatterSyn schematic, not a measured apparatus, atomic model or complete SOP.</metadata>
