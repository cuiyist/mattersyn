  <text x="449" y="492" fill="#246979" font-family="Arial, Segoe UI, sans-serif" font-size="24" font-weight="700">15 min</text>

  <line x1="724" y1="376" x2="755" y2="376" stroke="#3b91a0" stroke-width="4" stroke-linecap="round"/>
