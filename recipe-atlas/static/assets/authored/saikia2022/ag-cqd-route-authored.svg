  <text x="92" y="241" text-anchor="middle" fill="#ffffff" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="700">1</text>
  <text x="124" y="242" fill="#214d5a" font-family="Arial, Segoe UI, sans-serif" font-size="23" font-weight="700">CQD stock</text>
  <line x1="78" y1="265" x2="341" y2="265" stroke="#d8e8e9" stroke-width="2"/>
  <text x="80" y="308" fill="#183b49" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="700">200 µL</text>
  <text x="80" y="344" fill="#496b75" font-family="Arial, Segoe UI, sans-serif" font-size="18">Coal-derived CQDs</text>
  <text x="80" y="376" fill="#496b75" font-family="Arial, Segoe UI, sans-serif" font-size="18">Stock: 10.79 mg mL⁻¹</text>
  <rect x="78" y="420" width="264" height="103" rx="14" fill="#eaf6f6"/>
  <text x="94" y="453" fill="#326672" font-family="Arial, Segoe UI, sans-serif" font-size="17">Upstream CQD preparation</text>
  <text x="94" y="480" fill="#326672" font-family="Arial, Segoe UI, sans-serif" font-size="17">is cited, not reproduced</text>
  <text x="94" y="507" fill="#326672" font-family="Arial, Segoe UI, sans-serif" font-size="17">in this method excerpt.</text>

  <line x1="369" y1="376" x2="400" y2="376" stroke="#3b91a0" stroke-width="4" stroke-linecap="round"/>
  <path d="M389 365 L401 376 L389 387" fill="none" stroke="#3b91a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="410" y="194" width="310" height="362" rx="24" fill="#ffffff" stroke="#b9dce0" stroke-width="2"/>
  <circle cx="447" cy="234" r="19" fill="#2b8795"/>
  <text x="447" y="241" text-anchor="middle" fill="#ffffff" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="700">2</text>
  <text x="479" y="242" fill="#214d5a" font-family="Arial, Segoe UI, sans-serif" font-size="23" font-weight="700">Dilute + stir</text>
  <line x1="433" y1="265" x2="696" y2="265" stroke="#d8e8e9" stroke-width="2"/>
  <text x="435" y="307" fill="#183b49" font-family="Arial, Segoe UI, sans-serif" font-size="23" font-weight="700">100 mL water</text>
