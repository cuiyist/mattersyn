  <text x="55" y="55" fill="#2a7380" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="700" letter-spacing="2">MATTERSYN · AUTHORED ROUTE SCHEMATIC</text>
  <text x="55" y="112" fill="#183b49" font-family="Arial, Segoe UI, sans-serif" font-size="42" font-weight="700">Coal-derived CQDs → Ag/CQD nanocomposite</text>
  <text x="55" y="151" fill="#55717b" font-family="Arial, Segoe UI, sans-serif" font-size="21">Main article method · PDF p. 3 (printed 311) · symbolic stages, no individual batch ID</text>

