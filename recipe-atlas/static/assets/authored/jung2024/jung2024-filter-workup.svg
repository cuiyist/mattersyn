  <text x="40" y="53" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#087d83" font-weight="700" text-anchor="start" >JUNG ET AL. 2024  •  Ag NANOSPHERES</text>
  <text x="40" y="102" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#172d3d" font-weight="700" text-anchor="start" >Stabilize and filter AgNSs</text><rect x="758" y="49" width="162" height="30" rx="15" fill="#def2ed" stroke="none" /><text x="839" y="70" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#087d83" font-weight="700" text-anchor="middle" >WORKUP</text>
  <rect x="40" y="142" width="520" height="320" rx="20" fill="#fff" stroke="#d5e3e2" /><rect x="582" y="142" width="338" height="320" rx="20" fill="#fff" stroke="#d5e3e2" />
  <rect x="89" y="257" width="78" height="126" rx="12" fill="#f9fcfb" stroke="#172d3d" stroke-width="3"/><rect x="95" y="313.7" width="66" height="63.30000000000001" rx="7" fill="#e6efec" stroke="none" /><line x1="97" y1="313.7" x2="159" y2="313.7" stroke="#087d83" stroke-width="1.5" stroke-linecap="round" /><text x="129" y="409" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#536b78" font-weight="700" text-anchor="middle" >SDS + PVP</text><line x1="174" y1="319" x2="223" y2="319" stroke="#087d83" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="226" y="255" width="96" height="19" rx="5" fill="#e5ebee" stroke="#172d3d" /><rect x="248" y="274" width="52" height="17" rx="3" fill="#fff" stroke="#172d3d" /><path d="M271 291 v61" fill="none" stroke="#172d3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="254" y="352" width="34" height="7" rx="3" fill="#087d83" stroke="#172d3d" /><text x="270" y="408" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#536b78" font-weight="700" text-anchor="middle" >0.2 µm filter</text><line x1="312" y1="320" x2="360" y2="320" stroke="#087d83" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M388 248 h62 v123 l-17 31 h-28 l-17 -31 Z" fill="#fbfcfc" stroke="#172d3d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M394 329 h50 v42 l-15 25 h-20 l-15 -25 Z" fill="#e1efea" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /><path d="M413 391 q6 5 12 0" fill="none" stroke="#a8b7bf" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><text x="419" y="435" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#536b78" font-weight="700" text-anchor="middle" >50 mL tube</text>
  <circle cx="615" cy="182" r="10" fill="#def2ed" stroke="none" /><text x="615" y="187" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#087d83" font-weight="700" text-anchor="middle" >1</text><text x="637" y="187" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="600" text-anchor="start" >Before filtering, add 1 mL 1 wt% SDS</text><text x="637" y="207" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="400" text-anchor="start" >and 2.5 mL 10 wt% PVP; stir 10 min at</text><text x="637" y="227" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="400" text-anchor="start" >room temperature.</text><circle cx="615" cy="259" r="10" fill="#def2ed" stroke="none" /><text x="615" y="264" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#087d83" font-weight="700" text-anchor="middle" >2</text><text x="637" y="264" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="600" text-anchor="start" >Pass through a 0.2 µm syringe membrane</text><text x="637" y="284" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="400" text-anchor="start" >filter and transfer to a 50 mL</text><text x="637" y="304" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="400" text-anchor="start" >centrifuge tube.</text><circle cx="615" cy="336" r="10" fill="#def2ed" stroke="none" /><text x="615" y="341" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#087d83" font-weight="700" text-anchor="middle" >3</text><text x="637" y="341" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="600" text-anchor="start" >Spin 11000 g for 15 min, wash at 6500 g</text><text x="637" y="361" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="400" text-anchor="start" >for 10 min, then redisperse in</text><text x="637" y="381" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="400" text-anchor="start" >DIW/SDS/PVP.</text>
  <line x1="40" y1="489" x2="920" y2="489" stroke="#cbdcdd" stroke-width="1" stroke-linecap="round" /><text x="40" y="516" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#536b78" font-weight="500" text-anchor="start" >SI PDF p.2 • ligand exchange, filtration and centrifugation</text>
