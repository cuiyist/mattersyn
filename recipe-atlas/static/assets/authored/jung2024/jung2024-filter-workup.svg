<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stabilize and filter AgNSs apparatus schematic" width="960" height="560" viewBox="0 0 960 560"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#087d83"/></marker></defs>
