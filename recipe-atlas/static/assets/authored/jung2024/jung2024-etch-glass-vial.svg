  <rect x="235" y="232" width="132" height="183" rx="12" fill="#f9fcfb" stroke="#172d3d" stroke-width="3"/><rect x="241" y="314.35" width="120" height="94.64999999999998" rx="7" fill="#d9eee9" stroke="none" /><line x1="243" y1="314.35" x2="359" y2="314.35" stroke="#087d83" stroke-width="1.5" stroke-linecap="round" /><circle cx="259" cy="336.35" r="6" fill="#a8b7bf" stroke="#728994" /><circle cx="277" cy="336.35" r="6" fill="#a8b7bf" stroke="#728994" /><circle cx="295" cy="336.35" r="6" fill="#a8b7bf" stroke="#728994" /><circle cx="313" cy="336.35" r="6" fill="#a8b7bf" stroke="#728994" /><circle cx="259" cy="356.35" r="6" fill="#a8b7bf" stroke="#728994" /><circle cx="277" cy="356.35" r="6" fill="#a8b7bf" stroke="#728994" /><circle cx="295" cy="356.35" r="6" fill="#a8b7bf" stroke="#728994" /><circle cx="313" cy="356.35" r="6" fill="#a8b7bf" stroke="#728994" /><circle cx="259" cy="376.35" r="6" fill="#a8b7bf" stroke="#728994" /><circle cx="277" cy="376.35" r="6" fill="#a8b7bf" stroke="#728994" /><rect x="83" y="199" width="155" height="30" rx="15" fill="#e9eefb" stroke="none" /><text x="160.5" y="220" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6179b6" font-weight="700" text-anchor="middle" >selected Ag mix</text><rect x="392" y="199" width="95" height="30" rx="15" fill="#fff0dc" stroke="none" /><text x="439.5" y="220" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#cd7245" font-weight="700" text-anchor="middle" >Cu(II)</text><line x1="205" y1="222" x2="244" y2="255" stroke="#087d83" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="392" y1="222" x2="367" y2="255" stroke="#087d83" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="139" y="414" width="145" height="30" rx="15" fill="#fff0dc" stroke="none" /><text x="211.5" y="435" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#cd7245" font-weight="700" text-anchor="middle" >60 °C preheat</text><rect x="314" y="414" width="112" height="30" rx="15" fill="#def2ed" stroke="none" /><text x="370" y="435" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#087d83" font-weight="700" text-anchor="middle" >2 h etch</text>
  <circle cx="615" cy="182" r="10" fill="#def2ed" stroke="none" /><text x="615" y="187" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#087d83" font-weight="700" text-anchor="middle" >1</text><text x="637" y="187" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="600" text-anchor="start" >In a 20 mL glass vial combine selected</text><text x="637" y="207" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="400" text-anchor="start" >Ag dispersion, DIW and 100 mM CTAC.</text><circle cx="615" cy="239" r="10" fill="#def2ed" stroke="none" /><text x="615" y="244" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#087d83" font-weight="700" text-anchor="middle" >2</text><text x="637" y="244" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="600" text-anchor="start" >Preheat to 60 °C for 10 min; add 380 µL</text><text x="637" y="264" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="400" text-anchor="start" >5 mM Cu(NO3)2.</text><circle cx="615" cy="296" r="10" fill="#def2ed" stroke="none" /><text x="615" y="301" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#087d83" font-weight="700" text-anchor="middle" >3</text><text x="637" y="301" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="600" text-anchor="start" >Let the oxidative etch proceed for 2 h.</text><text x="637" y="321" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="400" text-anchor="start" >No deliberate degassing is stated for</text><text x="637" y="341" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="400" text-anchor="start" >this branch.</text>
  <line x1="40" y1="489" x2="920" y2="489" stroke="#cbdcdd" stroke-width="1" stroke-linecap="round" /><text x="40" y="516" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#536b78" font-weight="500" text-anchor="start" >SI PDF pp.1–2 • oxidative etching method</text>
