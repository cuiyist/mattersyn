<circle cx="92" cy="191" r="21" fill="#2b7884"/><text x="92" y="198" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">1</text>
<text x="126" y="200" font-size="25" font-weight="700" fill="#123c50">Seed Ag nuclei</text><text x="85" y="287" font-size="19" fill="#294d5d">AgNO3 + CTAC; ice-cold NaBH4</text><text x="85" y="321" font-size="19" fill="#294d5d">30 °C; seed incubation 1 h</text>
<text x="85" y="373" font-size="16" fill="#8b653d">SI p. 1</text></g><g font-family="Arial, sans-serif"><rect x="555" y="150" width="445" height="250" rx="22" fill="#ffffff" stroke="#bad3dc" stroke-width="3"/>
<circle cx="592" cy="191" r="21" fill="#2b7884"/><text x="592" y="198" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">2</text>
<text x="626" y="200" font-size="25" font-weight="700" fill="#123c50">Grow Ag shapes</text><text x="585" y="287" font-size="19" fill="#294d5d">Seed + CTAC + silver trifluoroacetate</text><text x="585" y="321" font-size="19" fill="#294d5d">60 °C 20 min; then ascorbic acid 90 min</text>
<text x="585" y="373" font-size="16" fill="#8b653d">SI p. 1</text></g><g font-family="Arial, sans-serif"><rect x="1055" y="150" width="445" height="250" rx="22" fill="#ffffff" stroke="#bad3dc" stroke-width="3"/>
<circle cx="1092" cy="191" r="21" fill="#2b7884"/><text x="1092" y="198" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">3</text>
<text x="1126" y="200" font-size="25" font-weight="700" fill="#123c50">Selectively flocculate</text><text x="1085" y="287" font-size="19" fill="#294d5d">BDAC; 30 °C for 15–24 h undisturbed</text><text x="1085" y="321" font-size="19" fill="#294d5d">Rods/wires flocculate</text>
<text x="1085" y="373" font-size="16" fill="#8b653d">SI p. 1; Fig. S1</text></g><g font-family="Arial, sans-serif"><rect x="1055" y="490" width="445" height="250" rx="22" fill="#ffffff" stroke="#bad3dc" stroke-width="3"/>
<circle cx="1092" cy="531" r="21" fill="#2b7884"/><text x="1092" y="538" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">4</text>
<text x="1126" y="540" font-size="25" font-weight="700" fill="#123c50">Recover cube/bipyramid feed</text><text x="1085" y="627" font-size="19" fill="#294d5d">Transfer supernatant, retain centrifuge pellet</text><text x="1085" y="661" font-size="19" fill="#294d5d">Wash; redisperse in CTAC</text>
<text x="1085" y="713" font-size="16" fill="#8b653d">SI p. 1–2</text></g><g font-family="Arial, sans-serif"><rect x="555" y="490" width="445" height="250" rx="22" fill="#ffffff" stroke="#bad3dc" stroke-width="3"/>
<circle cx="592" cy="531" r="21" fill="#2b7884"/><text x="592" y="538" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">5</text>
<text x="626" y="540" font-size="25" font-weight="700" fill="#123c50">Etch with Cu(II)</text><text x="585" y="627" font-size="19" fill="#294d5d">380 µL of 5 mM Cu(NO3)2</text><text x="585" y="661" font-size="19" fill="#294d5d">60 °C for 2 h; source uses O2 and Cl−</text>
<text x="585" y="713" font-size="16" fill="#8b653d">SI p. 2; Fig. 1</text></g><g font-family="Arial, sans-serif"><rect x="55" y="490" width="445" height="250" rx="22" fill="#ffffff" stroke="#bad3dc" stroke-width="3"/>
<circle cx="92" cy="531" r="21" fill="#2b7884"/><text x="92" y="538" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">6</text>
<text x="126" y="540" font-size="25" font-weight="700" fill="#123c50">Stabilize Ag nanospheres</text><text x="85" y="627" font-size="19" fill="#294d5d">Add SDS/PVP before filtering</text><text x="85" y="661" font-size="19" fill="#294d5d">Filter, wash, redisperse; store 4 °C</text>
<text x="85" y="713" font-size="16" fill="#8b653d">SI p. 2; Fig. 1–2</text></g>
<rect x="55" y="800" width="1445" height="90" rx="19" fill="#e7f2f3" stroke="#b9d6db" stroke-width="2"/>
<text x="80" y="836" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#245b68">Separate application branch</text>
<text x="80" y="869" font-family="Arial, sans-serif" font-size="18" fill="#385b66">PVP-modified AgNSs → film on ITO → spin-coat preformed green or red InP/ZnSe/ZnS QDs (SI p. 2).</text>
