  <circle cx="615" cy="182" r="10" fill="#def2ed" stroke="none" /><text x="615" y="187" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#087d83" font-weight="700" text-anchor="middle" >1</text><text x="637" y="187" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="600" text-anchor="start" >Replace cupric ions with cuprous ions</text><text x="637" y="207" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="400" text-anchor="start" >for the negative control.</text><circle cx="615" cy="239" r="10" fill="#def2ed" stroke="none" /><text x="615" y="244" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#087d83" font-weight="700" text-anchor="middle" >2</text><text x="637" y="244" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="600" text-anchor="start" >Use a mixture of acetonitrile and water</text><text x="637" y="264" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="400" text-anchor="start" >because Cu(I) is not soluble in water.</text><circle cx="615" cy="296" r="10" fill="#def2ed" stroke="none" /><text x="615" y="301" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#087d83" font-weight="700" text-anchor="middle" >3</text><text x="637" y="301" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="600" text-anchor="start" >The Cu(I) reagent, dose and</text><text x="637" y="321" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="400" text-anchor="start" >acetonitrile:water ratio are not</text><text x="637" y="341" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="400" text-anchor="start" >reported.</text>
