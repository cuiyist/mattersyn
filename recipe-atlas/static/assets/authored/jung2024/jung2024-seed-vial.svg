  <rect x="249" y="247" width="112" height="166" rx="12" fill="#f9fcfb" stroke="#172d3d" stroke-width="3"/><rect x="255" y="321.7" width="100" height="85.30000000000001" rx="7" fill="#e9edb4" stroke="none" /><line x1="257" y1="321.7" x2="353" y2="321.7" stroke="#087d83" stroke-width="1.5" stroke-linecap="round" /><rect x="287.08" y="390" width="35.84" height="6" rx="3" fill="#172d3d" stroke="none" /><circle cx="273" cy="343.7" r="6" fill="#a8b7bf" stroke="#728994" /><circle cx="291" cy="343.7" r="6" fill="#a8b7bf" stroke="#728994" /><circle cx="309" cy="343.7" r="6" fill="#a8b7bf" stroke="#728994" /><circle cx="327" cy="343.7" r="6" fill="#a8b7bf" stroke="#728994" /><circle cx="273" cy="363.7" r="6" fill="#a8b7bf" stroke="#728994" /><text x="305" y="437" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#536b78" font-weight="700" text-anchor="middle" >20 mL glass vial</text><rect x="220" y="425" width="170" height="18" rx="6" fill="#73939b" stroke="#172d3d" /><rect x="237" y="444" width="136" height="7" rx="0" fill="#172d3d" stroke="none" /><rect x="80" y="202" width="142" height="30" rx="15" fill="#def2ed" stroke="none" /><text x="151" y="223" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#087d83" font-weight="700" text-anchor="middle" >0.5 mM CTAC</text><rect x="370" y="202" width="163" height="30" rx="15" fill="#fff0dc" stroke="none" /><text x="451.5" y="223" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#cd7245" font-weight="700" text-anchor="middle" >AgNO3 → NaBH4</text><line x1="218" y1="222" x2="252" y2="265" stroke="#087d83" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="371" y1="223" x2="359" y2="265" stroke="#087d83" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="93" y="372" width="170" height="30" rx="15" fill="#e9eefb" stroke="none" /><text x="178" y="393" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6179b6" font-weight="700" text-anchor="middle" >30 °C · 500 rpm</text>
  <circle cx="615" cy="182" r="10" fill="#def2ed" stroke="none" /><text x="615" y="187" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#087d83" font-weight="700" text-anchor="middle" >1</text><text x="637" y="187" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="600" text-anchor="start" >20 mL glass vial: 10 mL of 0.5 mM CTAC,</text><text x="637" y="207" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="400" text-anchor="start" >30 °C for 10 min, 500 rpm.</text><circle cx="615" cy="239" r="10" fill="#def2ed" stroke="none" /><text x="615" y="244" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#087d83" font-weight="700" text-anchor="middle" >2</text><text x="637" y="244" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="600" text-anchor="start" >Add 25 µL 0.1 M AgNO3; after 20 s add</text><text x="637" y="264" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="400" text-anchor="start" >450 µL fresh ice-cold 0.02 M NaBH4.</text><circle cx="615" cy="296" r="10" fill="#def2ed" stroke="none" /><text x="615" y="301" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#087d83" font-weight="700" text-anchor="middle" >3</text><text x="637" y="301" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="600" text-anchor="start" >Continue stirring at 30 °C for 1 h. The</text><text x="637" y="321" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="400" text-anchor="start" >resulting seeds are reported as 2–3 nm.</text>
