  <circle cx="615" cy="182" r="10" fill="#def2ed" stroke="none" /><text x="615" y="187" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#087d83" font-weight="700" text-anchor="middle" >1</text><text x="637" y="187" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="600" text-anchor="start" >Sequentially sonicate ITO in acetone,</text><text x="637" y="207" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="400" text-anchor="start" >ethanol and DIW for 30 min each.</text><circle cx="615" cy="239" r="10" fill="#def2ed" stroke="none" /><text x="615" y="244" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#087d83" font-weight="700" text-anchor="middle" >2</text><text x="637" y="244" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="600" text-anchor="start" >Affix a 9 mm-diameter, 1.8 mm-thick</text><text x="637" y="264" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="400" text-anchor="start" >sticky chamber; add 200 µL PVP-AgNS</text><text x="637" y="284" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="400" text-anchor="start" >dispersion at OD 80 (1 cm path).</text><circle cx="615" cy="316" r="10" fill="#def2ed" stroke="none" /><text x="615" y="321" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#087d83" font-weight="700" text-anchor="middle" >3</text><text x="637" y="321" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="600" text-anchor="start" >Dry at 60 °C, remove chamber, then wash</text><text x="637" y="341" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#172d3d" font-weight="400" text-anchor="start" >with DIW, ethanol and isopropanol.</text>
