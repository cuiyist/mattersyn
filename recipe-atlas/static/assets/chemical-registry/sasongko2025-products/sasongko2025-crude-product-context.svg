<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820"><title>Post-injection crude dispersion</title><rect x="1" y="1" width="1098" height="818" rx="18" fill="white" stroke="#b9ced8"/><text x="40" y="55" font-family="Arial,sans-serif" font-size="27" fill="#244756">Post-injection crude dispersion</text><text x="40" y="95" font-family="Arial,sans-serif" font-size="20" fill="#687f8b">Sasongko et al. · Journal of Physical Chemistry C 2025</text><text x="55" y="160" font-family="Arial,sans-serif" font-size="29" fill="#244756">Promptly cooled reaction mixture</text><rect x="36" y="208" width="1028" height="70" rx="14" fill="#edf5f8"/><text x="55" y="243" font-family="Arial,sans-serif" font-size="21" fill="#244756">Source-scoped process, observation or interpretation context</text><text x="45" y="350" font-family="Arial,sans-serif" font-size="21" fill="#244756">This is the crude dispersion after FA-stock injection and prompt cooling. Growth dwell and</text><text x="45" y="377" font-family="Arial,sans-serif" font-size="21" fill="#244756">numerical room temperature are unreported. No purified-product composition or atomic model is</text><text x="45" y="404" font-family="Arial,sans-serif" font-size="21" fill="#244756">assigned.</text><text x="45" y="726" font-family="Arial,sans-serif" font-size="20" fill="#687f8b">Symbolic context only. No atomic positions, particle envelope, ligand geometry or exact</text><text x="45" y="753" font-family="Arial,sans-serif" font-size="20" fill="#687f8b">structure–recipe pair.</text></svg>