<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820"><title>Washing-waste observation</title><rect x="1" y="1" width="1098" height="818" rx="18" fill="white" stroke="#b9ced8"/><text x="40" y="55" font-family="Arial,sans-serif" font-size="27" fill="#244756">Washing-waste observation</text><text x="40" y="95" font-family="Arial,sans-serif" font-size="20" fill="#687f8b">Sasongko et al. · Journal of Physical Chemistry C 2025</text><text x="55" y="160" font-family="Arial,sans-serif" font-size="29" fill="#244756">Original Figure S1 waste vials</text><rect x="36" y="208" width="1028" height="70" rx="14" fill="#edf5f8"/><text x="55" y="243" font-family="Arial,sans-serif" font-size="21" fill="#244756">Source-scoped process, observation or interpretation context</text><text x="45" y="350" font-family="Arial,sans-serif" font-size="21" fill="#244756">Figure S1 compares waste associated with OAm:OA 1:2, 1:3 and 1:4. The caption associates 1:4 with</text><text x="45" y="377" font-family="Arial,sans-serif" font-size="21" fill="#244756">partial QD dissolution. This is a discarded-fraction observation, not the retained final product or</text><text x="45" y="404" font-family="Arial,sans-serif" font-size="21" fill="#244756">a dissolved-mass measurement.</text><text x="45" y="726" font-family="Arial,sans-serif" font-size="20" fill="#687f8b">Symbolic context only. No atomic positions, particle envelope, ligand geometry or exact</text><text x="45" y="753" font-family="Arial,sans-serif" font-size="20" fill="#687f8b">structure–recipe pair.</text></svg>