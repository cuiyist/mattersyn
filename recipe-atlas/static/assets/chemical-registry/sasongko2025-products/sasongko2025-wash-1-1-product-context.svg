<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820"><title>Washing comparison — 1:1</title><rect x="1" y="1" width="1098" height="818" rx="18" fill="white" stroke="#b9ced8"/><text x="40" y="55" font-family="Arial,sans-serif" font-size="27" fill="#244756">Washing comparison — 1:1</text><text x="40" y="95" font-family="Arial,sans-serif" font-size="20" fill="#687f8b">Sasongko et al. · Journal of Physical Chemistry C 2025</text><text x="55" y="160" font-family="Arial,sans-serif" font-size="29" fill="#244756">Acetonitrile:toluene 1:1</text><rect x="36" y="208" width="1028" height="165" rx="14" fill="#edf5f8"/><text x="55" y="243" font-family="Arial,sans-serif" font-size="21" fill="#244756">acetonitrile parts: 1 volume part</text><text x="55" y="270" font-family="Arial,sans-serif" font-size="21" fill="#244756">toluene parts: 1 volume part</text><text x="55" y="297" font-family="Arial,sans-serif" font-size="21" fill="#244756">(001) FWHM: .48 ° 2θ (axis)</text><text x="55" y="324" font-family="Arial,sans-serif" font-size="21" fill="#244756">(002) FWHM: .53 ° 2θ (axis)</text><text x="55" y="351" font-family="Arial,sans-serif" font-size="21" fill="#244756">average PL lifetime: 80 ns</text><text x="45" y="443" font-family="Arial,sans-serif" font-size="21" fill="#244756">Figure 2 compares this washing ratio by volume at fixed 100 °C growth and OAm:OA 1:3. It is one</text><text x="45" y="470" font-family="Arial,sans-serif" font-size="21" fill="#244756">paired purification condition, not another independent full experimental matrix. Absolute washing</text><text x="45" y="497" font-family="Arial,sans-serif" font-size="21" fill="#244756">amounts and whole-product composition are unknown.</text><text x="45" y="726" font-family="Arial,sans-serif" font-size="20" fill="#687f8b">Symbolic context only. No atomic positions, particle envelope, ligand geometry or exact</text><text x="45" y="753" font-family="Arial,sans-serif" font-size="20" fill="#687f8b">structure–recipe pair.</text></svg>