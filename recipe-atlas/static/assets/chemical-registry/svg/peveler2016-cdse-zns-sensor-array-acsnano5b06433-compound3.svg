<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780"><rect width="1000" height="780" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="30" y="30" font-size="14" fill="#56788d">PEVELER 2016 · QUALIFIED CHEMICAL IDENTITY</text><text x="30" y="74" font-size="23" fill="#233f52">O-(2-(N-5-(1,2-Dithiolan-3-yl)pentanamide)ethyl)-O-prime-(2-azidoethyl)ethylene</text><text x="30" y="105" font-size="23" fill="#233f52">glycol (3)</text><text x="500" y="310" text-anchor="middle" font-size="33" fill="#38576b">Exact formula not assigned</text><text x="500" y="370" text-anchor="middle" font-size="19" fill="#657787">MATERIAL IDENTITY · NO ATOMISTIC MODEL</text><line x1="30" y1="540" x2="970" y2="540" stroke="#cedae3"/><text x="30" y="574" font-size="17" fill="#42586a">Source-drawn amide-linked lipoic-acid/azido linker. Absolute configuration is unreported; this is</text><text x="30" y="599" font-size="17" fill="#42586a">distinct from the terminal-OH and methoxy-PEG ester ligands.</text><text x="30" y="748" font-size="14" fill="#607789">Source identity: ACS Nano 2016 · DOI 10.1021/acsnano.5b06433</text></g></svg>