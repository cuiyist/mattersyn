<svg xmlns="http://www.w3.org/2000/svg" width="840" height="480" viewBox="0 0 840 480" role="img"><title>Tetraglyme</title><desc>Nominal source identity; molecular, particle and crystal coordinates remain unassigned. Tetraethylene glycol dimethyl ether, 99%, vacuum distilled; no explicit assignment to an omitted growth recipe.</desc><rect width="840" height="480" fill="#f5f9fa"/><rect x="14" y="14" width="812" height="452" rx="14" fill="white" stroke="#d3dfe5"/><text x="34.00" y="42.00" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#607785">SOURCE IDENTITY REFERENCE</text><text x="34.00" y="78.00" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#193648">Tetraglyme</text><text x="34.00" y="128.00" font-family="Arial,sans-serif" font-size="25" font-weight="normal" text-anchor="start" fill="#193648">C10H22O5</text><text x="34.00" y="171.00" font-family="Arial,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#193648">Tetraethylene glycol dimethyl ether, 99%, vacuum distilled; no explicit assignment to an</text><text x="34.00" y="195.00" font-family="Arial,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#193648">omitted growth recipe.</text><text x="34.00" y="452.00" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#607785">Reference only - no measured 3D, solution, surface or crystal geometry</text></svg>