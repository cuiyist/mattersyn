<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Anhydrous silver perchlorate symbolic formula card</title>
  <desc id="desc">An authored, non-atomistic label for anhydrous silver perchlorate, AgClO4, used as the silver ion source in Chan et al. 2007. It does not show a measured crystal or solution complex.</desc>
  <style>
    text{font-family:Segoe UI,Arial,sans-serif;fill:#173b4a}
    .eyebrow{font-size:23px;font-weight:700;letter-spacing:2px;fill:#567782}
    .formula{font-size:112px;font-weight:700;letter-spacing:-5px}
    .name{font-size:38px;font-weight:650}
    .note{font-size:25px;fill:#4c6871}
    .small{font-size:21px;fill:#60767c}
  </style>
  <rect width="800" height="800" fill="#f8fbfb"/>
  <rect x="32" y="32" width="736" height="736" rx="34" fill="#fff" stroke="#d0e0e3" stroke-width="3"/>
  <rect x="70" y="72" width="660" height="12" rx="6" fill="#8b91bf"/>
  <text x="82" y="145" class="eyebrow">REAGENT IDENTITY · CHAN 2007</text>
  <text x="82" y="270" class="formula">AgClO₄</text>
  <text x="82" y="337" class="name">Silver perchlorate</text>
  <rect x="82" y="380" width="285" height="55" rx="27" fill="#eef0f9" stroke="#afb7d6" stroke-width="2"/>
  <text x="109" y="416" class="note">Anhydrous salt</text>
  <path d="M82 486 H718" stroke="#dce7e9" stroke-width="2"/>
  <text x="82" y="548" class="note">Formula identity only.</text>
  <text x="82" y="590" class="note">No solution speciation or crystal</text>
  <text x="82" y="632" class="note">geometry is implied.</text>
  <text x="82" y="712" class="small">Authored symbolic card · main article p. 12212</text>
</svg>
