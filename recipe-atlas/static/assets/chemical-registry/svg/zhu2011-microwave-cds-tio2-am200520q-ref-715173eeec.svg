<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560"><rect width="840" height="560" rx="15" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="43" font-size="23" fill="#213446">thiourea</text><text x="28" y="111" font-size="15" fill="#596b7d">Canonical-bound identity reference · no experimental coordinates</text><rect x="28" y="146" width="784" height="46" rx="8" fill="#e6f1fa"/><text x="48" y="175" font-size="20" fill="#213446">Identity card — geometry unassigned</text><text x="28" y="227" font-size="17" fill="#213446">Role: sulfur precursor</text><text x="28" y="263" font-size="17" fill="#213446">Canonical formula: CH4N2S</text><text x="28" y="299" font-size="17" fill="#213446">Reported thiourea identity and CH4N2S formula. No exact committed molecular graph is</text><text x="28" y="322" font-size="17" fill="#213446">selected; connectivity and geometry remain unassigned.</text><text x="28" y="358" font-size="17" fill="#213446">Equal concentration to cadmium nitrate in the selected electrode-4 bath; no quantity or</text><text x="28" y="381" font-size="17" fill="#213446">purity is inferred.</text><text x="28" y="526" font-size="12" fill="#596b7d">Zhu et al. (2011) · Main PDF p.2 / printed p.1473, Experimental Section, MACBD preparation paragraph and</text><text x="28" y="544" font-size="12" fill="#596b7d">electrode numbering</text></g></svg>