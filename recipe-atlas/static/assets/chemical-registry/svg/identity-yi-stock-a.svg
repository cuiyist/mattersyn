<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><title>Solution A · rare-earth precursor</title><desc>Source solution A is prepared through acid dissolution, evaporation and redissolution. Its detailed nitrate/hydration speciation and final solution volume are not established; starting oxide quantities are retained in canonical records.</desc><rect x="10" y="12" width="880" height="396" rx="24" fill="#f5f9fb"/><text x="450" y="60" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#294451">Solution A · rare-earth precursor</text><text x="450" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#294451">La₂O₃ + Yb₂O₃ + Er₂O₃ → acid dissolution</text><text x="450" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#294451">Evaporate excess acid; redissolve residue</text><text x="450" y="297" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#294451">30 mL deionized water · stir 1 h</text><text x="450" y="362" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#294451">Solution composition schematic · no exact speciation</text></svg>