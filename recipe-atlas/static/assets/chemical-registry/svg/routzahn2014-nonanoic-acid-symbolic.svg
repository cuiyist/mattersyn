<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Routzahn 2014 nonanoic acid symbolic reagent card</title>
  <desc id="desc">Authored formula-only identity for nonanoic acid, C9H18O2, named as a precipitation aid during nanocrystal purification in Supporting Information page S2. It does not depict molecular conformation, solvent association, or solution geometry.</desc>
  <style>
    text{font-family:Segoe UI,Arial,sans-serif;fill:#173b4a}
    .eyebrow{font-size:22px;font-weight:700;letter-spacing:2px;fill:#567782}
    .formula{font-size:107px;font-weight:700;letter-spacing:-5px}
    .name{font-size:39px;font-weight:650}.note{font-size:25px;fill:#4c6871}
    .small{font-size:21px;fill:#60767c}
  </style>
  <rect width="800" height="800" fill="#f8fbfb"/>
  <rect x="32" y="32" width="736" height="736" rx="34" fill="#fff" stroke="#d0e0e3" stroke-width="3"/>
  <rect x="70" y="72" width="660" height="12" rx="6" fill="#70aaa4"/>
  <text x="82" y="145" class="eyebrow">PURIFICATION AID · ROUTZAHN 2014</text>
  <text x="82" y="270" class="formula">C₉H₁₈O₂</text>
  <text x="82" y="337" class="name">Nonanoic acid</text>
  <rect x="82" y="380" width="410" height="55" rx="27" fill="#eaf6f3" stroke="#a8d3ca" stroke-width="2"/>
  <text x="109" y="416" class="note">Precipitation aid</text>
  <path d="M82 486 H718" stroke="#dce7e9" stroke-width="2"/>
  <text x="82" y="548" class="note">Added with methanol during</text>
  <text x="82" y="590" class="note">nanocrystal purification.</text>
  <text x="82" y="632" class="note">Formula identity only.</text>
  <text x="82" y="712" class="small">No conformation or solution geometry · SI p. S2</text>
</svg>
