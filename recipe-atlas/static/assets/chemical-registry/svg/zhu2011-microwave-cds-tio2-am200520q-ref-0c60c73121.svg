</g><text x="28" y="405" font-size="17" fill="#213446">Role: aqueous precursor-bath solvent</text><text x="28" y="441" font-size="17" fill="#213446">Canonical formula: not reported</text><text x="28" y="477" font-size="17" fill="#213446">Conventional water reference connectivity only. Canonical empirical formula remains</text><text x="28" y="500" font-size="17" fill="#213446">unreported; this does not assign solution speciation or measured geometry.</text><text x="28" y="536" font-size="17" fill="#213446">Aqueous solution is reported; water grade, solvent volume and empirical formula are not</text><text x="28" y="559" font-size="17" fill="#213446">separately printed in this procedure.</text><text x="28" y="633" font-size="12" fill="#596b7d">Zhu et al. (2011) · Main PDF p.2 / printed p.1473, Experimental Section, MACBD preparation paragraph and</text><text x="28" y="651" font-size="12" fill="#596b7d">electrode numbering</text></g></svg>