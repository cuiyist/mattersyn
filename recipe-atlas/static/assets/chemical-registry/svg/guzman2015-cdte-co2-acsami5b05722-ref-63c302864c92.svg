" fill="#193648">coordinates are unassigned.</text><text x="34.00" y="452.00" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#607785">Reference only - no measured 3D, solution, surface or crystal geometry</text><rect x="406" y="179" width="28" height="30" rx="4" fill="white"/><text x="420" y="202" font-family="Arial,sans-serif" font-size="25" font-weight="bold" text-anchor="middle" fill="#193648">C</text></svg>