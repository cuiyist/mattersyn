<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img"><title>Thallous acetate · formal components</title><desc>Thallous acetate as formal disconnected Tl+ and acetate− components. The localized carboxylate drawing is one resonance representation; it does not assign a Tl–O coordination bond, ion-pair geometry, hydrate, crystal packing or dissolved speciation.</desc><rect x="1" y="1" width="998" height="508" rx="20" fill="#fff" stroke="#d7e4ea"/><text x="40" y="49" font-family="Arial,sans-serif" font-size="27" font-weight="600" fill="#253f50" text-anchor="start">Thallous acetate · formal components</text><path d="M40 72H960" stroke="#d7e4ea"/><text x="500" y="115" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#416679" text-anchor="middle">Tl⁺  [CH₃COO]⁻</text><rect x="86" y="176" width="228" height="186" rx="20" fill="#edf5f7" stroke="#bfd5dd"/><text x="200" y="256" font-family="Arial,sans-serif" font-size="66" font-weight="400" fill="#253f50" text-anchor="middle">Tl⁺</text><text x="200" y="323" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#253f50" text-anchor="middle">Thallium(I)</text><rect x="372" y="160" width="542" height="224" rx="20" fill="#fbfbf8" stroke="#dce3dd"/><path d="M615 257L675 202M625 268L686 212M620 270L705 322" stroke="#deaa42" stroke-width="15" opacity=".25" stroke-linecap="round"/><path d="M520 267L608 267M624 255L676 205M635 265L687 215M628 279L704 320" stroke="#354b56" stroke-width="3.5" fill="none"/><text x="474" y="280" font-family="Arial,sans-serif" font-size="34" font-weight="400" fill="#253f50" text-anchor="middle">CH₃</text><text x="620" y="280" font-family="Arial,sans-serif" font-size="34" font-weight="400" fill="#253f50" text-anchor="middle">C</text><text x="704" y="202" font-family="Arial,sans-serif" font-size="34" font-weight="400" fill="#b33e42" text-anchor="middle">O</text><text x="735" y="342" font-family="Arial,sans-serif" font-size="34" font-weight="400" fill="#b33e42" text-anchor="middle">O⁻</text><text x="640" y="411" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#253f50" text-anchor="middle">Acetate · carboxylate highlighted</text><rect x="35" y="437" width="930" height="49" rx="10" fill="#edf5f7"/><text x="500" y="467" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#253f50" text-anchor="middle">Separate formal components · no Tl–O bond or salt 3D geometry</text></svg>