nt-size="22" font-weight="normal" text-anchor="start" fill="#193648">Reference formula: C3H6O2S</text><text x="34.00" y="359.00" font-family="Arial,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#193648">Formula field in source record remains unreported.</text><text x="34.00" y="383.00" font-family="Arial,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#193648">Free 3-mercaptopropionic acid reference; surface binding, ionization and coverage are</text><text x="34.00" y="407.00" font-family="Arial,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#193648">unassigned.</text><text x="34.00" y="461.00" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#607785">Reference only - no measured 3D, solution, surface or crystal geometry</text></svg>