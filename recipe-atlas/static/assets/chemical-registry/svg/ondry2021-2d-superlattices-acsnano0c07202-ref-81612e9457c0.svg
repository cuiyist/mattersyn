<svg xmlns="http://www.w3.org/2000/svg" width="840" height="558" viewBox="0 0 840 558" role="img"><title>DMF</title><desc>Conventional 2D connectivity reference; not measured coordinates. Conventional free-molecule 2D reference only. It does not assign solution speciation, surface binding, source purity or measured coordinates.</desc><rect width="840" height="558" fill="#f5f9fa"/><rect x="14" y="14" width="812" height="530" rx="14" fill="white" stroke="#d3dfe5"/><text x="34.00" y="40.00" font-family="Arial,sans-serif" font-size="15" fill="#647b87" font-weight="bold">2D CONNECTIVITY REFERENCE</text><text x="34.00" y="77.00" font-family="Arial,sans-serif" font-size="23" fill="#183a4b" font-weight="bold">DMF</text><line x1="229.47" y1="122.00" x2="356.49" y2="195.33" stroke="#294a59" stroke-width="2.3"/><line x1="356.49" y1="195.33" x2="356.49" y2="342.00" stroke="#294a59" stroke-width="2.3"/><line x1="356.49" y1="195.33" x2="483.51" y2="122.00" stroke="#294a59" stroke-width="2.3"/><line x1="484.71" y1="119.92" x2="611.73" y2="193.25" stroke="#294a59" stroke-width="2.3"/><line x1="482.31" y1="124.08" x2="609.33" y2="197.41" stroke="#294a59" stroke-width="2.3"/><rect x="338.49" y="181.33" width="36" height="29" rx="6" fill="white"/><text x="346.49" y="202.33" font-family="Arial,sans-serif" font-size="22" fill="#285bc2" font-weight="bold">N</text><rect x="592.53" y="181.33" width="36" height="29" rx="6" fill="white"/><text x="600.53" y="202.33" font-family="Arial,sans-serif" font-size="22" fill="#b32635" font-weight="bold">O</text><text x="34.00" y="377.00" font-family="Arial,sans-serif" font-size="21" fill="#234252" font-weight="normal">Reference formula: C3H7NO</text><text x="34.00" y="406.00" font-family="Arial,sans-serif" font-size="17" fill="#234252" font-weight="normal">Source formula remains unreported.</text><text x="34.00" y="442.00" font-family="Arial,sans-serif" font-size="17" fill="#234252" font-weight="normal">Conventional free-molecule 2D reference only. It does not assign solution speciation,</text><text x="34.00" y="467.00" font-family="Arial,sans-serif" font-size="17" fill="#234252" font-weight="normal">surface binding, source purity or measured coordinates.</text><text x="34.00" y="530.00" font-family="Arial,sans-serif" font-size="16" fill="#647b87" font-weight="normal">Reference only - no measured 3D, crystal or surface geometry</text></svg>