<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t d"><title id="t">Teflon-lined autoclave schematic</title><desc id="d">Illustrative sealed vessel. Fill level, pressure and construction geometry are not specified.</desc><rect width="640" height="320" rx="18" fill="#f7fafc"/><text x="320" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#263746">Sealed solvothermal vessel · schematic</text><rect x="230" y="76" width="180" height="160" rx="24" fill="#dce5eb" stroke="#334e5e" stroke-width="7"/><rect x="248" y="96" width="144" height="122" rx="18" fill="#fff" stroke="#6b8797" stroke-width="5"/><line x1="244" y1="86" x2="396" y2="86" stroke="#334e5e" stroke-width="13" stroke-linecap="round"/><text x="320" y="273" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#263746">Teflon liner · 140–180°C · 15 h</text><text x="320" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#536b78">illustrative only · pressure unreported</text></svg>