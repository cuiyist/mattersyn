<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc"><title id="title">n-Dodecane</title><desc id="desc">Validated formal 2D connectivity with arbitrary drawing coordinates. No 3D conformer or measured geometry is supplied.</desc><g font-family="Arial, sans-serif"><rect width="1200" height="550" rx="12" fill="white"/><text x="36" y="47" font-size="27" fill="#173c4a">n-Dodecane</text><text x="36" y="90" font-size="20" fill="#466370">C12H26 · Formal 2D reference</text><line x1="85.0" y1="224.5309090909091" x2="178.63636363636363" y2="275.46909090909094" stroke="#345565" stroke-width="2.6"/><line x1="178.63636363636363" y1="275.46909090909094" x2="272.2727272727273" y2="224.5309090909091" stroke="#345565" stroke-width="2.6"/><line x1="272.2727272727273" y1="224.5309090909091" x2="365.9090909090909" y2="275.46909090909094" stroke="#345565" stroke-width="2.6"/><line x1="365.9090909090909" y1="275.46909090909094" x2="459.54545454545456" y2="224.5309090909091" stroke="#345565" stroke-width="2.6"/><line x1="459.54545454545456" y1="224.5309090909091" x2="553.1818181818182" y2="275.46909090909094" stroke="#345565" stroke-width="2.6"/><line x1="553.1818181818182" y1="275.46909090909094" x2="646.8181818181818" y2="224.5309090909091" stroke="#345565" stroke-width="2.6"/><line x1="646.8181818181818" y1="224.5309090909091" x2="740.4545454545455" y2="275.46909090909094" stroke="#345565" stroke-width="2.6"/><line x1="740.4545454545455" y1="275.46909090909094" x2="834.0909090909091" y2="224.5309090909091" stroke="#345565" stroke-width="2.6"/><line x1="834.0909090909091" y1="224.5309090909091" x2="927.7272727272727" y2="275.46909090909094" stroke="#345565" stroke-width="2.6"/><line x1="927.7272727272727" y1="275.46909090909094" x2="1021.3636363636364" y2="224.5309090909091" stroke="#345565" stroke-width="2.6"/><line x1="1021.3636363636364" y1="224.5309090909091" x2="1115.0" y2="275.46909090909094" stroke="#345565" stroke-width="2.6"/><text x="36" y="397" font-size="18" fill="#466370">Unlabelled corners and ends are carbon atoms; carbon-bound hydrogens are implicit.</text><text x="36" y="437" font-size="19" fill="#466370">Validated formal 2D connectivity with arbitrary drawing coordinates. No 3D conformer or measured geometry</text><text x="36" y="465" font-size="19" fill="#466370">is supplied.</text></g></svg>
