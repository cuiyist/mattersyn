<svg xmlns="http://www.w3.org/2000/svg" width="620" height="240" viewBox="0 0 620 240" role="img" aria-labelledby="t d"><title id="t">Bismuth(III) 2-ethylhexanoate source formula</title><desc id="d">Formula-level precursor identity. Bi coordination and molecular geometry were not measured.</desc><rect x="2" y="2" width="616" height="236" rx="20" fill="#f6fafc" stroke="#c7dbe6"/><text x="30" y="54" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#123048">Bi(III) 2-ethylhexanoate</text><text x="30" y="110" font-family="Arial,sans-serif" font-size="24" fill="#154d63">Bi[OOCCH(C₂H₅)C₄H₉]₃</text><text x="30" y="158" font-family="Arial,sans-serif" font-size="16" fill="#536778">Formula printed in Fanfair &amp; Korgel (2005)</text><text x="30" y="190" font-family="Arial,sans-serif" font-size="15" fill="#536778">Coordination and solution species are unreported.</text></svg>