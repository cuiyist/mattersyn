<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="479" viewBox="0 0 1000 479"><rect width="1000" height="479" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="26" font-weight="bold" fill="#173047">LMWH-DOCA conjugate (LHD)</text><text x="28" y="90" font-size="17" font-weight="normal" fill="#596b7d">Canonical-bound reference • geometry unassigned</text><rect x="28" y="126" width="944" height="48" rx="8" fill="#e6f1fa"/><text x="44" y="157" font-size="20" font-weight="normal" fill="#173047">Identity / component context — no exact structural model</text><text x="28" y="198" font-size="20" font-weight="normal" fill="#173047">Role: micelle-forming conjugate</text><text x="28" y="237" font-size="20" font-weight="normal" fill="#173047">Source formula: not reported</text><text x="28" y="276" font-size="20" font-weight="normal" fill="#173047">mass: 50 mg</text><text x="28" y="315" font-size="20" font-weight="normal" fill="#173047">Required locally reported LHD preparation is represented separately; exact transfer batch not identified.</text><text x="28" y="354" font-size="20" font-weight="normal" fill="#173047">Qualified macromolecule/intermediate identity; exact sequence, substitution pattern, counterions and</text><text x="28" y="381" font-size="20" font-weight="normal" fill="#173047">batch-specific connectivity are unassigned.</text><text x="28" y="430" font-size="15" font-weight="normal" fill="#596b7d">Khatun et al. (2012) • Main PDF p.3 / printed p.3882, Section 2.4, loading and workup</text></g></svg>