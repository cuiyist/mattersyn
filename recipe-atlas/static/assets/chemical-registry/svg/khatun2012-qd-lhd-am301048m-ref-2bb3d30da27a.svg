<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="572" viewBox="0 0 1000 572"><rect width="1000" height="572" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="26" font-weight="bold" fill="#173047">CdTe/CdSe QD solution in chloroform</text><text x="28" y="90" font-size="17" font-weight="normal" fill="#596b7d">Canonical-bound reference • geometry unassigned</text><rect x="28" y="126" width="944" height="48" rx="8" fill="#e6f1fa"/><text x="44" y="157" font-size="20" font-weight="normal" fill="#173047">Identity / component context — no exact structural model</text><text x="28" y="198" font-size="20" font-weight="normal" fill="#173047">Role: selected QD loading stock</text><text x="28" y="237" font-size="20" font-weight="normal" fill="#173047">Source formula: not reported</text><text x="28" y="276" font-size="20" font-weight="normal" fill="#173047">stock aliquot volume: 0.5 mL</text><text x="28" y="315" font-size="20" font-weight="normal" fill="#173047">source concentration: 0.112 muM/mL; Printed0.112microM per mL; ambiguous dimensional notation</text><text x="28" y="342" font-size="20" font-weight="normal" fill="#173047">retained without molar-charge calculation.</text><text x="28" y="381" font-size="20" font-weight="normal" fill="#173047">0.5mL is a QD solution aliquot, not pure chloroform or QD volume. Source explicitly selects Q-LHD/0.5 for</text><text x="28" y="408" font-size="20" font-weight="normal" fill="#173047">subsequent studies on p.5.</text><text x="28" y="447" font-size="20" font-weight="normal" fill="#173047">Particle/formulation reference only. No single-molecule formula for the formulation, atomic model, shell</text><text x="28" y="474" font-size="20" font-weight="normal" fill="#173047">geometry or exact size is inferred.</text><text x="28" y="523" font-size="15" font-weight="normal" fill="#596b7d">Khatun et al. (2012) • Main PDF p.3 / printed p.3882, Section 2.4, loading and workup</text></g></svg>