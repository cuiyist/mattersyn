<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc"><title id="title">Cadmium acetate dihydrate</title><desc id="desc">Disconnected formal ions and two waters preserve the named dihydrate. No Cd–water coordination, ion pairing, lattice or 3D geometry is assigned.</desc><g font-family="Arial, sans-serif"><rect width="1200" height="550" rx="12" fill="white"/><text x="36" y="47" font-size="27" fill="#173c4a">Cadmium acetate dihydrate</text><text x="36" y="90" font-size="20" fill="#466370">Cd(C2H3O2)2·2H2O · Formal 2D reference</text><line x1="289.12310400000007" y1="140.0" x2="365.33333333333337" y2="184.0" stroke="#345565" stroke-width="2.6"/><line x1="368.33333333333337" y1="184.0" x2="368.33333333333337" y2="272.0" stroke="#345565" stroke-width="2.6"/><line x1="362.33333333333337" y1="184.0" x2="362.33333333333337" y2="272.0" stroke="#345565" stroke-width="2.6"/><line x1="365.33333333333337" y1="184.0" x2="441.5435626666667" y2="140.0" stroke="#345565" stroke-width="2.6"/><line x1="758.4564373333333" y1="140.0" x2="834.6666666666666" y2="184.0" stroke="#345565" stroke-width="2.6"/><line x1="837.6666666666666" y1="184.0" x2="837.6666666666666" y2="272.0" stroke="#345565" stroke-width="2.6"/><line x1="831.6666666666666" y1="184.0" x2="831.6666666666666" y2="272.0" stroke="#345565" stroke-width="2.6"/><line x1="834.6666666666666" y1="184.0" x2="910.876896" y2="140.0" stroke="#345565" stroke-width="2.6"/><rect x="563.0" y="165.0" width="74" height="38" rx="4" fill="white"/><text x="600.0" y="192.0" text-anchor="middle" font-size="25" font-weight="600" fill="#596981">Cd2+</text><rect x="352.33333333333337" y="253.0" width="26" height="38" rx="4" fill="white"/><text x="365.33333333333337" y="280.0" text-anchor="middle" font-size="25" font-weight="600" fill="#b73c43">O</text><rect x="420.5435626666667" y="121.0" width="42" height="38" rx="4" fill="white"/><text x="441.5435626666667" y="148.0" text-anchor="middle" font-size="25" font-weight="600" fill="#b73c43">O−</text><rect x="821.6666666666666" y="253.0" width="26" height="38" rx="4" fill="white"/><text x="834.6666666666666" y="280.0" text-anchor="middle" font-size="25" font-weight="600" fill="#b73c43">O</text><rect x="889.876896" y="121.0" width="42" height="38" rx="4" fill="white"/><text x="910.876896" y="148.0" text-anchor="middle" font-size="25" font-weight="600" fill="#b73c43">O−</text><rect x="483.0" y="341.0" width="58" height="38" rx="4" fill="white"/><text x="512.0" y="368.0" text-anchor="middle" font-size="25" font-weight="600" fill="#b73c43">H₂O</text><rect x="659.0" y="341.0" width="58" height="38" rx="4" fill="white"/><text x="688.0" y="368.0" text-anchor="middle" font-size="25" font-weight="600" fill="#b73c43">H₂O</text><text x="36" y="397" font-size="18" fill="#466370">Unlabelled corners and ends are carbon atoms; carbon-bound hydrogens are implicit.</text><text x="36" y="437" font-size="19" fill="#466370">Disconnected formal ions and two waters preserve the named dihydrate. No Cd–water coordination, ion</text><text x="36" y="465" font-size="19" fill="#466370">pairing, lattice or 3D geometry is assigned.</text></g></svg>
