<svg xmlns='http://www.w3.org/2000/svg' width='900' height='470' viewBox='0 0 900 470'><title>Sodium borate decahydrate · composition schematic</title><desc>Formula-unit composition only: 2 Na⁺, one B₄O₇²⁻ unit, and 10 H₂O. Borate connectivity, hydration coordination, relative positions, and crystal geometry are not shown.</desc><rect x='8' y='8' width='884' height='454' rx='24' fill='#f5f9fb' stroke='#d3e1e8'/><text x='450' y='48' text-anchor='middle' font-family='Arial,sans-serif' font-size='25' font-weight='600' fill='#294451'>Sodium borate decahydrate · composition schematic</text><text x='170' y='205' text-anchor='middle' font-family='Arial,sans-serif' font-size='25' fill='#294451'>2 Na⁺</text><text x='450' y='205' text-anchor='middle' font-family='Arial,sans-serif' font-size='25' fill='#294451'>B₄O₇²⁻</text><text x='730' y='205' text-anchor='middle' font-family='Arial,sans-serif' font-size='25' fill='#294451'>10 H₂O</text><text x='310' y='214' text-anchor='middle' font-family='Arial,sans-serif' font-size='19' fill='#758894'>+</text><text x='590' y='214' text-anchor='middle' font-family='Arial,sans-serif' font-size='19' fill='#758894'>+</text><text x='450' y='274' text-anchor='middle' font-family='Arial,sans-serif' font-size='16' fill='#667b88'>formula-unit composition; no borate bonds or hydrate positions</text><text x='450' y='396' text-anchor='middle' font-family='Arial,sans-serif' font-size='25' font-weight='600' fill='#294451'>Na₂B₄O₇·10H₂O</text><text x='450' y='432' text-anchor='middle' font-family='Arial,sans-serif' font-size='14' fill='#526777'>Formula-unit composition only: 2 Na⁺, one B₄O₇²⁻ unit, and 10 H₂O. Borate connectivity, hydration coordination, relative positions, and crystal geometry are not shown.</text></svg>