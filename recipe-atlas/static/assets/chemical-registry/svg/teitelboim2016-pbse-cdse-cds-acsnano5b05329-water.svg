<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680"><rect width="1000" height="680" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="30" y="30" font-size="14" fill="#56788d">TEITELBOIM 2016 · QUALIFIED CHEMICAL REFERENCE</text><text x="30" y="73" font-size="23" fill="#233f52">Water; external cooling bath</text><text x="32" y="156" font-size="22" fill="#38576b">H2O</text><rect x="480.50" y="297.00" width="39" height="26" rx="4" fill="#f8fafc"/><text x="500.00" y="317.00" text-anchor="middle" font-size="20" fill="#ad3541">H2O</text><text x="30" y="465" font-size="15" fill="#596d7d">Formal 2D connectivity; carbon and hydrogen may be implicit. No measured geometry.</text><line x1="30" y1="490" x2="970" y2="490" stroke="#cedae3"/><text x="30" y="522" font-size="17" fill="#42586a">Free water reference for the external cooling bath. It is not a reaction ingredient or a measured</text><text x="30" y="546" font-size="17" fill="#42586a">hydrogen-bonded bath structure.</text><text x="30" y="659" font-size="14" fill="#607789">Source identity: ACS Nano 2016 · DOI 10.1021/acsnano.5b05329</text></g></svg>