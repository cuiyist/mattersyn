<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 310" role="img" aria-labelledby="title desc">
  <title id="title">PbTe nanocrystal input, symbolic formula card</title>
  <desc id="desc">MatterSyn-authored formula identity card for the externally prepared PbTe nanocrystal input described by Ko and coauthors in 2010. It depicts no particle size, shape, ligands, atom positions, or upstream synthesis.</desc>
  <rect width="540" height="310" rx="24" fill="#f7f9fc"/>
  <rect x="18" y="18" width="504" height="274" rx="20" fill="white" stroke="#d6e0ec" stroke-width="2"/>
  <circle cx="270" cy="112" r="57" fill="#4b748e" opacity=".15"/>
  <text x="270" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="30" fill="#4b748e">PbTe</text>
  <text x="270" y="203" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#1e3549">PbTe nanocrystal input</text>
  <text x="270" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#607286">Externally prepared · formula identity only</text>
</svg>
