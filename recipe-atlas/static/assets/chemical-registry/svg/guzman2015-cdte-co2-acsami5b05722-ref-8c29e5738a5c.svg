<svg xmlns="http://www.w3.org/2000/svg" width="840" height="480" viewBox="0 0 840 480" role="img"><title>poly(2-trimethylammonium) ethyl methacrylate methyl (PMAEMA)</title><desc>Nominal source identity reference; no molecular or crystal coordinates. Exact source polymer name retained. Repeat-unit identity is not repaired; molecular weight and concentration basis are unreported.</desc><rect width="840" height="480" fill="#f5f9fa"/><rect x="14" y="14" width="812" height="452" rx="14" fill="white" stroke="#d3dfe5"/><text x="34.00" y="42.00" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#607785">SOURCE IDENTITY REFERENCE</text><text x="34.00" y="78.00" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#193648">poly(2-trimethylammonium) ethyl methacrylate methyl</text><text x="34.00" y="108.00" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#193648">(PMAEMA)</text><text x="34.00" y="158.00" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#193648">Formula not reported / composition unassigned</text><text x="34.00" y="201.00" font-family="Arial,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#193648">Exact source polymer name retained. Repeat-unit identity is not repaired; molecular</text><text x="34.00" y="225.00" font-family="Arial,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#193648">weight and concentration basis are unreported.</text><text x="34.00" y="452.00" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#607785">Reference only - no measured 3D, solution, surface or crystal geometry</text></svg>