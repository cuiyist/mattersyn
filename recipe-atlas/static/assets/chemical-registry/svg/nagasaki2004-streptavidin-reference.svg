<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470"><title>Unlabeled streptavidin</title><desc>Unlabeled streptavidin competition control, distinct from the TexasRed conjugate and from avidin. No protein coordinates are supplied.</desc><rect width="960" height="470" rx="20" fill="#fff"/><rect x="1" y="1" width="958" height="468" rx="20" fill="none" stroke="#d5e0e5"/><text x="28" y="41" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#193749" text-anchor="start">Unlabeled streptavidin</text><text x="28" y="73" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#617784" text-anchor="start">Symbolic source identity · no atomistic coordinates</text><rect x="88" y="134" width="385" height="159" rx="25" fill="#e2eef6" stroke="#82a6bf"/><text x="280" y="225" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#3e6683" text-anchor="middle">Streptavidin</text><text x="525" y="217" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#526976" text-anchor="start">Unlabeled control</text><text x="89" y="332" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#637482" text-anchor="start">Symbolic identity; protein fold, binding-site geometry and dye loading are not assigned.</text><path d="M28 370H932" stroke="#e1e8ec"/><text x="28" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536575" text-anchor="start">No PDB structure, protein conformation or conjugate coordinates are supplied. Diagram shapes do not</text><text x="28" y="423" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536575" text-anchor="start">represent molecular envelopes.</text></svg>