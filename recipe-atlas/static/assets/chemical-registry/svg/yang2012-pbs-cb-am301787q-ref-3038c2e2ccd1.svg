<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="506" viewBox="0 0 1000 506"><rect width="1000" height="506" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="26" font-weight="bold" fill="#173047">Pb(Ac)2, lead acetate</text><text x="28" y="90" font-size="17" font-weight="normal" fill="#596b7d">Canonical-bound reference • geometry unassigned</text><rect x="28" y="126" width="944" height="48" rx="8" fill="#e6f1fa"/><text x="44" y="157" font-size="20" font-weight="normal" fill="#173047">Identity / component context — no exact structural model</text><text x="28" y="198" font-size="20" font-weight="normal" fill="#173047">Role: lead precursor in separate ethylenediamine solution</text><text x="28" y="237" font-size="20" font-weight="normal" fill="#173047">Source formula: Pb(Ac)2</text><text x="28" y="276" font-size="20" font-weight="normal" fill="#173047">amount: not reported</text><text x="28" y="315" font-size="20" font-weight="normal" fill="#173047">Hydration and absolute solute amount are unreported. The 0.06 M concentration belongs to the separate</text><text x="28" y="342" font-size="20" font-weight="normal" fill="#173047">stock, not the final mixed reaction.</text><text x="28" y="381" font-size="20" font-weight="normal" fill="#173047">Source lead-acetate identity with unspecified hydration and coordination; no exact molecule or hydrate</text><text x="28" y="408" font-size="20" font-weight="normal" fill="#173047">graph assigned.</text><text x="28" y="457" font-size="15" font-weight="normal" fill="#596b7d">Yang et al. (2012) • Main PDF p.2 / printed p.6163, Experimental, Preparation of PbS/CB Composite Counter Electrode</text></g></svg>