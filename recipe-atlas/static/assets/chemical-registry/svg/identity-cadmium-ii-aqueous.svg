<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>Cadmium(II) ions in water</title><desc>Source names aqueous Cd²⁺, not a specific salt. The displayed ion identity does not establish coordination number, counterion, hydrate or solution complex.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><text x="450" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#294451">Cd²⁺ (aq)</text><text x="450" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#294451">Aqueous cadmium source</text><text x="450" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#294451">Counterion / hydration unspecified</text></svg>