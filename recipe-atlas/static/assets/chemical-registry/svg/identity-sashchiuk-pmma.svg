<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>Poly(methyl methacrylate) resist</title><desc>Named PMMA resist used in device fabrication. Molecular weight, tacticity, solvent and film thickness are not reported; no unique molecule or chain conformer is claimed.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><text x="450" y="115" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#294451">PMMA lithography resist</text><text x="450" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#294451">Spin coating followed by annealing</text><text x="450" y="257" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#294451">Molecular weight and formulation unknown</text></svg>