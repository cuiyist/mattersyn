<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700"><title>Nanosized zinc oxide</title><desc>Inframat Advanced Materials ~30 nm; I15/I16 feed, distinct from reaction-generated ZnO. Symbolic material identity only; no molecular, crystal, solution or product geometry is assigned.</desc><rect x="1" y="1" width="1098" height="698" rx="20" fill="white" stroke="#cbdde5"/><text x="36" y="48" font-family="Arial,sans-serif" font-size="25" text-anchor="start" fill="#294558">Nanosized zinc oxide</text><path d="M36 75H1064" stroke="#d5e3e8"/><text x="550" y="115" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#294558">ZnO</text><rect x="60" y="155" width="980" height="330" rx="18" fill="#f1f7fa" stroke="#b9d0db"/><text x="550" y="245" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#294558">Purchased nanosized ZnO</text><text x="550" y="323" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#294558">Approximately 30 nm starting powder</text><text x="550" y="401" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#294558">Distinct from reaction-generated ZnO</text><rect x="30" y="520" width="1040" height="148" rx="10" fill="#eef5f8"/><text x="50" y="550" font-family="Arial,sans-serif" font-size="17" text-anchor="start" fill="#294558">Inframat Advanced Materials ~30 nm; I15/I16 feed, distinct from reaction-generated ZnO.</text><text x="50" y="628" font-family="Arial,sans-serif" font-size="16" text-anchor="start" fill="#294558">Reference identity only. No exact solution species or source atomic structure is reconstructed.</text></svg>