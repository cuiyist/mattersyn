<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360" role="img"><title>Holey-carbon film</title><desc>A carbon support film is named. The elemental symbol is not a molecular carbon species, graphite lattice or atomic reconstruction of the film.</desc><rect x="22" y="36" width="796" height="288" rx="18" fill="#f1f6fa" stroke="#ccdae5"/><text x="420" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" fill="#18384d">C</text><text x="420" y="219" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#476276">Support material · no molecular model</text></svg>