<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470"><title>Glass slide: XRD support</title><desc>Generic glass slides support the separately freeze-dried XRD specimens. Glass composition, brand and cleaning procedure are not specified.</desc><rect width="960" height="470" rx="20" fill="#fff"/><rect x="1" y="1" width="958" height="468" rx="20" fill="none" stroke="#d5e0e5"/><text x="28" y="41" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#193749" text-anchor="start">Glass slide: XRD support</text><text x="28" y="73" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#617784" text-anchor="start">Symbolic source identity · no atomistic coordinates</text><path d="M142 273L282 137L764 153L624 289Z" fill="#e4f1f3" stroke="#7ca1aa" stroke-width="3"/><path d="M142 273V287L624 305L764 170V153M624 289V305" fill="none" stroke="#7ca1aa" stroke-width="2"/><text x="458" y="217" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#527d86" text-anchor="middle">Glass support</text><path d="M28 370H932" stroke="#e1e8ec"/><text x="28" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536575" text-anchor="start">Generic glass slide for freeze-dried XRD specimens. Composition, brand and cleaning procedure are not</text><text x="28" y="423" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536575" text-anchor="start">specified.</text></svg>