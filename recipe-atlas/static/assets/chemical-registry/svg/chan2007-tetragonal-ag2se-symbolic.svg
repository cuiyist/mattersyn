<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Tetragonal silver selenide symbolic phase card</title>
  <desc id="desc">An authored, non-atomistic label for the tetragonal Ag2Se product phase reported by powder X-ray diffraction in Supporting Information Figure S2 of Chan et al. 2007. It does not depict atomic coordinates or particle morphology.</desc>
  <style>
    text{font-family:Segoe UI,Arial,sans-serif;fill:#173b4a}
    .eyebrow{font-size:23px;font-weight:700;letter-spacing:2px;fill:#567782}
    .formula{font-size:138px;font-weight:700;letter-spacing:-5px}
    .name{font-size:35px;font-weight:650}
    .note{font-size:25px;fill:#4c6871}
    .small{font-size:21px;fill:#60767c}
  </style>
  <rect width="800" height="800" fill="#f8fbfb"/>
  <rect x="32" y="32" width="736" height="736" rx="34" fill="#fff" stroke="#d0e0e3" stroke-width="3"/>
  <rect x="70" y="72" width="660" height="12" rx="6" fill="#d4af60"/>
  <text x="82" y="145" class="eyebrow">PRODUCT PHASE · SI FIGURE S2</text>
  <text x="82" y="300" class="formula">Ag₂Se</text>
  <text x="82" y="366" class="name">Tetragonal silver selenide</text>
  <rect x="82" y="407" width="410" height="58" rx="29" fill="#f8f2df" stroke="#d9c58b" stroke-width="2"/>
  <text x="107" y="445" class="note">Powder XRD phase label</text>
  <path d="M82 505 H718" stroke="#dce7e9" stroke-width="2"/>
  <text x="82" y="565" class="note">Chip-reacted sample: 2.8 mM CdSe,</text>
  <text x="82" y="607" class="note">5 mM AgClO₄. Separate from main XAS.</text>
  <text x="82" y="667" class="small">Symbolic only · no atomic model or particle image</text>
  <text x="82" y="712" class="small">Authored for Chan et al. · DOI 10.1021/jp073474u</text>
</svg>
