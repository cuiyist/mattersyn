<title>4-Hydroxythiophenol</title><desc>Fresh reduced-pressure distillation; free precursor is chemically distinct from the sulfur-bound thiolate cap. Reported 4.93 g, 39 mmol. Conventional free-molecule connectivity and a locally computed illustrative conformer only; not a measured solution geometry, surface state or specimen crystal. This free thiol is distinct from the sulfur-bound, deprotonated surface cap; its S–H bond must not be assigned to the nanocluster surface.</desc>
