<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680"><rect width="1000" height="680" rx="22" fill="#f7faff"/><g font-family="Arial,sans-serif"><text x="40" y="49" font-size="28" font-weight="700" fill="#16354a">Surface bromide identity</text><text x="40" y="88" font-size="21" fill="#416b7a">Br- · material or ionic identity</text><text x="500" y="242" text-anchor="middle" font-size="52" font-weight="700" fill="#244b64">Br−</text><text x="500" y="306" text-anchor="middle" font-size="22" fill="#536b7b">Identity / composition only · no atomic arrangement assigned</text><line x1="40" x2="960" y1="426" y2="426" stroke="#c8d8e4"/><text x="40" y="459" font-size="17" fill="#465b70">Monatomic Br- surface-termination identity described by the article. This is distinct from the</text><text x="40" y="483" font-size="17" fill="#465b70">CTAB exchange reagent. No adsorption position, coverage, ion-pair arrangement or coordination</text><text x="40" y="507" font-size="17" fill="#465b70">geometry is assigned.</text><text x="40" y="649" font-size="15" fill="#607488">Chemical reference · no measured molecular or surface geometry</text></g></svg>