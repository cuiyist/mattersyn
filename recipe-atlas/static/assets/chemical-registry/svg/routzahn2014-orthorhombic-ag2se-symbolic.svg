<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Routzahn 2014 orthorhombic silver selenide symbolic phase card</title>
  <desc id="desc">Authored, non-atomistic label for orthorhombic Ag2Se reported by powder X-ray diffraction at the final 107 percent point of an ensemble CdSe/CdS cuvette titration. It does not depict atomic coordinates, particle morphology, or direct phase measurement of the imaged single dots.</desc>
  <style>
    text{font-family:Segoe UI,Arial,sans-serif;fill:#173b4a}
    .eyebrow{font-size:21px;font-weight:700;letter-spacing:2px;fill:#567782}
    .formula{font-size:138px;font-weight:700;letter-spacing:-5px}
    .name{font-size:35px;font-weight:650}.note{font-size:25px;fill:#4c6871}
    .small{font-size:21px;fill:#60767c}
  </style>
  <rect width="800" height="800" fill="#f8fbfb"/>
  <rect x="32" y="32" width="736" height="736" rx="34" fill="#fff" stroke="#d0e0e3" stroke-width="3"/>
  <rect x="70" y="72" width="660" height="12" rx="6" fill="#d4af60"/>
  <text x="82" y="145" class="eyebrow">PRODUCT PHASE · MAIN FIGURE 1</text>
  <text x="82" y="300" class="formula">Ag₂Se</text>
  <text x="82" y="366" class="name">Orthorhombic silver selenide</text>
  <rect x="82" y="407" width="415" height="58" rx="29" fill="#f8f2df" stroke="#d9c58b" stroke-width="2"/>
  <text x="107" y="445" class="note">Ensemble powder XRD</text>
  <path d="M82 505 H718" stroke="#dce7e9" stroke-width="2"/>
  <text x="82" y="565" class="note">Final 107% titration point;</text>
  <text x="82" y="607" class="note">co-reported with monoclinic Ag₂S.</text>
  <text x="82" y="666" class="small">No atom coordinates or particle morphology</text>
  <text x="82" y="711" class="small">Not direct XRD of the imaged single dots</text>
</svg>
