<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780"><rect x="1" y="1" width="1098" height="778" rx="18" fill="white" stroke="#c4d7df"/><text x="36" y="50" font-family="Arial,sans-serif" font-size="26" text-anchor="start" fill="#294658">Delta formamidinium lead iodide</text><text x="550" y="105" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#294658">δ-FAPbI3</text><rect x="55" y="160" width="990" height="345" rx="20" fill="#eef6f8" stroke="#c4d7df"/><text x="550" y="245" font-family="Arial,sans-serif" font-size="28" text-anchor="middle" fill="#294658">δ-FAPbI3</text><text x="550" y="325" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#294658">Source-assigned competing phase</text><text x="550" y="405" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#294658">Context-specific identity; no atomic model</text><rect x="28" y="548" width="1044" height="205" rx="12" fill="#edf5f8"/><text x="48" y="580" font-family="Arial,sans-serif" font-size="17" text-anchor="start" fill="#294658">The source identifies δ-FAPbI3 as a competing component at 25 °C growth. This is not every product or a</text><text x="48" y="604" font-family="Arial,sans-serif" font-size="17" text-anchor="start" fill="#294658">complete specimen composition.</text><text x="48" y="628" font-family="Arial,sans-serif" font-size="17" text-anchor="start" fill="#294658"></text><text x="48" y="652" font-family="Arial,sans-serif" font-size="17" text-anchor="start" fill="#294658">Symbolic source identity only; no atomic coordinates, discrete complex, lattice or product binding is</text><text x="48" y="676" font-family="Arial,sans-serif" font-size="17" text-anchor="start" fill="#294658">assigned.</text></svg>