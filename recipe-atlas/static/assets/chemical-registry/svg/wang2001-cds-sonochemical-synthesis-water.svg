<svg xmlns="http://www.w3.org/2000/svg" width="800" height="370" viewBox="0 0 800 370"><title>Doubly distilled water</title><desc>The stated synthesis solvent volume is separate from unquantified distilled wash water. Reference identity; no measured geometry.</desc><rect width="800" height="370" rx="20" fill="#f1f7fa"/><g font-family="Arial"><text x="30" y="42" font-size="17" fill="#306374">WANG ET AL. 2001 · SOURCE-QUALIFIED IDENTITY</text><text x="30" y="94" font-size="25" fill="#183d49">Doubly distilled water</text><text x="30" y="214" font-size="34" fill="#087d8b">H2O</text><text x="30" y="289" font-size="18" fill="#42616d">Identity reference; source-specific speciation unmeasured.</text><text x="30" y="325" font-size="18" fill="#42616d">Apparatus and chemical presentation remain qualified.</text></g></svg>