<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500"><rect width="960" height="500" rx="16" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="30" y="35" font-size="14" letter-spacing="1.2" fill="#527589">CHEMICAL REFERENCE · MAZUMDAR 2015</text><text x="30" y="70" font-size="22" fill="#203b50">Sandwich-cell sodium polysulfide; 1 M Na2S and 1 M sulfur; solvent</text><text x="30" y="99" font-size="22" fill="#203b50">unspecified</text><text x="480" y="205" text-anchor="middle" font-size="34" fill="#244658">1 M Na2S + 1 M sulfur</text><text x="480" y="251" text-anchor="middle" font-size="22" fill="#526477">Solvent not reported</text><text x="480" y="306" text-anchor="middle" font-size="17" fill="#65738a">MATERIAL IDENTITY · NO ATOMISTIC MODEL</text><line x1="30" y1="370" x2="930" y2="370" stroke="#cddbe4"/><text x="30" y="402" font-size="17" fill="#526477">Sandwich-cell electrolyte specified as 1 M Na2S and 1 M sulfur. Solvent is not reported. Sulfur</text><text x="30" y="426" font-size="17" fill="#526477">species distribution and ion association are unspecified; no atomistic model.</text></g></svg>