<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img"><title>Proposed tin hydroxide intermediate</title><desc>Sn(OH)4 is the authors’ proposed solution intermediate, not an isolated reagent or measured speciation. Formula display does not assign coordination geometry.</desc><rect width="900" height="440" rx="15" fill="#fff"/><text x="30" y="39" text-anchor="start" font-family="Arial,sans-serif" font-size="24" fill="#294f61">Proposed tin hydroxide intermediate</text><path d="M30 60H870" stroke="#d6e5eb"/><text x="450" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#294f61">Sn(OH)₄</text><text x="450" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="66" fill="#294f61">Sn(OH)₄</text><text x="450" y="279" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#294f61">Author-proposed intermediate</text><text x="450" y="322" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#294f61">Formula only · species and coordination unresolved</text><rect x="26" y="378" width="848" height="43" rx="9" fill="#edf5f7"/><text x="450" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#294f61">Proposed mechanism context · not an isolated or measured molecular structure</text></svg>