<svg xmlns="http://www.w3.org/2000/svg" width="840" height="440" viewBox="0 0 840 440" role="img" aria-labelledby="identity-title identity-description"><title id="identity-title">Zinc diethyldithiocarbamate</title><desc id="identity-description">Source-named Zinc diethyldithiocarbamate. Quantities and uses belong to the selected source record. No measured coordinates, solution speciation, coordination shell or particle geometry are assigned.</desc><rect x="1" y="1" width="838" height="438" rx="20" fill="#f5fafb" stroke="#b8d2df" /><text x="34" y="47" font-family="Arial, sans-serif" font-size="16" fill="#477487">SOURCE CHEMICAL IDENTITY</text><text x="34" y="105" font-family="Arial, sans-serif" font-size="27" fill="#17465b">Zinc diethyldithiocarbamate</text><text x="34" y="236" font-family="Arial, sans-serif" font-size="21" fill="#17465b">Formula: C10H20N2S4Zn</text><text x="34" y="293" font-family="Arial, sans-serif" font-size="19" fill="#27414d">Reference geometry is not assigned.</text><text x="34" y="325" font-family="Arial, sans-serif" font-size="16" fill="#477487">Identity and composition do not establish a molecular or particle geometry.</text></svg>
