<svg xmlns="http://www.w3.org/2000/svg" width="840" height="558" viewBox="0 0 840 558" role="img"><title>acetone</title><desc>Conventional 2D connectivity reference; not measured coordinates. Conventional free-molecule 2D reference only. It does not assign solution speciation, surface binding, source purity or measured coordinates.</desc><rect width="840" height="558" fill="#f5f9fa"/><rect x="14" y="14" width="812" height="530" rx="14" fill="white" stroke="#d3dfe5"/><text x="34.00" y="40.00" font-family="Arial,sans-serif" font-size="15" fill="#647b87" font-weight="bold">2D CONNECTIVITY REFERENCE</text><text x="34.00" y="77.00" font-family="Arial,sans-serif" font-size="23" fill="#183a4b" font-weight="bold">acetone</text><line x1="422.40" y1="122.00" x2="422.40" y2="268.67" stroke="#294a59" stroke-width="2.3"/><line x1="417.60" y1="122.00" x2="417.60" y2="268.67" stroke="#294a59" stroke-width="2.3"/><line x1="420.00" y1="268.67" x2="292.98" y2="342.00" stroke="#294a59" stroke-width="2.3"/><line x1="420.00" y1="268.67" x2="547.02" y2="342.00" stroke="#294a59" stroke-width="2.3"/><rect x="402.00" y="108.00" width="36" height="29" rx="6" fill="white"/><text x="410.00" y="129.00" font-family="Arial,sans-serif" font-size="22" fill="#b32635" font-weight="bold">O</text><rect x="402.00" y="254.67" width="36" height="29" rx="6" fill="white"/><text x="410.00" y="275.67" font-family="Arial,sans-serif" font-size="22" fill="#234252" font-weight="bold">C</text><rect x="274.98" y="328.00" width="45" height="29" rx="6" fill="white"/><text x="282.98" y="349.00" font-family="Arial,sans-serif" font-size="22" fill="#234252" font-weight="bold">CH3</text><rect x="529.02" y="328.00" width="45" height="29" rx="6" fill="white"/><text x="537.02" y="349.00" font-family="Arial,sans-serif" font-size="22" fill="#234252" font-weight="bold">CH3</text><text x="34.00" y="377.00" font-family="Arial,sans-serif" font-size="21" fill="#234252" font-weight="normal">Reference formula: C3H6O</text><text x="34.00" y="406.00" font-family="Arial,sans-serif" font-size="17" fill="#234252" font-weight="normal">Source formula remains unreported.</text><text x="34.00" y="442.00" font-family="Arial,sans-serif" font-size="17" fill="#234252" font-weight="normal">Conventional free-molecule 2D reference only. It does not assign solution speciation,</text><text x="34.00" y="467.00" font-family="Arial,sans-serif" font-size="17" fill="#234252" font-weight="normal">surface binding, source purity or measured coordinates.</text><text x="34.00" y="530.00" font-family="Arial,sans-serif" font-size="16" fill="#647b87" font-weight="normal">Reference only - no measured 3D, crystal or surface geometry</text></svg>