<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" role="img"><title>Isolated intermediate · source 3</title><desc>Composition diagram; no measured atomic coordinates.</desc><rect width="840" height="480" fill="#f6fafc"/><g font-family="Arial, sans-serif"><text x="34" y="47" font-size="28" font-weight="600" fill="#223c51" text-anchor="start">Isolated intermediate · source 3</text><text x="52" y="135" font-size="42" font-weight="600" fill="#223c51" text-anchor="start">FePt/CdS</text><text x="52" y="196" font-size="25" font-weight="400" fill="#223c51" text-anchor="start">FePt after cadmium-precursor addition</text><text x="52" y="242" font-size="22" font-weight="400" fill="#223c51" text-anchor="start">An amorphous CdS-covered intermediate is proposed.</text><text x="52" y="303" font-size="22" font-weight="600" fill="#223c51" text-anchor="start">An intact shell was not successfully isolated.</text><text x="52" y="351" font-size="20" font-weight="400" fill="#567084" text-anchor="start">The isolated microscopy specimen does not establish shell geometry.</text><text x="34" y="451" font-size="17" font-weight="400" fill="#567084" text-anchor="start">Composition diagram; no measured atomic coordinates.</text></g></svg>