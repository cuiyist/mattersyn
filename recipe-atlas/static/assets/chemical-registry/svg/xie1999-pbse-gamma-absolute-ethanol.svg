<svg xmlns="http://www.w3.org/2000/svg" width="800" height="370" viewBox="0 0 800 370"><title>Absolute ethanol</title><desc>First specified wash; absolute grade as stated, with no numerical purity or volume. Identity reference only; no measured geometry.</desc><rect width="800" height="370" rx="20" fill="#f1f7fa"/><g font-family="Arial"><text x="30" y="42" font-size="17" fill="#306374">XIE ET AL. 1999 · SOURCE-QUALIFIED IDENTITY</text><text x="30" y="94" font-size="25" fill="#183d49">Absolute ethanol</text><text x="30" y="214" font-size="34" fill="#087d8b">C2H6O</text><text x="30" y="289" font-size="18" fill="#42616d">Reference identity; solution speciation unmeasured.</text><text x="30" y="325" font-size="18" fill="#42616d">Source quantities and mixture limits remain in the protocol.</text></g></svg>