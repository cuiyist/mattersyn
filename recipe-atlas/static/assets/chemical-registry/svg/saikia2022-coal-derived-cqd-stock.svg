<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Coal-derived CQD stock, authored symbolic card</title>
  <desc id="desc">Authored, non-measured illustration for the CQD stock used by Saikia et al. 2022. The main article PDF page 3, printed page 311, reports a 10.79 milligram per milliliter stock and a 200 microliter route aliquot. Exact atomistic structure and stock speciation are unreported here. DOI 10.1039/d1nj04039a.</desc>
  <metadata>Source: Saikia et al., New Journal of Chemistry 2022, DOI 10.1039/d1nj04039a, main PDF page 3 / printed 311. Source PDF SHA-256 c958d865a99f21c99be395ac2ea8f2940caf9a660c976cd3f52feec95f21e71f. Original MatterSyn symbolic artwork; no measured coordinates, atomistic formula or particle-size scale.</metadata>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5f5f5"/>
      <stop offset="1" stop-color="#d4edf1"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60c4c2"/>
      <stop offset="1" stop-color="#167a91"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="560" fill="#f8fbfc"/>
  <rect x="22" y="22" width="956" height="516" rx="24" fill="#ffffff" stroke="#d7e6e9" stroke-width="2"/>
  <text x="68" y="72" fill="#2f747e" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="700" letter-spacing="2">MATTERSYN · AUTHORED SYMBOL</text>
  <text x="68" y="122" fill="#183b49" font-family="Arial, Segoe UI, sans-serif" font-size="38" font-weight="700">Coal-derived CQD stock</text>
  <text x="69" y="151" fill="#54707a" font-family="Arial, Segoe UI, sans-serif" font-size="18">Saikia et al. 2022 · main article p. 3 (printed 311)</text>

  <rect x="68" y="183" width="440" height="286" rx="22" fill="url(#panel)" stroke="#bddde2" stroke-width="2"/>
  <circle cx="163" cy="271" r="42" fill="url(#dot)" opacity="0.95"/>
  <circle cx="342" cy="255" r="33" fill="url(#dot)" opacity="0.88"/>
  <circle cx="257" cy="354" r="51" fill="url(#dot)" opacity="0.92"/>
  <circle cx="391" cy="374" r="23" fill="url(#dot)" opacity="0.88"/>
  <circle cx="120" cy="396" r="17" fill="url(#dot)" opacity="0.82"/>
  <circle cx="166" cy="266" r="14" fill="#d4f6ed" opacity="0.34"/>
  <circle cx="251" cy="343" r="16" fill="#d4f6ed" opacity="0.30"/>
  <circle cx="338" cy="246" r="11" fill="#d4f6ed" opacity="0.29"/>
  <text x="91" y="446" fill="#336e79" font-family="Arial, Segoe UI, sans-serif" font-size="16">Symbolic dots · no size or geometry scale</text>

  <rect x="539" y="183" width="392" height="286" rx="22" fill="#fbfdfd" stroke="#d7e6e9" stroke-width="2"/>
  <text x="565" y="224" fill="#2a6773" font-family="Arial, Segoe UI, sans-serif" font-size="19" font-weight="700">SOURCE-BOUND STOCK</text>
  <line x1="565" y1="242" x2="905" y2="242" stroke="#cddfe2" stroke-width="2"/>
  <text x="565" y="276" fill="#5b737c" font-family="Arial, Segoe UI, sans-serif" font-size="16">Material</text>
  <text x="565" y="301" fill="#183b49" font-family="Arial, Segoe UI, sans-serif" font-size="21" font-weight="700">Coal-derived CQDs</text>
  <text x="565" y="337" fill="#5b737c" font-family="Arial, Segoe UI, sans-serif" font-size="16">Reported stock concentration</text>
  <text x="565" y="363" fill="#183b49" font-family="Arial, Segoe UI, sans-serif" font-size="21" font-weight="700">10.79 mg mL⁻¹</text>
  <text x="565" y="399" fill="#5b737c" font-family="Arial, Segoe UI, sans-serif" font-size="16">Route aliquot</text>
  <text x="565" y="425" fill="#183b49" font-family="Arial, Segoe UI, sans-serif" font-size="21" font-weight="700">200 µL</text>

  <text x="69" y="505" fill="#526e76" font-family="Arial, Segoe UI, sans-serif" font-size="16">Exact atomistic structure and stock speciation unreported; upstream CQD preparation is cited.</text>
</svg>
