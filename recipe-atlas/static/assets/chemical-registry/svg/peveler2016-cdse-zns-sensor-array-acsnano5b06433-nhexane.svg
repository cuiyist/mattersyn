<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780"><rect width="1000" height="780" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="30" y="30" font-size="14" fill="#56788d">PEVELER 2016 · QUALIFIED CHEMICAL IDENTITY</text><text x="30" y="74" font-size="23" fill="#233f52">n-Hexane</text><text x="32" y="178" font-size="22" fill="#38576b">Reference formula: C6H14</text><line x1="409.95" y1="386.07" x2="590.05" y2="293.93" stroke="#364f60" stroke-width="2.3"/><line x1="409.95" y1="386.07" x2="240.11" y2="276.15" stroke="#364f60" stroke-width="2.3"/><line x1="590.05" y1="293.93" x2="759.89" y2="403.85" stroke="#364f60" stroke-width="2.3"/><line x1="240.11" y1="276.15" x2="60.00" y2="368.28" stroke="#364f60" stroke-width="2.3"/><line x1="759.89" y1="403.85" x2="940.00" y2="311.72" stroke="#364f60" stroke-width="2.3"/><text x="30" y="512" font-size="15" fill="#596d7d">Formal 2D reference; carbon/hydrogen may be implicit. No measured geometry.</text><line x1="30" y1="540" x2="970" y2="540" stroke="#cedae3"/><text x="30" y="574" font-size="17" fill="#42586a">Pure neutral n-hexane reference only for explicitly named n-hexane. Generic hexane occurrences</text><text x="30" y="599" font-size="17" fill="#42586a">remain a separate unresolved identity.</text><text x="30" y="748" font-size="14" fill="#607789">Source identity: ACS Nano 2016 · DOI 10.1021/acsnano.5b06433</text></g></svg>