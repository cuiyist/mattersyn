<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Routzahn 2014 methanolic silver nitrate symbolic reagent card</title>
  <desc id="desc">Authored formula-only card for silver nitrate used as an Ag ion source in methanol. Methanol is a solvent, not a drawn adduct. The card does not imply measured solution speciation, coordination geometry or crystal structure.</desc>
  <style>
    text{font-family:Segoe UI,Arial,sans-serif;fill:#173b4a}
    .eyebrow{font-size:22px;font-weight:700;letter-spacing:2px;fill:#567782}
    .formula{font-size:116px;font-weight:700;letter-spacing:-5px}
    .name{font-size:38px;font-weight:650}.note{font-size:25px;fill:#4c6871}
    .small{font-size:21px;fill:#60767c}
  </style>
  <rect width="800" height="800" fill="#f8fbfb"/>
  <rect x="32" y="32" width="736" height="736" rx="34" fill="#fff" stroke="#d0e0e3" stroke-width="3"/>
  <rect x="70" y="72" width="660" height="12" rx="6" fill="#7da7ca"/>
  <text x="82" y="145" class="eyebrow">REAGENT IDENTITY · ROUTZAHN 2014</text>
  <text x="82" y="270" class="formula">AgNO₃</text>
  <text x="82" y="337" class="name">Silver nitrate</text>
  <rect x="82" y="380" width="344" height="55" rx="27" fill="#eaf3fa" stroke="#a8c6df" stroke-width="2"/>
  <text x="109" y="416" class="note">Methanol solvent</text>
  <path d="M82 486 H718" stroke="#dce7e9" stroke-width="2"/>
  <text x="82" y="548" class="note">Formula and solvent context only.</text>
  <text x="82" y="590" class="note">No Ag⁺ solution complex or crystal</text>
  <text x="82" y="632" class="note">geometry is implied.</text>
  <text x="82" y="712" class="small">Authored symbolic card · main p. 988; SI p. S4</text>
</svg>
