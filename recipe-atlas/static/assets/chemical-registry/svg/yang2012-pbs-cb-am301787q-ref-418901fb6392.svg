<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="533" viewBox="0 0 1000 533"><rect width="1000" height="533" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="26" font-weight="bold" fill="#173047">source-prepared PbS powder</text><text x="28" y="90" font-size="17" font-weight="normal" fill="#596b7d">Canonical-bound reference • geometry unassigned</text><rect x="28" y="126" width="944" height="48" rx="8" fill="#e6f1fa"/><text x="44" y="157" font-size="20" font-weight="normal" fill="#173047">Identity / component context — no exact structural model</text><text x="28" y="198" font-size="20" font-weight="normal" fill="#173047">Role: catalytic solid</text><text x="28" y="237" font-size="20" font-weight="normal" fill="#173047">Source formula: PbS</text><text x="28" y="276" font-size="20" font-weight="normal" fill="#173047">amount: not reported</text><text x="28" y="315" font-size="20" font-weight="normal" fill="#173047">Required local solvothermal preparation is represented separately. Individual PbS charge is not reported;</text><text x="28" y="342" font-size="20" font-weight="normal" fill="#173047">total PbS plus CB is 2.2 g and Sample C ratio is 10:1 by weight. No component mass is presented as</text><text x="28" y="369" font-size="20" font-weight="normal" fill="#173047">reported.</text><text x="28" y="408" font-size="20" font-weight="normal" fill="#173047">Source-prepared PbS powder component. No isolated molecule, particle geometry, crystal cell or atomic</text><text x="28" y="435" font-size="20" font-weight="normal" fill="#173047">coordinates are assigned by this reference card.</text><text x="28" y="484" font-size="15" font-weight="normal" fill="#596b7d">Yang et al. (2012) • Main PDF p.2 / printed p.6163, Experimental, Preparation of PbS/CB Composite Counter Electrode</text></g></svg>