<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="545" viewBox="0 0 1000 545"><rect width="1000" height="545" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="26" font-weight="bold" fill="#173047">low molecular weight heparin (Fraxiparine)</text><text x="28" y="90" font-size="17" font-weight="normal" fill="#596b7d">Canonical-bound reference • geometry unassigned</text><rect x="28" y="126" width="944" height="48" rx="8" fill="#e6f1fa"/><text x="44" y="157" font-size="20" font-weight="normal" fill="#173047">Identity / component context — no exact structural model</text><text x="28" y="198" font-size="20" font-weight="normal" fill="#173047">Role: conjugation substrate</text><text x="28" y="237" font-size="20" font-weight="normal" fill="#173047">Source formula: not reported</text><text x="28" y="276" font-size="20" font-weight="normal" fill="#173047">amount: 0.02 mmol</text><text x="28" y="315" font-size="20" font-weight="normal" fill="#173047">molecular weight: 5000 Da</text><text x="28" y="354" font-size="20" font-weight="normal" fill="#173047">Source describes low molecular weight heparin; no exact sequence, counterion distribution or molecular</text><text x="28" y="381" font-size="20" font-weight="normal" fill="#173047">graph assigned.</text><text x="28" y="420" font-size="20" font-weight="normal" fill="#173047">Qualified macromolecule/intermediate identity; exact sequence, substitution pattern, counterions and</text><text x="28" y="447" font-size="20" font-weight="normal" fill="#173047">batch-specific connectivity are unassigned.</text><text x="28" y="496" font-size="15" font-weight="normal" fill="#596b7d">Khatun et al. (2012) • Main PDF p.2 / printed p.3881, Section 2.2, LHD synthesis</text></g></svg>