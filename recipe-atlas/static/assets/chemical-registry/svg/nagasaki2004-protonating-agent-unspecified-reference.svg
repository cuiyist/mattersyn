<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470"><title>Unreported protonating reagent</title><desc>PAMA protonation is explicit, but reagent identity is not reported. No acid, chemical formula or geometry is assigned.</desc><rect width="960" height="470" rx="20" fill="#fff"/><rect x="1" y="1" width="958" height="468" rx="20" fill="none" stroke="#d5e0e5"/><text x="28" y="41" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#193749" text-anchor="start">Unreported protonating reagent</text><text x="28" y="73" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#617784" text-anchor="start">Explicit missing reagent identity</text><rect x="107" y="133" width="746" height="150" rx="13" fill="#faf1df" stroke="#d5bd85"/><text x="480" y="196" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#876c31" text-anchor="middle">Protonating reagent: not reported</text><text x="480" y="245" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#876c31" text-anchor="middle">PAMA protonation is stated; the acid identity is not.</text><path d="M28 370H932" stroke="#e1e8ec"/><text x="28" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536575" text-anchor="start">No chemical formula or molecular structure can be assigned. In particular, HCl from the zeta-potential</text><text x="28" y="423" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536575" text-anchor="start">assay is not borrowed.</text></svg>