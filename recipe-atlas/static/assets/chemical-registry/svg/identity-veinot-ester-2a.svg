<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360" role="img"><title>CdS surface acetyl ester 2a</title><desc>CdS is the inorganic composition label, not the whole capped-particle formula. The source assigns an O-acylated para-phenolic thiolate cap. Motif and R group are illustrative; conversion is not assumed to be complete, and no atomistic phase, ligand count or measured geometry is assigned.</desc><rect x="20" y="28" width="800" height="304" rx="18" fill="#f3f7fa" stroke="#d1dfe8"/><circle cx="130" cy="172" r="63" fill="#ead391" stroke="#8b7943" stroke-width="2"/><text x="130" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#214458">CdS</text><path d="M193 172H228M259 172H296M296 172L321 129H371L396 172L371 215H321Z" fill="none" stroke="#466b7e" stroke-width="3"/><text x="244" y="181" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#214458">S</text><circle cx="346" cy="172" r="30" fill="none" stroke="#466b7e" stroke-width="2"/><path d="M396 172H432" stroke="#466b7e" stroke-width="3"/><text x="455" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#214458">O</text><path d="M472 172H511M530 159V114M537 159V114M549 172H602" stroke="#466b7e" stroke-width="3"/><text x="533" y="181" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#214458">C</text><text x="534" y="100" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#214458">O</text><text x="630" y="181" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#214458">R</text><text x="644" y="229" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#214458">R = CH₃</text><text x="420" y="299" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#214458">Illustrative connection motif · no lattice or ligand count</text></svg>