<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Chloroform</title><desc id="desc">Ordinary CHCl3 reference only. Cached connectivity and a computed conformer do not establish solution speciation or measured sample geometry.</desc><g font-family="Arial, sans-serif"><rect width="1200" height="640" rx="16" fill="white"/><text x="40" y="52" font-size="27" fill="#163b50">Chloroform</text><text x="40" y="133" font-size="21" fill="#335264">CHCl3 | Reference connectivity</text><line x1="703.923" y1="230.000" x2="600.000" y2="290.000" stroke="#456474" stroke-width="3"/><line x1="496.077" y1="230.000" x2="600.000" y2="290.000" stroke="#456474" stroke-width="3"/><line x1="600.000" y1="410.000" x2="600.000" y2="290.000" stroke="#456474" stroke-width="3"/><rect x="679.923" y="209.000" width="48" height="40" rx="7" fill="white"/><text x="703.923" y="239.000" text-anchor="middle" font-size="26" font-weight="600" fill="#247f50">Cl</text><rect x="472.077" y="209.000" width="48" height="40" rx="7" fill="white"/><text x="496.077" y="239.000" text-anchor="middle" font-size="26" font-weight="600" fill="#247f50">Cl</text><rect x="576.000" y="389.000" width="48" height="40" rx="7" fill="white"/><text x="600.000" y="419.000" text-anchor="middle" font-size="26" font-weight="600" fill="#247f50">Cl</text><rect x="576.000" y="269.000" width="48" height="40" rx="7" fill="white"/><text x="600.000" y="299.000" text-anchor="middle" font-size="26" font-weight="600" fill="#344e60">CH</text><text x="40" y="452" font-size="20" fill="#335264">2D connectivity reference. Drawing positions are arbitrary; hydrogens follow atom labels.</text><text x="40" y="505" font-size="21" fill="#335264">Ordinary CHCl3 reference only. Cached connectivity and a computed conformer do not establish</text><text x="40" y="534" font-size="21" fill="#335264">solution speciation or measured sample geometry.</text></g></svg>
