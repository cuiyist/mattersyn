<svg xmlns="http://www.w3.org/2000/svg" width="840" height="480" viewBox="0 0 840 480" role="img"><title>Iron(III) oleate</title><desc>Nominal source identity; molecular, particle and crystal coordinates remain unassigned. Nominal stoichiometric label only; no coordination or aggregation model. Reported 900.2 mg per 1 mmol retained.</desc><rect width="840" height="480" fill="#f5f9fa"/><rect x="14" y="14" width="812" height="452" rx="14" fill="white" stroke="#d3dfe5"/><text x="34.00" y="42.00" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#607785">SOURCE IDENTITY REFERENCE</text><text x="34.00" y="78.00" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#193648">Iron(III) oleate</text><text x="34.00" y="128.00" font-family="Arial,sans-serif" font-size="25" font-weight="normal" text-anchor="start" fill="#193648">Fe(C18H33O2)3</text><text x="34.00" y="171.00" font-family="Arial,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#193648">Nominal stoichiometric label only; no coordination or aggregation model. Reported 900.2 mg</text><text x="34.00" y="195.00" font-family="Arial,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#193648">per 1 mmol retained.</text><text x="34.00" y="452.00" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#607785">Reference only - no measured 3D, solution, surface or crystal geometry</text></svg>