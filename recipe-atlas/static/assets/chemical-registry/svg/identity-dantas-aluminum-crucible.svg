<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><title>Aluminum crucible, literal source wording</title><desc>The paper literally names an aluminum crucible at 1400 °C. Preserve this questionable vessel description without silently changing it to alumina. Al labels the stated material only, not a verified apparatus specification or reagent.</desc><rect x="10" y="12" width="880" height="396" rx="24" fill="#f5f9fb"/><text x="450" y="64" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#294451">Aluminum crucible, literal source wording</text><text x="450" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#294451">Source wording: aluminum crucible</text><text x="450" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#294451">Reported melting: 1400 °C for 2 h</text><text x="450" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#294451">Vessel identity remains unresolved</text></svg>