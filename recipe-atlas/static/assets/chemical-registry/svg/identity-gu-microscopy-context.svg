<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" role="img"><title>Microscopy and diffraction specimens</title><desc>Composition diagram; no measured atomic coordinates.</desc><rect width="840" height="480" fill="#f6fafc"/><g font-family="Arial, sans-serif"><text x="34" y="47" font-size="28" font-weight="600" fill="#223c51" text-anchor="start">Microscopy and diffraction specimens</text><line x1="35" y1="149" x2="803" y2="149" stroke="#d8e5ed"/><text x="48" y="128" font-size="25" font-weight="600" fill="#223c51" text-anchor="start">1 · FePt</text><text x="280" y="128" font-size="19" font-weight="400" fill="#223c51" text-anchor="start">Precursor and separate FePt comparator contexts</text><line x1="35" y1="226" x2="803" y2="226" stroke="#d8e5ed"/><text x="48" y="205" font-size="25" font-weight="600" fill="#223c51" text-anchor="start">2 · FePt/S</text><text x="280" y="205" font-size="19" font-weight="400" fill="#223c51" text-anchor="start">Isolated intermediate; intact sulfur layer unverified</text><line x1="35" y1="303" x2="803" y2="303" stroke="#d8e5ed"/><text x="48" y="282" font-size="25" font-weight="600" fill="#223c51" text-anchor="start">3 · FePt/CdS</text><text x="280" y="282" font-size="19" font-weight="400" fill="#223c51" text-anchor="start">Isolated intermediate; intact CdS shell unverified</text><line x1="35" y1="380" x2="803" y2="380" stroke="#d8e5ed"/><text x="48" y="359" font-size="25" font-weight="600" fill="#223c51" text-anchor="start">4 · FePt–CdS</text><text x="280" y="359" font-size="19" font-weight="400" fill="#223c51" text-anchor="start">TEM, HRTEM and SAED final-product contexts</text><text x="34" y="451" font-size="17" font-weight="400" fill="#567084" text-anchor="start">Composition diagram; no measured atomic coordinates.</text></g></svg>