<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc"><title id="title">Sodium cyanoborohydride</title><desc id="desc">Formal Na+ and cyanoborohydride anion. The cyano C-N triple bond is retained. Component separation is graphic layout, not an ion-pair geometry.</desc><g font-family="Arial, sans-serif"><rect width="1200" height="550" rx="12" fill="white"/><text x="36" y="47" font-size="27" fill="#173c4a">Sodium cyanoborohydride</text><text x="36" y="88" font-size="20" fill="#466370">CH3BNNa · Formal 2D reference</text><line x1="615.0" y1="255.0" x2="750.0" y2="255.0" stroke="#345565" stroke-width="2.6"/><line x1="750.0" y1="250.0" x2="885.0" y2="250.0" stroke="#345565" stroke-width="2.6"/><line x1="750.0" y1="255.0" x2="885.0" y2="255.0" stroke="#345565" stroke-width="2.6"/><line x1="750.0" y1="260.0" x2="885.0" y2="260.0" stroke="#345565" stroke-width="2.6"/><rect x="286.0" y="236.0" width="58" height="38" rx="4" fill="white"/><text x="315.0" y="263.0" text-anchor="middle" font-size="25" font-weight="600" fill="#173c4a">Na⁺</text><rect x="578.0" y="236.0" width="74" height="38" rx="4" fill="white"/><text x="615.0" y="263.0" text-anchor="middle" font-size="25" font-weight="600" fill="#846259">BH₃⁻</text><rect x="868.0" y="236.0" width="34" height="38" rx="4" fill="white"/><text x="885.0" y="263.0" text-anchor="middle" font-size="25" font-weight="600" fill="#3265ac">N</text><text x="36" y="390" font-size="18" fill="#466370">2D connectivity only; component positions and drawing angles are arbitrary.</text><text x="36" y="415" font-size="17" fill="#466370">Unlabelled corners/ends are carbon atoms; carbon-bound hydrogens are implicit.</text><text x="36" y="451" font-size="18" fill="#466370">Formal Na+ and cyanoborohydride anion. The cyano C-N triple bond is retained. Component separation is graphic</text><text x="36" y="477" font-size="18" fill="#466370">layout, not an ion-pair geometry.</text></g></svg>
