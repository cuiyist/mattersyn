<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><title>Boron oxide powder</title><desc>Formula-unit atom-count illustration for the reported oxide powder. Positions are a graphic layout, not a discrete oxide molecule, measured lattice, polymorph or glass-network geometry. No atomic coordinate download is implied.</desc><rect x="10" y="12" width="880" height="396" rx="24" fill="#f5f9fb"/><text x="450" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#294451">Boron oxide powder</text><text x="450" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#294451">B2O3</text><circle cx="240.0" cy="213" r="34" fill="#a9c6d8" stroke="#63899c"/><text x="240.0" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#294451">B</text><circle cx="345.0" cy="213" r="34" fill="#a9c6d8" stroke="#63899c"/><text x="345.0" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#294451">B</text><circle cx="450.0" cy="213" r="34" fill="#e7b3ac" stroke="#63899c"/><text x="450.0" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#294451">O</text><circle cx="555.0" cy="213" r="34" fill="#e7b3ac" stroke="#63899c"/><text x="555.0" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#294451">O</text><circle cx="660.0" cy="213" r="34" fill="#e7b3ac" stroke="#63899c"/><text x="660.0" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#294451">O</text><text x="450" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#294451">Formula-unit composition · no bonds or lattice assigned</text><text x="450" y="341" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#294451">Powder phase and atomic structure are not reported</text></svg>