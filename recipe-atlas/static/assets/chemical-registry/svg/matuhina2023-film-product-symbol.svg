<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680"><title>Deposited nanocrystal film</title><desc>A generic deposited-film symbol. The binding caption specifies the actual substrate and aging or optical context; no polymer encapsulation is implied.</desc><rect x="1" y="1" width="1098" height="678" rx="20" fill="#fff" stroke="#b9ced8"/><text x="48" y="59" fill="#244756" font-family="Arial,sans-serif" font-size="30" text-anchor="start">Deposited nanocrystal film</text><text x="48" y="107" fill="#244756" font-family="Arial,sans-serif" font-size="22" text-anchor="start">A source-specific substrate specimen</text><text x="550" y="258" fill="#244756" font-family="Arial,sans-serif" font-size="64" text-anchor="middle">CsMnCl3</text><rect x="235" y="345" width="630" height="26" rx="4" fill="#e48dc3"/><rect x="235" y="375" width="630" height="50" rx="5" fill="#dbeaf1" stroke="#789dab"/><text x="550" y="470" fill="#244756" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">Schematic layers; thickness and morphology are not to scale</text><text x="52" y="548" fill="#244756" font-family="Arial,sans-serif" font-size="20" text-anchor="start">A generic deposited-film symbol. The binding caption specifies the actual substrate</text><text x="52" y="578" fill="#244756" font-family="Arial,sans-serif" font-size="20" text-anchor="start">and aging or optical context; no polymer encapsulation is implied.</text></svg>