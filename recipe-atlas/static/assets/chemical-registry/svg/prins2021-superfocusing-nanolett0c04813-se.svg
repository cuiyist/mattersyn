<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc"><title id="title">Selenium powder</title><desc id="desc">Elemental selenium powder identity only. No allotrope, molecular form or measured atomic coordinates are assigned.</desc><g font-family="Arial, sans-serif"><rect width="1200" height="550" rx="12" fill="white"/><text x="36" y="47" font-size="27" fill="#173c4a">Selenium powder</text><text x="36" y="90" font-size="20" fill="#466370">Se · Identity reference</text><rect x="75" y="151" width="1050" height="164" rx="20" fill="#edf5f8" stroke="#c6dce5"/><text x="600" y="248" text-anchor="middle" font-size="44" fill="#234c60">Se</text><text x="36" y="382" font-size="21" fill="#466370">Composition / identity reference only</text><text x="36" y="437" font-size="19" fill="#466370">Elemental selenium powder identity only. No allotrope, molecular form or measured atomic coordinates are</text><text x="36" y="465" font-size="19" fill="#466370">assigned.</text></g></svg>
