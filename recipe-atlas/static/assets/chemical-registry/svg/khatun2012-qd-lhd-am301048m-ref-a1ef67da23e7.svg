<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="506" viewBox="0 0 1000 506"><rect width="1000" height="506" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="26" font-weight="bold" fill="#173047">CdTe quantum dots</text><text x="28" y="90" font-size="17" font-weight="normal" fill="#596b7d">Canonical-bound reference • geometry unassigned</text><rect x="28" y="126" width="944" height="48" rx="8" fill="#e6f1fa"/><text x="44" y="157" font-size="20" font-weight="normal" fill="#173047">Identity / component context — no exact structural model</text><text x="28" y="198" font-size="20" font-weight="normal" fill="#173047">Role: selected core charge for shell growth</text><text x="28" y="237" font-size="20" font-weight="normal" fill="#173047">Source formula: CdTe</text><text x="28" y="276" font-size="20" font-weight="normal" fill="#173047">mass: 0.02 g</text><text x="28" y="315" font-size="20" font-weight="normal" fill="#173047">Locally described core synthesis is included. Exact relation of this weighed charge to sampled aliquots or</text><text x="28" y="342" font-size="20" font-weight="normal" fill="#173047">entire preceding batch is unreported.</text><text x="28" y="381" font-size="20" font-weight="normal" fill="#173047">Particle/formulation reference only. No single-molecule formula for the formulation, atomic model, shell</text><text x="28" y="408" font-size="20" font-weight="normal" fill="#173047">geometry or exact size is inferred.</text><text x="28" y="457" font-size="15" font-weight="normal" fill="#596b7d">Khatun et al. (2012) • Main PDF p.2 / printed p.3881, Section 2.3, near-infrared quantum-dot synthesis</text></g></svg>