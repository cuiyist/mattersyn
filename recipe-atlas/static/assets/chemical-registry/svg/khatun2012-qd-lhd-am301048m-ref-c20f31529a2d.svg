<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440"><rect width="1000" height="440" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="26" font-weight="bold" fill="#173047">cadmium oxide</text><text x="28" y="90" font-size="17" font-weight="normal" fill="#596b7d">Canonical-bound reference • geometry unassigned</text><rect x="28" y="126" width="944" height="48" rx="8" fill="#e6f1fa"/><text x="44" y="157" font-size="20" font-weight="normal" fill="#173047">Identity / component context — no exact structural model</text><text x="28" y="198" font-size="20" font-weight="normal" fill="#173047">Role: cadmium precursor for core</text><text x="28" y="237" font-size="20" font-weight="normal" fill="#173047">Source formula: CdO</text><text x="28" y="276" font-size="20" font-weight="normal" fill="#173047">amount: 0.1 mmol</text><text x="28" y="315" font-size="20" font-weight="normal" fill="#173047">Nominal component/element identity only; no molecular cluster, allotrope, polymorph or dissolved species</text><text x="28" y="342" font-size="20" font-weight="normal" fill="#173047">is assigned.</text><text x="28" y="391" font-size="15" font-weight="normal" fill="#596b7d">Khatun et al. (2012) • Main PDF p.2 / printed p.3881, Section 2.3, near-infrared quantum-dot synthesis</text></g></svg>