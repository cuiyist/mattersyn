<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>Carbon-coated electron-microscopy grid</title><desc>Ultrathin carbon grid for TEM or 400 mesh carbon-coated grid for EELS. A particular metal backing is not reported. Grid properties are not nanocrystal dimensions.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><text x="450" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#254a5c">Carbon-coated grid</text><text x="450" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#254a5c">TEM / EELS specimen support</text><text x="450" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#254a5c">Mesh applies only where reported</text></svg>