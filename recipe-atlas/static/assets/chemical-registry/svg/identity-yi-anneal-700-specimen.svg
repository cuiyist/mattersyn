<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><title>700 °C annealed phosphor</title><desc>Illustrative specimen identity for nominal La2(MoO4)3:Yb,Er. Shapes and dimensions are explanatory, not a TEM reconstruction or refined dopant-site/lattice model. The 800 °C powder is source-assigned tetragonal with an unidentified minor second phase; that phase assignment is not generalized to every specimen. No size is interpolated from annealing temperature.</desc><rect x="10" y="12" width="880" height="396" rx="24" fill="#f5f9fb"/><text x="450" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#294451">700 °C annealed phosphor</text><text x="450" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#294451">La₂(MoO₄)₃:Yb,Er</text><circle cx="120" cy="185" r="25" fill="#aecad4" stroke="#668c9e"/><circle cx="211" cy="186" r="25" fill="#aecad4" stroke="#668c9e"/><circle cx="305" cy="185" r="25" fill="#aecad4" stroke="#668c9e"/><circle cx="156" cy="257" r="25" fill="#aecad4" stroke="#668c9e"/><circle cx="255" cy="262" r="25" fill="#aecad4" stroke="#668c9e"/><text x="625" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#294451">700 °C · 5 h</text><text x="625" y="234" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#294451">Nominal doped host</text><text x="625" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#294451">No source atomic coordinates</text><text x="450" y="358" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#294451">Specimen schematic · independent of measured micrographs</text></svg>