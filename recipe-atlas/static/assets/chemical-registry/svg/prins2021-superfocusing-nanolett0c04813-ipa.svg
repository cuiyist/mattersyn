<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc"><title id="title">2-Propanol</title><desc id="desc">Reference molecule only. No measured geometry, in-situ speciation, reagent impurities or surface binding is assigned.</desc><g font-family="Arial, sans-serif"><rect width="1200" height="550" rx="12" fill="white"/><text x="36" y="47" font-size="27" fill="#173c4a">2-Propanol</text><text x="36" y="90" font-size="20" fill="#466370">C3H8O · Formal 2D reference</text><line x1="600.0" y1="334.375" x2="600.0" y2="221.875" stroke="#345565" stroke-width="2.6"/><line x1="600.0" y1="221.875" x2="502.57215" y2="165.625" stroke="#345565" stroke-width="2.6"/><line x1="600.0" y1="221.875" x2="697.42785" y2="165.625" stroke="#345565" stroke-width="2.6"/><rect x="579.0" y="315.375" width="42" height="38" rx="4" fill="white"/><text x="600.0" y="342.375" text-anchor="middle" font-size="25" font-weight="600" fill="#b73c43">OH</text><text x="36" y="397" font-size="18" fill="#466370">Unlabelled corners and ends are carbon atoms; carbon-bound hydrogens are implicit.</text><text x="36" y="437" font-size="19" fill="#466370">Reference molecule only. No measured geometry, in-situ speciation, reagent impurities or surface binding is</text><text x="36" y="465" font-size="19" fill="#466370">assigned.</text></g></svg>
