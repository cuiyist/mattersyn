<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><title>SG3 · PbS quantum dots in glass</title><desc>Illustrative embedded-particle/glass architecture. Dot positions, relative dimensions and colors are explanatory, not an AFM reconstruction, atomic crystal structure or interpolation of annealing time into size. Optical cohort; separate source sample SG3.</desc><rect x="10" y="12" width="880" height="396" rx="24" fill="#f5f9fb"/><text x="450" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#294451">SG3 · PbS quantum dots in glass</text><rect x="56" y="95" width="300" height="206" rx="13" fill="#d5e4ed" stroke="#6c91a5"/><circle cx="100" cy="134" r="12" fill="#779aa8" stroke="#3c6e80"/><circle cx="192" cy="133" r="15" fill="#779aa8" stroke="#3c6e80"/><circle cx="289" cy="145" r="12" fill="#779aa8" stroke="#3c6e80"/><circle cx="136" cy="217" r="15" fill="#779aa8" stroke="#3c6e80"/><circle cx="239" cy="203" r="12" fill="#779aa8" stroke="#3c6e80"/><circle cx="309" cy="260" r="12" fill="#779aa8" stroke="#3c6e80"/><circle cx="83" cy="270" r="10" fill="#779aa8" stroke="#3c6e80"/><text x="627" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#294451">600 °C · 6 h anneal</text><text x="627" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#294451">Optical cohort</text><text x="627" y="267" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#294451">Glass proportions unreported</text><text x="450" y="359" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#294451">Architecture schematic · no measured atomic coordinates</text></svg>