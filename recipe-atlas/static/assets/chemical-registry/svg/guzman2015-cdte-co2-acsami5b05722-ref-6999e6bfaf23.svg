<svg xmlns="http://www.w3.org/2000/svg" width="840" height="480" viewBox="0 0 840 480" role="img"><title>Milli-Q water</title><desc>Conventional 2D connectivity reference; not measured coordinates. Water connectivity reference only. The source grade belongs to the rinsing occurrence.</desc><rect width="840" height="480" fill="#f5f9fa"/><rect x="14" y="14" width="812" height="452" rx="14" fill="white" stroke="#d3dfe5"/><text x="34.00" y="42.00" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#607785">2D CONNECTIVITY REFERENCE</text><text x="34.00" y="78.00" font-family="Arial,sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#193648">Milli-Q water</text><rect x="397.50" y="179.00" width="45" height="30" rx="4" fill="#ffffff"/><text x="420.00" y="202.00" font-family="Arial,sans-serif" font-size="25" font-weight="bold" text-anchor="middle" fill="#bc3d42">OH2</text><text x="34.00" y="327.00" font-family="Arial,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#193648">Reference formula: H2O</text><text x="34.00" y="359.00" font-family="Arial,sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#193648">Water connectivity reference only. The source grade belongs to the rinsing occurrence.</text><text x="34.00" y="452.00" font-family="Arial,sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#607785">Reference only - no measured 3D, solution, surface or crystal geometry</text></svg>