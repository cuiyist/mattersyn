<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440"><rect width="1000" height="440" fill="#f8fbfd"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="26" font-weight="bold" fill="#173047">formamide</text><text x="28" y="90" font-size="17" font-weight="normal" fill="#596b7d">Canonical-bound reference • geometry unassigned</text><rect x="28" y="126" width="944" height="48" rx="8" fill="#e6f1fa"/><text x="44" y="157" font-size="20" font-weight="normal" fill="#173047">Identity / component context — no exact structural model</text><text x="28" y="198" font-size="20" font-weight="normal" fill="#173047">Role: LHD dissolution solvent</text><text x="28" y="237" font-size="20" font-weight="normal" fill="#173047">Source formula: not reported</text><text x="28" y="276" font-size="20" font-weight="normal" fill="#173047">volume: 2.5 mL</text><text x="28" y="315" font-size="20" font-weight="normal" fill="#173047">Source-named identity only. Connectivity, speciation and measured molecular/crystal geometry are</text><text x="28" y="342" font-size="20" font-weight="normal" fill="#173047">unassigned.</text><text x="28" y="391" font-size="15" font-weight="normal" fill="#596b7d">Khatun et al. (2012) • Main PDF p.3 / printed p.3882, Section 2.4, loading and workup</text></g></svg>