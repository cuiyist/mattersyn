<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><title>Diluted nitric acid</title><desc>HNO3 identifies the reported acid. This formula illustration does not prescribe an undissociated molecule, aqueous ionic proportions, concentration or acid volume. Water is a separately inspectable solvent reference.</desc><rect x="10" y="12" width="880" height="396" rx="24" fill="#f5f9fb"/><text x="450" y="60" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#294451">Diluted nitric acid</text><text x="450" y="106" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#294451">HNO₃ · aqueous, diluted</text><circle cx="266" cy="205" r="31" fill="#b6d1dd" stroke="#6a8c9b"/><text x="266" y="213" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#294451">H</text><circle cx="358" cy="205" r="31" fill="#b6d1dd" stroke="#6a8c9b"/><text x="358" y="213" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#294451">N</text><circle cx="450" cy="205" r="31" fill="#e8b3ac" stroke="#6a8c9b"/><text x="450" y="213" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#294451">O</text><circle cx="542" cy="205" r="31" fill="#e8b3ac" stroke="#6a8c9b"/><text x="542" y="213" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#294451">O</text><circle cx="634" cy="205" r="31" fill="#e8b3ac" stroke="#6a8c9b"/><text x="634" y="213" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#294451">O</text><text x="450" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#294451">Acid concentration and volume not reported</text><text x="450" y="349" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#294451">Formula atom counts · solution species not resolved</text></svg>