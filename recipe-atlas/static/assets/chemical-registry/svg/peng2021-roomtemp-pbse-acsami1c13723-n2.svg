<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Nitrogen</title><desc id="desc">Dinitrogen reference; 3D separation is 1.09768 angstrom from a NIST 14N2 reference, with arbitrary orientation. Current gas isotopic composition is unspecified.</desc><g font-family="Arial, sans-serif"><rect width="1200" height="640" rx="16" fill="white"/><text x="40" y="52" font-size="27" fill="#163b50">Nitrogen</text><text x="40" y="133" font-size="21" fill="#335264">N2 | Reference connectivity</text><line x1="682.500" y1="325.000" x2="517.500" y2="325.000" stroke="#456474" stroke-width="3"/><line x1="682.500" y1="320.000" x2="517.500" y2="320.000" stroke="#456474" stroke-width="3"/><line x1="682.500" y1="315.000" x2="517.500" y2="315.000" stroke="#456474" stroke-width="3"/><rect x="667.500" y="299.000" width="30" height="40" rx="7" fill="white"/><text x="682.500" y="329.000" text-anchor="middle" font-size="26" font-weight="600" fill="#275ba5">N</text><rect x="502.500" y="299.000" width="30" height="40" rx="7" fill="white"/><text x="517.500" y="329.000" text-anchor="middle" font-size="26" font-weight="600" fill="#275ba5">N</text><text x="40" y="452" font-size="20" fill="#335264">2D connectivity reference. Drawing positions are arbitrary; hydrogens follow atom labels.</text><text x="40" y="505" font-size="21" fill="#335264">Dinitrogen reference; 3D separation is 1.09768 angstrom from a NIST 14N2 reference, with arbitrary</text><text x="40" y="534" font-size="21" fill="#335264">orientation. Current gas isotopic composition is unspecified.</text></g></svg>
