<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc"><title id="title">Nitrogen</title><desc id="desc">Dinitrogen reference: formal triple bond; 3D positions use the NIST 14N2 distance of 1.09768 Å with arbitrary orientation. Source isotopic composition is unreported.</desc><g font-family="Arial, sans-serif"><rect width="1200" height="550" rx="12" fill="white"/><text x="36" y="47" font-size="27" fill="#173c4a">Nitrogen</text><text x="36" y="90" font-size="20" fill="#466370">N2 · Formal 2D reference</text><line x1="656.25" y1="255.0" x2="543.75" y2="255.0" stroke="#345565" stroke-width="2.6"/><line x1="656.25" y1="250.0" x2="543.75" y2="250.0" stroke="#345565" stroke-width="2.6"/><line x1="656.25" y1="245.0" x2="543.75" y2="245.0" stroke="#345565" stroke-width="2.6"/><rect x="643.25" y="231.0" width="26" height="38" rx="4" fill="white"/><text x="656.25" y="258.0" text-anchor="middle" font-size="25" font-weight="600" fill="#3265ac">N</text><rect x="530.75" y="231.0" width="26" height="38" rx="4" fill="white"/><text x="543.75" y="258.0" text-anchor="middle" font-size="25" font-weight="600" fill="#3265ac">N</text><text x="36" y="397" font-size="18" fill="#466370">Unlabelled corners and ends are carbon atoms; carbon-bound hydrogens are implicit.</text><text x="36" y="437" font-size="19" fill="#466370">Dinitrogen reference: formal triple bond; 3D positions use the NIST 14N2 distance of 1.09768 Å with</text><text x="36" y="465" font-size="19" fill="#466370">arbitrary orientation. Source isotopic composition is unreported.</text></g></svg>
