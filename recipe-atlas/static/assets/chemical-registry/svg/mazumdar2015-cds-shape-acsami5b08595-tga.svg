 y="278" font-size="17" fill="#526477">Drawing coordinates are arbitrary.</text><text x="490" y="302" font-size="17" fill="#526477">No surface binding or solution</text><text x="490" y="326" font-size="17" fill="#526477">species is inferred.</text><line x1="30" y1="370" x2="930" y2="370" stroke="#cddbe4"/><text x="30" y="405" font-size="17" fill="#526477">Qualified thioglycolic-acid connectivity for source spelling thiolglycolic acid. Arbitrary 2D</text><text x="30" y="429" font-size="17" fill="#526477">coordinates; no 3D or bound-state model.</text></g></svg>