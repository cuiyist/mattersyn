<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470"><title>Potassium naphthalene</title><desc>The literal source name is retained. Exact formula, charge/radical representation and metal–arene geometry are unresolved; no neutral naphthalene substitute is used.</desc><rect width="960" height="470" rx="20" fill="#fff"/><rect x="1" y="1" width="958" height="468" rx="20" fill="none" stroke="#d5e0e5"/><text x="28" y="41" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#193749" text-anchor="start">Potassium naphthalene</text><text x="28" y="73" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#617784" text-anchor="start">Source-name reference · electronic state unresolved</text><rect x="81" y="127" width="797" height="166" rx="13" fill="#f4f7f9" stroke="#b9cbd3"/><text x="480" y="189" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#4d697b" text-anchor="middle">Potassium naphthalene</text><text x="480" y="242" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#627888" text-anchor="middle">Source-named reagent in PDP preparation</text><path d="M28 370H932" stroke="#e1e8ec"/><text x="28" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536575" text-anchor="start">The paper does not specify a formula, electronic-state model or metal–arene structure. A neutral</text><text x="28" y="423" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536575" text-anchor="start">naphthalene model is not substituted.</text></svg>