<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img"><title>Tin dioxide colloidal specimen</title><desc>Nominal tin-dioxide colloid identity. Particle symbols identify the material class, not atom positions, measured radius, shape or the same physical sample across techniques.</desc><rect width="900" height="440" rx="15" fill="#fff"/><text x="30" y="39" text-anchor="start" font-family="Arial,sans-serif" font-size="24" fill="#294f61">Tin dioxide colloidal specimen</text><path d="M30 60H870" stroke="#d6e5eb"/><text x="450" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#294f61">SnO₂</text><circle cx="350" cy="207" r="25" fill="#6f9dad" stroke="#417183" stroke-width="2"/><circle cx="449" cy="186" r="19" fill="#6f9dad" stroke="#417183" stroke-width="2"/><circle cx="534" cy="232" r="23" fill="#6f9dad" stroke="#417183" stroke-width="2"/><circle cx="399" cy="275" r="20" fill="#6f9dad" stroke="#417183" stroke-width="2"/><circle cx="483" cy="286" r="16" fill="#6f9dad" stroke="#417183" stroke-width="2"/><text x="450" y="344" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#294f61">Composition symbols · no size scale or atomic lattice</text><rect x="26" y="378" width="848" height="43" rx="9" fill="#edf5f7"/><text x="450" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#294f61">Separate specimen contexts · original TEM images remain the measured evidence</text></svg>