<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700"><rect x="1" y="1" width="1098" height="698" rx="18" fill="white" stroke="#bfd1dc"/><text x="35" y="50" font-family="Arial, sans-serif" font-size="26" fill="#173445">Acetonitrile:toluene 1:20 washing formulation</text><text x="35" y="95" font-family="Arial, sans-serif" font-size="19" fill="#173445">Ingredient references and source amounts; no dissolved complex is drawn</text><rect x="35" y="130" width="1030" height="94" rx="12" fill="#edf5f8"/><text x="58" y="162" font-family="Arial, sans-serif" font-size="23" fill="#173445">Acetonitrile</text><text x="58" y="198" font-family="Arial, sans-serif" font-size="20" fill="#173445">1 volume part — antisolvent</text><rect x="35" y="242" width="1030" height="94" rx="12" fill="#edf5f8"/><text x="58" y="274" font-family="Arial, sans-serif" font-size="23" fill="#173445">Toluene</text><text x="58" y="310" font-family="Arial, sans-serif" font-size="20" fill="#173445">20 volume parts — solvent</text><text x="35" y="412" font-family="Arial, sans-serif" font-size="18" fill="#173445">One alternative washing formulation, with relative volume parts only. Absolute volume, concentration,</text><text x="35" y="438" font-family="Arial, sans-serif" font-size="18" fill="#173445">premixing, storage and repetition count are unreported. Select the ratio paired with the source</text><text x="35" y="464" font-family="Arial, sans-serif" font-size="18" fill="#173445">condition; do not combine the alternatives.</text><text x="35" y="670" font-family="Arial, sans-serif" font-size="17" fill="#173445">Source: Sasongko et al. 2025, Supporting Information p. S3</text></svg>