<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700"><rect x="1" y="1" width="1098" height="698" rx="18" fill="white" stroke="#bfd1dc"/><text x="35" y="50" font-family="Arial, sans-serif" font-size="26" fill="#173445">Prepared FA-oleate in OA/ODE</text><text x="35" y="95" font-family="Arial, sans-serif" font-size="19" fill="#173445">Ingredient references and source amounts; no dissolved complex is drawn</text><rect x="35" y="130" width="1030" height="94" rx="12" fill="#edf5f8"/><text x="58" y="162" font-family="Arial, sans-serif" font-size="23" fill="#173445">Formamidine acetate salt</text><text x="58" y="198" font-family="Arial, sans-serif" font-size="20" fill="#173445">0.1042 g — precursor</text><rect x="35" y="242" width="1030" height="94" rx="12" fill="#edf5f8"/><text x="58" y="274" font-family="Arial, sans-serif" font-size="23" fill="#173445">Oleic acid</text><text x="58" y="310" font-family="Arial, sans-serif" font-size="20" fill="#173445">0.8 mL — ligand/reaction medium</text><rect x="35" y="354" width="1030" height="94" rx="12" fill="#edf5f8"/><text x="58" y="386" font-family="Arial, sans-serif" font-size="23" fill="#173445">1-Octadecene</text><text x="58" y="422" font-family="Arial, sans-serif" font-size="20" fill="#173445">3.2 mL — solvent</text><text x="35" y="512" font-family="Arial, sans-serif" font-size="18" fill="#173445">Whole precursor formulation; the separate injection uses 0.51 mL. Final volume, concentration, storage</text><text x="35" y="538" font-family="Arial, sans-serif" font-size="18" fill="#173445">and dissolved species are unknown. The three references describe ingredients, not an identified FA-</text><text x="35" y="564" font-family="Arial, sans-serif" font-size="18" fill="#173445">oleate complex.</text><text x="35" y="670" font-family="Arial, sans-serif" font-size="17" fill="#173445">Source: Sasongko et al. 2025, Supporting Information p. S3</text></svg>