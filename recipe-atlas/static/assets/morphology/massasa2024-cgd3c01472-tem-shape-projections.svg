<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-labelledby="t d"><title id="t">Qualified 2D TEM shape projections</title><desc id="d">Flat silhouettes represent source-described cubic-shaped particles at room temperature and plate or rod projections in heated routes. They do not specify 3D faceting, size or crystal coordinates.</desc><rect width="960" height="250" fill="#f8fafc"/><text x="34" y="43" font-family="Arial" font-size="22" font-weight="bold" fill="#17324d">TEM appearance by condition</text><g fill="#718c9d" stroke="#29495d" stroke-width="2"><rect x="105" y="87" width="80" height="80" rx="4"/><rect x="211" y="95" width="70" height="70" rx="4"/><rect x="507" y="103" width="169" height="28" rx="8"/><rect x="697" y="91" width="44" height="65" rx="8"/><rect x="765" y="106" width="121" height="25" rx="8"/></g><g font-family="Arial" font-size="16" fill="#17324d"><text x="86" y="205">RT acetone: cubic-shaped</text><text x="521" y="205">Heated ODE: plate/rod projections</text></g></svg>
