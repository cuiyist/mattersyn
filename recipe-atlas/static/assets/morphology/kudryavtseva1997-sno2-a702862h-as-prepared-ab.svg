<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
  <title id="title">As-prepared SnO2 populations A and B — conceptual morphology</title>
  <desc id="desc">Two separate schematic panels express the reported morphology of as-prepared powders in Kudryavtseva et al., 1997, Figure 2. A is a population of three-dimensional agglomerates; B is a population of thin, two-dimensional platelet agglomerates. Outlines, object counts and relative sizes are illustrative, not measured contours, crystallite shapes or atomic coordinates. The original SEM Figure 2 is separate evidence. No annealed or electrical specimen is represented.</desc>
  <rect width="1080" height="620" rx="22" fill="#f6f9fc"/>
  <g font-family="Arial, sans-serif" fill="#24485c">
    <text x="40" y="46" font-size="27" font-weight="600">As-prepared powders: two distinct morphologies</text>
    <text x="40" y="77" font-size="17">Conceptual depiction from Figure 2 and the accompanying source description</text>
    <rect x="28" y="104" width="498" height="340" rx="16" fill="#edf3f7" stroke="#c7d9e4"/>
    <rect x="554" y="104" width="498" height="340" rx="16" fill="#edf3f7" stroke="#c7d9e4"/>
    <text x="52" y="143" font-size="26" font-weight="700">A</text>
    <text x="92" y="143" font-size="22">Three-dimensional agglomerates</text>
    <text x="578" y="143" font-size="26" font-weight="700">B</text>
    <text x="618" y="143" font-size="22">Thin, two-dimensional platelets</text>
  </g>
  <!-- Independent abstract aggregate bodies; no constituent crystallites. -->
  <g stroke="#42677c" stroke-width="3" stroke-linejoin="round">
    <path d="M75 236 L111 205 L164 219 L203 202 L242 240 L230 283 L192 320 L135 312 L99 282 Z" fill="#8daaba"/>
    <path d="M75 236 L120 247 L164 219 L203 202 L180 252 L230 283 L192 320 L155 274 L99 282 Z" fill="#6f92a7" stroke="none"/>
    <path d="M281 208 L327 182 L377 194 L418 225 L402 260 L350 286 L304 269 L270 238 Z" fill="#aac0cd"/>
    <path d="M270 238 L315 230 L327 182 L339 233 L402 260 L350 286 L304 269 Z" fill="#7d9db1" stroke="none"/>
    <path d="M244 324 L281 289 L325 301 L349 338 L322 380 L279 393 L229 365 Z" fill="#7d9daf"/>
    <path d="M244 324 L278 340 L281 289 L295 339 L349 338 L322 380 L279 393 Z" fill="#66889e" stroke="none"/>
  </g>
  <!-- Thin irregular sheet silhouettes; no lattice, thickness scale or tracing. -->
  <g stroke="#42677c" stroke-width="3" stroke-linejoin="round">
    <path d="M600 259 L677 204 L773 216 L737 258 L755 282 L667 313 L615 292 Z" fill="#c3d8e2"/>
    <path d="M615 292 L667 313 L755 282 L755 289 L667 321 L615 299 Z" fill="#6b92a8"/>
    <path d="M795 218 L842 185 L933 209 L979 250 L910 270 L848 251 Z" fill="#b1ccda"/>
    <path d="M848 251 L910 270 L979 250 L979 257 L910 277 L848 258 Z" fill="#6b92a8"/>
    <path d="M744 334 L810 292 L908 311 L941 342 L872 374 L818 365 L782 384 Z" fill="#c9dce5"/>
    <path d="M782 384 L818 365 L872 374 L941 342 L941 349 L872 381 L818 372 L782 391 Z" fill="#6b92a8"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#24485c" font-size="18">
    <text x="52" y="422">Population A only; not an annealed specimen</text>
    <text x="578" y="422">Population B only; not an annealed specimen</text>
    <text x="40" y="484" font-weight="600">Schematic • not to scale • no measured contours or atomic coordinates</text>
    <text x="40" y="515">Shapes, object counts and relative sizes are illustrative. Individual crystallite shape is not assigned.</text>
    <text x="40" y="548">See the original SEM Figure 2 separately. Physical aliquot identity and cross-method matching are unknown.</text>
    <text x="40" y="589" font-size="16">Kudryavtseva et al. (1997) • DOI 10.1039/a702862h • PDF p. 2 / printed p. 2270</text>
  </g>
</svg>
