<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="478" viewBox="0 0 1280 478" role="img">
<title>Huang 2015 CdSe 9-ACA exchange: source-scoped preparation stages</title>
<desc>Four stage cards summarize source-reported quantities; vessels, liquid levels, and nanocrystal icons are conceptual.</desc>
<rect width="1280" height="478" fill="#f7fbfd"/><text x="28" y="42" font-family="Arial" font-size="27" font-weight="700" fill="#173448">Partial 9-ACA surface exchange on CdSe</text>
<text x="28" y="68" font-family="Arial" font-size="16" fill="#39586b">Huang et al., Chem. Mater. 2015 · main PDF p.2 / printed 7504 · conceptual stage illustration</text>
<g font-family="Arial" font-size="16" fill="#183c50">
<rect x="24" y="92" width="286" height="302" rx="17" fill="#fff" stroke="#b7d4df" stroke-width="2"/>
<text x="44" y="125" font-size="19" font-weight="700">1  Precipitate feed</text><text x="44" y="161">20 nmol ODPA–CdSe NCs</text><text x="44" y="190">+ 3 mL methanol</text>
<path d="M88 230 L88 305 Q130 340 174 305 L174 230" fill="none" stroke="#4c8296" stroke-width="5"/><path d="M95 286 Q131 306 167 286" fill="none" stroke="#9bc5cb" stroke-width="16"/>
<text x="44" y="353">7000 rpm · 5 min</text><text x="44" y="378" font-size="14">Retain the pellet.</text>
<rect x="339" y="92" width="286" height="302" rx="17" fill="#fff" stroke="#b7d4df" stroke-width="2"/>
<text x="359" y="125" font-size="19" font-weight="700">2  Add ligand solution</text><text x="359" y="161">Pellet + 1.1 mL toluene</text><text x="359" y="190">+ 6 mL 9-ACA solution</text><text x="359" y="219">ACN:toluene = 3:11 v/v</text>
<path d="M417 259 L417 322 Q464 345 510 322 L510 259" fill="none" stroke="#4c8296" stroke-width="5"/><circle cx="445" cy="301" r="9" fill="#d0a548"/><circle cx="477" cy="291" r="9" fill="#d0a548"/>
<text x="359" y="353">Source states 0.0216 M</text><text x="359" y="378" font-size="14">Post-dilution concentration unclear.</text>
<rect x="654" y="92" width="286" height="302" rx="17" fill="#fff" stroke="#b7d4df" stroke-width="2"/>
<text x="674" y="125" font-size="19" font-weight="700">3  Exchange and isolate</text><text x="674" y="161">Stir 12 h</text><text x="674" y="190">Acetone: 2× exchange volume</text><text x="674" y="219">7830 rpm · 15 min</text>
<path d="M735 258 L735 322 Q782 346 829 322 L829 258" fill="none" stroke="#4c8296" stroke-width="5"/><circle cx="781" cy="307" r="10" fill="#d0a548"/>
<text x="674" y="353">Retain CdSe/9-ACA pellet.</text><text x="674" y="378" font-size="14">Exchange temperature not stated.</text>
<rect x="969" y="92" width="286" height="302" rx="17" fill="#fff" stroke="#b7d4df" stroke-width="2"/>
<text x="989" y="125" font-size="19" font-weight="700">4  Prepare optical sample</text><text x="989" y="161">Redisperse in hexane</text><text x="989" y="190">+ designated DPA amount</text><text x="989" y="219">Table 1: DPA 1.7 mM</text>
<rect x="1045" y="258" width="116" height="76" rx="7" fill="#ecf7f5" stroke="#4c8296" stroke-width="5"/><circle cx="1084" cy="291" r="9" fill="#d0a548"/><circle cx="1119" cy="291" r="9" fill="#d0a548"/>
<text x="989" y="353">N₂ glovebox · air-free cuvette</text><text x="989" y="378" font-size="14">Assay, not CdSe growth chemistry.</text>
</g>
<path d="M312 240 h24 m-10 -9 l10 9 -10 9 M627 240 h24 m-10 -9 l10 9 -10 9 M942 240 h24 m-10 -9 l10 9 -10 9" stroke="#537f94" stroke-width="3" fill="none"/>
<text x="28" y="431" font-family="Arial" font-size="14" fill="#4d6573">The original CdSe hot-injection core-growth recipe is only cited, not reported here. Most native ODPA reportedly remains after exchange.</text>
<text x="28" y="455" font-family="Arial" font-size="14" fill="#4d6573">Diagram vessels and particle marks are illustrative; no post-exchange TEM shape or atomistic structure is claimed.</text>
</svg>