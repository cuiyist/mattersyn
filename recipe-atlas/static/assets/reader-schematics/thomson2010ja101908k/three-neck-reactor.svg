<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" role="img" aria-labelledby="title desc">
<title id="title">Conceptual three-neck Bi2S3 nanowire synthesis apparatus</title>
<desc id="desc">Illustrative three-neck flask on a heater. A switchable line denotes the source sequence under vacuum then nitrogen; a septum port permits sulfur-in-oleylamine injection. Vessel capacity, fill level, probe, condenser and stirring details are not specified.</desc>
