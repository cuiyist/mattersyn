<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-labelledby="title desc"><title id="title">Hexadecylamine exchange context</title><desc id="desc">Conceptual transfer of hexadecylamine in chloroform into an oleylamine-capped bismuth sulfide nanowire solution in chloroform, followed by overnight stirring. Volumes, exact excess, temperature and stirring rate are unspecified.</desc><rect width="760" height="310" rx="22" fill="#f7fafc"/><text x="380" y="37" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#263746">Post-growth ligand-exchange context</text><text x="380" y="60" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#61747e">Illustrative; not to scale; amounts and ratios are unreported</text><path d="M113 96H248L235 241Q180 267 126 241Z" fill="#edf6fa" stroke="#67899b" stroke-width="4"/><path d="M126 197H235L232 239Q181 258 130 239Z" fill="#a8cfdd" fill-opacity=".72"/><text x="180" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#35586a">Hexadecylamine</text><text x="180" y="284" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#526c78">large excess in CHCl₃</text><path d="M279 172H461" stroke="#607f8f" stroke-width="5"/><path d="M442 156L464 172L442 188" fill="none" stroke="#607f8f" stroke-width="5"/><path d="M512 96H647L634 241Q580 267 526 241Z" fill="#edf6fa" stroke="#67899b" stroke-width="4"/><path d="M526 193H635L632 239Q581 258 530 239Z" fill="#badbcd" fill-opacity=".72"/><text x="580" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#35586a">Bi₂S₃ nanowire solution</text><text x="580" y="284" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#526c78">CHCl₃ · stir overnight</text></svg>