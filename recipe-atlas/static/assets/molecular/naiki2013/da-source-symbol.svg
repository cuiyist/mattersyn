<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" role="img" aria-labelledby="title desc"><title id="title">Dimethylamine solution — authored source symbol</title><desc id="desc">Naiki et al. 2013 DOI 10.1021/jp305408p, main PDF page 2. 50% aqueous dimethylamine solution. 750 / 330 µL in separate stages. Solution composition and pH after addition are not measured. Original symbolic identity; no measured molecular or particle coordinates.</desc><rect width="800" height="280" fill="#f7fafc"/><rect x="18" y="18" width="764" height="244" rx="20" fill="#fff" stroke="#bdd2dc" stroke-width="2"/><rect x="38" y="43" width="110" height="110" rx="18" fill="#e7f1f5" stroke="#507688" stroke-width="2"/><text x="93" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#194453">DA</text><text x="178" y="64" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#507688">MATTERSYN · SOURCE-BOUND SYMBOL</text><text x="178" y="103" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#193448">Dimethylamine solution</text><text x="178" y="137" font-family="Arial,sans-serif" font-size="19" fill="#2f5868">750 / 330 µL in separate stages</text><text x="39" y="200" font-family="Arial,sans-serif" font-size="16" fill="#405f6c">Main article p. 2 · DOI 10.1021/jp305408p</text><text x="39" y="232" font-family="Arial,sans-serif" font-size="15" fill="#5b6f77">Symbolic identity only; see record for limits and stage-specific quantities.</text></svg>