<svg xmlns="http://www.w3.org/2000/svg" width="800" height="270" viewBox="0 0 800 270" role="img" aria-labelledby="title desc"><title id="title">Open air aging — original source symbol</title><desc id="desc">Liu et al. 2008 DOI 10.1021/cg701128b. Ambient air, sulfur reactant unidentified. 3 weeks in SI S2. The source assigns an Ag2S nanotube but does not identify the sulfur-donor molecule. Symbolic identity, no measured molecular geometry.</desc><rect width="800" height="270" fill="#f7fafc"/><rect x="18" y="18" width="764" height="234" rx="18" fill="#fff" stroke="#bdd2dc" stroke-width="2"/><rect x="40" y="42" width="106" height="106" rx="17" fill="#e7f1f5" stroke="#507688" stroke-width="2"/><text x="93" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#194453">AMB</text><text x="176" y="63" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#507688">SOURCE-BOUND SYMBOL</text><text x="176" y="104" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#193448">Open air aging</text><text x="176" y="139" font-family="Arial,sans-serif" font-size="18" fill="#2f5868">3 weeks in SI S2</text><text x="40" y="198" font-family="Arial,sans-serif" font-size="16" fill="#405f6c">DOI 10.1021/cg701128b · main PDF pp. 2, 7; SI S2 where relevant</text><text x="40" y="228" font-family="Arial,sans-serif" font-size="15" fill="#5b6f77">Identity only; source record preserves unknowns and stage-specific quantities.</text></svg>