<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" role="img" aria-labelledby="title desc">
<title id="title">8ScSZ primary particles — qualitative dispersion sketch</title>
<desc id="desc">Original conceptual drawing for only the 0.2 mol/L urea long two-step specimen in Xu et al. Figure 5. Schematic particle symbols form loose groups with open space, expressing weak agglomeration and the reported absence of tight agglomeration. Symbols, number, contours, size spread and spacing are arbitrary. Not a TEM reconstruction, a measured size distribution or atomic coordinates.</desc>
