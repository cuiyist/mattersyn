<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Schematic spherical Cu2-xTe particle population</title>
  <desc id="desc">A qualitative illustration of rounded nanocrystal outlines. The arrangement, color, particle count and scale are illustrative and are not a TEM image.</desc>
  <defs>
    <radialGradient id="particle" cx="32%" cy="26%" r="78%">
      <stop offset="0" stop-color="#f5fbfb"/>
      <stop offset="0.34" stop-color="#9cc7c6"/>
      <stop offset="0.78" stop-color="#548f91"/>
      <stop offset="1" stop-color="#326b70"/>
    </radialGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#dce9ec" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#dce9ec"/>
      <stop offset="1" stop-color="#dce9ec" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="960" height="480" rx="26" fill="#f8fbfc"/>
  <path d="M72 386H888" stroke="url(#line)" stroke-width="2"/>
  <g fill="url(#particle)" stroke="#28656b" stroke-opacity=".28" stroke-width="3" filter="url(#shadow)">
    <circle cx="226" cy="222" r="77"/>
    <circle cx="456" cy="190" r="79"/>
    <circle cx="686" cy="230" r="76"/>
    <circle cx="344" cy="326" r="60"/>
    <circle cx="588" cy="326" r="62"/>
  </g>
  <g fill="#fff" fill-opacity=".46">
    <ellipse cx="203" cy="193" rx="22" ry="12" transform="rotate(-35 203 193)"/>
    <ellipse cx="433" cy="160" rx="23" ry="12" transform="rotate(-35 433 160)"/>
    <ellipse cx="664" cy="201" rx="21" ry="11" transform="rotate(-35 664 201)"/>
    <ellipse cx="327" cy="304" rx="18" ry="10" transform="rotate(-35 327 304)"/>
    <ellipse cx="570" cy="303" rx="18" ry="10" transform="rotate(-35 570 303)"/>
  </g>
  <text x="480" y="444" text-anchor="middle" fill="#526873" font-family="system-ui,sans-serif" font-size="20" letter-spacing=".4">Schematic morphology · not to scale</text>
</svg>
