<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 248" role="img" aria-label="Rounded projected outlines; qualitative source-figure illustration"><title>Rounded projected outlines</title><desc>Interpretive two-dimensional illustration. Not measured coordinates, a size distribution, facet indexing, or a selected-recipe sample assignment. Colors and counts are schematic.</desc><rect width="360" height="248" rx="18" fill="#f5f9fb"/><text x="180" y="30" text-anchor="middle" fill="#486477" font-family="sans-serif" font-size="12">Rounded projected outlines</text><circle cx="72" cy="91" r="18" fill="#43a5ad" fill-opacity=".22" stroke="#43a5ad" stroke-width="2.5"/><circle cx="151" cy="85" r="20" fill="#43a5ad" fill-opacity=".22" stroke="#43a5ad" stroke-width="2.5"/><circle cx="235" cy="93" r="22" fill="#43a5ad" fill-opacity=".22" stroke="#43a5ad" stroke-width="2.5"/><circle cx="111" cy="155" r="18" fill="#43a5ad" fill-opacity=".22" stroke="#43a5ad" stroke-width="2.5"/><circle cx="206" cy="155" r="20" fill="#43a5ad" fill-opacity=".22" stroke="#43a5ad" stroke-width="2.5"/><circle cx="293" cy="148" r="22" fill="#43a5ad" fill-opacity=".22" stroke="#43a5ad" stroke-width="2.5"/><text x="180" y="234" text-anchor="middle" fill="#486477" font-family="sans-serif" font-size="12">Qualitative illustration · not to scale</text></svg>