<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-labelledby="t d"><title id="t">Illustrative Bi nanocrystal morphology</title><desc id="d">Spherical bismuth nanocrystals at a source-reported approximate twenty nanometer diameter; broad distribution and no atomistic coordinates.</desc><rect x="2" y="2" width="676" height="296" rx="18" fill="#f7fbfd" stroke="#cadde6"/><text x="30" y="50" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#17394e">Bi nanocrystal seeds</text><g fill="#adbed0" stroke="#607b8a" stroke-width="3"><circle cx="142" cy="160" r="51"/><circle cx="267" cy="164" r="45"/><circle cx="380" cy="160" r="53"/></g><text x="470" y="150" font-family="Arial,sans-serif" font-size="22" fill="#1e596e">~20 nm</text><text x="470" y="181" font-family="Arial,sans-serif" font-size="15" fill="#617785">broad distribution</text><text x="30" y="267" font-family="Arial,sans-serif" font-size="14" fill="#637b88">Authored shape guide from TEM description; no measured atomic positions.</text></svg>