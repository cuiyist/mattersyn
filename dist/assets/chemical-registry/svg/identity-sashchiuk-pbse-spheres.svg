<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>Spherical PbSe nanocrystal assemblies</title><desc>The spheres comprise multiple PbSe nanocrystals. Their assembly dimensions, constituent particle sizes and diffraction evidence have separate source scopes. Relative packing and ligand positions are illustrative.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><circle cx="450" cy="97" r="66" fill="#dce9ed" stroke="#739caf"/><rect x="415" y="68" width="20" height="20" fill="#739caf" stroke="#2c5268" transform="rotate(16,425,78)"/><rect x="449" y="54" width="20" height="20" fill="#739caf" stroke="#2c5268" transform="rotate(-24,459,64)"/><rect x="475" y="74" width="20" height="20" fill="#739caf" stroke="#2c5268" transform="rotate(12,485,84)"/><rect x="398" y="99" width="20" height="20" fill="#739caf" stroke="#2c5268" transform="rotate(28,408,109)"/><rect x="433" y="96" width="20" height="20" fill="#739caf" stroke="#2c5268" transform="rotate(-17,443,106)"/><rect x="469" y="108" width="20" height="20" fill="#739caf" stroke="#2c5268" transform="rotate(31,479,118)"/><rect x="427" y="132" width="20" height="20" fill="#739caf" stroke="#2c5268" transform="rotate(9,437,142)"/><rect x="461" y="141" width="20" height="20" fill="#739caf" stroke="#2c5268" transform="rotate(-20,471,151)"/><rect x="489" y="131" width="20" height="20" fill="#739caf" stroke="#2c5268" transform="rotate(6,499,141)"/><text x="450" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#294451">Spherical polycrystalline assemblies</text><text x="450" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#294451">Randomly oriented PbSe building blocks</text><text x="450" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#294451">Assembly size is not crystallite size</text></svg>