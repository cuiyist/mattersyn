<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>Acidified water</title><desc>H2O describes the solvent only, not the complete acidified solution. Water has a separate molecular reference; acid identity, dose and mixed-sol pH remain unknown.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><text x="450" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#294451">Water at pH 1.25</text><text x="450" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#294451">Acid identity unreported</text><text x="450" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#294451">Water formula excludes unknown acid</text></svg>