<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>Unassigned silica/siloxane complexes</title><desc>Source interpretation of small species in the dispersion. No pure-silica stoichiometry, unique oligomer, exact molecular formula or nanocrystal core is inferred.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><text x="450" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#254a5c">Silica / siloxane complexes</text><text x="450" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#254a5c">Unassigned solution byproducts</text><text x="450" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#254a5c">No exact molecular structure supplied</text></svg>