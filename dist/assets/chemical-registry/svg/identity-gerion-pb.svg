<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>Phosphate buffer</title><desc>Both named phosphate salts and water are separate molecular references. Source-specific concentration and pH belong to the current operation.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><text x="450" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#254a5c">K2HPO4 + KH2PO4</text><text x="450" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#254a5c">Aqueous phosphate buffer</text><text x="450" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#254a5c">Component ratio not reported</text></svg>