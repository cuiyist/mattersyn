<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><title>Hydrofluoric acid solution</title><rect x="10" y="12" width="880" height="396" rx="24" fill="#f4f8fa"/><text x="450" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#294451">Hydrofluoric acid solution</text><text x="450" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#294451">HF · aqueous acid identity</text><circle cx="374" cy="206" r="37" fill="#c8dce4" stroke="#698999"/><text x="374" y="217" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#294451">H</text><circle cx="526" cy="206" r="37" fill="#bbd7b1" stroke="#698999"/><text x="526" y="217" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#294451">F</text><text x="450" y="301" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#294451">Reported treatment: 10% HF</text><text x="450" y="353" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#294451">Percentage basis and dose unreported</text><desc>HF identifies the source acid treatment. The H and F symbols encode formula composition only; this is not a claim of undissociated HF, a measured species ratio or hydration structure. The source gives10%, without a percentage basis or delivered volume.</desc></svg>