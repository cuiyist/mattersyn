<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360" role="img"><title>Silver reference-electrode wire</title><desc>Solid silver reference electrode used with silver-containing solutions. This is an electrode component, not the deposited nanocrystal specimen or a refined crystal model.</desc><rect x="20" y="22" width="800" height="316" rx="18" fill="#f1f6f9" stroke="#cbdce6"/><text x="216" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" fill="#254b5e">Ag</text><text x="575" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#254b5e">Electrode component</text><text x="575" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#254b5e">Source identity card</text><text x="575" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#254b5e">No invented molecular or crystal model</text><text x="420" y="297" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#254b5e">Illustrative reference • not measured sample geometry</text></svg>