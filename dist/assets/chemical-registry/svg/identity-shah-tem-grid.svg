<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>Carbon-coated copper TEM grid</title><desc>Microscopy support, distinct from the metal nanocrystal composition. Mesh count is a source acquisition detail, not a particle dimension.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><text x="450" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" fill="#254a5c">Carbon film / Cu grid</text><text x="450" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#254a5c">200 mesh microscopy support</text><text x="450" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#254a5c">Support geometry is illustrative</text></svg>