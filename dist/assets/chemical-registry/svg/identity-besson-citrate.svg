<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>Sodium citrate (form unspecified)</title><desc>The source names sodium citrate without identifying protonation or hydrate. No sodium stoichiometry, unique formula or coordination geometry is imposed.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><text x="450" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#294451">Sodium citrate</text><text x="450" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#294451">Citrate complexing reagent</text><text x="450" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#294451">Protonation / hydration unspecified</text></svg>