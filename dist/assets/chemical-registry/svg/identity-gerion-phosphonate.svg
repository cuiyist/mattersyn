<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>(Trihydroxysilyl)propyl methylphosphonate solution</title><desc>Printed reagent identity retained. Figure 1 depicts a negatively charged phosphonate functionality. No complete stock formula, counterion or molecular geometry is invented.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><text x="450" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#254a5c">Silane–propyl–phosphonate</text><text x="450" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#254a5c">42 wt% in water</text><text x="450" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#254a5c">Counterion / exact stock formula unverified</text></svg>