12" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#294451">Reported pore size: 0.2 µm</text><text x="450" y="364" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#294451">Diagram pores are not drawn to scale</text><desc>A0.2µm PTFE membrane is reported as separation equipment. The illustration is not a measured pore map, polymer-chain model or reaction ingredient. The retained fraction is the nanotube composite; free nanocrystals are removed by toluene washing.</desc></svg>