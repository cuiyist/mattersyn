<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>p-Doped silicon substrate</title><desc>Silicon electrical-device support with unspecified p-type dopant and orientation. This is not a PbSe synthesis precursor or an independently synthesized silicon material.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><text x="450" y="115" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#294451">p-Doped silicon substrate</text><text x="450" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#294451">Device support and back gate</text><text x="450" y="257" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#294451">Dopant identity and concentration unknown</text></svg>