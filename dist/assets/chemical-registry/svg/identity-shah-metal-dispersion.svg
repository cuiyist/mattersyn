<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>Metal nanocrystal dispersion</title><desc>A generic operation input shared by separate elemental-metal specimens. It does not assert an Ag–Ir–Pt alloy, mixed batch or unreported concentration.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><text x="450" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" fill="#254a5c">Ag, Ir OR Pt dispersion</text><text x="450" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#254a5c">Separate source-specific specimens</text><text x="450" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#254a5c">No mixed-metal product implied</text></svg>