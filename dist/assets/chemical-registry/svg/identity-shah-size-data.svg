<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>TEM particle-size observations</title><desc>Sample-specific TEM diameter observations are analytical data; normalized distributions and moments are derived under stated spherical-particle assumptions, not additional synthesis batches.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><text x="450" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" fill="#254a5c">TEM diameter observations</text><text x="450" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#254a5c">Statistical analysis input</text><text x="450" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#254a5c">Not a molecular species</text></svg>