<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>Unspecified ZnS shell precursors</title><desc>The no-CdSe control and room-temperature stock aging use unspecified shell precursors. Cited historical preparations do not supply missing identities in this experiment.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><text x="450" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#254a5c">ZnS shell precursors</text><text x="450" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#254a5c">Control described in Note 28</text><text x="450" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#254a5c">Identities and charges unreported</text></svg>