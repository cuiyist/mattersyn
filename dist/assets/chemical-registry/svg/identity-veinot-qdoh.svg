<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360" role="img"><title>QDOH phenolic CdS nanoclusters</title><desc>CdS is the inorganic composition label only, not a complete cluster formula. The sulfur-bound para-hydroxyphenyl motif is illustrative; no atomic lattice, ligand count, particle shape or coverage is assigned.</desc><rect x="20" y="28" width="800" height="304" rx="18" fill="#f3f7fa" stroke="#d1dfe8"/><circle cx="130" cy="172" r="63" fill="#ead391" stroke="#8b7943" stroke-width="2"/><text x="130" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#214458">CdS</text><path d="M193 172H228M259 172H296M296 172L321 129H371L396 172L371 215H321Z" fill="none" stroke="#466b7e" stroke-width="3"/><text x="244" y="181" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#214458">S</text><circle cx="346" cy="172" r="30" fill="none" stroke="#466b7e" stroke-width="2"/><path d="M396 172H432" stroke="#466b7e" stroke-width="3"/><text x="455" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#214458">OH</text><text x="420" y="299" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#214458">Illustrative connection motif · no lattice or ligand count</text></svg>