<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360" role="img"><title>Hydrogen-terminated silicon (100)</title><desc>H-terminated substrate identity. Hydrogen coverage, oxide residue, surface reconstruction and atom-by-atom coordinates are unreported. Si identifies the substrate; it is not a stoichiometric Si–H molecule.</desc><rect x="20" y="22" width="800" height="316" rx="18" fill="#f1f6f9" stroke="#cbdce6"/><path d="M82 153H367L405 192H120Z" fill="#c4d6df" stroke="#7897a8" stroke-width="2"/><path d="M120 192H405V221H120Z" fill="#a8c0ce" stroke="#7897a8" stroke-width="2"/><path d="M84 149H365L403 188" fill="none" stroke="#518a87" stroke-width="3"/><text x="160" y="136" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#254b5e">H-terminated surface</text><text x="596" y="137" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#254b5e">Si(100) substrate</text><text x="596" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#254b5e">Illustrative surface only</text><text x="596" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#254b5e">No measured atomic coordinates</text><text x="420" y="297" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#254b5e">Illustrative reference • not measured sample geometry</text></svg>