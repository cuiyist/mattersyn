<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>Individual PbSe nanocrystals</title><desc>PbSe composition and rock-salt phase are source assignments. Cubic individual particles are described and imaged; spherical wording also appears in the source. This schematic is not a measured particle geometry or surface-ligand reconstruction.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><rect x="406" y="53" width="88" height="88" rx="5" fill="#739caf" stroke="#2c5268" stroke-width="3"/><path d="M406 53l20-14h88l-20 14M494 53l20-14v88l-20 14" fill="none" stroke="#2c5268" stroke-width="3"/><text x="450" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#294451">Individual PbSe nanocrystals</text><text x="450" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#294451">Rock-salt phase reported</text><text x="450" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#294451">Dimensions remain specimen-specific</text></svg>