<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>Titanium contact component</title><desc>Elemental component of the Ti/Au electrical contacts, not a molecular titanium reagent or PbSe synthesis ingredient. Evaporation thicknesses and detailed layer sequence are unreported.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><text x="450" y="115" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#294451">Ti contact component</text><text x="450" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#294451">Evaporated with Au contact leads</text><text x="450" y="257" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#294451">Layer thickness and sequence unknown</text></svg>