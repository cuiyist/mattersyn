<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>Zinc acetate clarity additive</title><desc>The source writes approximately10mg Zn(OAc)2 for optical-clarity restoration without specifying hydration. The separate main starting salt is dihydrate; that hydration is not silently transferred here.</desc><rect x="18" y="20" width="864" height="320" rx="20" fill="#f1f6f9" stroke="#cbdce6"/><text x="450" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#294451">Zn(OAc)2 · hydration unspecified</text><text x="450" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#294451">Approximately 10 mg</text><text x="450" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#294451">Only for a cloudy suspension</text></svg>