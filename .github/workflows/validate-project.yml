name: MatterSyn source and build checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'
defaults:
  run:
    shell: bash
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build validator
        run: python -m pip install -r requirements-build-lock.txt
      - name: Test the publication boundary
        working-directory: tools/mattersyn-release
        run: python -m unittest discover -s tests -v
      - name: Test publication and preservation helpers
        run: python -m unittest discover -s tools/publication -p 'test_*.py' -v
      - name: Test local package staging without private evidence
        run: python -m unittest discover -s tools/package-importer/tests -v
      - name: Test scoped packages and event metrics
        run: python -m unittest discover -s tools/workflow/tests -v
      - name: Test local extraction and silver admission boundaries
        run: python -m unittest discover -s tools/silver -p 'test_*.py' -v
      - name: Test the local simple-pipeline engineering package
        run: python -B tools/simple-pipeline/check_simple_pipeline.py
      - name: Test preliminary source projection and additive merge
        run: python -m unittest discover -s tools/preliminary -p 'test_*.py' -v
      - name: Test retired preliminary display guard
        run: node --test recipe-atlas/tests/retired-preliminary.test.mjs
      - name: Test browser condition classification
        run: node --test recipe-atlas/tests/protocol-conditions.test.mjs
      - name: Test default unit-cell references
        run: node --test recipe-atlas/tests/crystal-defaults.test.mjs
      - name: Test shared thermal stage illustrations
        run: node --test recipe-atlas/tests/generic-thermal-scenes.test.mjs
      - name: Test reported protocol scenes and screenshot target contract
        run: node --test recipe-atlas/tests/reported-protocol-scenes.test.mjs recipe-atlas/tests/reported-scene-extensions.test.mjs tools/ci/protocol-scenes-check.test.mjs recipe-atlas/tests/reported-scene-drawing.test.mjs
      - name: Test source-scoped apparatus context
        run: node --test recipe-atlas/tests/yu1998-scene-scope.test.mjs
      - name: Test reader specimen and figure isolation
        run: node --test recipe-atlas/tests/reader-revision.test.mjs
      - name: Test per-page Reader data and lazy protocol scripts
        run: node --test recipe-atlas/tests/reader-page-data.test.mjs recipe-atlas/tests/reactor-lines.test.mjs
      - name: Test reviewed source figure access
        run: node --test recipe-atlas/tests/reader-source-figures.test.mjs recipe-atlas/tests/reader-figure-category.test.mjs recipe-atlas/tests/reader-extracted-status.test.mjs
      - name: Test separate silver cards and field masking
        run: node --test recipe-atlas/tests/silver-reader.test.mjs
      - name: Test explicit pending-variant scope notices
        run: node --test recipe-atlas/tests/pending-variants.test.mjs
      - name: Test material-page first view
        run: node --test recipe-atlas/tests/reader-first-view.test.mjs
      - name: Test chemical reference display and release validation
        run: |
          node --test recipe-atlas/tests/chemical-reference-route.test.mjs tools/ci/chemical-reference-check.test.mjs
          python -B -m unittest discover -s recipe-atlas/tests -p "test_chemical_reference_*.py" -v
      - name: Test compact method-family grouping and selector
        run: |
          python -m unittest discover -s recipe-atlas/tests -p 'test_method_famil*.py' -v
          node --test recipe-atlas/tests/method-families.test.mjs tools/ci/method-families-check.test.mjs
      - name: Validate the public source projection
        run: |
          python tools/publication/bind_source_allowlist.py \
            --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/source-allowlist.json"
          python tools/mattersyn-release/export_release.py \
            --source-root "$GITHUB_WORKSPACE" \
            --destination "$RUNNER_TEMP/public-source" \
            --allowlist "$RUNNER_TEMP/source-allowlist.json" \
            --registry publication/asset-rights-registry.json \
            --policy publication/public-release-policy.json \
            --repo mattersyn \
            --manifest-out "$RUNNER_TEMP/source-manifest.json" \
            --report-out "$RUNNER_TEMP/source-boundary.json"
      - name: Bind the build to this clean source commit
        run: |
          python recipe-atlas/scripts/make_runtime_snapshot.py \
            --root "$GITHUB_WORKSPACE" \
            --blueprint publication/build-inputs.json \
            --output "$RUNNER_TEMP/build-snapshot.json"
      - name: Build and test the complete candidate
        run: |
          python recipe-atlas/scripts/build_release.py --candidate \
            --output "$RUNNER_TEMP/candidate" \
            --snapshot "$RUNNER_TEMP/build-snapshot.json" \
            --registry publication/asset-rights-registry.json \
            --artifact-transform tools/publication/source_link_artifacts.py
      - name: Detect protocol display changes for the fixed before/after comparison
        if: matrix.os == 'ubuntu-latest'
        env:
          COMPARISON_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os, subprocess
          base = os.environ['COMPARISON_BASE']
          if not base.strip('0'): base = 'HEAD^'
          paths = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
          methods = any(p in {'recipe-atlas/scripts/method_families.py','recipe-atlas/scripts/method_family_projection.py','recipe-atlas/scripts/build_atlas.py','recipe-atlas/static/method-families.mjs','recipe-atlas/static/reader-app.mjs','recipe-atlas/static/reader.css','recipe-atlas/templates/material-reader.html'} or p.startswith('tools/ci/method-families-') for p in paths)
          changed = methods or any(p in {'recipe-atlas/static/protocol-visuals.mjs', 'recipe-atlas/static/reported-protocol-scenes.mjs', 'recipe-atlas/static/reported-scene-drawing.mjs', 'recipe-atlas/static/reported-scene-extensions.mjs'} or p.startswith('tools/ci/protocol-scenes-') for p in paths)
          print('PROTOCOL_SCENES_COMPARISON_BASE=' + base)
          print('METHOD_FAMILIES_CHANGED=' + str(int(methods)))
          print('PROTOCOL_SCENES_CHANGED=' + str(int(changed)))
          chemical_changed = any(p in {'recipe-atlas/static/chemical-reference-route.mjs', 'recipe-atlas/static/chemical-viewer.mjs', 'recipe-atlas/static/reader-app.mjs', 'recipe-atlas/static/material-app.mjs', 'recipe-atlas/scripts/build_reader_shards.py', 'recipe-atlas/scripts/chemical_reference_quality.py', 'recipe-atlas/scripts/chemical_ambient_reference_pins.json'} or p.startswith(('recipe-atlas/static/assets/chemical-registry/', 'tools/ci/chemical-reference-check')) for p in paths)
          print('CHEMICAL_REFERENCES_CHANGED=' + str(int(chemical_changed)))
          PY
      - name: Capture the eighteen protocol steps before and after the display change
        if: matrix.os == 'ubuntu-latest' && env.PROTOCOL_SCENES_CHANGED == '1'
        run: |
          npm install --silent --no-save --prefix "$RUNNER_TEMP/protocol-pw" playwright@1.48.2
          npx --prefix "$RUNNER_TEMP/protocol-pw" playwright install --with-deps chromium >/dev/null
          export PLAYWRIGHT_DIR="$RUNNER_TEMP/protocol-pw"
          mkdir -p "$RUNNER_TEMP/protocol-serve" "$RUNNER_TEMP/protocol-scenes"
          ln -s "$RUNNER_TEMP/candidate/project/recipe-atlas/dist" "$RUNNER_TEMP/protocol-serve/mattersyn-site"
          python -m http.server 8173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/protocol-serve" >"$RUNNER_TEMP/protocol-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          git show "${PROTOCOL_SCENES_COMPARISON_BASE}:tools/ci/protocol-scenes-targets.json" > "$RUNNER_TEMP/protocol-scenes-before-targets.json"
          node tools/ci/protocol-scenes-check.mjs --base https://cuiyist.github.io/mattersyn-site/ --out "$RUNNER_TEMP/protocol-scenes/before" --phase before --targets "$RUNNER_TEMP/protocol-scenes-before-targets.json"
          node tools/ci/protocol-scenes-check.mjs --base http://127.0.0.1:8173/mattersyn-site/ --out "$RUNNER_TEMP/protocol-scenes/after" --phase after --targets tools/ci/protocol-scenes-targets.json
          if [[ "$METHOD_FAMILIES_CHANGED" == "1" ]]; then
            mkdir -p "$RUNNER_TEMP/method-families"
            git show "${PROTOCOL_SCENES_COMPARISON_BASE}:tools/ci/method-families-targets.json" > "$RUNNER_TEMP/method-families-base-targets.json"
            node --input-type=module -e 'import fs from "node:fs";import {beforeTargetsFromProtocolSnapshot as convert} from "./tools/ci/method-families-check.mjs";fs.writeFileSync(process.argv[3],JSON.stringify(convert(JSON.parse(fs.readFileSync(process.argv[1],"utf8")),JSON.parse(fs.readFileSync(process.argv[2],"utf8"))))+"\n",{flag:"wx"});' "$RUNNER_TEMP/protocol-scenes-before-targets.json" "$RUNNER_TEMP/method-families-base-targets.json" "$RUNNER_TEMP/method-families-before-targets.json"
            node tools/ci/method-families-check.mjs --base https://cuiyist.github.io/mattersyn-site/ --out "$RUNNER_TEMP/method-families/before" --phase before --targets "$RUNNER_TEMP/method-families-before-targets.json"
            node tools/ci/method-families-check.mjs --base http://127.0.0.1:8173/mattersyn-site/ --out "$RUNNER_TEMP/method-families/after" --phase after --targets tools/ci/method-families-targets.json
          fi
      - name: Retain protocol before/after screenshots
        if: always() && matrix.os == 'ubuntu-latest' && env.PROTOCOL_SCENES_CHANGED == '1'
        uses: actions/upload-artifact@v4
        with:
          name: mattersyn-protocol-scenes-${{ github.sha }}
          path: ${{ runner.temp }}/protocol-scenes/
          retention-days: 14
      - name: Retain method-family before/after screenshots
        if: always() && matrix.os == 'ubuntu-latest' && env.METHOD_FAMILIES_CHANGED == '1'
        uses: actions/upload-artifact@v4
        with:
          name: mattersyn-method-families-${{ github.sha }}
          path: ${{ runner.temp }}/method-families/
          retention-days: 14
      - name: Check actual precursor chemical modals
        if: matrix.os == 'ubuntu-latest' && env.CHEMICAL_REFERENCES_CHANGED == '1'
        run: |
          npm install --silent --no-save --prefix "$RUNNER_TEMP/protocol-pw" playwright@1.48.2
          npx --prefix "$RUNNER_TEMP/protocol-pw" playwright install --with-deps chromium >/dev/null
          export PLAYWRIGHT_DIR="$RUNNER_TEMP/protocol-pw"
          mkdir -p "$RUNNER_TEMP/chemical-serve"
          ln -s "$RUNNER_TEMP/candidate/project/recipe-atlas/dist" "$RUNNER_TEMP/chemical-serve/mattersyn-site"
          python -m http.server 8174 --bind 127.0.0.1 --directory "$RUNNER_TEMP/chemical-serve" >"$RUNNER_TEMP/chemical-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node tools/ci/chemical-reference-check.mjs --base http://127.0.0.1:8174/mattersyn-site/ --dist "$RUNNER_TEMP/candidate/project/recipe-atlas/dist" --out "$RUNNER_TEMP/chemical-modals"
      - name: Retain chemical modal screenshots
        if: always() && matrix.os == 'ubuntu-latest' && env.CHEMICAL_REFERENCES_CHANGED == '1'
        uses: actions/upload-artifact@v4
        with:
          name: mattersyn-chemical-modals-${{ github.sha }}
          path: ${{ runner.temp }}/chemical-modals/
          retention-days: 14
      - name: Retain test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mattersyn-validation-${{ github.sha }}-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/source-manifest.json
            ${{ runner.temp }}/source-boundary.json
            ${{ runner.temp }}/candidate/candidate-manifest.json
          retention-days: 7
  compare-artifacts:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: recipe-atlas/scripts/compare_candidate_manifests.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download both independently built manifests
        uses: actions/download-artifact@v4
        with:
          pattern: mattersyn-validation-${{ github.sha }}-*
          path: ${{ runner.temp }}/reproducibility
      - name: Compare every artifact and frozen input binding
        run: |
          python recipe-atlas/scripts/compare_candidate_manifests.py \
            --left "$RUNNER_TEMP/reproducibility/mattersyn-validation-${{ github.sha }}-ubuntu-latest/candidate/candidate-manifest.json" \
            --right "$RUNNER_TEMP/reproducibility/mattersyn-validation-${{ github.sha }}-windows-latest/candidate/candidate-manifest.json" \
            --report-out "$RUNNER_TEMP/cross-platform-comparison.json"
      - name: Retain the exact cross-platform comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mattersyn-reproducibility-${{ github.sha }}
          path: ${{ runner.temp }}/cross-platform-comparison.json
          retention-days: 7
