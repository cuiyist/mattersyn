name: MatterSyn source and build checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'
defaults:
  run:
    shell: bash
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build validator
        run: python -m pip install -r requirements-publication.txt
      - name: Test the publication boundary
        working-directory: tools/mattersyn-release
        run: python -m unittest discover -s tests -v
      - name: Test publication and preservation helpers
        run: python -m unittest discover -s tools/publication -p 'test_*.py' -v
      - name: Test local package staging without private evidence
        run: python -m unittest discover -s tools/package-importer/tests -v
      - name: Test browser condition classification
        run: node --test recipe-atlas/tests/protocol-conditions.test.mjs
      - name: Test source-scoped apparatus context
        run: node --test recipe-atlas/tests/yu1998-scene-scope.test.mjs
      - name: Check exact source manifest coverage
        run: python tools/publication/check_project_manifest.py
      - name: Validate the public source projection
        run: |
          python tools/mattersyn-release/export_release.py \
            --source-root "$GITHUB_WORKSPACE" \
            --destination "$RUNNER_TEMP/public-source" \
            --allowlist publication/project-allowlist.json \
            --registry publication/asset-rights-registry.json \
            --policy publication/public-release-policy.json \
            --repo mattersyn \
            --manifest-out "$RUNNER_TEMP/source-manifest.json" \
            --report-out "$RUNNER_TEMP/source-boundary.json"
      - name: Bind the build to this clean source commit
        run: |
          python recipe-atlas/scripts/make_runtime_snapshot.py \
            --root "$GITHUB_WORKSPACE" \
            --blueprint publication/build-inputs.json \
            --output "$RUNNER_TEMP/build-snapshot.json"
      - name: Build and test the complete candidate
        run: |
          python recipe-atlas/scripts/build_release.py --candidate \
            --output "$RUNNER_TEMP/candidate" \
            --snapshot "$RUNNER_TEMP/build-snapshot.json" \
            --registry publication/asset-rights-registry.json \
            --artifact-transform tools/publication/source_link_artifacts.py
      - name: Retain test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mattersyn-validation-${{ github.sha }}-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/source-manifest.json
            ${{ runner.temp }}/source-boundary.json
            ${{ runner.temp }}/candidate/candidate-manifest.json
          retention-days: 7
  compare-artifacts:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download both independently built manifests
        uses: actions/download-artifact@v4
        with:
          pattern: mattersyn-validation-${{ github.sha }}-*
          path: ${{ runner.temp }}/reproducibility
      - name: Compare every artifact and frozen input binding
        run: |
          python recipe-atlas/scripts/compare_candidate_manifests.py \
            --left "$RUNNER_TEMP/reproducibility/mattersyn-validation-${{ github.sha }}-ubuntu-latest/candidate/candidate-manifest.json" \
            --right "$RUNNER_TEMP/reproducibility/mattersyn-validation-${{ github.sha }}-windows-latest/candidate/candidate-manifest.json" \
            --report-out "$RUNNER_TEMP/cross-platform-comparison.json"
      - name: Retain the exact cross-platform comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mattersyn-reproducibility-${{ github.sha }}
          path: ${{ runner.temp }}/cross-platform-comparison.json
          retention-days: 7
